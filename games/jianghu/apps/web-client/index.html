<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>江湖 jianghu · 浏览器试玩版（C2）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f13; color: #e8e4d8;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.panning { cursor: grabbing; }

  /* ── HUD 顶栏 ── */
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; z-index: 10;
    background: linear-gradient(rgba(10,12,16,.92), rgba(10,12,16,.55));
    display: flex; align-items: center; gap: 16px; font-size: 13px; pointer-events: none; flex-wrap: wrap; }
  #hud .sep { color: #444; }
  #status { color: #fa0; font-weight: 700; }
  #status.ok { color: #5fd0e0; }
  #status.err { color: #f44; }
  #hpwrap { display: inline-flex; align-items: center; gap: 6px; }
  #hpbar { width: 110px; height: 8px; background: #301a1a; border: 1px solid #553; border-radius: 3px; overflow: hidden; }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #c8324a, #f2a03c); transition: width .15s; }
  #skillcd-hud { color: #9fd; }
  .btn { pointer-events: auto; cursor: pointer; }
  #btn-inv { border: 1px solid #4a5568; padding: 3px 9px; border-radius: 6px; background: rgba(18,22,30,.9); user-select: none; }
  #btn-inv:hover { border-color: #f2a03c; color: #f2a03c; }
  #btn-inv.on { border-color: #f2a03c; color: #f2a03c; box-shadow: 0 0 8px rgba(242,160,60,.5); }

  /* ── 底部技能栏 ── */
  #actionbar { position: absolute; left: 12px; bottom: 12px; z-index: 10; display: flex; gap: 8px; align-items: flex-end; }
  .abtn { width: 58px; height: 58px; border-radius: 8px; border: 1px solid #4a5568; background: rgba(18,22,30,.92);
    color: #e8e4d8; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; user-select: none; position: relative; transition: transform .06s, border-color .12s; }
  .abtn:hover { border-color: #5fd0e0; transform: translateY(-2px); }
  .abtn:active { transform: translateY(0); }
  .abtn .key { font-size: 10px; color: #7a8699; font-weight: 500; }
  .abtn .cd { position: absolute; inset: 0; border-radius: 8px; background: rgba(8,10,14,.78); color: #f2a03c;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .abtn.parry { width: 68px; height: 68px; border-color: #5f8fb0; }
  .abtn.parry.active { border-color: #5fd0e0; box-shadow: 0 0 12px rgba(95,208,224,.7); color: #5fd0e0; }
  .abtn.dungeon { width: auto; min-width: 92px; height: 44px; padding: 0 12px; flex-direction: row; gap: 8px; font-size: 13px;
    border-color: #7d5fa0; color: #cbb; }
  .abtn.dungeon:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Toast（顶部）── */
  #toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(20,16,30,.95); border: 1px solid #7d5fa0; color: #e8e4d8; padding: 8px 16px;
    border-radius: 8px; font-size: 13px; display: none; max-width: 70vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #toast.err { border-color: #c8324a; background: rgba(40,12,16,.95); }

  /* ── 拾取 toast（屏幕下方，C2）── */
  #pickup-toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 21;
    background: rgba(14,12,22,.94); border: 1px solid #5f8fb0; color: #e8e4d8; padding: 6px 14px;
    border-radius: 10px; font-size: 13px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.55);
    white-space: nowrap; }
  #pickup-toast .r { font-weight: 700; }

  /* ── 背包面板（C2）── */
  #invpanel { position: absolute; right: 16px; top: 64px; width: 320px; z-index: 30; display: none;
    background: rgba(12,14,20,.96); border: 1px solid #4a5568; border-radius: 10px; padding: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6); }
  #invpanel.open { display: block; }
  #inv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #inv-title { font-weight: 700; font-size: 14px; }
  #inv-count { color: #7a8699; font-size: 12px; margin-left: 6px; }
  #inv-close { cursor: pointer; border: 1px solid #4a5568; background: transparent; color: #aab; border-radius: 6px;
    padding: 2px 8px; font-size: 12px; }
  #inv-close:hover { color: #fff; border-color: #f44; }
  #inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 320px; overflow-y: auto; }
  .inv-cell { border: 2px solid #666; border-radius: 6px; padding: 4px 2px; text-align: center; background: rgba(30,34,44,.7); }
  .inv-id { font-size: 10px; color: #ddd; font-weight: 700; word-break: break-all; }
  .inv-meta { font-size: 9px; color: #9aa; margin-top: 2px; }
  #inv-empty { color: #7a8699; text-align: center; padding: 18px 0; font-size: 13px; }

  /* ── E7 装备栏 + 属性面板 ── */
  #attr-panel { margin-bottom: 8px; border: 1px solid #3a4250; border-radius: 8px; padding: 6px 8px; font-size: 12px;
    display: flex; gap: 16px; background: rgba(18,22,30,.7); color: #aab; flex-wrap: wrap; }
  #attr-panel b { color: #f2a03c; }
  #inv-equip { display: flex; gap: 6px; margin-bottom: 8px; }
  .equip-slot { flex: 1; border: 2px solid #4a5568; border-radius: 8px; padding: 5px 3px; text-align: center;
    background: rgba(30,34,44,.7); cursor: pointer; user-select: none; }
  .equip-slot:hover { border-color: #5fd0e0; }
  .equip-slot .slot-label { font-size: 9px; color: #9aa; display: block; margin-bottom: 2px; }
  .equip-slot .slot-item { font-size: 10px; font-weight: 700; word-break: break-all; }
  .equip-slot.empty .slot-item { color: #556; }
  .equip-slot .slot-action { font-size: 9px; color: #7a8699; display: block; margin-top: 2px; }
  .equip-slot.filled:hover .slot-action { color: #f2a03c; }
  .equip-btn { margin-top: 3px; font-size: 10px; border: 1px solid #4a5568; background: rgba(40,48,64,.9);
    color: #e8e4d8; border-radius: 5px; padding: 1px 8px; cursor: pointer; }
  .equip-btn:hover { border-color: #f2a03c; color: #f2a03c; }

  /* ── 帮助 ── */
  #help { position: absolute; right: 12px; bottom: 12px; z-index: 10; color: #7a8699; font-size: 11px;
    text-align: right; line-height: 1.7; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #help b { color: #aab; }
</style>
</head>
<body>
<div id="hud">
  <span id="status">连接中…</span>
  <span class="sep">|</span>
  <span id="room">房间:-</span>
  <span class="sep">|</span>
  <span id="tick">tick:-</span>
  <span class="sep">|</span>
  <span id="ents">entities:0</span>
  <span class="sep">|</span>
  <span id="hpwrap"><span id="hp">HP:-</span><span id="hpbar"><span id="hpfill"></span></span></span>
  <span id="parryhud"></span>
  <span id="skillcd-hud"></span>
  <span class="btn" id="btn-inv" title="背包（I）">背包 [I]</span>
</div>
<canvas id="game"></canvas>

<div id="actionbar">
  <div class="abtn" id="btn-skill-0" title="技能1（键 1）"><span>技1</span><span class="key">1</span></div>
  <div class="abtn" id="btn-skill-1" title="技能2（键 2）"><span>技2</span><span class="key">2</span></div>
  <div class="abtn" id="btn-skill-2" title="技能3（键 3）"><span>技3</span><span class="key">3</span></div>
  <div class="abtn" id="btn-skill-3" title="技能4（键 4）"><span>技4</span><span class="key">4</span></div>
  <div class="abtn parry" id="btn-parry" title="格挡（空格）"><span>格挡</span><span class="key">SPACE</span></div>
  <div class="abtn dungeon" id="btn-dungeon" title="进副本 / 出本（F）"><span id="btn-dungeon-label">进副本</span><span class="key">F</span></div>
</div>

<div id="toast"></div>
<div id="pickup-toast"></div>
<div id="invpanel">
  <div id="inv-head">
    <span id="inv-title">背包 <span id="inv-count">0/60</span></span>
    <button id="inv-close">✕</button>
  </div>
  <!-- E7：属性面板（攻击/生命/暴击，来自快照 attrs） -->
  <div id="attr-panel">
    <span>攻击 <b id="attr-atk">-</b></span>
    <span>生命 <b id="attr-hp">-</b></span>
    <span>暴击 <b id="attr-crit">-</b></span>
  </div>
  <!-- E7：3 槽装备栏（点击已穿槽位卸下） -->
  <div id="inv-equip">
    <div class="equip-slot empty" id="slot-weapon" data-slot="weapon"><span class="slot-label">武器</span><span class="slot-item">—</span><span class="slot-action"></span></div>
    <div class="equip-slot empty" id="slot-armor" data-slot="armor"><span class="slot-label">护甲</span><span class="slot-item">—</span><span class="slot-action"></span></div>
    <div class="equip-slot empty" id="slot-trin" data-slot="trinket"><span class="slot-label">饰品</span><span class="slot-item">—</span><span class="slot-action"></span></div>
  </div>
  <div id="inv-grid"><div id="inv-empty">空</div></div>
</div>

<div id="help">
  <b>左键点敌人</b> 自动走近普攻 · <b>左键点地面</b> 点击移动 · <b>WASD/方向键</b> 移动（8 向） · <b>空格</b> 格挡 · <b>1-4</b> 技能 · <b>I</b> 背包<br>
  <b>F</b> 进副本/出本 · 靠近掉落按 <b>F</b>（走近自动拾取） · <b>滚轮</b> 缩放 · <b>拖拽</b> 平移 · <b>双击</b> 回中<br>
  <b>装备</b>：背包内点「装备」穿装（攻击/生命/暴击立即提升） · 点击装备栏槽位卸下
</div>

<script>
(function () {
"use strict";
// ============================================================================
// 江湖 jianghu · 浏览器客户端 C2（Canvas 2D + WebSocket，零构建，单文件）
// ============================================================================
// 协议要点（对齐服务端 gateway/protocol/protocol-binary，见 README.md）：
//   - 控制面 JSON（显式 type）；数据面二进制（ws.binaryType='arraybuffer'）。
//   - input.cmd 必须 { type:'input.cmd', payload:{ cmd:{...} } }（服务端读 payload?.cmd）。
//   - 动作：0=MOVE 1=PARRY 2..5=SKILL1..4 6=SIGNAL 7=STOP（松开移动键 → 服务端清 lastMove 立即停）
//     8=ATTACK（E8 普攻，targetEntityId 指定目标；服务端权威 CD/距离/伤害）。
//   - 目标/伤害由服务端权威结算，客户端只发 skillSlot/targetEntityId，绝不自行锁 target。
//   - 快照帧：[u8 msgType=0x01][u32 tick LE][u16 count] + 每实体（见 decodeSnapshot）。
//   - E6 背包：character.inventory（拾取入库推送）/ character.inventory.get（打开面板拉全量）。
// ============================================================================
// C2 手感方案（WEB-FEEL 已验证模式，dungeon-online PASS）：
//   - 本地玩家：按键 → 渲染位置立即按 PLAYER_SPEED*dt 推进（本地预测，仅渲染层，不伪造权威）；
//     每收到权威快照向 me.pos lerp(RECONCILE_FACTOR=0.3) 收敛；仅瞬移（err>SNAP_THRESHOLD）硬回正。
//   - 远端实体：10 帧环缓冲，renderTime = lastTick - INTERP_TICKS(3) 双快照 lerp。
//   - 服务端权威位置不变：预测只是渲染坐标，位置仍以快照为准。
// ============================================================================

const params = new URLSearchParams(location.search);
const SERVER = (params.get('server') || 'ws://localhost:3011').replace(/\/+$/, '');
const DEV_USER = params.get('devUserId') || 'dev';
const DEBUG = params.get('debug') === '1';

// ── 共享常量（与 sim-core/constants.ts 对齐；C1 单一来源的客户端镜像，C7）──
const TILE = 48;
const TICK_RATE = 12;
const TICK_MS = 1000 / TICK_RATE;
const WORLD_W = 40 * TILE;              // 1920
const WORLD_H = 30 * TILE;              // 1440
const ENTRANCE_POS = { x: 20 * TILE, y: 15 * TILE }; // 主世界入口（tile 20,15）
const ENTRANCE_ENTER_RADIUS = 3 * TILE; // UI「进副本」可用半径（服务端不校验距离，仅冷却）
const PARRY_TICKS = 3;                  // 格挡窗口（服务端权威展示用）
const SKILL_ACTIONS = [2, 3, 4, 5];     // InputAction.SKILL1..4
const ACTION_STOP = 7;                  // InputAction.STOP
const ACTION_ATTACK = 8;                // InputAction.ATTACK（E8 普攻）
const MELEE_RANGE = 48;                 // 服务端 MELEE_RANGE=1×TILE（近战命中范围，C7 镜像）
const ATTACK_CD_TICKS = 6;              // 服务端 ATTACK_CD_TICKS=6（0.5s 普攻间隔；CD 由服务端权威）
const ARRIVE_TOL = 24;                  // 服务端 TARGET_ARRIVE_TOL=0.5×TILE（点击移动到达容差）
const CLICK_DRAG_TOL = 6;               // 鼠标位移阈值：超过视为拖拽平移，否则为左键点击

// ── C2 手感/表现参数（WEB-FEEL 模式）──
const BASE_SPEED = 4;                   // 服务端 BASE_SPEED（格/秒，constants.ts C7 镜像）
const PLAYER_SPEED = BASE_SPEED * TILE; // 192 px/s 本地预测速度（与服务端权威 1:1）
const RECONCILE_FACTOR = 0.3;           // 每快照向权威 pos lerp 收敛（无瞬移、无振荡）
const SNAP_THRESHOLD = 250;             // 仅真实瞬移（重连/切房）硬回正
const INTERP_TICKS = 3;                 // 远端实体渲染 = 最新 tick - 3（≈250ms @12Hz）
const BUF_MAX = 10;                     // 快照环缓冲帧数
const PICKUP_HINT_RADIUS = 1.5 * TILE;  // 拾取提示半径（服务端 PICKUP_RADIUS=1×TILE 自动拾取）
const SKILL_FX_RADIUS = 76;             // 技能光效半径（≈1.5 tile）
const SKILL_FX_TTL = 300;               // 技能光效时长（ms）

// 8 向单位向量（0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE；与服务端 dirToVector 对称）
const DIR_VECTORS = [
  { x: 1, y: 0 },
  { x: Math.SQRT1_2, y: Math.SQRT1_2 },
  { x: 0, y: 1 },
  { x: -Math.SQRT1_2, y: Math.SQRT1_2 },
  { x: -1, y: 0 },
  { x: -Math.SQRT1_2, y: -Math.SQRT1_2 },
  { x: 0, y: -1 },
  { x: Math.SQRT1_2, y: -Math.SQRT1_2 },
];

// 稀有度配色（art-bible：白/蓝/金/暗金）
const RARITY_COLORS = ['#D8D2C4', '#4C7FD6', '#F2A03C', '#C8324A'];
const RARITY_NAMES = ['白', '蓝', '金', '暗金'];
// E7：装备槽名称（与服务端 ITEM_PROTOS slot 对齐）
const SLOT_NAMES = { weapon: '武器', armor: '护甲', trinket: '饰品' };
const KIND = { PLAYER: 0, ENEMY: 1, BOSS: 2, LOOT_GROUND: 3, TELEGRAPH: 4, ENTRANCE: 5 };

// ── DOM ──
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const roomEl = document.getElementById('room');
const tickEl = document.getElementById('tick');
const entsEl = document.getElementById('ents');
const hpEl = document.getElementById('hp');
const hpFill = document.getElementById('hpfill');
const parryHud = document.getElementById('parryhud');
const skillCdHud = document.getElementById('skillcd-hud');
const toastEl = document.getElementById('toast');
const dungeonBtn = document.getElementById('btn-dungeon');
const dungeonBtnLabel = document.getElementById('btn-dungeon-label');
const invPanelEl = document.getElementById('invpanel');
const invGridEl = document.getElementById('inv-grid');
const invCountEl = document.getElementById('inv-count');
const invBtn = document.getElementById('btn-inv');

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.w = window.innerWidth;
  view.h = window.innerHeight;
}
window.addEventListener('resize', resize);

// ── 调试/自动化暴露（E2E 断言用；C2 新增 lastHits/lastKills/inventory/predicted 钩子）──
const GAME = window.__game = {
  connected: false, state: 'connecting', seatId: null, roomId: null, reconnectToken: null,
  lastSnapshot: null, localEntityId: null, errors: [], snapshotCount: 0, lastTick: 0,
  skillCd: [0, 0, 0, 0], parryActive: false, localHp: 0, localMaxHp: 0,
  lastLocalPos: null, wsState: 'closed', guest: null,
  // C2：本地预测 / 打击感 / 掉落 / 背包（E2E 断言钩子）
  predicted: null, localRenderPos: null, renderTick: 0,
  lastHits: [], lastKills: [], pickupToasts: [], lastSkillAt: 0,
  inventory: { items: [], cap: 60, loaded: false },
  equipped: {}, // E7：3 槽已穿戴（character.inventory 消息）
  nearLootId: null, pickupHint: '', invOpen: false,
  // E8：鼠标交互（左键点敌人点选攻击 / 点地面点击移动；E2E 断言钩子）
  selectedEnemyId: null, combatTarget: null, moveTarget: null, lastAttackAt: 0,
  // 调试钩子（仅 ?debug=1 生效；E2E 用）
  debugEnterDungeon: null, debugExitDungeon: null,
  toggleInventory: null, openInventory: null, closeInventory: null, sendSignal: null,
};

// ── 视图 / 摄像机 ──
const view = { w: window.innerWidth, h: window.innerHeight, scale: 1.0, cx: ENTRANCE_POS.x, cy: ENTRANCE_POS.y, follow: true };
let drag = null;          // 拖拽平移状态
let clickStart = null;    // 潜在左键点击（mousedown 记录；位移 > CLICK_DRAG_TOL 转为拖拽）
function screenToWorld(sx, sy) {
  return { x: (sx - view.w / 2) / view.scale + view.cx, y: (sy - view.h / 2) / view.scale + view.cy };
}
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  view.scale = Math.min(2.5, Math.max(0.45, view.scale * f));
  if (!view.follow) snapFollow();
}, { passive: false });
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return; // 仅左键可能触发点击/拖拽；右键暂不绑定（E8 说明）
  const w = screenToWorld(e.clientX, e.clientY);
  clickStart = { x: e.clientX, y: e.clientY, moved: false, wx: w.x, wy: w.y };
});
window.addEventListener('mousemove', (e) => {
  if (clickStart && !clickStart.moved) {
    const dx = e.clientX - clickStart.x, dy = e.clientY - clickStart.y;
    if (Math.hypot(dx, dy) > CLICK_DRAG_TOL) {
      // 位移超阈值 → 转为拖拽平移（不触发点击动作；相机停止跟随）。
      clickStart.moved = true;
      drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
      canvas.classList.add('panning');
      view.follow = false;
    }
  }
  if (drag) {
    view.cx = drag.cx - (e.clientX - drag.x) / view.scale;
    view.cy = drag.cy - (e.clientY - drag.y) / view.scale;
  }
});
window.addEventListener('mouseup', (e) => {
  if (drag) { drag = null; canvas.classList.remove('panning'); }
  else if (clickStart && !clickStart.moved && e.button === 0) {
    // 左键点击（无位移）→ 交互动作：点敌人点选攻击 / 点地面点击移动（E8）。
    handleClick(clickStart.wx, clickStart.wy);
  }
  clickStart = null;
});
canvas.addEventListener('dblclick', snapFollow);
function snapFollow() { view.follow = true; }

// ── 状态 ──
let state = 'connecting';           // connecting | overworld | dungeon | reconnecting | closed
function setState(s) { state = s; GAME.state = s; }
let seq = 1;
let seatId = null;
let roomId = null;
let reconnectToken = null;
let tickMs = TICK_MS;
let lastSnapshot = null;            // 最新权威快照
let localEntityId = null;
let snapBuffer = [];                // 插值缓冲 [{tick, entities:Map}]
let lastKnown = new Map();          // id → {ent, alpha} 实体消失淡出
const keys = new Set();

// ============================================================================
// 二进制快照解码（对齐 protocol-binary.ts decodeEntity）
// ============================================================================
function decodeSnapshot(buf) {
  const dv = new DataView(buf);
  let off = 0;
  const msgType = dv.getUint8(off); off += 1;
  if (msgType !== 0x01) throw new Error('unknown binary msgType 0x' + msgType.toString(16));
  const tick = dv.getUint32(off, true); off += 4;
  const count = dv.getUint16(off, true); off += 2;
  const entities = [];
  for (let i = 0; i < count; i++) {
    const id = dv.getUint16(off, true); off += 2;
    const mask = dv.getUint16(off, true); off += 2;
    const x = dv.getInt16(off, true); off += 2;
    const y = dv.getInt16(off, true); off += 2;
    const kind = dv.getUint8(off); off += 1;
    const dir = dv.getUint8(off); off += 1;
    const hp = dv.getUint16(off, true); off += 2;
    const maxHp = dv.getUint16(off, true); off += 2;
    const status = dv.getUint16(off, true); off += 2;
    const seCount = dv.getUint8(off); off += 1;
    const statusEffects = [];
    for (let j = 0; j < seCount; j++) {
      statusEffects.push({ type: dv.getUint8(off), remainingTicks: dv.getUint16(off, true) });
      off += 3;
    }
    const e = { id, mask, kind, dir, pos: { x, y }, hp, maxHp, status, statusEffects };

    // 条件字段（按 changeMask 位；与服务端 encodeEntity 对称）
    if (mask & (1 << 5))  { e.ownerId = dv.getUint16(off, true); off += 2; }
    if (mask & (1 << 6))  { e.parryState = { active: dv.getUint8(off) === 1, windowEndTick: dv.getUint32(off, true) }; off += 5; }
    if (mask & (1 << 7))  {
      const itemId = dv.getUint32(off, true); off += 4;
      const rarity = dv.getUint8(off); off += 1;
      const affixCount = dv.getUint8(off); off += 1;
      const affixes = [];
      for (let j = 0; j < affixCount; j++) { affixes.push(dv.getUint8(off)); off += 1; }
      const ttlTicks = dv.getUint16(off, true); off += 2;
      e.loot = { itemId, rarity, affixes, ttlTicks };
    }
    if (mask & (1 << 8))  {
      e.telegraph = { shape: dv.getUint8(off), color: dv.getUint8(off), startTick: dv.getUint32(off, true), applyTick: dv.getUint32(off, true), radius: dv.getUint16(off, true) };
      off += 12;
    }
    if (mask & (1 << 9))  { e.entrance = { cooldownTicks: dv.getUint16(off, true), lastUsedTick: dv.getUint32(off, true) }; off += 6; }
    if (mask & (1 << 10)) { e.tier = dv.getUint8(off); off += 1; }
    if (mask & (1 << 11)) { e.skillCd = [dv.getUint16(off, true), dv.getUint16(off + 2, true), dv.getUint16(off + 4, true), dv.getUint16(off + 6, true)]; off += 8; }
    if (mask & (1 << 12)) {
      // E7 扩展 attrs：str/dex/vit + hasExt(u8) + (atk u16, maxHp u16, crit千分比 u16)×hasExt
      const str = dv.getUint8(off); const dex = dv.getUint8(off + 1); const vit = dv.getUint8(off + 2); off += 3;
      if (dv.getUint8(off) === 1) {
        off += 1;
        e.attrs = { str, dex, vit, atk: dv.getUint16(off, true), maxHp: dv.getUint16(off + 2, true), crit: dv.getUint16(off + 4, true) };
        off += 6;
      } else {
        off += 1;
        e.attrs = { str, dex, vit };
      }
    }
    entities.push(e);
  }
  return { tick, entities };
}

// ============================================================================
// 连接 / 消息分发
// ============================================================================
function wsUrl() {
  return `${SERVER}/ws/jianghu?devUserId=${encodeURIComponent(DEV_USER)}`;
}

function connect() {
  clearTimeout(reconnectTimer);
  ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';
  GAME.wsState = 'connecting';

  ws.onopen = () => {
    GAME.wsState = 'open';
    reconnectAttempts = 0;
    // session.ready 到达后：有 token → session.reconnect；否则 room.join
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      handleControl(msg);
    } else if (ev.data instanceof ArrayBuffer) {
      try { handleSnapshot(decodeSnapshot(ev.data)); }
      catch (err) { GAME.errors.push('decode:' + (err && err.message)); }
    }
  };

  ws.onerror = () => {
    setStatus('连接错误', 'err');
    GAME.errors.push('ws error');
  };

  ws.onclose = (ev) => {
    GAME.wsState = 'closed';
    GAME.connected = false;
    if (ev.code === 4001) { setStatus('被踢下线（重复登录）', 'err'); setState('closed'); return; }
    if (state === 'closed') return;
    setStatus('断线，自动重连中…', 'err');
    setState('reconnecting');
    scheduleReconnect();
  };
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  const delay = Math.min(5000, 800 * Math.pow(1.6, reconnectAttempts++));
  reconnectTimer = setTimeout(() => connect(), delay);
}

function sendJson(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

// C2：房间切换/重连 → 清空表现态（防跨房实体 id 误判伤害/击杀）
function resetFxState() {
  snapBuffer = []; lastKnown.clear();
  prevHp = new Map(); floatTexts = []; hitFlashes = new Map();
  rings = []; skillFx = []; killFx = []; parryFx.until = 0; meleeFx = [];
  predicted = null;
  // E8：清鼠标交互目标（防跨房 id 误用）。
  selectedEnemyId = null; combatTarget = null; moveTarget = null;
  GAME.selectedEnemyId = null; GAME.combatTarget = null; GAME.moveTarget = null;
  GAME.lastHits = []; GAME.lastKills = []; GAME.nearLootId = null; GAME.pickupHint = '';
}

function handleControl(msg) {
  switch (msg.type) {
    case 'session.ready': {
      seatId = msg.seatId;
      tickMs = msg.tickMs || TICK_MS;
      GAME.seatId = seatId; GAME.guest = msg.guest;
      // E7.2：游客模式提示（裸开页面=游客，拾取/装备不保存）。
      if (msg.guest) setTimeout(() => toast('游客模式：拾取/装备不保存，用 ?devUserId=dev 打开可登录体验完整玩法'), 800);
      if (state === 'reconnecting') {
        if (reconnectToken && roomId) {
          sendJson({ type: 'session.reconnect', requestId: 'rec', payload: { roomId, reconnectToken } });
        } else {
          sendJson({ type: 'room.join', requestId: 'join' });
        }
      } else {
        sendJson({ type: 'room.join', requestId: 'join' });
      }
      break;
    }
    case 'room.join.ok': {
      roomId = msg.roomId;
      reconnectToken = msg.reconnectToken;
      setState('overworld');
      GAME.connected = true;
      GAME.roomId = roomId; GAME.reconnectToken = reconnectToken;
      setStatus('主世界', 'ok');
      resetFxState();
      startInputLoop();
      break;
    }
    case 'dungeon.enter.ok': {
      roomId = msg.roomId;
      reconnectToken = msg.reconnectToken;
      setState('dungeon');
      GAME.roomId = roomId; GAME.reconnectToken = reconnectToken;
      resetFxState();
      setStatus('副本', 'ok');
      toast('已进入副本');
      break;
    }
    case 'dungeon.exit.ok': {
      roomId = msg.roomId || 'room_resident_public';
      reconnectToken = null;
      setState('overworld');
      GAME.roomId = roomId; GAME.reconnectToken = null;
      resetFxState();
      setStatus('主世界', 'ok');
      toast('已出本');
      break;
    }
    case 'session.reconnect.ok': {
      roomId = msg.roomId;
      reconnectToken = msg.reconnectToken;
      setState(msg.fellBackToResident ? 'overworld' : (roomId && roomId !== 'room_resident_public' ? 'dungeon' : 'overworld'));
      GAME.roomId = roomId; GAME.reconnectToken = reconnectToken;
      GAME.connected = true;
      resetFxState();
      setStatus(state === 'dungeon' ? '副本（已重连）' : '主世界（已重连）', 'ok');
      toast('已重连');
      break;
    }
    case 'room.snapshot': {
      // presence 信息（成员数等）暂不渲染，保留日志
      break;
    }
    case 'session.pong':
      break;
    case 'game.error': {
      const code = msg.error && msg.error.code;
      toast(ERROR_TEXT[code] || ('服务端: ' + (code || 'unknown')), true);
      GAME.errors.push('game.error:' + code);
      break;
    }
    case 'session.kicked': {
      setStatus('被踢下线（重复登录）', 'err');
      toast('已断开：重复登录', true);
      setState('closed');
      break;
    }
    // ── E6 背包数据通道：拾取入库推送 / character.inventory.get 回复 / E7 equip/unequip 回复（同一格式）──
    case 'character.inventory': {
      const items = (msg.items || []).map((i) => ({ itemId: i.itemId, rarity: i.rarity, affixes: (i.affixes || []).slice(), slot: i.slot }));
      const prevIds = new Set(inventory.items.map((i) => i.itemId));
      inventory.items = items;
      inventory.cap = msg.cap || 60;
      inventory.loaded = true;
      equipped = msg.equipped || {};
      GAME.inventory = { items: inventory.items.slice(), cap: inventory.cap, loaded: true };
      GAME.equipped = equipped;
      // 增量 toast：新入库物品 → 屏幕下方「拾取 [稀有度色]物品（词缀xN）」
      const added = items.filter((i) => !prevIds.has(i.itemId));
      for (const it of added) {
        const color = RARITY_COLORS[it.rarity] || '#D8D2C4';
        pickupToast(`拾取 <span class="r" style="color:${color}">${RARITY_NAMES[it.rarity] || '?'}品</span>（词缀×${it.affixes.length}）`);
      }
      renderInventory();
      renderEquip();
      break;
    }
  }
}

// ============================================================================
// 快照处理（权威态 + 本地预测收敛 + 伤害/击杀检测 + 插值缓冲）
// ============================================================================
function handleSnapshot(snap) {
  GAME.snapshotCount++;
  GAME.lastTick = snap.tick;
  lastSnapshot = snap;
  GAME.lastSnapshot = snap;

  // 定位本地玩家（seatId 权威映射；kind=PLAYER + ownerId===seatId）
  localEntityId = null;
  for (const e of snap.entities) {
    if (e.kind === KIND.PLAYER && e.ownerId === seatId) { localEntityId = e.id; break; }
  }
  GAME.localEntityId = localEntityId;
  const me = localEntityId != null ? snap.entities.find((e) => e.id === localEntityId) : null;
  if (me) {
    GAME.localHp = me.hp; GAME.localMaxHp = me.maxHp;
    GAME.lastLocalPos = { x: me.pos.x, y: me.pos.y };
    GAME.parryActive = !!(me.parryState && me.parryState.active);
    if (me.skillCd) GAME.skillCd = me.skillCd.slice();

    // C2 本地预测初始化 / 收敛（只改渲染坐标 predicted，绝不写 me/快照权威字段）
    if (!predicted) {
      predicted = { x: me.pos.x, y: me.pos.y };
    } else {
      const ex = me.pos.x - predicted.x, ey = me.pos.y - predicted.y;
      const err = Math.hypot(ex, ey);
      if (err > SNAP_THRESHOLD) { predicted.x = me.pos.x; predicted.y = me.pos.y; } // 真瞬移 → 硬回正
      else { predicted.x += ex * RECONCILE_FACTOR; predicted.y += ey * RECONCILE_FACTOR; } // lerp 收敛
    }
  } else {
    predicted = null;
  }
  GAME.predicted = predicted ? { x: predicted.x, y: predicted.y } : null;

  // C2 伤害检测（比较上一帧 hp → 飘字 / 闪白 / 扩散环 / E2E lastHits）
  for (const e of snap.entities) {
    const old = prevHp.get(e.id);
    if (old != null && e.hp < old && e.kind !== KIND.LOOT_GROUND && e.kind !== KIND.ENTRANCE) {
      recordHit(e, old - e.hp, e.id === localEntityId, e.kind === KIND.ENEMY || e.kind === KIND.BOSS);
    }
  }

  // C2 击杀检测：上一帧在、本帧消失的敌人/BOSS → 粒子爆散 + E2E lastKills
  const newIds = new Set(snap.entities.map((e) => e.id));
  for (const [id] of prevHp) {
    if (!newIds.has(id)) {
      const gone = lastKnown.get(id);
      if (gone && (gone.ent.kind === KIND.ENEMY || gone.ent.kind === KIND.BOSS)) {
        spawnKillFx(gone.ent.pos.x, gone.ent.pos.y, gone.ent.kind === KIND.BOSS);
      }
    }
  }
  prevHp = new Map();
  for (const e of snap.entities) prevHp.set(e.id, e.hp);

  // 插值缓冲（环缓冲，最多 BUF_MAX 帧；实体按 id 建 Map 便于 lerp）
  const emap = new Map();
  for (const e of snap.entities) emap.set(e.id, e);
  snapBuffer.push({ tick: snap.tick, entities: emap });
  if (snapBuffer.length > BUF_MAX) snapBuffer.shift();

  // 消失实体淡出
  const seen = new Set(emap.keys());
  for (const [id, rec] of lastKnown) {
    if (!seen.has(id)) { rec.alpha -= 0.15; if (rec.alpha <= 0) lastKnown.delete(id); }
  }
  for (const e of snap.entities) lastKnown.set(e.id, { ent: e, alpha: 1 });

  updateHud();
}

// ── C2 打击感：伤害飘字 / 闪白 / 扩散环 / 格挡反馈 / E2E 钩子 ──
function recordHit(e, dmg, isLocal, isEnemy) {
  const t = performance.now();
  const color = isLocal ? '#ff5a5a' : (isEnemy ? '#ffd27d' : '#ffffff');
  floatTexts.push({ x: e.pos.x, y: e.pos.y - 22, text: '-' + dmg, color, born: t, ttl: 1000, vy: -30 });
  hitFlashes.set(e.id, t + 150); // 150ms 闪白
  rings.push({ x: e.pos.x, y: e.pos.y, color, born: t, ttl: 220, r0: 8, r1: isLocal ? 34 : 30 });

  // E2E 钩子：最近飘字
  GAME.lastHits.push({ id: e.id, dmg, kind: e.kind, t });
  if (GAME.lastHits.length > 30) GAME.lastHits.shift();

  if (isLocal && GAME.parryActive) {
    // 格挡生效（受击时 parry 窗口激活）→ 「格挡！」+ 盾闪
    floatTexts.push({ x: e.pos.x, y: e.pos.y - 48, text: '格挡！', color: '#5fd0e0', born: t, ttl: 900, vy: -24 });
    parryFx.until = t + 400;
    rings.push({ x: e.pos.x, y: e.pos.y, color: '#5fd0e0', born: t, ttl: 300, r0: 20, r1: 46 });
  }
  // 技能命中叠加闪光（刚放技能且附近敌人受击）
  if (isEnemy && t - GAME.lastSkillAt < 600) {
    rings.push({ x: e.pos.x, y: e.pos.y, color: '#fff2d0', born: t, ttl: 200, r0: 4, r1: 26 });
  }
}

function spawnKillFx(x, y, isBoss) {
  const parts = [];
  const n = isBoss ? 12 : 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
    const sp = 42 + Math.random() * 70;
    parts.push({ dx: Math.cos(a) * sp, dy: Math.sin(a) * sp, size: 3 + Math.random() * 4, color: isBoss ? '#e5b25d' : '#e5484d' });
  }
  killFx.push({ x, y, parts, born: performance.now(), ttl: 260 });
  GAME.lastKills.push({ x, y, isBoss, t: performance.now() });
  if (GAME.lastKills.length > 20) GAME.lastKills.shift();
}

// HUD 更新
// ============================================================================
function updateHud() {
  tickEl.textContent = 'tick:' + (GAME.lastTick || '-');
  entsEl.textContent = 'entities:' + (lastSnapshot ? lastSnapshot.entities.length : 0);
  roomEl.textContent = '房间:' + (roomId === 'room_resident_public' ? '主世界' : (state === 'dungeon' ? '副本' : (roomId || '-')));
  hpEl.textContent = 'HP:' + GAME.localHp + '/' + GAME.localMaxHp;
  hpFill.style.width = (GAME.localMaxHp > 0 ? Math.max(0, GAME.localHp / GAME.localMaxHp) * 100 : 0) + '%';

  // 技能 CD（tick 左 → 秒）
  skillCdHud.textContent = 'CD: ' + GAME.skillCd.map((t) => (t > 0 ? (t / TICK_RATE).toFixed(1) + 's' : '·')).join(' ');
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('btn-skill-' + i);
    let cdEl = btn.querySelector('.cd');
    if (GAME.skillCd[i] > 0) {
      if (!cdEl) { cdEl = document.createElement('div'); cdEl.className = 'cd'; btn.appendChild(cdEl); }
      cdEl.textContent = (GAME.skillCd[i] / TICK_RATE).toFixed(1) + 's';
    } else if (cdEl) cdEl.remove();
  }

  // 格挡
  const parryBtn = document.getElementById('btn-parry');
  parryBtn.classList.toggle('active', !!GAME.parryActive);
  parryHud.textContent = GAME.parryActive ? '格挡中' : '';

  // E7 属性面板（攻击/生命/暴击，来自快照 attrs；crit 千分比 → 百分比）
  const attrMe = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
  if (attrMe && attrMe.attrs) {
    document.getElementById('attr-atk').textContent = attrMe.attrs.atk != null ? String(attrMe.attrs.atk) : '-';
    document.getElementById('attr-hp').textContent = attrMe.attrs.maxHp != null ? String(attrMe.attrs.maxHp) : '-';
    document.getElementById('attr-crit').textContent = attrMe.attrs.crit != null ? (attrMe.attrs.crit / 10).toFixed(1) + '%' : '-';
  }

  // 进副本 / 出本按钮
  updateDungeonButton();
}

function updateDungeonButton() {
  const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
  const ent = lastSnapshot ? lastSnapshot.entities.find((e) => e.kind === KIND.ENTRANCE) : null;
  const ep = ent ? ent.pos : ENTRANCE_POS;
  if (state === 'dungeon') {
    dungeonBtnLabel.textContent = '出本 (F)';
    dungeonBtn.disabled = false;
    dungeonBtn.title = '出本（F）';
  } else if (state === 'overworld') {
    dungeonBtnLabel.textContent = '进副本 (F)';
    const near = me && Math.hypot(me.pos.x - ep.x, me.pos.y - ep.y) <= ENTRANCE_ENTER_RADIUS;
    dungeonBtn.disabled = !near && !DEBUG;
    dungeonBtn.title = near ? '进副本（F）' : '靠近裂隙入口（或 ?debug=1 强制）';
  } else {
    dungeonBtn.disabled = true;
  }
}

// ============================================================================
// 输入
// ============================================================================
// 方向 0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE（对齐 movement.ts）
const KEY_DIRS = {
  KeyW: { dx: 0, dy: -1 }, ArrowUp: { dx: 0, dy: -1 },
  KeyS: { dx: 0, dy: 1 }, ArrowDown: { dx: 0, dy: 1 },
  KeyA: { dx: -1, dy: 0 }, ArrowLeft: { dx: -1, dy: 0 },
  KeyD: { dx: 1, dy: 0 }, ArrowRight: { dx: 1, dy: 0 },
};

function dirFromKeys() {
  let dx = 0, dy = 0;
  for (const code of keys) { const v = KEY_DIRS[code]; if (v) { dx += v.dx; dy += v.dy; } }
  if (dx === 0 && dy === 0) return null;
  if (dx > 0 && dy === 0) return 0;
  if (dx > 0 && dy > 0) return 1;
  if (dx === 0 && dy > 0) return 2;
  if (dx < 0 && dy > 0) return 3;
  if (dx < 0 && dy === 0) return 4;
  if (dx < 0 && dy < 0) return 5;
  if (dx === 0 && dy < 0) return 6;
  return 7; // dx>0 && dy<0 NE
}

function sendCmd(cmd) {
  if (!lastSnapshot || !(state === 'overworld' || state === 'dungeon')) return;
  sendJson({
    type: 'input.cmd',
    payload: { cmd: { seq: seq++, tick: lastSnapshot.tick, ...cmd } },
  });
}

function sendMove(dir) {
  sendCmd({ action: 0, dir });
  lastMoveDir = dir;
}

// 松开移动键 → 显式 STOP（协议缺口修复，P0）：服务端清 lastMove 立即停，不再惯性滑行。
function sendStop() {
  if (lastMoveDir == null) return;
  sendCmd({ action: ACTION_STOP, dir: lastMoveDir });
  lastMoveDir = null;
}

function sendParry() { sendCmd({ action: 1, dir: lastMoveDir ?? 0 }); }

// C2：技能释放 → 立即本地技能光效（朝向扇形闪光 0.3s 淡出）+ E2E lastSkillAt
function sendSkill(slot) {
  sendCmd({ action: SKILL_ACTIONS[slot] ?? 2, skillSlot: slot, dir: lastMoveDir ?? 0 });
  const d = dirFromKeys() ?? lastMoveDir ?? 0;
  const base = predicted || (localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId).pos : { x: 0, y: 0 });
  skillFx.push({ x: base.x, y: base.y, dir: d, color: 'rgba(255,179,71,1)', born: performance.now(), ttl: SKILL_FX_TTL, radius: SKILL_FX_RADIUS });
  GAME.lastSkillAt = performance.now();
}

// SIGNAL(6)：靠近掉落按 F 的拾取意图（服务端为重叠自动拾取，此动作服务端忽略，仅表现/占位）
function sendSignal() { sendCmd({ action: 6, dir: lastMoveDir ?? 0 }); }

// E8：客户端 8 向朝向（与服务端 dirToward 对称；本地预测/光效用，纯几何无随机）。
function dirTowardClient(ax, ay, bx, by) {
  const deg = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
  const k = Math.round(deg / 45);
  return ((k % 8) + 8) % 8;
}

// E8：无条件发 STOP（点击移动/战斗目标结束用；服务端清 lastMove 立即停）。
function sendStopCmd() {
  sendCmd({ action: ACTION_STOP, dir: lastMoveDir ?? 0 });
  lastMoveDir = null;
}

// E8：点击移动 → MOVE{targetTile}（目标格编码 gx*64+gy，与服务端 world.packTile 一致）。
function sendMoveToTile(gx, gy) {
  sendCmd({ action: 0, dir: lastMoveDir ?? 0, targetTile: gx * 64 + gy });
}

// E8：普攻 → ATTACK{targetEntityId}（服务端权威 CD/距离/伤害）；本地白刃挥砍光效。
function sendAttack(targetId) {
  sendCmd({ action: ACTION_ATTACK, dir: lastMoveDir ?? 0, targetEntityId: targetId });
  const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
  const t = lastSnapshot ? lastSnapshot.entities.find((e) => e.id === targetId) : null;
  const base = predicted || (me ? me.pos : null);
  if (base && t) {
    meleeFx.push({ x: base.x, y: base.y, dir: dirTowardClient(base.x, base.y, t.pos.x, t.pos.y), born: performance.now(), ttl: 220 });
    GAME.lastAttackAt = performance.now();
  }
}

// E8：清鼠标交互目标（点选/战斗/点击移动）。
function clearClickTargets() {
  selectedEnemyId = null; combatTarget = null; moveTarget = null;
  GAME.selectedEnemyId = null; GAME.combatTarget = null; GAME.moveTarget = null;
}

// E8：敌人点选命中半径（比渲染半径略大，便于点选）。
function enemyHitRadius(e) {
  if (e.kind === KIND.BOSS) return 34;
  if (e.tier === 1) return 24;
  return 20;
}

// E8：左键点击 → 命中敌人/BOSS → 点选（红圈）并自动走近普攻；命中地面 → 点击移动。
// 交互优先级：左键点敌人 → 攻击；左键点地面 → 移动；右键暂不绑定。
function handleClick(wx, wy) {
  if (!lastSnapshot || localEntityId == null) return;
  if (state !== 'overworld' && state !== 'dungeon') return;
  // ① 优先点选敌人/BOSS（存活）。
  let hit = null, bestD = Infinity;
  for (const e of lastSnapshot.entities) {
    if ((e.kind !== KIND.ENEMY && e.kind !== KIND.BOSS) || e.hp <= 0) continue;
    const d = Math.hypot(e.pos.x - wx, e.pos.y - wy);
    if (d <= enemyHitRadius(e) && d < bestD) { bestD = d; hit = e; }
  }
  if (hit) {
    selectedEnemyId = hit.id;
    combatTarget = hit.id;
    moveTarget = null;
    GAME.selectedEnemyId = selectedEnemyId; GAME.combatTarget = combatTarget; GAME.moveTarget = null;
    GAME.lastClickEnemy = { id: hit.id, x: hit.pos.x, y: hit.pos.y };
    return;
  }
  // ② 空地 → 点击移动（目标格，clamp 到世界 40×30 内）。
  const gx = Math.max(0, Math.min(39, Math.floor(wx / TILE)));
  const gy = Math.max(0, Math.min(29, Math.floor(wy / TILE)));
  selectedEnemyId = null; combatTarget = null;
  moveTarget = gx * 64 + gy;
  GAME.selectedEnemyId = null; GAME.combatTarget = null; GAME.moveTarget = moveTarget;
  GAME.lastClickMove = { wx, wy, gx, gy };
}

// 12Hz 输入循环：键盘优先（按住持续 MOVE）；无键盘 → 战斗目标（走近+普攻）→ 点击移动 → 兜底 STOP。
function startInputLoop() {
  if (inputTimer) clearInterval(inputTimer);
  inputTimer = setInterval(() => {
    if (!(state === 'overworld' || state === 'dungeon')) return;
    const dir = dirFromKeys();
    if (dir != null) {
      // 键盘优先：清点击目标（点击移动/攻击被按键打断）。
      if (combatTarget != null || moveTarget != null) clearClickTargets();
      sendMove(dir);
      return;
    }
    if (combatTarget != null) {
      // 战斗目标：范围内自动普攻（服务端 CD 门闸），范围外发 MOVE{targetTile:敌人格} 走近。
      const t = lastSnapshot ? lastSnapshot.entities.find((e) => e.id === combatTarget && (e.kind === KIND.ENEMY || e.kind === KIND.BOSS) && e.hp > 0) : null;
      if (!t) { // 目标死亡/消失 → 清目标并停。
        clearClickTargets();
        sendStopCmd();
        return;
      }
      const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
      if (!me) return;
      const d = Math.hypot(t.pos.x - me.pos.x, t.pos.y - me.pos.y);
      if (d <= MELEE_RANGE) sendAttack(combatTarget);
      else sendMoveToTile(
        Math.max(0, Math.min(39, Math.floor(t.pos.x / TILE))),
        Math.max(0, Math.min(29, Math.floor(t.pos.y / TILE))),
      );
      return;
    }
    if (moveTarget != null) {
      const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
      if (!me) return;
      const gx = Math.floor(moveTarget / 64), gy = moveTarget % 64;
      const tx = gx * TILE + TILE / 2, ty = gy * TILE + TILE / 2;
      if (Math.hypot(tx - me.pos.x, ty - me.pos.y) <= ARRIVE_TOL) {
        // 到达 → 清目标并停（服务端到达亦自动清 lastMove，双保险）。
        moveTarget = null; GAME.moveTarget = null;
        sendStopCmd();
      } else {
        sendMoveToTile(gx, gy);
      }
      return;
    }
    sendStop();
  }, 80);
}

// 一次性动作（PARRY/SKILL）在按键沿触发，防连发
let lastActionAt = 0;
function fireAction(fn) {
  const now = performance.now();
  if (now - lastActionAt < 120) return; // 轻微防抖
  lastActionAt = now;
  fn();
}

window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Space') fireAction(sendParry);
  if (e.code === 'Digit1') fireAction(() => sendSkill(0));
  if (e.code === 'Digit2') fireAction(() => sendSkill(1));
  if (e.code === 'Digit3') fireAction(() => sendSkill(2));
  if (e.code === 'Digit4') fireAction(() => sendSkill(3));
  if (e.code === 'KeyI') { e.preventDefault(); toggleInventory(); }
  // F：副本内 → 出本优先；主世界靠近掉落 → 拾取意图（SIGNAL，服务端忽略；走近重叠即自动拾取）；否则进/出本
  if (e.code === 'KeyF') fireAction(() => {
    if (state === 'dungeon') { exitDungeon(); return; }
    if (nearLootId != null) sendSignal(); else toggleDungeon();
  });
});
window.addEventListener('keyup', (e) => {
  keys.delete(e.code);
  // 最后一个移动键松开 → 显式 STOP（P0 手感修复：服务端清 lastMove 立即停）。
  if (KEY_DIRS[e.code] && dirFromKeys() === null) sendStop();
});
// 失焦 / 切页 / 断连前：清按键 + 清点击目标 + 显式 STOP，避免服务端沿最后方向惯性滑行。
window.addEventListener('blur', () => {
  keys.clear();
  clearClickTargets();
  sendStop();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    keys.clear();
    clearClickTargets();
    sendStop();
  }
});
window.addEventListener('beforeunload', () => {
  if (lastMoveDir != null && ws && ws.readyState === 1) {
    try {
      sendJson({
        type: 'input.cmd',
        payload: { cmd: { seq: seq++, tick: lastSnapshot ? lastSnapshot.tick : 0, action: ACTION_STOP, dir: lastMoveDir } },
      });
    } catch { /* ignore */ }
    lastMoveDir = null;
  }
});

// 技能/格挡/背包按钮
for (let i = 0; i < 4; i++) {
  document.getElementById('btn-skill-' + i).addEventListener('click', () => fireAction(() => sendSkill(i)));
}
document.getElementById('btn-parry').addEventListener('click', () => fireAction(sendParry));
dungeonBtn.addEventListener('click', toggleDungeon);
invBtn.addEventListener('click', toggleInventory);
document.getElementById('inv-close').addEventListener('click', closeInventory);

// E7：点击已穿槽位 → 卸下（character.unequip）
for (const slotEl of document.querySelectorAll('.equip-slot')) {
  slotEl.addEventListener('click', () => {
    const slot = slotEl.dataset.slot;
    if (equipped && equipped[slot]) sendUnequip(slot);
  });
}

// 进副本 / 出本
function enterDungeon() {
  sendJson({ type: 'dungeon.enter', requestId: 'enter', payload: { entranceId: 1 } });
}
function exitDungeon() {
  sendJson({ type: 'dungeon.exit', requestId: 'exit' });
}
function toggleDungeon() {
  if (state === 'dungeon') { exitDungeon(); return; }
  if (state !== 'overworld') return;
  if (DEBUG) { enterDungeon(); return; }
  const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
  const ent = lastSnapshot ? lastSnapshot.entities.find((e) => e.kind === KIND.ENTRANCE) : null;
  const ep = ent ? ent.pos : ENTRANCE_POS;
  if (me && Math.hypot(me.pos.x - ep.x, me.pos.y - ep.y) <= ENTRANCE_ENTER_RADIUS) enterDungeon();
  else toast('请先靠近裂隙入口');
}

// ============================================================================
// 背包面板（C2）：按 I / HUD 按钮开关；character.inventory 推送实时刷新 + 打开拉全量
// ============================================================================
function openInventory() {
  invOpen = true; GAME.invOpen = true;
  invPanelEl.classList.add('open');
  invBtn.classList.add('on');
  sendJson({ type: 'character.inventory.get', requestId: 'inv' + (invSeq++) }); // 打开拉全量
  renderInventory();
  renderEquip();
}
function closeInventory() {
  invOpen = false; GAME.invOpen = false;
  invPanelEl.classList.remove('open');
  invBtn.classList.remove('on');
}
function toggleInventory() { invOpen ? closeInventory() : openInventory(); }

function renderInventory() {
  invCountEl.textContent = inventory.items.length + '/' + inventory.cap;
  if (inventory.items.length === 0) {
    invGridEl.innerHTML = '<div id="inv-empty">空</div>';
    return;
  }
  invGridEl.innerHTML = '';
  for (const it of inventory.items) {
    const color = RARITY_COLORS[it.rarity] || '#D8D2C4';
    const cell = document.createElement('div');
    cell.className = 'inv-cell';
    cell.style.borderColor = color;
    const short = '#' + (it.itemId % 0x10000).toString(16).toUpperCase().padStart(4, '0');
    const aff = it.affixes.length > 0 ? '词缀×' + it.affixes.length : '无词缀';
    const slotName = SLOT_NAMES[it.slot] || '';
    cell.innerHTML = `<div class="inv-id">${short}</div><div class="inv-meta" style="color:${color}">${RARITY_NAMES[it.rarity] || '?'} · ${aff}${slotName ? ' · ' + slotName : ''}</div>`;
    // E7：装备按钮（发 character.equip；已穿同槽位物品会被换下回背包）。
    const eqBtn = document.createElement('button');
    eqBtn.className = 'equip-btn';
    eqBtn.textContent = '装备';
    eqBtn.addEventListener('click', () => sendEquip(it.itemId));
    cell.appendChild(eqBtn);
    invGridEl.appendChild(cell);
  }
}

// E7：3 槽已穿戴渲染（稀有度色边框 + 短号；点击已穿槽位 → 卸下）
function renderEquip() {
  for (const slot of ['weapon', 'armor', 'trinket']) {
    const el = document.getElementById('slot-' + (slot === 'trinket' ? 'trin' : slot));
    if (!el) continue;
    const item = equipped[slot] || null;
    const itemEl = el.querySelector('.slot-item');
    const actionEl = el.querySelector('.slot-action');
    if (item) {
      const color = RARITY_COLORS[item.rarity] || '#D8D2C4';
      const short = '#' + (item.itemId % 0x10000).toString(16).toUpperCase().padStart(4, '0');
      el.classList.remove('empty'); el.classList.add('filled');
      el.style.borderColor = color;
      itemEl.textContent = short + ' · 词缀×' + (item.affixes || []).length;
      itemEl.style.color = color;
      actionEl.textContent = '点击卸下';
    } else {
      el.classList.add('empty'); el.classList.remove('filled');
      el.style.borderColor = '';
      itemEl.textContent = '—';
      itemEl.style.color = '';
      actionEl.textContent = '';
    }
  }
}

// E7：装备 / 卸下（服务端经 character.inventory 回推刷新）
function sendEquip(itemId) {
  sendJson({ type: 'character.equip', requestId: 'eq' + (invSeq++), payload: { itemId } });
}
function sendUnequip(slot) {
  sendJson({ type: 'character.unequip', requestId: 'ueq' + (invSeq++), payload: { slot } });
}

// 调试钩子（?debug=1 时暴露给 E2E）
if (DEBUG) {
  GAME.debugEnterDungeon = enterDungeon;
  GAME.debugExitDungeon = exitDungeon;
  GAME.sendMove = sendMove;
  GAME.sendSkill = sendSkill;
  GAME.sendParry = sendParry;
  GAME.toggleInventory = toggleInventory;
  GAME.openInventory = openInventory;
  GAME.closeInventory = closeInventory;
  GAME.sendSignal = sendSignal;
  GAME.sendEquip = sendEquip; // E7
  GAME.sendUnequip = sendUnequip; // E7
  GAME.sendAttack = sendAttack; // E8 普攻
  GAME.sendMoveToTile = sendMoveToTile; // E8 点击移动
  GAME.clickWorld = (wx, wy) => handleClick(wx, wy); // E8 世界坐标点击（E2E 兜底/调试）
  GAME.clearClickTargets = clearClickTargets; // E8
  GAME.worldToScreen = worldToScreen; // E8 E2E：世界坐标 → 屏幕坐标（page.mouse.click 用）
  GAME.screenToWorld = screenToWorld; // E8
}

// ============================================================================
// 渲染
// ============================================================================
function worldToScreen(p) {
  return {
    x: (p.x - view.cx) * view.scale + view.w / 2,
    y: (p.y - view.cy) * view.scale + view.h / 2,
  };
}

// C2 远端实体插值：10 帧环缓冲，renderTime = 最新 tick - INTERP_TICKS 双快照 lerp
function interpPos(id, t) {
  let a = null, b = null;
  for (let i = snapBuffer.length - 1; i >= 0; i--) {
    const s = snapBuffer[i];
    const ent = s.entities.get(id);
    if (!ent) continue;
    if (s.tick <= t) { a = { tick: s.tick, pos: ent.pos }; break; }
    b = { tick: s.tick, pos: ent.pos };
  }
  if (a && b) {
    const span = Math.max(1, b.tick - a.tick);
    const f = Math.min(1, Math.max(0, (t - a.tick) / span));
    return { x: a.pos.x + (b.pos.x - a.pos.x) * f, y: a.pos.y + (b.pos.y - a.pos.y) * f };
  }
  if (a) return { x: a.pos.x, y: a.pos.y };
  if (b) return { x: b.pos.x, y: b.pos.y };
  const rec = lastKnown.get(id);
  return rec ? { x: rec.ent.pos.x, y: rec.ent.pos.y } : null;
}

// 实体渲染位置：本地 → 预测坐标；远端 → renderTime 插值
function renderPosFor(e) {
  if (e.id === localEntityId && predicted) return { x: predicted.x, y: predicted.y };
  return interpPos(e.id, renderTime);
}

function draw() {
  requestAnimationFrame(draw);
  const t = performance.now();
  const dt = Math.min(0.05, (t - lastFrameT) / 1000);
  lastFrameT = t;

  if (!lastSnapshot) {
    ctx.fillStyle = '#14161c';
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.fillStyle = '#7a8699';
    ctx.font = '15px system-ui';
    ctx.fillText('等待服务器快照…', 24, 48);
    return;
  }

  // C2 远端渲染 tick = 最新 tick - INTERP_TICKS（≈250ms @12Hz）
  renderTime = lastSnapshot.tick - INTERP_TICKS;
  GAME.renderTick = renderTime;

  // C2/E8 本地预测：按键 / 战斗目标 / 点击移动 → 渲染位置立即推进（帧率无关，按 PLAYER_SPEED*dt；仅渲染层）
  if (predicted && (state === 'overworld' || state === 'dungeon')) {
    const d = dirFromKeys();
    if (d != null) {
      const v = DIR_VECTORS[d];
      predicted.x += v.x * PLAYER_SPEED * dt;
      predicted.y += v.y * PLAYER_SPEED * dt;
    } else if (combatTarget != null) {
      const t = lastSnapshot ? lastSnapshot.entities.find((e) => e.id === combatTarget && (e.kind === KIND.ENEMY || e.kind === KIND.BOSS) && e.hp > 0) : null;
      if (t && Math.hypot(t.pos.x - predicted.x, t.pos.y - predicted.y) > MELEE_RANGE) {
        const v = DIR_VECTORS[dirTowardClient(predicted.x, predicted.y, t.pos.x, t.pos.y)];
        predicted.x += v.x * PLAYER_SPEED * dt;
        predicted.y += v.y * PLAYER_SPEED * dt;
      }
    } else if (moveTarget != null) {
      const gx = Math.floor(moveTarget / 64), gy = moveTarget % 64;
      const tx = gx * TILE + TILE / 2, ty = gy * TILE + TILE / 2;
      if (Math.hypot(tx - predicted.x, ty - predicted.y) > ARRIVE_TOL) {
        const v = DIR_VECTORS[dirTowardClient(predicted.x, predicted.y, tx, ty)];
        predicted.x += v.x * PLAYER_SPEED * dt;
        predicted.y += v.y * PLAYER_SPEED * dt;
      }
    }
    // 世界边界 clamp（近似；墙内由 RECONCILE_FACTOR 每快照收敛回正）
    predicted.x = Math.max(8, Math.min(WORLD_W - 8, predicted.x));
    predicted.y = Math.max(8, Math.min(WORLD_H - 8, predicted.y));
  }
  GAME.predicted = predicted ? { x: predicted.x, y: predicted.y } : null;
  GAME.localRenderPos = predicted ? { x: predicted.x, y: predicted.y } : null;

  // 相机跟随本地玩家（预测位置 → 按键即时动，手感优先）
  if (view.follow) {
    if (predicted) { view.cx = predicted.x; view.cy = predicted.y; }
    else if (localEntityId != null) {
      const p = interpPos(localEntityId, renderTime);
      if (p) { view.cx = p.x; view.cy = p.y; }
    }
  }
  const camX = view.cx, camY = view.cy;

  ctx.fillStyle = '#14161c';
  ctx.fillRect(0, 0, view.w, view.h);

  ctx.save();
  ctx.translate(view.w / 2 - camX * view.scale, view.h / 2 - camY * view.scale);
  ctx.scale(view.scale, view.scale);

  drawGrid();
  drawWorldBounds();
  drawTelegraphs();
  drawEntities();

  ctx.restore();
  drawFx();
  drawMinimap(camX, camY);
}

function drawGrid() {
  const x0 = Math.max(0, Math.floor((view.cx - view.w / 2 / view.scale) / TILE) * TILE);
  const x1 = Math.min(WORLD_W, Math.ceil((view.cx + view.w / 2 / view.scale) / TILE) * TILE);
  const y0 = Math.max(0, Math.floor((view.cy - view.h / 2 / view.scale) / TILE) * TILE);
  const y1 = Math.min(WORLD_H, Math.ceil((view.cy + view.h / 2 / view.scale) / TILE) * TILE);
  ctx.strokeStyle = 'rgba(90,100,120,0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += TILE) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = y0; y <= y1; y += TILE) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  // 安全区/出生区淡色块（主世界入口附近）
  ctx.fillStyle = 'rgba(95,208,224,0.04)';
  ctx.fillRect(18 * TILE, 13 * TILE, 4 * TILE, 4 * TILE);
}

function drawWorldBounds() {
  ctx.strokeStyle = 'rgba(200,180,140,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1, 1, WORLD_W - 2, WORLD_H - 2);
}

function drawHpBar(x, y, w, hp, maxHp, alignBottom) {
  if (!maxHp) return;
  const h = 5;
  const bx = x - w / 2, by = alignBottom ? y - 12 : y - 30;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx - 1, by - 1, w + 2, h + 2);
  ctx.fillStyle = '#3a0f12';
  ctx.fillRect(bx, by, w, h);
  const f = Math.max(0, Math.min(1, hp / maxHp));
  ctx.fillStyle = f > 0.5 ? '#5fa85f' : (f > 0.25 ? '#f2a03c' : '#c8324a');
  ctx.fillRect(bx, by, w * f, h);
}

function drawPlayer(e, p) {
  const isLocal = e.id === localEntityId;
  const size = isLocal ? 30 : 26;
  const s = worldToScreen(p);
  if (s.x < -60 || s.y < -60 || s.x > view.w + 60 || s.y > view.h + 60) return;

  const ang = e.dir * Math.PI / 4;
  const facing = { x: Math.cos(ang), y: Math.sin(ang) };

  ctx.save();
  ctx.translate(s.x, s.y);

  // 身体（青色方块 + 描边）
  ctx.fillStyle = isLocal ? '#4CB5F5' : '#3f87b8';
  ctx.strokeStyle = isLocal ? '#eaf6ff' : '#7fb3d9';
  ctx.lineWidth = isLocal ? 2.5 : 1.5;
  roundRect(-size / 2, -size / 2, size, size, 6);
  ctx.fill(); ctx.stroke();

  // C2 受击闪白（150ms）
  const flashUntil = hitFlashes.get(e.id);
  if (flashUntil && performance.now() < flashUntil) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    roundRect(-size / 2, -size / 2, size, size, 6);
    ctx.fill();
  }

  // 朝向点
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(size * 0.28 * facing.x, size * 0.28 * facing.y, 4, 0, Math.PI * 2);
  ctx.fill();

  // 本地玩家金圈
  if (isLocal) {
    ctx.strokeStyle = 'rgba(255,210,0,0.95)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,210,0,0.8)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(0, 0, size / 2 + 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 格挡光环
  if (e.parryState && e.parryState.active) {
    ctx.strokeStyle = '#5fd0e0';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#5fd0e0';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, 0, size / 2 + 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(95,208,224,0.12)';
    ctx.beginPath(); ctx.arc(0, 0, size / 2 + 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // C2 格挡中提示（本地玩家，parry 窗口）
  if (isLocal && e.parryState && e.parryState.active) {
    ctx.fillStyle = '#5fd0e0';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('格挡中', s.x, s.y - size / 2 - 20);
  }

  drawHpBar(s.x, s.y, isLocal ? 44 : 38, e.hp, e.maxHp, true);
}

function drawEnemy(e, p) {
  const s = worldToScreen(p);
  if (s.x < -80 || s.y < -80 || s.x > view.w + 80 || s.y > view.h + 80) return;
  const isBoss = e.kind === KIND.BOSS;
  const isElite = e.tier === 1;
  const size = isBoss ? 52 : (isElite ? 34 : 26);

  ctx.save();
  ctx.translate(s.x, s.y);

  const ang = e.dir * Math.PI / 4;
  const facing = { x: Math.cos(ang), y: Math.sin(ang) };
  if (isBoss) {
    ctx.fillStyle = '#7d1f2b';
    ctx.strokeStyle = '#e5b25d';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(229,178,93,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, size / 2 + 6, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.fillStyle = isElite ? '#5f8fb0' : '#e5484d';
    ctx.strokeStyle = isElite ? '#aad4ea' : '#ffb3b3';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (isElite) {
      ctx.strokeStyle = 'rgba(95,208,224,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, size / 2 + 4, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // C2 受击闪白（150ms）
  const flashUntil = hitFlashes.get(e.id);
  if (flashUntil && performance.now() < flashUntil) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill();
  }

  // 朝向点
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(size * 0.30 * facing.x, size * 0.30 * facing.y, 3, 0, Math.PI * 2);
  ctx.fill();

  // E8：选中敌人红圈（左键点选跟随；脉动呼吸）
  if (e.id === selectedEnemyId) {
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 160);
    ctx.strokeStyle = 'rgba(255,60,60,' + pulse.toFixed(2) + ')';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(255,60,60,0.9)';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, size / 2 + 7, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  drawHpBar(s.x, s.y, isBoss ? 72 : (isElite ? 48 : 38), e.hp, e.maxHp, true);
  if (isBoss) { ctx.fillStyle = '#e5b25d'; ctx.font = '10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('BOSS', s.x, s.y - 40); }
  else if (isElite) { ctx.fillStyle = '#5fd0e0'; ctx.font = '9px system-ui'; ctx.textAlign = 'center'; ctx.fillText('精英', s.x, s.y - 26); }
}

function drawLoot(e, p) {
  const s = worldToScreen(p);
  if (s.x < -60 || s.y < -60 || s.x > view.w + 60 || s.y > view.h + 60) return;
  const rarity = e.loot ? e.loot.rarity : 0;
  const color = RARITY_COLORS[rarity] || '#D8D2C4';
  const t = performance.now() / 1000;
  const pulse = 0.62 + 0.28 * Math.sin(t * 3.2); // 轻微脉动（alpha 呼吸）

  ctx.save();
  ctx.translate(s.x, s.y);

  // C2 稀有度光柱（地面向上竖条，alpha 呼吸）
  const pillarH = 58 + pulse * 10;
  const pillarW = 10 + pulse * 3;
  const grad = ctx.createLinearGradient(0, -pillarH, 0, 0);
  grad.addColorStop(0, hexA(color, 0));
  grad.addColorStop(0.25, hexA(color, 0.65 * pulse));
  grad.addColorStop(1, hexA(color, 0.35 * pulse));
  ctx.fillStyle = grad;
  ctx.fillRect(-pillarW / 2, -pillarH, pillarW, pillarH);

  // 底部光晕
  ctx.globalAlpha = 0.5 * pulse;
  const bg = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
  bg.addColorStop(0, hexA(color, 0.9));
  bg.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();

  // 菱形核心（漂浮光晕）
  ctx.globalAlpha = 1;
  ctx.shadowColor = color; ctx.shadowBlur = 10;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -9); ctx.lineTo(9, 0); ctx.lineTo(0, 9); ctx.lineTo(-9, 0);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // C2 名字放大 + 描边 + 脉动
  ctx.save();
  ctx.globalAlpha = Math.min(1, pulse + 0.15);
  ctx.font = 'bold 12px system-ui';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(10,12,16,0.9)';
  const label = (RARITY_NAMES[rarity] || '?') + ' ' + (e.loot ? e.loot.itemId : '');
  ctx.strokeText(label, s.x, s.y + 26);
  ctx.fillStyle = color;
  ctx.fillText(label, s.x, s.y + 26);
  if (e.loot && e.loot.ttlTicks != null) {
    ctx.font = '9px system-ui';
    const ttl = (e.loot.ttlTicks / TICK_RATE).toFixed(0) + 's';
    ctx.strokeText(ttl, s.x, s.y + 38);
    ctx.fillStyle = 'rgba(210,210,220,0.75)';
    ctx.fillText(ttl, s.x, s.y + 38);
  }
  ctx.restore();
}

function drawEntrance(e, p) {
  const s = worldToScreen(p);
  if (s.x < -80 || s.y < -80 || s.x > view.w + 80 || s.y > view.h + 80) return;
  const t = performance.now() / 1000;
  const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((x) => x.id === localEntityId) : null;
  const near = me && Math.hypot(me.pos.x - e.pos.x, me.pos.y - e.pos.y) <= ENTRANCE_ENTER_RADIUS;

  ctx.save();
  ctx.translate(s.x, s.y);
  // 旋转涡流（裂隙异象）
  for (let i = 0; i < 3; i++) {
    const rr = 18 + i * 10 + Math.sin(t * 2 + i) * 3;
    ctx.strokeStyle = i === 0 ? '#9b5fd6' : (i === 1 ? '#5fd0e0' : 'rgba(155,95,214,0.4)');
    ctx.lineWidth = 3 - i * 0.7;
    ctx.setLineDash([6, 5]);
    ctx.lineDashOffset = -t * 40 * (i + 1);
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.fillStyle = 'rgba(155,95,214,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
  // 中心
  ctx.fillStyle = near ? '#e8d5ff' : '#cbb';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = near ? '#e8d5ff' : 'rgba(200,190,220,0.8)';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(near ? '裂隙入口（按 F）' : '裂隙入口', s.x, s.y - 30);
  if (e.entrance && e.entrance.cooldownTicks > 0) {
    const left = e.entrance.cooldownTicks - (GAME.lastTick - e.entrance.lastUsedTick);
    if (left > 0) {
      ctx.fillStyle = '#f2a03c';
      ctx.font = '9px system-ui';
      ctx.fillText('冷却 ' + (left / TICK_RATE).toFixed(1) + 's', s.x, s.y - 20);
    }
  }
}

function drawTelegraph(e, p) {
  if (!e.telegraph) return;
  const s = worldToScreen(p);
  if (s.x < -120 || s.y < -120 || s.x > view.w + 120 || s.y > view.h + 120) return;
  const t = e.telegraph;
  const radius = t.radius || 60;
  const progress = t.applyTick > t.startTick ? Math.min(1, Math.max(0, (GAME.lastTick - t.startTick) / (t.applyTick - t.startTick))) : 0;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.globalAlpha = 0.3 + progress * 0.45;
  ctx.fillStyle = t.color === 1 ? '#5fd0e0' : '#e5484d';
  ctx.strokeStyle = t.color === 1 ? '#5fd0e0' : '#e5484d';
  if (t.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill(); }
  else {
    ctx.lineWidth = 3 + progress * 3;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.12; ctx.fill();
  }
  ctx.restore();
}

function drawTelegraphs() {
  if (!lastSnapshot) return;
  for (const e of lastSnapshot.entities) {
    if (e.kind !== KIND.TELEGRAPH) continue;
    const p = renderPosFor(e) || e.pos;
    if (p) drawTelegraph(e, p);
  }
}

function drawEntities() {
  if (!lastSnapshot) return;
  // 入口画在实体底层
  for (const e of lastSnapshot.entities) {
    if (e.kind !== KIND.ENTRANCE) continue;
    drawEntrance(e, e.pos);
  }

  // C2 拾取提示：最近 LOOT_GROUND ≤ 1.5×TILE → 「按 F 拾取」（服务端重叠自动拾取，走近即拾取）
  nearLootId = null; GAME.nearLootId = null; GAME.pickupHint = '';
  const mePos = predicted || (localEntityId != null ? (lastSnapshot.entities.find((e) => e.id === localEntityId) || {}).pos : null);
  if (mePos) {
    let bestLoot = null, bestD = Infinity;
    for (const e of lastSnapshot.entities) {
      if (e.kind !== KIND.LOOT_GROUND) continue;
      const d = Math.hypot(e.pos.x - mePos.x, e.pos.y - mePos.y);
      if (d < bestD) { bestD = d; bestLoot = e; }
    }
    if (bestLoot && bestD <= PICKUP_HINT_RADIUS) {
      nearLootId = bestLoot.id;
      GAME.nearLootId = nearLootId;
      GAME.pickupHint = '按 F 拾取';
      const lp = interpPos(bestLoot.id, renderTime) || bestLoot.pos;
      const ls = worldToScreen(lp);
      ctx.save();
      ctx.font = 'bold 12px system-ui';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(10,12,16,0.9)';
      ctx.strokeText('按 F 拾取', ls.x, ls.y - 42);
      ctx.fillStyle = '#ffd27d';
      ctx.fillText('按 F 拾取', ls.x, ls.y - 42);
      ctx.restore();
    }
  }

  // E8：点击移动目标点标记（小十字圈，淡黄虚线）
  if (moveTarget != null) {
    const gx = Math.floor(moveTarget / 64), gy = moveTarget % 64;
    const ms = worldToScreen({ x: gx * TILE + TILE / 2, y: gy * TILE + TILE / 2 });
    ctx.save();
    ctx.strokeStyle = 'rgba(255,210,0,0.85)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(ms.x, ms.y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(ms.x - 17, ms.y); ctx.lineTo(ms.x - 6, ms.y);
    ctx.moveTo(ms.x + 6, ms.y); ctx.lineTo(ms.x + 17, ms.y);
    ctx.moveTo(ms.x, ms.y - 17); ctx.lineTo(ms.x, ms.y - 6);
    ctx.moveTo(ms.x, ms.y + 6); ctx.lineTo(ms.x, ms.y + 17);
    ctx.stroke();
    ctx.restore();
  }

  for (const e of lastSnapshot.entities) {
    if (e.kind === KIND.ENTRANCE) continue;
    const p = renderPosFor(e) || e.pos;
    if (!p) continue;
    if (e.kind === KIND.PLAYER) drawPlayer(e, p);
    else if (e.kind === KIND.ENEMY || e.kind === KIND.BOSS) drawEnemy(e, p);
    else if (e.kind === KIND.LOOT_GROUND) drawLoot(e, p);
    else if (e.kind === KIND.TELEGRAPH) { /* telegraph 已底层绘制 */ }
  }
  // 消失实体淡出
  for (const [id, rec] of lastKnown) {
    if (!lastSnapshot.entities.some((e) => e.id === id)) {
      const p = rec.ent.pos;
      const s = worldToScreen(p);
      if (s.x < -80 || s.y < -80 || s.x > view.w + 80 || s.y > view.h + 80) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, rec.alpha);
      if (rec.ent.kind === KIND.LOOT_GROUND) { drawLoot(rec.ent, p); }
      else if (rec.ent.kind === KIND.ENEMY || rec.ent.kind === KIND.BOSS) { drawEnemy(rec.ent, p); }
      ctx.restore();
    }
  }
}

// C2 表现层特效（飘字 / 命中环 / 技能光效 / 击杀粒子）— 屏幕空间绘制
function drawFx() {
  const t = performance.now();

  // 伤害飘字（1s 淡出上飘）
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    const age = t - f.born;
    if (age > f.ttl) { floatTexts.splice(i, 1); continue; }
    const k = age / f.ttl;
    const s = worldToScreen({ x: f.x, y: f.y + f.vy * age / 1000 });
    ctx.save();
    ctx.globalAlpha = 1 - k * k;
    ctx.font = 'bold 15px system-ui';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.strokeText(f.text, s.x, s.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, s.x, s.y);
    ctx.restore();
  }

  // 命中/格挡扩散环
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    const age = t - r.born;
    if (age > r.ttl) { rings.splice(i, 1); continue; }
    const k = age / r.ttl;
    const s = worldToScreen({ x: r.x, y: r.y });
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r.r0 + (r.r1 - r.r0) * k, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 技能光效（玩家放技能方向扇形闪光，0.3s 淡出）
  for (let i = skillFx.length - 1; i >= 0; i--) {
    const fx = skillFx[i];
    const age = t - fx.born;
    if (age > fx.ttl) { skillFx.splice(i, 1); continue; }
    const k = age / fx.ttl;
    const s = worldToScreen({ x: fx.x, y: fx.y });
    const ang = fx.dir * Math.PI / 4;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(ang);
    ctx.globalAlpha = (1 - k) * 0.55;
    const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, fx.radius);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.4, fx.color);
    grad.addColorStop(1, 'rgba(255,140,66,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, fx.radius, -0.62, 0.62);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // E8 普攻挥砍弧线（白刃扇形短闪 0.22s，复用技能光效模式）
  for (let i = meleeFx.length - 1; i >= 0; i--) {
    const fx = meleeFx[i];
    const age = t - fx.born;
    if (age > fx.ttl) { meleeFx.splice(i, 1); continue; }
    const k = age / fx.ttl;
    const s = worldToScreen({ x: fx.x, y: fx.y });
    const ang = fx.dir * Math.PI / 4;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(ang);
    ctx.globalAlpha = (1 - k) * 0.85;
    const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 36);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.7)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 36, -0.5, 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, 30, -0.5, 0.5);
    ctx.stroke();
    ctx.restore();
  }

  // 击杀粒子（6-12 个小方块，200ms 淡出四散）
  for (let i = killFx.length - 1; i >= 0; i--) {
    const fx = killFx[i];
    const age = t - fx.born;
    if (age > fx.ttl) { killFx.splice(i, 1); continue; }
    const k = age / fx.ttl;
    for (const p of fx.parts) {
      const s = worldToScreen({ x: fx.x + p.dx * k, y: fx.y + p.dy * k });
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = p.color;
      ctx.translate(s.x, s.y);
      ctx.rotate(p.dx * k * 0.1);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  // 格挡成功盾闪（本地玩家，受击时 parry 生效）
  if (parryFx.until > t) {
    const me = localEntityId != null && lastSnapshot ? lastSnapshot.entities.find((e) => e.id === localEntityId) : null;
    const base = predicted || (me ? me.pos : null);
    if (base) {
      const s = worldToScreen(base);
      const k = 1 - (parryFx.until - t) / 400;
      ctx.save();
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = '#5fd0e0';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 26 + k * 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawMinimap(camX, camY) {
  const mw = 150, mh = 112, mx = view.w - mw - 12, my = 52;
  const kx = mw / WORLD_W, ky = mh / WORLD_H;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(10,12,16,0.85)';
  ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
  ctx.strokeStyle = 'rgba(90,100,120,0.5)';
  ctx.strokeRect(mx - 2, my - 2, mw + 4, mh + 4);
  if (lastSnapshot) {
    for (const e of lastSnapshot.entities) {
      let col = null;
      if (e.kind === KIND.PLAYER) col = e.id === localEntityId ? '#ffd200' : '#4cb5f5';
      else if (e.kind === KIND.ENEMY) col = '#e5484d';
      else if (e.kind === KIND.BOSS) col = '#e5b25d';
      else if (e.kind === KIND.LOOT_GROUND) col = RARITY_COLORS[e.loot ? e.loot.rarity : 0];
      else if (e.kind === KIND.ENTRANCE) col = '#9b5fd6';
      if (!col) continue;
      ctx.fillStyle = col;
      const r = e.kind === KIND.BOSS ? 4 : (e.kind === KIND.PLAYER ? 3 : 2);
      ctx.fillRect(mx + e.pos.x * kx - r / 2, my + e.pos.y * ky - r / 2, r, r);
    }
  }
  // 视野框
  const vw = view.w / view.scale * kx, vh = view.h / view.scale * ky;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.strokeRect(mx + camX * kx - vw / 2, my + camY * ky - vh / 2, vw, vh);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// hex → rgba(...,a) 辅助（稀有度色光柱渐变）
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ── 启动 ──
resize();
connect();
draw();
})();
</script>
