<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Dungeon Online - 浏览器试玩版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: system-ui, -apple-system, sans-serif; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; background: rgba(0,0,0,0.7); font-size: 13px; display: flex; gap: 18px; align-items: center; z-index: 10; pointer-events: none; }
  #hud span { white-space: nowrap; }
  #status { color: #fa0; font-weight: bold; }
  #status.ok { color: #3f3; }
  #status.err { color: #f44; }
  canvas { display: block; width: 100%; height: 100%; background: #111; }
  #help { position: absolute; bottom: 12px; left: 14px; color: #aaa; font-size: 12px; z-index: 10; pointer-events: none; }
  #bossbar { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(60%, 560px); height: 16px; background: rgba(40,0,0,0.75); border: 1px solid #f55; border-radius: 8px; overflow: hidden; display: none; z-index: 10; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg,#f55,#f93); transition: width 0.12s linear; }
  #bossname { position: absolute; top: -1px; left: 8px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; line-height: 16px; }
  #skillbar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; pointer-events: none; }
  .skill { width: 52px; height: 52px; border-radius: 10px; background: rgba(0,0,0,0.55); border: 1px solid #4cb5f5; color: #cfe; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .skill .k { font-size: 16px; font-weight: bold; color: #fff; }
  .skill .n { font-size: 10px; opacity: 0.85; }
  .skill .cd { position: absolute; left: 0; bottom: 0; width: 100%; background: rgba(0,0,0,0.65); }
  .skill.ready { border-color: #6fd68a; }
  #stick-area { position: fixed; bottom: 24px; left: 24px; width: 120px; height: 120px; z-index: 20; display: none; }
  #stick-base { position: absolute; left: 10px; top: 10px; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); }
  #stick-nub { position: absolute; left: 35px; top: 35px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.35); transform: scale(0); transition: transform 0.08s; }
  #touch-attack { position: fixed; bottom: 34px; right: 24px; width: 76px; height: 76px; border-radius: 50%; background: rgba(255,80,80,0.25); border: 1px solid rgba(255,120,120,0.5); color: #fcc; display: none; align-items: center; justify-content: center; font-size: 26px; z-index: 20; user-select: none; -webkit-user-select: none; }
  @media (hover: none) and (pointer: coarse) {
    #stick-area, #touch-attack { display: flex; }
    #skillbar { bottom: 100px; }
  }
  /* ── wave progression HUD (M7) ── */
  #wavebanner { position: absolute; top: 16px; left: 50%; transform: translate(-50%, -8px); width: min(72%, 520px); text-align: center; color: #fff; font-size: 15px; font-weight: bold; text-shadow: 0 2px 4px #000; background: rgba(20,10,0,0.55); border: 1px solid rgba(230,140,60,0.7); border-radius: 10px; padding: 8px 14px; z-index: 12; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  #wavebanner.show { opacity: 1; transform: translate(-50%, 0); }
  #wavebanner.boss { border-color: #f55; color: #ffd6c8; }
  #wavebanner.win { border-color: #6fd68a; color: #bfffd0; }
  #wavebanner .sub { display: block; font-size: 12px; font-weight: normal; opacity: 0.85; margin-top: 3px; }
  #wavechip { position: absolute; top: 8px; right: 14px; color: #fdb; font-size: 12px; text-shadow: 0 1px 2px #000; z-index: 10; pointer-events: none; }
  @media (hover: none) and (pointer: coarse) {
    #wavebanner { top: 10px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="hud">
  <span id="status">连接中...</span>
  <span id="tick">tick:-</span>
  <span id="hp">HP:-</span>
  <span id="ents">entities:0</span>
</div>
<canvas id="game"></canvas>
<div id="wavebanner"></div>
<div id="wavechip"></div>
<div id="bossbar"><div id="bossfill"></div><span id="bossname"></span></div>
<div id="skillbar">
  <div class="skill" id="sk0"><span class="k">1</span><span class="n">护盾链接</span><div class="cd" id="cd0"></div></div>
  <div class="skill" id="sk1"><span class="k">2</span><span class="n">急救链</span><div class="cd" id="cd1"></div></div>
  <div class="skill" id="sk2"><span class="k">3</span><span class="n">嘲讽战吼</span><div class="cd" id="cd2"></div></div>
</div>
<div id="stick-area"><div id="stick-base"><div id="stick-nub"></div></div></div>
<div id="touch-attack">⚔</div>
<div id="help">WASD / 方向键 移动 · 空格 / J 攻击 · Shift 闪避 · 1·2·3 协作技（按职业）</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const tickEl = document.getElementById('tick');
const hpEl = document.getElementById('hp');
const entsEl = document.getElementById('ents');
const bossbar = document.getElementById('bossbar');
const bossfill = document.getElementById('bossfill');
const bossname = document.getElementById('bossname');
const waveBanner = document.getElementById('wavebanner');
const waveChip = document.getElementById('wavechip');
let lastSeenWave = 0, lastSeenPhase = 1, bannerTimer = null, bannerHideAt = 0;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const params = new URLSearchParams(location.search);
const SERVER = params.get('server') || 'ws://localhost:3010';
const devUserId = 'web_' + Math.random().toString(36).slice(2, 8);

const ws = new WebSocket(`${SERVER.replace(/\/$/, '')}/ws/dungeon?devUserId=${devUserId}`);
ws.binaryType = 'arraybuffer';

// exposed for automation/debug (per engineering brief)
const GAME = window.__game = {
  connected: false, lastSnapshot: null, localEntityId: null, gameState: 'connecting',
  fps: 0, errors: [], spritesLoaded: false, localRender: null, predicted: null, authPos: null,
  particleCount: 0, // M11: live death/hit particle count (for automation gate)
  localClass: null, classSkills: [], lastCastParam: null, // M15/C4: per-class skill set (for automation gate)
};
// M11: expose spawnBurst so automation can deterministically trigger/verify the death-burst path.
GAME.spawnBurst = spawnBurst;

let state = 'connecting';
let roomId = null, seatIndex = null, reconnectToken = null, runId = null;
let lastSnapshot = null;
let localEntityId = null;
let seq = 1;
let lastMoveDir = null;
let touchDir = null;          // virtual joystick vector for touch devices

// ── smoothing / interpolation tunables ──
// WEB-FEEL anti-stutter: frame-rate-independent local prediction + gentle server reconciliation.
// The OLD model added a fixed step EVERY rAF frame then yanked back 30% of the error on each
// snapshot → prediction raced ahead of authority → visible oscillation/stutter. The new model
// advances the RENDER position by PLAYER_SPEED*dt each frame and eases only 15% of the (small,
// latency-bound) error toward the authoritative pos per snapshot → no snap, no oscillation.
const PLAYER_SPEED = 210;        // px/s local prediction (≈ new tank CLASS_BASE.moveSpeed, types.ts).
                                 // TODO: one day this should arrive from the server/snapshot as the
                                 // single source of truth instead of being hardcoded here.
const RECONCILE_FACTOR = 0.15;   // per-snapshot ease toward authoritative pos (no snap, no oscillation)
const SNAP_THRESHOLD = 250;      // hard snap only after a real teleport (e.g. reconnect); else ease
const INTERP_TICKS = 3;          // render remote entities ~100ms in the past
const BUF_MAX = 10;              // ring buffer of recent snapshots

let predicted = null;            // predicted RENDER position of the LOCAL player (render-only; never authoritative)
let snapBuffer = [];             // [{tick, entities}]
let renderTime = 0;              // current interpolated render tick
let lastFrameT = performance.now();

// ── damage / death / pickup event tracking (flash + SFX) ──
let hpPrev = new Map();        // id -> last hp (for damage-flash detection)
let knownIds = new Map();      // id -> kind (for death / loot-pickup detection)
let flash = new Map();         // id -> flash expiry ms
let lastHitSfx = 0, lastDeathSfx = 0;
// camera smoothing
let camX = 0, camY = 0;
// co-op skill cooldown UI state (client-only estimate; authoritative gating is server-side)
// C4b：扩展到 5 项（与 SKILL_IDS 对齐）。skillId 索引：0护盾/1急救/2嘲讽/3标记/4弹幕。
const SKILL_CD_MS = [12000, 10000, 14000, 14000, 16000];
// C4/C4b：职业技能白名单（mirror sim CLASS_SKILLS；客户端仅用于渲染/拦截，权威校验在 sim）。
// C4b：ranger 加 MARK(3)、mage 加 BARRAGE(4)，故这俩职业 3 技；tank/healer 维持 2 技。
const CLASS_SKILLS_CLIENT = { tank: [2, 0], ranger: [1, 0, 3], mage: [2, 0, 4], healer: [1, 0] };
const SKILL_TARGET_MODE = ['ally', 'ally', 'self', 'enemy', 'enemy']; // 按全局 skillId：0/1=盟友，2=自身，3/4=敌人（C4b MARK/BARRAGE 进攻技指向敌人）
const skillCdUntil = [0, 0, 0]; // 按本地技能序号 0/1/2（每职业最多 3 技）
// 自动化钩子（与 GAME.spawnBurst 同模式）：清技能 CD，便于验证脚本在「早期已施放占用 slot0」后
// 仍能确定性触发本职业第 1 技的映射校验（避免冷却 bleed 误判）。仅调试用，不影响正常游戏。
GAME.clearSkillCd = () => { for (let i = 0; i < skillCdUntil.length; i++) skillCdUntil[i] = 0; };
let mySkills = [];
let lastCastParam = null;
let skillBarBuiltFor = null;
let shakeMag = 0;             // screen-shake magnitude (decays each frame)
const floaters = [];          // floating damage/heal numbers {x,y,text,color,born,life}
// co-op cast feedback (M8): track last seen activeSkill per ally so a NEW cast fires a one-shot ring + label.
const lastActiveSkill = new Map(); // actorId → {skillId, tick}
const SKILL_LABEL = ['护盾链接', '急救链', '嘲讽战吼', '猎手标记', '术法弹幕']; // 索引对齐 SKILL_IDS（C4b +MARK/BARRAGE）
const SKILL_FX_COLOR = ['#6fd68a', '#f8d24a', '#f5a24a', '#e86fb0', '#9b7be8']; // 绿(护盾)/金(急救)/橙(嘲讽)/品红(标记)/紫(弹幕)，对齐 art-bible 阵营色/EMBER
const castRings = [];         // co-op cast ground rings {id, skillId, x, y, born, color} (M8)
const particles = [];         // death/hit particle bursts {x, y, vx, vy, born, life, color, r} (M11)
const lastPos = new Map();    // actorId → {x, y} last known position (for death burst spawn) (M11)

// ── sprite / art assets ──
const SPRITE_SRC = {
  hero: 'assets/hero.png',
  grunt: 'assets/grunt.png',
  elite: 'assets/elite.png',
  caster: 'assets/caster.png',
  boss: 'assets/boss.png',
  floor: 'assets/floor.png',
};
const SPRITES = {};
let floorPattern = null;
let spritesPending = 0;
for (const [k, src] of Object.entries(SPRITE_SRC)) {
  const img = new Image();
  const rec = { img, status: 'loading' };
  SPRITES[k] = rec;
  spritesPending++;
  img.onload = () => {
    rec.status = 'ok';
    if (k === 'floor') floorPattern = ctx.createPattern(img, 'repeat');
    onSpriteSettled();
  };
  img.onerror = () => { rec.status = 'err'; onSpriteSettled(); };
  img.src = src;
}
function onSpriteSettled() {
  const allDone = Object.values(SPRITES).every(s => s.status !== 'loading');
  if (allDone) GAME.spritesLoaded = true;
}
const spriteOk = k => SPRITES[k] && SPRITES[k].status === 'ok';

const keys = new Set();
const KEY_DIR = {
  KeyW:{x:0,y:-1}, ArrowUp:{x:0,y:-1},
  KeyS:{x:0,y:1}, ArrowDown:{x:0,y:1},
  KeyA:{x:-1,y:0}, ArrowLeft:{x:-1,y:0},
  KeyD:{x:1,y:0}, ArrowRight:{x:1,y:0},
};

window.addEventListener('keydown', e => {
  keys.add(e.code);
  ensureAudio();
  if (e.code === 'Space' || e.code === 'KeyJ') {
    e.preventDefault();
    sendInput(1, lastMoveDir || {x:0,y:0}, nearestEnemyId());
    sfxAttack();
  } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    sendInput(2, lastMoveDir || {x:0,y:0}, 0); // DODGE
  } else if (e.code === 'Digit1' || e.code === 'Numpad1') {
    castSkill(0);
  } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
    castSkill(1);
  } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
    castSkill(2);
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));

// ── touch controls (mobile) ──
const stickArea = document.getElementById('stick-area');
const stickBase = document.getElementById('stick-base');
const stickNub = document.getElementById('stick-nub');
const touchAttack = document.getElementById('touch-attack');
let stickActive = false, stickCx = 0, stickCy = 0;
function updateStick(tx, ty) {
  const dx = tx - stickCx, dy = ty - stickCy;
  const len = Math.hypot(dx, dy);
  const max = 45;
  const f = len > max ? max / len : 1;
  touchDir = { x: (dx * f) / max, y: (dy * f) / max };
  if (stickNub) { stickNub.style.left = (50 + dx * f - 15) + 'px'; stickNub.style.top = (50 + dy * f - 15) + 'px'; }
}
if (stickArea) {
  stickArea.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 0) return;
    const t = e.touches[0];
    stickCx = t.clientX; stickCy = t.clientY;
    if (stickBase) { stickBase.style.left = (stickCx - 50) + 'px'; stickBase.style.top = (stickCy - 50) + 'px'; }
    if (stickNub) stickNub.style.transform = 'scale(1)';
    stickActive = true; updateStick(t.clientX, t.clientY);
  }, { passive: false });
  stickArea.addEventListener('touchmove', e => {
    if (!stickActive) return; e.preventDefault();
    const t = e.touches[0]; updateStick(t.clientX, t.clientY);
  }, { passive: false });
  stickArea.addEventListener('touchend', e => { e.preventDefault(); stickActive = false; touchDir = null; if (stickNub) stickNub.style.transform = 'scale(0)'; }, { passive: false });
  stickArea.addEventListener('touchcancel', () => { stickActive = false; touchDir = null; if (stickNub) stickNub.style.transform = 'scale(0)'; });
}
if (touchAttack) {
  touchAttack.addEventListener('touchstart', e => {
    e.preventDefault(); ensureAudio(); sendInput(1, touchDir || { x: 0, y: 0 }, nearestEnemyId()); sfxAttack();
    touchAttack.style.background = 'rgba(255,80,80,0.45)';
  }, { passive: false });
  touchAttack.addEventListener('touchend', e => { e.preventDefault(); touchAttack.style.background = 'rgba(255,80,80,0.25)'; }, { passive: false });
}
// C4：技能栏改为按职业动态构建（renderSkillBar），监听器在其中挂载，移除静态 3 技能循环。

function currentInputDir() {
  let dx = 0, dy = 0;
  for (const code of keys) { const v = KEY_DIR[code]; if (v) { dx += v.x; dy += v.y; } }
  if (dx !== 0 || dy !== 0) { const len = Math.hypot(dx, dy); return { x: dx / len, y: dy / len }; }
  return touchDir;
}

function nearestEnemyId() {
  if (!lastSnapshot) return 0;
  const me = lastSnapshot.entities.find(e => e.id === localEntityId);
  if (!me) return 0;
  let best = null, bd = 1e9;
  for (const e of lastSnapshot.entities) {
    if (e.kind === 0) continue;
    const d = Math.hypot(e.pos.x - me.pos.x, e.pos.y - me.pos.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best ? best.id : 0;
}

function sendJson(obj) { ws.send(JSON.stringify(obj)); }
function sendInput(action, dir, target, param) {
  if (!lastSnapshot || state !== 'playing') return;
  sendJson({
    type: 'input.cmd',
    payload: { cmd: { seq: seq++, tick: lastSnapshot.tick, action, dir: { x: dir.x || 0, y: dir.y || 0 }, target: target || 0, param: param ?? 0 } }
  });
}

// ── co-op skill targeting + casting ──
function nearestAllyId() {
  if (!lastSnapshot || localEntityId == null) return 0;
  const me = lastSnapshot.entities.find(e => e.id === localEntityId);
  if (!me) return 0;
  let best = null, bd = 1e9;
  for (const e of lastSnapshot.entities) {
    if (e.kind !== 0 || e.id === localEntityId) continue;
    const d = Math.hypot(e.pos.x - me.pos.x, e.pos.y - me.pos.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best ? best.id : 0;
}
function castSkill(localIdx) {
  if (localIdx >= mySkills.length) { sfxDenied(); return; } // C4：职业无此技 → 拦截（不发送）
  const skillId = mySkills[localIdx];
  const now = performance.now();
  if (now < skillCdUntil[localIdx]) { sfxDenied(); return; }
  // C4b：目标模式按 skillId 路由——self 自身 / enemy 最近敌人（MARK/BARRAGE）/ ally 最近盟友。
  const mode = SKILL_TARGET_MODE[skillId];
  const target = mode === 'self' ? 0 : (mode === 'enemy' ? nearestEnemyId() : nearestAllyId());
  sendInput(3, { x: 0, y: 0 }, target, skillId);
  skillCdUntil[localIdx] = now + SKILL_CD_MS[skillId];
  lastCastParam = skillId;
  GAME.lastCastParam = skillId;
  sfxSkill();
}
// C4：按本地职业动态构建技能栏（监听器随构建挂载；移除原静态 3 技能循环）。
function renderSkillBar() {
  const bar = document.getElementById('skillbar');
  if (!bar) return;
  bar.innerHTML = '';
  mySkills.forEach((sid, idx) => {
    const el = document.createElement('div');
    el.className = 'skill';
    el.id = 'sk' + idx;
    el.innerHTML = '<span class="k">' + (idx + 1) + '</span><span class="n">' + SKILL_LABEL[sid] + '</span><div class="cd" id="cd' + idx + '"></div>';
    el.style.pointerEvents = 'auto';
    el.addEventListener('touchstart', (e) => { e.preventDefault(); castSkill(idx); }, { passive: false });
    el.addEventListener('click', () => castSkill(idx));
    bar.appendChild(el);
  });
}

// ── WebAudio SFX (procedural, no asset files) ──
let actx = null;
let droneOsc = null, droneGain = null;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; }
  if (actx) startAmbient();
}
function tone(freq, dur, type, gain, when, slideTo) {
  if (!actx) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function sfxAttack() { tone(420, 0.09, 'square', 0.07, 0, 720); }
function sfxHit() { tone(190, 0.08, 'sawtooth', 0.10, 0, 90); }
function sfxDeath() { tone(300, 0.30, 'sawtooth', 0.09, 0, 70); }
function sfxPickup() { tone(660, 0.08, 'triangle', 0.10); tone(900, 0.11, 'triangle', 0.08, 0.07); }
function sfxSkill() { tone(520, 0.12, 'triangle', 0.10, 0, 780); tone(780, 0.14, 'triangle', 0.08, 0.06); }
function sfxDenied() { tone(150, 0.10, 'square', 0.05); }
function startAmbient() {
  if (!actx || droneOsc) return;
  droneOsc = actx.createOscillator(); droneOsc.type = 'sine'; droneOsc.frequency.value = 52;
  droneGain = actx.createGain(); droneGain.gain.value = 0.018;
  droneOsc.connect(droneGain); droneGain.connect(actx.destination);
  droneOsc.start();
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.12;
  const lfoGain = actx.createGain(); lfoGain.gain.value = 0.010;
  lfo.connect(lfoGain); lfoGain.connect(droneGain.gain);
  lfo.start();
}

ws.onopen = () => {
  state = 'auth';
  GAME.connected = true; GAME.gameState = 'auth';
  sendJson({ type: 'room.create', requestId: 'r1', payload: { displayName: 'WebPlayer' } });
};

ws.onerror = () => {
  statusEl.textContent = '连接错误（服务端是否已启动？）';
  statusEl.className = 'err';
  GAME.connected = false; GAME.gameState = 'error';
};

ws.onclose = () => {
  statusEl.textContent = '连接已关闭';
  statusEl.className = 'err';
  GAME.connected = false; GAME.gameState = 'closed';
};

function handleControl(msg) {
  switch (msg.type) {
    case 'room.create.ok': {
      roomId = msg.roomId; seatIndex = msg.seatIndex; reconnectToken = msg.reconnectToken;
      state = 'room';
      sendJson({ type: 'game.start', requestId: 'r2', payload: { roomId } });
      break;
    }
    case 'game.start.ok': {
      runId = msg.runId;
      state = 'playing';
      statusEl.textContent = '游戏中';
      statusEl.className = 'ok';
      break;
    }
    case 'game.error': {
      statusEl.textContent = '错误: ' + (msg.error?.code || 'unknown');
      statusEl.className = 'err';
      break;
    }
  }
}

function handleSnapshot(msg) {
  lastSnapshot = msg;
  localEntityId = null;
  if (seatIndex != null && Array.isArray(msg.entities)) {
    const local = msg.entities.find(e => e.kind === 0 && e.ownerId === seatIndex);
    if (local) localEntityId = local.id;
  }

  // ring buffer (keep last BUF_MAX snapshots)
  snapBuffer.push(msg);
  if (snapBuffer.length > BUF_MAX) snapBuffer.shift();

  // Gently reconcile predicted RENDER pos toward the authoritative snapshot each tick.
  // Small 0.15 ease → no snap, no oscillation. Hard snap only past SNAP_THRESHOLD (real teleport).
  // Discipline B: we ONLY ever write the RENDER position `predicted`; we never touch
  // msg / lastSnapshot.hp / status or any authoritative field.
  if (localEntityId != null) {
    const auth = msg.entities.find(e => e.id === localEntityId);
    if (auth) {
      if (!predicted) {
        predicted = { x: auth.pos.x, y: auth.pos.y };
      } else {
        const ex = auth.pos.x - predicted.x;
        const ey = auth.pos.y - predicted.y;
        if (Math.hypot(ex, ey) > SNAP_THRESHOLD) {
          predicted.x = auth.pos.x; predicted.y = auth.pos.y; // real teleport → snap
        } else {
          predicted.x += ex * RECONCILE_FACTOR;
          predicted.y += ey * RECONCILE_FACTOR;
        }
      }
    }
  }

  // ── damage / death / pickup event tracking (drives flash + SFX + juice) ──
  for (const e of msg.entities) {
    const prev = hpPrev.get(e.id);
    if (prev != null && e.hp < prev) {
      const dmg = prev - e.hp;
      flash.set(e.id, performance.now() + 130);
      floaters.push({ x: e.pos.x, y: e.pos.y - 12, text: '-' + dmg, color: '#ff5a5a', born: performance.now(), life: 750 });
      if (e.id === localEntityId) { shakeMag = Math.max(shakeMag, 7); sfxHit(); }
      else { const n = performance.now(); if (n - lastHitSfx > 60) { sfxHit(); lastHitSfx = n; } }
    } else if (prev != null && e.hp > prev) {
      floaters.push({ x: e.pos.x, y: e.pos.y - 12, text: '+' + (e.hp - prev), color: '#5dff8a', born: performance.now(), life: 750 });
    }
    hpPrev.set(e.id, e.hp);
    lastPos.set(e.id, { x: e.pos.x, y: e.pos.y }); // M11: remember last spot for death burst
  }
  let deathHappened = false, lootGone = false;
  for (const [id, kind] of knownIds) {
    if (!msg.entities.some(en => en.id === id)) {
      if (kind === 6) lootGone = true;
      else if (kind === 1 || kind === 2) {
        deathHappened = true;
        const p = lastPos.get(id) || { x: 0, y: 0 }; // M11: burst at last known position
        spawnBurst(p.x, p.y, kind === 2 ? '#f93' : '#f86', kind === 2 ? 20 : 12);
      }
    }
  }
  if (deathHappened) {
    const n = performance.now();
    shakeMag = Math.max(shakeMag, 5);
    if (n - lastDeathSfx > 120) { sfxDeath(); lastDeathSfx = n; }
  }
  if (lootGone) sfxPickup();
  knownIds.clear();
  for (const e of msg.entities) knownIds.set(e.id, e.kind);

  // ── M8 co-op cast feedback (C5 收口)：盟友「新施放」协作技 → 一次性光环 + 头顶标签飘字 ──
  // 仅对玩家盟友触发（e.kind===0）；activeSkill 由服务端权威下发（world.snapshot 公开），非客户端伪造。
  // 判定「新施放」：本 tick 有 activeSkill 且 (上次无 或 上次 skillId 不同 或 上次 tick 较远 → 视为新一次)。
  for (const e of msg.entities) {
    if (e.kind !== 0) continue;
    const cur = e.activeSkill ?? null;
    const prev = lastActiveSkill.get(e.id);
    const isNewCast =
      cur != null &&
      (prev == null || prev.skillId !== cur || prev.tick == null || msg.tick - prev.tick > 12);
    if (isNewCast) {
      const label = SKILL_LABEL[cur] || '协作技';
      const col = SKILL_FX_COLOR[cur] || '#fff';
      // 头顶协作技标签飘字
      floaters.push({ x: e.pos.x, y: e.pos.y - 20, text: '✦ ' + label, color: col, born: performance.now(), life: 950, big: true });
      // 施法者脚下扩散光环标记（render 时按 born 渐隐，drawCastRings 消费）
      castRings.push({ id: e.id, skillId: cur, x: e.pos.x, y: e.pos.y, born: performance.now(), color: col });
      // 若施法者就是本地玩家，额外给点屏内确认（音效已在 castSkill 内 sfxSkill 触发）
      if (e.id === localEntityId) { shakeMag = Math.max(shakeMag, 2.5); }
    }
    if (cur != null) lastActiveSkill.set(e.id, { skillId: cur, tick: msg.tick });
    else lastActiveSkill.delete(e.id);
  }

  GAME.lastSnapshot = lastSnapshot;
  // M9: expose live downed-ally count (rescue clarity). Read via GAME.lastSnapshot (getter-consistent)
  // so automation that injects a synthetic downed entity still sees it counted deterministically.
  GAME.downedAllies = (GAME.lastSnapshot?.entities || []).filter(
    (e) => e.kind === 0 && e.status && (e.status & 2) && (e.status & 1),
  ).length;
  GAME.localEntityId = localEntityId;
  GAME.gameState = state;
}

ws.onmessage = (ev) => {
  let msg;
  if (typeof ev.data === 'string') {
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleControl(msg);
    const isSnap = msg.type === 'snapshot' || (msg.tick !== undefined && Array.isArray(msg.entities));
  if (isSnap && Array.isArray(msg.entities)) handleSnapshot(msg);
  } else if (ev.data instanceof ArrayBuffer) {
    try {
      msg = JSON.parse(new TextDecoder().decode(ev.data));
    } catch { return; }
    const isSnap = msg.type === 'snapshot' || (msg.tick !== undefined && Array.isArray(msg.entities));
  if (isSnap && Array.isArray(msg.entities)) handleSnapshot(msg);
  }
};

function updateInput() {
  let dx = 0, dy = 0;
  for (const code of keys) {
    const v = KEY_DIR[code];
    if (v) { dx += v.x; dy += v.y; }
  }
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    lastMoveDir = { x: dx / len, y: dy / len };
    sendInput(0, lastMoveDir);
  } else {
    lastMoveDir = null;
  }
}

// ── facing / sprite helpers ──
// EntityState.dir is a number 0-7 in screen coords (0=E, clockwise).
// 0-7 → screen angle = dir*PI/4. Sprites face UP (-y); align by +PI/2.
function facingAngle(e) {
  if (e.dir == null) return null;
  if (typeof e.dir === 'object' && e.dir.x !== undefined) {
    return Math.atan2(e.dir.y, e.dir.x) + Math.PI / 2; // vector form (telegraph)
  }
  return e.dir * Math.PI / 4 + Math.PI / 2;
}

function enemySpriteKey(tid) {
  if (!tid) return 'grunt';
  if (tid.startsWith('elite')) return 'elite';
  if (tid.startsWith('caster')) return 'caster';
  if (tid.startsWith('brute')) return 'grunt'; // brute_charger 复用 grunt 精灵（无专属资产）
  if (tid.startsWith('bomber')) return 'grunt'; // M13 自爆兵 复用 grunt 精灵（无专属资产）
  if (tid.startsWith('boss')) return 'boss';
  return 'grunt';
}

function spriteKeyFor(e) {
  if (e.kind === 0) return 'hero';
  if (e.kind === 2) return 'boss';
  if (e.kind === 1) return enemySpriteKey(e.enemyTypeId);
  return null;
}

function spriteSizeFor(e) {
  if (e.kind === 2) return 76;   // boss: massive
  if (e.kind === 0) return 34;   // hero
  if (e.enemyTypeId && e.enemyTypeId.startsWith('caster')) return 34; // caster
  return 30;                      // grunt / elite
}

const CLASS_LABEL = { tank: '守卫士', ranger: '游侠', mage: '术士', healer: '医者' };
const ENEMY_LABEL = { grunt_swarm: '', elite_warden: '精英', caster_ember: '法师', brute_charger: '冲锋', bomber_imp: '自爆', boss_emberlord: '余烬领主' };

// ── interpolation of remote entities ──
function interpPos(id, t) {
  let a = null, b = null;
  for (let i = 0; i < snapBuffer.length; i++) {
    const s = snapBuffer[i];
    const ent = s.entities.find(e => e.id === id);
    if (!ent) continue;
    if (s.tick <= t) a = { tick: s.tick, pos: ent.pos };
    else { b = { tick: s.tick, pos: ent.pos }; break; }
  }
  if (a && b) {
    const span = (b.tick - a.tick) || 1;
    const f = Math.min(1, Math.max(0, (t - a.tick) / span));
    return { x: a.pos.x + (b.pos.x - a.pos.x) * f, y: a.pos.y + (b.pos.y - a.pos.y) * f };
  }
  if (a) return { x: a.pos.x, y: a.pos.y };
  if (b) return { x: b.pos.x, y: b.pos.y };
  const latest = snapBuffer[snapBuffer.length - 1];
  const ent = latest && latest.entities.find(e => e.id === id);
  return ent ? { x: ent.pos.x, y: ent.pos.y } : { x: 0, y: 0 };
}

function renderPosFor(e) {
  if (e.id === localEntityId && predicted) return predicted;
  return interpPos(e.id, renderTime);
}

// ── drawing ──
function drawTelegraph(e, snap, x, y) {
  if (!e.telegraph) return;
  const t = e.telegraph;
  const radius = t.radius || 1;
  const progress = t.applyTick > t.startTick ? Math.min(1, Math.max(0, (snap.tick - t.startTick) / (t.applyTick - t.startTick))) : 0;
  ctx.save();
  ctx.globalAlpha = 0.35 + progress * 0.4;
  ctx.strokeStyle = t.color || '#f55';
  ctx.fillStyle = t.color || '#f55';
  ctx.lineWidth = 2 + progress * 2;

  let angle = 0;
  if (t.dir && (t.dir.x || t.dir.y)) {
    angle = Math.atan2(t.dir.y, t.dir.x);
  }
  ctx.translate(x, y);
  ctx.rotate(angle);

  if (t.shape === 2 || t.shape === 3) { // CONE / LINE
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(-0.5) * radius, Math.sin(-0.5) * radius);
    ctx.arc(0, 0, radius, -0.5, 0.5);
    ctx.closePath();
    ctx.fill();
  } else if (t.shape === 1) { // AOE_FILL
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
  } else { // RING
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.15;
    ctx.fill();
  }
  ctx.restore();
}

function drawLabel(e, x, y, size) {
  let text = null, color = '#fff';
  if (e.kind === 0 && e.classId && CLASS_LABEL[e.classId]) {
    text = CLASS_LABEL[e.classId];
    color = '#bdf';
  } else if (e.kind === 2) {
    text = ENEMY_LABEL.boss_emberlord;
    color = '#f88';
  } else if (e.kind === 1 && e.enemyTypeId && ENEMY_LABEL[e.enemyTypeId]) {
    text = ENEMY_LABEL[e.enemyTypeId];
    color = e.enemyTypeId.startsWith('caster') ? '#d8f'
          : e.enemyTypeId.startsWith('brute') ? '#ff7a4a'
          : e.enemyTypeId.startsWith('bomber') ? '#ff5a3c'
          : '#fc8';
  }
  if (!text) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = 'bold 11px system-ui';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
  ctx.fillText(text, x, y - size / 2 - 14);
  ctx.restore();
}

function drawHpBar(e, x, y, size) {
  const hp = e.hp ?? 0, max = e.maxHp || hp;
  if (max <= 0) return;
  const w = Math.max(24, size), h = 4;
  const bx = x - w / 2, by = y - size / 2 - 9;
  ctx.fillStyle = '#400';
  ctx.fillRect(bx, by, w, h);
  ctx.fillStyle = '#3f3';
  ctx.fillRect(bx, by, w * Math.max(0, hp / max), h);
}

function drawLoot(e, x, y, snap) {
  const t = e.lootType || 0;
  const colors = ['#3f3', '#4cb5f5', '#fa0']; // medkit / ammo / buff
  const c = colors[t] || '#fff';
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
  ctx.save();
  ctx.globalAlpha = 0.35 * pulse;
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#021'; ctx.lineWidth = 2;
  if (t === 0) { // medkit cross
    ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.stroke();
  } else if (t === 2) { // buff up-arrow
    ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.moveTo(x - 4, y + 1); ctx.lineTo(x, y - 3); ctx.lineTo(x + 4, y + 1); ctx.stroke();
  } else { // ammo dot
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ── deterministic decorative world props (cosmetic; no sim dependency) ──
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) ^ 0x9e3779b9;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
function drawDecor(camX, camY) {
  const T = 256;
  const x0 = Math.floor((camX - canvas.width / 2) / T) * T;
  const y0 = Math.floor((camY - canvas.height / 2) / T) * T;
  for (let gx = x0; gx < camX + canvas.width / 2 + T; gx += T) {
    for (let gy = y0; gy < camY + canvas.height / 2 + T; gy += T) {
      const h = hash2(gx, gy);
      if (h % 7 === 0) {
        const fx2 = gx + 40, fy2 = gy + 40;
        const flick = 0.6 + 0.4 * Math.sin(performance.now() / 120 + h);
        ctx.save();
        ctx.fillStyle = '#5a3a1a'; ctx.fillRect(fx2 - 2, fy2, 4, 12);
        const grd = ctx.createRadialGradient(fx2, fy2 - 4, 2, fx2, fy2 - 4, 28);
        grd.addColorStop(0, 'rgba(255,174,66,0.5)');
        grd.addColorStop(1, 'rgba(255,120,40,0)');
        ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(fx2, fy2 - 4, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffcf6e'; ctx.beginPath(); ctx.arc(fx2, fy2 - 4, 3 + flick, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (h % 11 === 0) {
        ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(gx + 24, gy + 24); ctx.lineTo(gx + 48, gy + 56); ctx.lineTo(gx + 36, gy + 88); ctx.stroke(); ctx.restore();
      }
    }
  }
}

function drawFloaters() {
  const now = performance.now();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui';
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    const t = (now - f.born) / f.life;
    if (t >= 1) { floaters.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y - t * 26);
  }
  ctx.restore();
}

// co-op cast ground rings (M8): expanding ring at cast origin, fades over ~900ms.
function drawCastRings() {
  const now = performance.now();
  ctx.save();
  ctx.lineWidth = 3;
  for (let i = castRings.length - 1; i >= 0; i--) {
    const r = castRings[i];
    const t = (now - r.born) / 900;
    if (t >= 1) { castRings.splice(i, 1); continue; }
    ctx.globalAlpha = (1 - t) * 0.9;
    ctx.strokeStyle = r.color;
    ctx.shadowColor = r.color; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 14 + t * 26, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

// M11: death / hit particle bursts. Lightweight (max ~240 live), world-space, decay + gravity.
function spawnBurst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    if (particles.length > 240) break;
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 110; // px/s
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 40, // slight upward bias
      born: performance.now(),
      life: 420 + Math.random() * 280,
      color,
      r: 2 + Math.random() * 2.5,
    });
  }
}

function drawParticles() {
  const now = performance.now();
  ctx.save();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const t = (now - p.born) / p.life;
    if (t >= 1) { particles.splice(i, 1); continue; }
    const dt = 0.016; // ~60fps step for motion
    p.vy += 220 * dt; // gravity
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1 - 0.5 * t), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// M16: flying projectiles (enemy/player ranged attacks in flight, dodgeable).
// World-space, reads GAME.lastSnapshot so the automation synthetic-injection path
// is also exercised. Drawn above rings, below floaters.
function drawProjectiles() {
  const projs = (GAME.lastSnapshot?.projectiles || []);
  if (!projs.length) return;
  ctx.save();
  for (const p of projs) {
    const x = p.x, y = p.y, r = p.radius || 6;
    const vx = p.vx || 0, vy = p.vy || 0;
    const sp = Math.hypot(vx, vy) || 1;
    const tl = 16; // trail length (world px)
    const tx = (vx / sp) * tl, ty = (vy / sp) * tl;
    // motion trail (opposite to velocity)
    const grad = ctx.createLinearGradient(x, y, x - tx, y - ty);
    grad.addColorStop(0, 'rgba(255,120,50,0.85)');
    grad.addColorStop(1, 'rgba(255,120,50,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = r * 1.3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - tx, y - ty); ctx.stroke();
    // glowing core
    ctx.shadowColor = '#ff5a2a'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawCircleFallback(e, x, y, snap) {
  const isLocal = e.id === localEntityId;
  const isPlayer = e.kind === 0;
  const downed = e.status && (e.status & 2);
  let fill = isLocal ? '#fd0' : (isPlayer ? '#4af' : '#f55');
  if (downed) fill = '#888';
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fill();
  if (e.dir && (e.dir.x || e.dir.y)) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + e.dir.x * 10, y + e.dir.y * 10);
    ctx.stroke();
  }
}

function drawSpriteAndOverlays(e, x, y, snap) {
  const isLocal = e.id === localEntityId;
  const downed = e.status && (e.status & 2);
  const key = spriteKeyFor(e);
  const size = spriteSizeFor(e);

  if (key && spriteOk(key)) {
    ctx.save();
    ctx.translate(x, y);
    let angle = null;
    const held = currentInputDir();
    if (isLocal && held) angle = Math.atan2(held.y, held.x) + Math.PI / 2;
    else angle = facingAngle(e);
    if (angle != null) ctx.rotate(angle);
    ctx.drawImage(SPRITES[key].img, -size / 2, -size / 2, size, size);
    ctx.restore();

    if (downed) {
      // M9: 倒地更醒目——脉动暗红罩 + 「倒地」标签，并据 rescue 进度画救援环（队友靠近自动累积）。
      const pulse = 0.45 + 0.25 * Math.sin(performance.now() / 220);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#600';
      ctx.fillRect(x - size / 2, y - size / 2, size, size);
      ctx.restore();
      // 救援进度环（world-space，绘制于 sprite 之上）
      if (e.rescue && e.rescue.totalTicks > 0) {
        const ratio = Math.max(0, Math.min(1, e.rescue.progressTicks / e.rescue.totalTicks));
        ctx.save();
        ctx.strokeStyle = '#6fd68a'; ctx.lineWidth = 3;
        ctx.shadowColor = '#6fd68a'; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(x, y, size / 2 + 8, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      // 「倒地·救我」标签
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 300));
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
      ctx.fillText('倒地·救我', x, y - size / 2 - 14);
      ctx.restore();
    }
    if (isLocal) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,210,0,0.95)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255,210,0,0.85)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, size / 2 + 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // M14 (C5 收口): persistent skill-effect overlays on players (server-authoritative, already
    // serialized). shieldUntilTick present → cyan team-color shield ring (opacity ∝ reduction);
    // tauntUntilTick present → orange aggro aura ring. Cast-time ring/floater is M8; this shows
    // the sustained state so allies read "who's shielded / who's tanking" at a glance.
    if (e.kind === 0) {
      if (e.shieldUntilTick != null && e.shieldUntilTick > 0) {
        const red = e.shieldReduction != null ? e.shieldReduction : 0.5;
        const pulse = 0.6 + 0.25 * Math.sin(performance.now() / 200);
        ctx.save();
        ctx.globalAlpha = (0.35 + 0.45 * red) * pulse;
        ctx.strokeStyle = '#5fd6ff'; // 阵营/EMBER 冷色护盾（art-bible §3 对齐）
        ctx.lineWidth = 3;
        ctx.shadowColor = '#5fd6ff'; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, y, size / 2 + 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      if (e.tauntUntilTick != null && e.tauntUntilTick > 0) {
        const pulse = 0.55 + 0.3 * Math.sin(performance.now() / 150);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.strokeStyle = '#f5a24a'; // 嘲讽暖橙（art-bible §3）
        ctx.lineWidth = 3;
        ctx.shadowColor = '#f5a24a'; ctx.shadowBlur = 12;
        // 双环（外虚内实）强调「吸火」状态
        ctx.beginPath();
        ctx.arc(x, y, size / 2 + 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = pulse * 0.5;
        ctx.beginPath();
        ctx.arc(x, y, size / 2 + 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
    // M12: enrage feedback (brute_charger 破50% → 服务端下发 enraged=true)。脉动红环 + 「狂暴」标记，
    // 仅敌人且服务端权威标记时点亮（不伪造状态）。复用 downed 的脉动节奏但用危险红。
    if ((e.kind === 1 || e.kind === 2) && e.enraged === true) {
      const pulse = 0.5 + 0.3 * Math.sin(performance.now() / 130);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ff3b2f';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff3b2f'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, size / 2 + 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.7 + 0.3 * Math.abs(Math.sin(performance.now() / 160));
      ctx.fillStyle = '#ff5a4a';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
      ctx.fillText('狂暴', x, y - size / 2 - 26);
      ctx.restore();
    }
    // M13: bomber imminent-detonation cue — when a bomber holds an active telegraph (about to
    // blow), pulse a fast danger outline so players read "back off" beyond the ground AOE fill.
    if (e.kind === 1 && e.enemyTypeId === 'bomber_imp' && e.telegraph != null) {
      const pulse = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 70));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ff2a1a';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff2a1a'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(x, y, size / 2 + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // C4b: marked-enemy 「易伤」cue — 敌人携带服务端权威 markedUntilTick → 脉动品红环 + 「易伤」
    // 标签，提示玩家「优先集火 / 对其伤害 ×1.25」（combat.resolveDamage 消费 markedUntilTick）。
    if ((e.kind === 1 || e.kind === 2) && e.markedUntilTick != null && e.markedUntilTick > 0) {
      const pulse = 0.5 + 0.3 * Math.sin(performance.now() / 110);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#e86fb0'; // 品红（art-bible §3 P3 阵营色，易伤标记）
      ctx.lineWidth = 3;
      ctx.shadowColor = '#e86fb0'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, size / 2 + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.8 + 0.2 * Math.abs(Math.sin(performance.now() / 140));
      ctx.fillStyle = '#ffb3e6';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
      ctx.fillText('易伤', x, y - size / 2 - 38);
      ctx.restore();
    }
  } else {
    drawCircleFallback(e, x, y, snap);
  }

  // hit flash (damage feedback)
  const f = flash.get(e.id);
  if (f != null) {
    if (performance.now() < f) {
      ctx.save();
      ctx.globalAlpha = 0.5 * ((f - performance.now()) / 130);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y, size / 2 + 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      flash.delete(e.id);
    }
  }

  // data-driven overlays (always on top of sprite)
  drawHpBar(e, x, y, size);
  if (e.shieldUntilTick != null && e.shieldUntilTick > snap.tick) {
    ctx.save();
    ctx.strokeStyle = '#fa0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, size / 2 + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  if (e.tauntUntilTick != null && e.tauntUntilTick > snap.tick) {
    ctx.save();
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.moveTo(x, y - size / 2 - 12);
    ctx.lineTo(x - 5, y - size / 2 - 4);
    ctx.lineTo(x + 5, y - size / 2 - 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  drawLabel(e, x, y, size);
}

function draw() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrameT) / 1000);
  lastFrameT = now;

  // local-player client-side prediction: frame-rate-independent, gently reconciled.
  // Advance the RENDER position by PLAYER_SPEED*dt each frame; never write authoritative fields.
  const held = currentInputDir();
  if (held && predicted && state === 'playing') {
    predicted.x += held.x * PLAYER_SPEED * dt;
    predicted.y += held.y * PLAYER_SPEED * dt;
  }

  if (predicted) { GAME.predicted = { x: predicted.x, y: predicted.y }; GAME.localRender = GAME.predicted; }
  const authEnt = (localEntityId != null && lastSnapshot)
    ? lastSnapshot.entities.find(e => e.id === localEntityId) : null;
  if (authEnt) GAME.authPos = { x: authEnt.pos.x, y: authEnt.pos.y };

  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!lastSnapshot) {
    ctx.fillStyle = '#888';
    ctx.font = '16px system-ui';
    ctx.fillText('等待服务器快照...', 20, 60);
    requestAnimationFrame(draw);
    return;
  }

  const snap = lastSnapshot;
  renderTime = snap.tick - INTERP_TICKS;
  tickEl.textContent = `tick:${snap.tick}`;
  entsEl.textContent = `entities:${snap.entities.length}`;

  // ── boss HUD ──
  const boss = snap.entities.find(e => e.kind === 2);
  if (boss) {
    bossbar.style.display = 'block';
    bossfill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
    bossname.textContent = '余烬领主' + ((boss.phase && boss.phase > 1) ? (' · 阶段' + boss.phase) : '');
  } else {
    bossbar.style.display = 'none';
  }

  // ── wave progression HUD (M7) ──
  const wave = snap.wave ?? 1;
  const totalWaves = snap.totalWaves ?? 1;
  const intermission = snap.intermissionTicks ?? 0;
  const roomPhase = snap.roomPhase ?? 1;
  waveChip.textContent = `波次 ${wave}/${totalWaves} · 剩余 ${snap.enemiesRemaining ?? '-'}`;

  // 通关结算（roomPhase SETTLE=3）：持续显示胜利横幅。
  if (roomPhase === 3) {
    waveBanner.className = 'win show';
    waveBanner.innerHTML = '🏆 通关！余烬小队肃清地牢';
    bannerHideAt = Infinity; // 不再自动隐藏
  } else {
    // 仅在「波次推进」或「进入 Boss 波」瞬间触发一次性横幅 + 音效（避免每帧重触）。
    const advanced = wave > lastSeenWave;
    const bossStarted = roomPhase === 2 && lastSeenPhase !== 2;
    if (advanced) {
      if (roomPhase === 2) {
        waveBanner.className = 'boss show';
        waveBanner.innerHTML = `⚔ 第 ${wave}/${totalWaves} 波 · BOSS 战`;
      } else {
        waveBanner.className = 'show';
        waveBanner.innerHTML = `第 ${wave}/${totalWaves} 波`;
      }
      if (intermission > 0) {
        waveBanner.innerHTML += `<span class="sub">下一波将在 ${(intermission / 30).toFixed(1)}s 后抵达</span>`;
      }
      sfxSkill(); // 复用协作技音效作「波次推进」提示（上行音阶）
      bannerHideAt = performance.now() + 1800;
    } else if (bossStarted && !advanced) {
      waveBanner.className = 'boss show';
      waveBanner.innerHTML = '⚔ BOSS 战';
      sfxDeath(); // 复用死亡音效作「Boss 登场」低沉提示
      bannerHideAt = performance.now() + 2000;
    }
  }
  // 横幅自动隐藏（无横幅或已超时则收起；通关横幅 bannerHideAt=Infinity 保持）。
  if (bannerHideAt !== Infinity && performance.now() > bannerHideAt && waveBanner.classList.contains('show')) {
    waveBanner.classList.remove('show');
  }
  lastSeenWave = wave; lastSeenPhase = roomPhase;
  GAME.wave = wave; GAME.totalWaves = totalWaves; GAME.roomPhase = roomPhase;
  GAME.enemiesRemaining = snap.enemiesRemaining ?? null;
  GAME.bannerShown = waveBanner.classList.contains('show');
  // M8: expose any ally's activeSkill (co-op cast feedback source) for automation gate.
  GAME.anyActiveSkill = (snap.entities || []).some((e) => e.kind === 0 && e.activeSkill != null);
  // M12: expose whether any enemy is enraged (server-authoritative flag) for automation gate.
  // Read from GAME.lastSnapshot (getter-consistent, like GAME.downedAllies) so injected-synthetic
  // enrage entities in automation are also detected deterministically.
  GAME.anyEnraged = (GAME.lastSnapshot?.entities || []).some((e) => (e.kind === 1 || e.kind === 2) && e.enraged === true);
  // M13: expose bomber_imp count (server-authoritative) for automation gate.
  GAME.bomberCount = (GAME.lastSnapshot?.entities || []).filter((e) => e.kind === 1 && e.enemyTypeId === 'bomber_imp').length;
  // M14 (C5): expose whether any ally is currently shielded / taunting (server-auth) for gate.
  GAME.anyShielded = (GAME.lastSnapshot?.entities || []).some((e) => e.kind === 0 && e.shieldUntilTick != null && e.shieldUntilTick > 0);
  GAME.anyTaunting = (GAME.lastSnapshot?.entities || []).some((e) => e.kind === 0 && e.tauntUntilTick != null && e.tauntUntilTick > 0);
  // M11: expose live particle count (death/hit juice) for automation gate.
  GAME.particleCount = particles.length;
  // M16: expose live projectile count (dodgeable ranged attacks) for automation gate.
  GAME.projectileCount = (GAME.lastSnapshot?.projectiles || []).length;
  // C4b: expose marked-enemy count (server-authoritative markedUntilTick, cond-serialized) for gate.
  // Read from GAME.lastSnapshot so injected-synthetic marked entities are also detected deterministically.
  GAME.markedEnemyCount = (GAME.lastSnapshot?.entities || []).filter((e) => e.kind === 1 && e.markedUntilTick != null && e.markedUntilTick > 0).length;
  // C4：本地职业解析 → 动态构建分职业技能栏 + 暴露职业信息供自动化闸门。
  const meEnt = (GAME.lastSnapshot?.entities || []).find((e) => e.kind === 0 && e.id === GAME.localEntityId);
  const lc = meEnt?.classId || null;
  if (lc && lc !== skillBarBuiltFor && CLASS_SKILLS_CLIENT[lc]) {
    mySkills = CLASS_SKILLS_CLIENT[lc];
    renderSkillBar();
    skillBarBuiltFor = lc;
  }
  GAME.localClass = lc;
  GAME.classSkills = mySkills;
  // ── skill cooldown HUD ──
  const nowMs = performance.now();
  for (let i = 0; i < mySkills.length; i++) {
    const remain = Math.max(0, skillCdUntil[i] - nowMs);
    const cdEl = document.getElementById('cd' + i);
    if (cdEl) cdEl.style.height = (remain > 0 ? (remain / SKILL_CD_MS[mySkills[i]]) * 100 : 0) + '%';
    const skEl = document.getElementById('sk' + i);
    if (skEl) skEl.classList.toggle('ready', remain <= 0);
  }

  const targetCamX = predicted ? predicted.x : (authEnt ? authEnt.pos.x : camX);
  const targetCamY = predicted ? predicted.y : (authEnt ? authEnt.pos.y : camY);
  camX += (targetCamX - camX) * 0.18;
  camY += (targetCamY - camY) * 0.18;
  // screen shake (juice)
  const sx = (Math.random() * 2 - 1) * shakeMag;
  const sy = (Math.random() * 2 - 1) * shakeMag;
  shakeMag *= 0.88; if (shakeMag < 0.2) shakeMag = 0;
  const rcx = camX + sx, rcy = camY + sy;

  const localHp = authEnt ? `${authEnt.hp ?? 0}/${authEnt.maxHp ?? 0}` : '-';
  hpEl.textContent = `HP:${localHp}`;

  // ── floor (world-space tiled pattern, scrolls with camera) ──
  ctx.save();
  ctx.translate(canvas.width / 2 - rcx, canvas.height / 2 - rcy);
  const fx = rcx - canvas.width / 2 - 64, fy = rcy - canvas.height / 2 - 64;
  const fw = canvas.width + 128, fh = canvas.height + 128;
  if (floorPattern) {
    ctx.fillStyle = floorPattern;
    ctx.fillRect(fx, fy, fw, fh);
  } else {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(fx, fy, fw, fh);
  }
  drawDecor(rcx, rcy);
  ctx.restore();

  // ── entities (camera-centered world space) ──
  ctx.save();
  ctx.translate(canvas.width / 2 - rcx, canvas.height / 2 - rcy);

  // telegraphs under sprites
  for (const e of snap.entities) {
    const p = renderPosFor(e);
    drawTelegraph(e, snap, p.x, p.y);
  }
  // sprites + overlays
  for (const e of snap.entities) {
    const p = renderPosFor(e);
    drawSpriteAndOverlays(e, p.x, p.y, snap);
  }
  // loot (drawn on top so it's always visible on the floor)
  for (const e of snap.entities) {
    if (e.kind === 6) { const p = renderPosFor(e); drawLoot(e, p.x, p.y, snap); }
  }
  drawParticles();   // M11: death/hit bursts (world space, under rings/floaters)
  drawCastRings();   // M8: co-op cast ground rings (under floaters, world space)
  drawProjectiles(); // M16: flying projectiles (world space, above rings, below floaters)
  drawFloaters();

  ctx.restore();

  // ── screen-space vignette (dungeon atmosphere) ──
  ctx.save();
  const vr = Math.max(canvas.width, canvas.height) * 0.55;
  const vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 60, canvas.width / 2, canvas.height / 2, vr);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.6, 'rgba(0,0,0,0.18)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();

  // WEB-FEEL：每帧上报移动输入（≈60Hz），确保权威模拟每个 tick 都收到 MOVE →
  // 玩家以真实 CLASS_BASE.moveSpeed（tank=210px/s）移动，而非被旧 100ms 轮询饿成 ~70px/s。
  // 保留 sendInput / sendJson 的 input.cmd 包装与攻击自动选敌（Space/J 在 keydown 中发送，未改动）。
  updateInput();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
