<!DOCTYPE html>
<html>
<head>
	<title>移动端适配</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<style type="text/css">
		header, footer, main {
		    display: block;
		}
		header {
		    position: fixed;
		    height: 50px;
		    left: 0;
		    right: 0;
		    top: 0;
		}
		footer {
		    position: fixed;
		    height: 34px;
		    left: 0;
		    right: 0;
		    bottom: 0;
		}
		main {
		    margin-top: 50px;
		    margin-bottom: 34px;
		    height: 2000px
		}
	</style>
</head>
<body class="layout-fixed">
    <!-- fixed定位的头部 -->
    <header>
        <button onclick="	window.location.reload();">	window.location.reload();</button>
    </header>
    
    <!-- 可以滚动的区域 -->
    <main>
        <!-- 内容在这里... -->
        
		<ul>
			<li>参考文献</li>
			<li>http://efe.baidu.com/blog/mobile-fixed-layout/?qq-pf-to=pcqq.group</li>
		</ul>
    </main>
    
    <!-- fixed定位的底部 -->
    <footer>
        <input type="text" placeholder="Footer..."/>
        <button class="submit">提交</button>
    </footer>
</body>
</html>
