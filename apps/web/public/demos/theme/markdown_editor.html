<!DOCTYPE html>
<html>
<head>
	<title>千秋万代一桶江湖</title>
	<meta charset="utf-8">
	<style type="text/css">
		*{box-sizing: border-box;}
		body{padding: 0;margin: 0;}
		#code{height:100vh;float:left;width:50%;border: 1px solid #f00}
		#code textarea{width:100%;height:100%;}
		#view{height:100vh;float:right;width:50%;border: 1px solid #f00}
	</style>
</head>
<body>
	<div id="app">
		<div id="code">
			<textarea v-model="text"></textarea>
		</div>
		<vue-markdown id="view"  :source="text"></vue-markdown>
	</div>
	<script src="https://cdn.bootcss.com/vue/2.2.2/vue.min.js"></script>
	<script src="./vue-markdown.js"></script>
	<script>
	    Vue.use(VueMarkdown);
	    var vm = new Vue({
	        el: "#app",
	        data: {
	        	text:'i am a ~~tast~~ **test**.千秋万代一桶江湖'
	        }
	    });
	</script>
</body>
</html>
