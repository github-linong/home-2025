<body>
	<div id="app">
		{{test}}
		<div class="drag"
	     v-drag
	 	 style="background: url('https://ss1.baidu.com/6ONXsjip0QIZ8tyhnq/it/u=988279975,1210033778&fm=58');
	        background-size: cover;
	        width: 200px;
	        height: 200px;
	        position: absolute;
	        top: 100px;
	        left: 180px;
	        transform: scale(1) rotate(0deg);
	        color: #fff;"
	    >
    </div>
	</div>
	<script type="text/javascript">
	//求两点之间的距离 勾股定理  
	function getDistance(a, b) {
	    let x = b.pageX - a.pageX,
	        y = b.pageY - a.pageY;
	    return Math.sqrt((x * x) + (y * y));
	}

	//求旋转角度 反三角函数
	function getAngle(a, b) {
	    let x = a.pageX - b.pageX,
	        y = a.pageY - b.pageY;
	    return Math.atan2(y, x) * 180 / Math.PI;
	}
	Vue.directive('drag', {
	  	bind(el, binding, vnode) {
	  		console.log('bind')
	        let type = binding.arg, 
	            obj = {},
	            now = [], //记录当前移动距离 
	            start = [], //记录手指按下位置
	            scale = 1, //缩放
	            old_scale = 1, //记录每次缩放
	            rotation = 0, //旋转度数
	            old_rotation = 0, //记录每次旋转
	            isTouch = false; // 是否开始touch事件
		  	        
	        el.addEventListener('touchstart', (e)=>{
	  			// console.log('touchstart')
	            if(e.touches.length >= 2) {
	                isTouch = true;
	                start = e.touches;
	                if(binding.arg === 'start') {
	                    binding.value(start);
	                }
	                old_scale = +(obj.scale || 1);
	                old_rotation = +(obj.rotation || 0);
                console.log(old_scale, old_rotation)
	            }
	        }, false);

	        el.addEventListener('touchmove', (e)=>{
	  			// console.log('touchmove')
	            if(e.preventDefault){
	                e.preventDefault();
	            } else {
	                e.stopPropagation();
	            }
	            if(e.touches.length >= 2 && isTouch) {
	                now = e.touches;
	                scale = getDistance(now[0], now[1]) / getDistance(start[0], start[1]);
	                rotation = getAngle(now[0], now[1]) - getAngle(start[0], start[1]);
	                obj = {
	                    scale: old_scale * scale.toFixed(2),
	                    rotation: +old_rotation + +rotation.toFixed(2)
	                }
	                if(binding.arg === 'move') {
	                    binding.value(obj);
	                } else {
	                    el.style.transform = `scale(${obj.scale}) rotate(${obj.rotation}deg)`;
	                }
	            }
	        }, false);
	        
	        el.addEventListener('touchend', (e)=>{
	  			// console.log('touchend')
	            if(isTouch) {
	                isTouch = false;
	            }
	            if(binding.arg === 'end') {
	                binding.value();
	            }
	        }, false);
	    }
	})
	new Vue({
		el: '#app',
		data: {
			test: 'LN'
		}
	})
	</script>
