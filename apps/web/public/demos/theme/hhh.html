        number_limit();
        function number_limit() {
            $(".price-start,.price-end").keyup(function () {
                var number = $(this).val();
                if (isNaN(number)) {
                    $(this).val("");
                    return;
                }
                var re = /([0-9]+.[0-9]{2})[0-9]*/;
                var new_number = number.replace(re, "$1");
                $(this).val(new_number);
            });

                _this.siblings(".btn_change_top").show();
                _this.siblings(".sep2").show();

                $.ajax({

                        "min_price": min_price,

                    success: function (re) {

                            _this.hide();
                            _this.siblings(".btn_change_cancel").hide();
                            _this.siblings(".btn_change_status").show();

<div style="text-align:right;">
    <select class="ui-select" id="pageSize" style="width:85px; border-radius:5px; float:left; margin-top:10px;">
        <option value="10">显示10条</option>
        <option value="15">显示15条</option>
        <option value="20">显示20条</option>
    </select>
    <span>共 <span id="rowCount">1</span> 条数据</span>
    <div class="pagination inline-block">
        <a href="javascript:void(0)" class="prev" id="prev">◀</a>
        <span><i class="cur" id="currentPage">1</i>/<i class="total" id="totalPage">1</i></span>
        <a href="javascript:void(0)" class="next" id="next">▶</a>
        <input type="text" class="page" id="go">
        <button type="button" id="jump">跳转</button>
    </div>
</div>
</div>

<script>
    //分页数据
    function pagination(re) {
        $('#rowCount').text(re.rowCount);
        $('#currentPage').text(re.currentPage);
        $('#totalPage').text(re.pageCount);
        if ("on_sale_car_type" == "on_sale_car_type") {
            $(".on_sale_num").show().text(re.rowCount);
        }
        if ("on_sale_car_type" == "stop_sell_car_type") {
            $(".stop_sell_num").show().text(re.rowCount);
        }
        if ("on_sale_car_type" == "new_car_clues") {
            $(".new_car_clues_num").show().text(re.rowCount);
        }
    }

    //分页事件
    pagination_bind_event();

    function pagination_bind_event() {
        $('#pageSize').on("change", function () {
            get_query()
        });
        $('#prev').bind('click', prevPage);
        $('#next').bind('click', nextPage);
        $('#jump').bind('click', jumpPage);
    }

    //上一页
    function prevPage() {
        var currentPage = $('#currentPage').text();
        if (currentPage <= 1) {
            layer.msg("已到最前页");
            return;
        }
        get_query(parseInt(currentPage) - 1);
    }

    //下一页
    function nextPage() {
        var currentPage = $('#currentPage').text();
        if (currentPage >= $('#totalPage').text()) {
            layer.msg("已到最后页");
            return;
        }
        get_query(parseInt(currentPage) + 1);
    }

    //跳页
    function jumpPage() {
        var page = $('#go').val();
        if (page < 1) {
            return;
        }
        if (page >= $('#totalPage').text() + 0) {
            return;
        }
        if (page == $('#currentPage').text() + 0) {
            return;
        }
        get_query(page);
    }

    //车型图片上传
    function change_car_type_img() {
        $(".car_type_upload").change(function () {

            var data = new FormData();
            //为FormData对象添加数据
            var file = $(this)[0].files[0];
            data.append('upload_file', file);
            var id = $(this).attr("data-id");
            data.append('id', id);

            $.ajax({
                url: "/part/index.php?m=Admin&c=CarMall&a=change_car_type_img",
                type: 'POST',
                data: data,
                dataType: 'json',
                cache: false,
                contentType: false,    //不可缺
                processData: false,    //不可缺
                success: function (response) {
                    if (response.status == true) {
                        $(".no_pic_" + id).hide();
                        $(".car_type_img_" + id).attr("src", response.url);
                    } else {
                        layer.msg(response.msg);
                    }
                }
            });
        });
    }
</script>
<script>
    get_query();
    function get_query(page) {
        var brand_id = "3,7,9,10,12,13,20,21";
        var status = "1";
        var num = $("#pageSize :selected").val();
        if (page === undefined) {
            page = 1;
        }
        $.ajax({
            url: "/part/index.php?m=Admin&c=CarMall&a=on_sale_car_type",
            type: 'post',
            data: {
                "brand_id": brand_id,
                "status": status,
                "page": page,
                "num": num
            },
            dataType: 'json',
            success: function (re) {
                $(".car_type_content").empty().html(re.dataHtml);
                pagination(re);
            }
        })
    }
</script></body></html>
