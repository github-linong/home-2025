<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="x5-fullscreen" content="true">
	<meta name="full-screen" content="yes">
	<title>滚动事件</title>
	<style type="text/css">
		*{
			padding: 0;margin: 0;
		}
		html,body,*{
			/*touch-action: none;*/
			/*touch-action: pan-x;*/
		}
		html,body,#app{
			/*touch-action: pan-y*/
		}
		#app{
			/*height: 90vh;*/
			overflow-y: auto; 
			touch-action: auto;
		}
		#console{
			/*height: 10vh;*/
		}

		#loading{
			overflow: hidden;height: 0px;transition: height 1s cubic-bezier(.26,1.2,.91,1.05);
			background: rgba(240, 245, 239, .4);text-align: center;
		}
		.item{
			overflow: hidden;
			height: 50px;
			padding: 10px;
		}
		.item img{
			float: left;
			height: 50px;
		}
		.item p{
			line-height: 25px;
		}

	</style>
</head>
<body>
	<div id="console"></div>
	<div id="app">
		<div id="loading">
			继续加油
		</div>
		<div id="item-box">
			<div class="">
				<img src="https://picsum.photos/400/800/?image=1">
				<p>name</p>
				<p>desc</p>
			</div>
		</div>
	</div>
	<script type="text/javascript">
		// 滚动加载
		;(()=>{
			var list = [];
			var loadList = (len = 10) => {
					setTimeout(()=>{
						for(var i =0; i < len; i++){
							var _num = Math.floor(Math.random()* 999)
							list.push(`
								<div class="item">
									<img src="https://picsum.photos/400/800/?image=${_num}">
									<p>${_num}</p>
									<p>${Math.floor(Math.random()* 999)}-${_num}</p>
								</div>
							`)
							document.querySelector('#item-box').innerHTML = list.join('');
						}
					},1000)
			}
			loadList(30);

			// 去抖
			var debounce = function (fn, delay) {
			  var timer = null;
			  return function () {
			    var context = this;
			    var args = arguments;
			    clearTimeout(timer);
			    timer = setTimeout(function () {
			      fn.apply(context, args);
			    }, delay);
			  };
			}
			var local = {
				//dom映射
				dom: {
					app: document.querySelector('#app'),
					loading: document.querySelector('#loading'),
				},
				//滚动加载配置项
				scroll: {
					offsetScroll: 400, //滚动加载,据底高度
					scrollHeight: app.scrollHeight,
					offsetHeight: app.offsetHeight,
					scrollTop: app.scrollTop,
				},
				eventScroll_fun(e) {
					var _old = local.scroll.scrollTop;
					local.scroll.scrollHeight = app.scrollHeight;
					local.scroll.offsetHeight = app.offsetHeight;
					local.scroll.scrollTop = app.scrollTop;

					if(local.scroll.scrollTop + local.scroll.offsetScroll > local.scroll.scrollHeight - local.scroll.offsetHeight && _old<local.scroll.scrollTop){
						// console.log(true)
						local.scrollCallback();
					}
				},
				eventScroll(){
					local.dom.app.addEventListener('scroll', local.eventScroll_fun);
				},
				touch: {
					startY: 0,
					loadingHeight: 0,
					loadingStart: 0,
					loadingAnimate: false,
				},
				eventTouch_fun(e) {
					// e.preventDefault()
					// e.stopPropagation()
					// local.scroll.scrollHeight = app.scrollHeight;
					// local.scroll.offsetHeight = app.offsetHeight;
					// local.scroll.scrollTop = app.scrollTop;
					// if(local.scroll.scrollTop === 0){ 
					// 	app.scrollTop = 1;
					// }else if(local.scroll.scrollHeight === local.scroll.offsetHeight+local.scroll.scrollTop){
					// 	app.scrollTop = local.scroll.scrollTop - 1; 
					// }
					if(e.touches[1] || local.touch.loadingAnimate) return;
					var _move = (e) => {
				        e._isScroller = true; 
						var _tag = e.touches[0].pageY - local.touch.startY;//正数向下，负数向上
						if(local.dom.app.scrollTop == 0 && _tag >= 0 ){
							if(!local.touch.loadingStart) local.touch.loadingStart = e.touches[0].pageY;
							local.touch.loadingHeight = Math.min(Math.max(_tag-local.touch.loadingStart, 0), 200)
							local.dom.loading.style.height = Math.min(local.touch.loadingHeight, 50)+'px';
							if(local.touch.loadingHeight == 200){
								local.dom.loading.innerText = '松手就加载';
							}else{
								local.dom.loading.innerText = '下拉刷新';
							}
						}
					}
					var _end = (e) => {
						local.touch.loadingStart = 0;
						if(local.touch.loadingHeight == 200){
							loading.innerText = '加载中.....';
							local.touch.loadingAnimate = true;
							setTimeout(()=>{
								local.touchCallback();
								local.touch.loadingAnimate = false;
								local.touch.loadingHeight = 0;
								loading.style.height = local.touch.loadingHeight+'px';
							},1000)
						}else{
							local.touch.loadingHeight = 0;
							loading.style.height = local.touch.loadingHeight+'px';
						}
						local.dom.app.removeEventListener('touchmove', _move);
						local.dom.app.removeEventListener('touchend', _end);
					}
					local.dom.app.addEventListener('touchmove', _move);
					local.dom.app.addEventListener('touchend', _end);
				},
				eventTouch(){
					// var startY = local.touch.startY;
					// local.dom.app.parentElement.addEventListener('touchmove', e=>{
					// 	var _old = startY;
					// 	startY = e.touches[0].pageY;
					// 	local.scroll.scrollTop = app.scrollTop;
					// 	document.querySelector('#console').innerText = (local.scroll.scrollTop + '-' + 2 + `--${startY}<${_old}`);
					// 	if(local.scroll.scrollTop<2 && startY>=_old){
					// 		e.preventDefault()
					// 	}
					// });
					// document.querySelector('body').addEventListener('touchstart', function (ev) {ev.preventDefault();});
					local.dom.app.addEventListener('touchstart', local.eventTouch_fun);
					// document.body.addEventListener('touchmove', (evt) => {if(!evt._isScroller){evt.preventDefault();}}); 
				},
				init(){
					// this.stopDrop();
					this.eventScroll();
					this.eventTouch();
				},
				touchCallback(){
					console.log('下拉')
				},
				scrollCallback: debounce(()=>{
					console.log('滚动')
				}, 100),
				/**
				 * 禁止浏览器下拉回弹
				 */
				stopDrop() {
				    var lastY;//最后一次y坐标点
				    document.querySelector('body').addEventListener('touchstart', function(event) {
				        lastY = e.changedTouches[0].clientY;//点击屏幕时记录最后一次Y度坐标。
				    });
				    document.querySelector('body').addEventListener('touchmove', function(event) {
				        var y = e.changedTouches[0].clientY;
				        var st = app.scrollTop; //滚动条高度  
				        if (y >= lastY && st <= 10) {//如果滚动条高度小于0，可以理解为到顶了，且是下拉情况下，阻止touchmove事件。
				            lastY = y;
				            event.preventDefault();
				        }
				        lastY = y;
				 
				    });
				}
			}
			local.init();
		})()

		var div = document.querySelector('body');

		div.addEventListener('touchstart', function(e) {
		    var e = e || window.event;
		    var str = '';
		    for(var i in e.touches[0]){
		    	console.log(str += i+'-'+ e.touches[0][i]+'<br>')
		    }
		    // console.log(window.LN_e = e.touches);
		    // console.log(e.touches[0].target);
		    // console.log(e.touches[0].identifier);
		    // console.log(e.touches[0].clientY);
		    document.querySelector('#console').innerHTML = str
		}, false)
	</script>
</body>
</html>
