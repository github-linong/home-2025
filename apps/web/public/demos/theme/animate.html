<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>Examples</title>
<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
<meta name="description" content="">
<meta name="keywords" content="">
<link href="" rel="stylesheet">
<style>
  body{padding:0;margin:0;background: #000}
  div{transform: translateX(-150px) scale(0.1) rotate(0deg);transition: all 1s;}
  div.scale{transform: translateX(-150px) scale(0.5) rotate(720deg);transition: all 1s;}
</style>
</head>
<body>
    <div class="" style="background: url(http://qzs.qzone.qq.com/touch/proj-qzone-app/album-magazine/sprite/tpl-youth-160728152205@2x.png);width: 637px;height: 619px;">

    </div>
    <script>
      setTimeout(() => {
        document.querySelector('div').className="scale";
      })

    </script>
</body>
</html>
