<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子密信 · 统计分析</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
    <style>
        html,
        body,
        #app {
            height: 100%;
        }

        body {
            margin: 0;
            background: #0b1220;
            color: #e8eefc;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #e8eefc;
            letter-spacing: .5px;
        }

        .subtle {
            color: #9aa4c7;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .toolbar .el-input,
        .toolbar .el-select,
        .toolbar .el-date-editor {
            width: 220px;
        }

        .panel {
            background: #121a2b;
            border: 1px solid #1e2a44;
            border-radius: 8px;
            padding: 6px;
        }

        .panel-title {
            font-size: 12px;
            color: #c7d2fe;
            margin: 0 0 4px;
        }

        .kpi {
            display: flex;
            gap: 8px;
        }

        .kpi .card {
            background: #121a2b;
            border: 1px solid #1e2a44;
            border-radius: 8px;
            padding: 8px 10px;
            flex: 1;
        }

        .kpi .label {
            font-size: 12px;
            color: #9aa4c7;
        }

        .kpi .value {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .chart {
            width: 100%;
            height: 180px;
        }

        .chart-sm {
            width: 100%;
            height: 140px;
        }

        .topn {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .topn .item {
            background: #0f172a;
            border: 1px solid #1e2a44;
            border-radius: 8px;
            padding: 10px;
        }

        .rank {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #1f2a44;
            font-size: 12px;
        }

        .rank:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <stats-app></stats-app>
    </div>

    <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
    <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
    <script src="./components/utils.js"></script>
    <script src="./components/toolbar.js"></script>
    <script src="./components/kpis.js"></script>
    <script src="./components/overall-charts.js"></script>
    <script src="./components/topn.js"></script>
    <script src="./components/device-tabs.js"></script>
    <script src="./components/network-graph.js"></script>
    <script src="./components/app.js"></script>
    <script>
        new Vue({ el: '#app' });
    </script>
</body>

</html>
