		}
	</style>
	<div id="app">
		<ul id="list">
			<li>
				
			</li>
		</ul>
		<script type="text/javascript">
			list=[
				{
					title: '潘石屹寄语517电信日：5G将会造福全世界的人们',
					desc: 'SOHO中国董事长潘石屹的5G寄语：5G将会造福全世界的人们，这是全人类的共同财富。有些狭隘的观点视这种进步为洪水猛兽，我们不要受这些干扰。埋头苦干，一份勤劳总会有一份收获。 '
				},
				{
					title: '瑞幸咖啡IPO发行价定在17美元 市值将达42亿美元',
					desc: '瑞幸咖啡IPO发行价定在17美元/股，这意味着市值将达到42亿美元。同时，该公司还将其IPO增加至3300万股。'
				},
				{
					title: '潘石屹寄语517电信日：5G将会造福全世界的人们',
					desc: 'SOHO中国董事长潘石屹的5G寄语：5G将会造福全世界的人们，这是全人类的共同财富。有些狭隘的观点视这种进步为洪水猛兽，我们不要受这些干扰。埋头苦干，一份勤劳总会有一份收获。 '
				},
				{
					title: '瑞幸咖啡IPO发行价定在17美元 市值将达42亿美元',
					desc: '瑞幸咖啡IPO发行价定在17美元/股，这意味着市值将达到42亿美元。同时，该公司还将其IPO增加至3300万股。'
				},
			]
			str = ''
			list.forEach(v=>{
				var isLongDesc = v.desc.length > 69;
				str+=`
				<li>
					<div class="title">${v.title}</div>
					<div class="desc">${isLongDesc?(v.desc.slice(0,69) + '……'):v.desc}</div>
				`
				if(isLongDesc){
					str+= `<div class="desc-switch desc--switch--close">展开</div>`
				}
				str+=`</li>`
			})
			$('#list').html(str).off('click').on('click', '.desc-switch,.desc' ,function(e){
				console.log(this)
				var idx = $(this).parents('li').index()
				var btn = $(this).parents('li').find('.desc-switch')
				if(btn.hasClass('desc--switch--close')){
					btn.addClass('desc--switch--open').removeClass('desc--switch--close').text('收起');
					btn.parents('li').find('.desc').text(list[idx].desc)
				}else if(btn.hasClass('desc--switch--open')){
					btn.removeClass('desc--switch--open').addClass('desc--switch--close').text('展开');
					btn.parents('li').find('.desc').text(list[idx].desc.slice(0,69) + '……')
				}
			});

		</script>
