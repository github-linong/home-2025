<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>ElementUI 实现导航联动功能 - www.lilnong.top</title>
	<meta keywords="导航联动">
	<meta description="导航联动">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <p>Menu Attribute - route： 开启路由配置</p>
        <p>Menu Attribute - default-active 当前激活菜单的 index</p>
        <div class="wrap">
            <div class="header">
                <el-radio-group v-model="isCollapse" style="margin-bottom: 20px;">
                    <el-radio-button :label="false">展开</el-radio-button>
                    <el-radio-button :label="true">收起</el-radio-button>
                </el-radio-group>
                <p>activeIndex: {{activeIndex}}</p>
                <el-menu
                    ref="nav1" 
                    :default-active="activeIndex" 
                    class="el-menu-demo" 
                    mode="horizontal" 
                    @select="handleSelect">
                    <el-menu-item index="1">处理中心</el-menu-item>
                    <el-submenu index="2">
                        <template slot="title">我的工作台</template>
                        <el-menu-item index="2-1">选项1</el-menu-item>
                        <el-menu-item index="2-2">选项2</el-menu-item>
                        <el-menu-item index="2-3">选项3</el-menu-item>
                        <el-submenu index="2-4">
                            <template slot="title">选项4</template>
                            <el-menu-item index="2-4-1">选项1</el-menu-item>
                            <el-menu-item index="2-4-2">选项2</el-menu-item>
                            <el-menu-item index="2-4-3">选项3</el-menu-item>
                        </el-submenu>
                    </el-submenu>
                    <el-submenu index="5">
                        <template slot="title">我的工作台2</template>
                        <el-menu-item index="2-1">选项1</el-menu-item>
                    </el-submenu>
                    <el-submenu index="6">
                        <template slot="title">我的工作台6</template>
                    </el-submenu>
                    <el-menu-item index="3" disabled>消息中心</el-menu-item>
                    <el-menu-item index="4"><a href="https://www.ele.me" target="_blank">订单管理</a></el-menu-item>
                </el-menu>
            </div>
            <div class="main">
                <div class="main-nav">
                    <el-menu 
                        ref="nav2"
                        default-active="1-4-1" 
                        class="el-menu-vertical-demo" 
                        @open="handleOpen" 
                        @close="handleClose" 
                        :collapse="isCollapse">
                        <el-submenu index="1">
                          <template slot="title">
                            <i class="el-icon-location"></i>
                            <span slot="title">导航一</span>
                          </template>
                          <el-menu-item-group>
                            <span slot="title">分组一</span>
                            <el-menu-item index="1-1">选项1</el-menu-item>
                            <el-menu-item index="1-2">选项2</el-menu-item>
                          </el-menu-item-group>
                          <el-menu-item-group title="分组2">
                            <el-menu-item index="1-3">选项3</el-menu-item>
                          </el-menu-item-group>
                          <el-submenu index="1-4">
                            <span slot="title">选项4</span>
                            <el-menu-item index="1-4-1">选项1</el-menu-item>
                          </el-submenu>
                        </el-submenu>
                        <el-menu-item index="2">
                          <i class="el-icon-menu"></i>
                          <span slot="title">导航二</span>
                        </el-menu-item>
                        <el-menu-item index="3" disabled>
                          <i class="el-icon-document"></i>
                          <span slot="title">导航三</span>
                        </el-menu-item>
                        <el-menu-item index="4">
                          <i class="el-icon-setting"></i>
                          <span slot="title">导航四</span>
                        </el-menu-item>
                      </el-menu>
                      
                      
                </div>
            </div>
            <div class="footer"></div>
        </div>
    </div>
    <style>
      .el-menu-vertical-demo:not(.el-menu--collapse) {
        width: 200px;
        min-height: 400px;
      }
    </style>
    <script>
        navConfig = {
            name: '综合业务管理平台',
            url: '/',
            children: [
                {
                    name: 'vv音乐',
                    url: '/vvmusic',
                    children: [
                        {
                            name: '审核管理',
                            url: '/vvmusic/audit',
                            children: [
                                {name: '文字审核', url: '/vvmusic/audit/text', isGroup: true, children: [
                                    {name: '私聊文字', url: '/vvmusic/audit/text/group'},
                                    {name: '群聊文字', url: '/vvmusic/audit/text/private'},
                                    {name: '评论文字', url: '/vvmusic/audit/text/comment'}
                                ]},
                                {name: '图片审核', url: '/vvmusic/audit/image', isGroup: true, children: [
                                    {name: '私聊图片', url: '/vvmusic/audit/image/group'},
                                    {name: '群聊图片', url: '/vvmusic/audit/image/private'},
                                    {name: '评论图片', url: '/vvmusic/audit/image/comment'}
                                ]},
                                {name: '信息审核', url: '/vvmusic/audit/info',}
                            ]
                        }
                    ]
                },
                {
                    name: '开发者',
                    url: '/dev',
                    children: [
                        {
                            name: '系统配置',
                            url: '/dev/config',
                            children: [
                                {name: '上传配置', url: '/dev/config/upload', isGroup: true, children: [
                                    {name: '上传图片', url: '/dev/config/upload/image'},
                                    {name: '上传视频', url: '/dev/config/upload/video'},
                                    {name: '上传音频', url: '/dev/config/upload/audio'},
                                    {name: '上传文件', url: '/dev/config/upload/file'}
                                ]},
                                {name: '通知配置', url: '/dev/config/notify', isGroup: true, children: [
                                    {name: '全局通知', url: '/dev/config/notify/public'},
                                    {name: '页面通知', url: '/dev/config/notify/page'},
                                    {name: '邮件通知', url: '/dev/config/notify/email'}
                                ]},
                                {name: '系统信息', url: '/dev/config/info',}
                            ]
                        }
                    ]
                }
            ]
        }
    </script>
    <script>
        vm = new Vue({
            el: '#app',
            data() {
                return {
                    activeIndex: '1',
                    activeIndex2: '1',
                    isCollapse: false
                };
            },
            methods: {
                handleSelect(key, keyPath) {
                    console.log(key, keyPath);
                },
                handleOpen(key, keyPath) {
                    console.log(key, keyPath);
                },
                handleClose(key, keyPath) {
                    console.log(key, keyPath);
                }
            }
        })
    </script>
