	<style>
		.video{
			height: 75vh;
		}
		.object-fit-cover{
			-o-object-fit: cover;
			object-fit: cover;
			/* height: 100%; */
		}
		.icon-absolute{position: absolute;z-index: 1000;right: 0px;top:50vh;}
		.icon-fixed{position: fixed;z-index: 2000;right: 100px;top:50vh;}
		.icon-btn{padding: 20px;}
	</style>
	<div id="app">
		<button onclick="video.play()">play</button>
		<button onclick="video.classList.toggle('object-fit-cover')">toggle-cover</button>
		<div class="icon-absolute">
			<div class="icon-btn" onclick="alert('absolute-单击了微信')">微信</div>
			<div class="icon-btn" onclick="alert('absolute-单击了QQ')">QQ</div>
		</div>
		<div class="icon-fixed">
			<div class="icon-btn" onclick="alert('fixed-单击了微信')">微信</div>
			<div class="icon-btn" onclick="alert('fixed-单击了QQ')">QQ</div>
		</div>
		<video 
			class="video object-fit-cover"
			id="video"
			width="100%" 
			type="video/mp4" 
			src="https://www.lilnong.top/static/video/v1705221.mp4" 
			alt="最后一个太难了，你们知道？" 
			preload="auto" 
			webkit-playsinline="" 
			playsinline="" 
			x5-video-player-fullscreen="false " 
			x5-video-player-type="h5"></video>
		<canvas id="canvas"
		width="200"
		height="200"
		style="height: 200px;width: 200px;"></canvas>
	</div>
	<script>
		var ctx = canvas.getContext('2d')
		paintCanvas = function(){
			ctx.drawImage(video, 0, 0, 200, 200)
		}
		requestAnimationFrameHandler = function(){
			requestAnimationFrame(()=>{
				requestAnimationFrameHandler();
			})
			paintCanvas()
		}
		requestAnimationFrameHandler()
	</script>
