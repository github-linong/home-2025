	<div id="app">
	</div>
	<script>
		var wxBack = {
			popstate: function(res){
				var _this = this;
				var state = {
					title: res.title || "VV音乐",
					page: "load",
					url: res.url,
				}
				if ((/micromessenger/gi).test(navigator.userAgent)) {
					_this.pushHistory(state)
					window.addEventListener('popstate', function (e) {
						console.log('popstate', state, history, e)
						var temp = e.state
						if (temp && "load" === temp.page) {
							location.reload()
						}
					})
				}
			},
			pushHistory: function(_state){
				console.log('pushHistory', _state, history)
				if (history.length < 2) {
					var url = location.href
					window.history.replaceState(_state,null, _state.url)
					window.history.pushState({ page: 'detail' },null, url)
					// setTimeout(v=>{
					// 	window.history.replaceState({ page: 'detail' },null, url)
					// })
					window.location.replace(url);
				}
			}
		};

		//调用
		wxBack.popstate({
			title: '标题，默认为“VV音乐”',
			url: '/cors/wxback'
		})
	</script>
