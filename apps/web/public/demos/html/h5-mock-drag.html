	<style type="text/css">
		ul{
			height: 500px;width: 300px;
			float:left;
		}
		ul:nth-child(1){
			border: 1px solid #111;
		}
		ul:nth-child(2){
			border: 1px solid #222;
		}
		li{
			border: 1px solid #f00;user-select:none;
		}

	<div id="app">
		<ul class="drap-wrap">
			<li class="nodrap">这是一个不可以拖动的内容 5</li>
			<li class="drap">这是一个可以拖动的内容 1</li>
			<li class="drap">这是一个可以拖动的内容 2</li>
			<li class="drap">这是一个可以拖动的内容 3</li>
			<li class="nodrap">这是一个不可以拖动的内容 6</li>
			<li class="drap">这是一个可以拖动的内容 4</li>
		</ul>
		<ul class="drap-wrap">
			
		</ul>
	</div>
	<script type="text/javascript">
		var drapDOM = null;
		window.addEventListener('mousedown', function(e){
			if(e.target.classList.contains('drap')){
				drapDOM = e.target;
			}
		})
		window.addEventListener('mousemove', function(e){
			if(drapDOM){
				drapDOM.style.position = 'fixed';
				drapDOM.style.pointerEvents =  'none';
				drapDOM.style.left = e.clientX + 'px'
				drapDOM.style.top = e.clientY + 'px'
				// console.log(e)
			}
		})
		window.addEventListener('mouseup', function(e){
			// console.log(e.target)
			if(drapDOM){
				drapDOM.style.position = 'initial';
				drapDOM.style.pointerEvents =  'initial';
				drapDOM.style.left = '0'
				drapDOM.style.top = '0';
				var eTarget = $(e.target)
				if(!eTarget.hasClass('drap-wrap')){
					eTarget = eTarget.parents('.drap-wrap');
				}
				// console.log(eTarget)
				if(eTarget.length){
					if(drapDOM.parentNode != eTarget[0]){
						eTarget[0].appendChild(drapDOM)
					}
				}
				drapDOM = null
			}
		})
	</script>
