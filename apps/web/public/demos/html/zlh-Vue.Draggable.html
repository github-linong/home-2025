<body>
	<style>
		.dargwrap {
			border: 1px solid #f00;
			padding: 10px;
			margin: 10px;
			display: flex;
		}

		.dargwrap .ul {
			flex: 1 1 auto;
			margin: 10px;
			padding: 10px;
			border: 1px solid #ff0;
			list-style: none
		}
	</style>
	<div id="app">
		<p>
			list: {{list}}
		</p>
		<div class="dargwrap">
			<draggable class="dragArea list-group ul"
				 :list="list"
				@change="change"
				:group="{ name: 'people', pull: 'clone', put: false }">
				<div class="list-group-item" v-for="element in list" :key="element.id">
					<template v-if="element.type == 'totle'">
						统计:{{element.txt}} / 8
					</template>
					<template v-else>
						{{element.id}}. {{ element.txt }} => {{element.num}}/8
					</template>
				</div>
			</draggable>
		</div>
	</div>
	<script>
		new Vue({
			el: '#app',
			data() {
				return {
					list: [
						{id: 1, type: 'record',txt:'人教大法师', num: 1},
						{id: 2, type: 'record',txt:'人教小法师', num: 1},
						{id: 3, type: 'record',txt:'长庚道友', num: 4},
						{id: 8, type: 'totle', txt:'0'},
						{id: 4, type: 'record',txt:'长寿道友', num: 2},
						{id: 5, type: 'record',txt:'海神', num: 3},
						{id: 6, type: 'record',txt:'水神', num: 5},
						{id: 7, type: 'totle', txt:'1'},
					]
				}
			},
			created(){
				this.computedTotal()
			},
			computed:{},
			methods: {
				change: function (evt) {
					window.console.log(evt);
					this.computedTotal()
				},
				computedTotal(){
					var sum = 0;
					this.list.forEach(v=>{
						if(v.type == 'totle'){
							v.txt = sum;
							sum = 0
						}
						sum += v.num || 0
					})
				}
			}
		})
	</script>
