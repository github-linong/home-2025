<body>
	<div id="app">
		<ul>
			<li>先点击屏幕录制</li>
			<li>然后可以点击《录制结果保存》可以看到期间的结果出现在了另一个video</li>
		</ul>
		<div>
			<button @click="getDisplayMedia">开启屏幕录制</button>
			<button @click="saveDisplayMeida">录制结果保存</button>
		</div>
		<video id="video1" style="max-width: 100vw;max-height: 50vh;" controls></video>
		<video id="video2" style="max-width: 100vw;max-height: 50vh;" controls></video>
	</div>
	<script>
		var mediaRecorder = null
		var chunks = [];
		function ondataavailable(event){
			console.log('ondataavailable', event)
			// var blob = event.data;
			chunks.push(event.data);
			// document.querySelector('#video2').src = URL.createObjectURL(blob)
		}
		function getDisplayMedia(){
			navigator.mediaDevices.getDisplayMedia()
				.then(function(mediaStream) {
					console.log('navigator.mediaDevices.getDisplayMedia', 'then', mediaStream)
					var video = document.querySelector('#video1');
					video.srcObject = mediaStream;
					video.onloadedmetadata = function(e) {
						video.play();
					};
					mediaRecorder = new MediaRecorder(mediaStream)
					mediaRecorder.ondataavailable = ondataavailable;
					mediaRecorder.start(2000);
				})
				.catch(function(err) { 
					console.log('navigator.mediaDevices.getDisplayMedia', 'catch', err)
					console.log(err.name + ": " + err.message); 
				}); // 总是在最后检查错误
			
		}
	</script>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {}
			},
			methods:{
				getDisplayMedia(){
					getDisplayMedia();
				},
				saveDisplayMeida(){
					// if(mediaRecorder) mediaRecorder.requestData()
					var blob = new Blob(chunks);
					uploadFile(blob)
					document.querySelector('#video2').src = URL.createObjectURL(blob)
				}
			}
		})
	</script>
	<script>
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file, Math.random()+'.mp4')
			formData.append('opacid', 'LN')
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.upload.onprogress = onprogress;
			xhr.open('post', '/upload_any');
			xhr.onreadystatechange = onreadystatechange;
			xhr.send(formData);
		}
	</script>
