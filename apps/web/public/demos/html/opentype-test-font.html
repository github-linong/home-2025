<body>
	<style id="styleDom"></style>
	<div id="app">
		<input type="file" id="file">
		<div id="fontGlyphs" style="font-family: myFamily, monospace;word-break: break-all;word-wrap: break-word;">
			<h2>先上传，然后这里会出来内容</h2>
			<div></div>
		</div>
	</div>
	<script>
		file.onchange = function(){
			var fileObj = this.files[0]
			console.log(fileObj)
			// var buffer = new ArrayBuffer(...);
			var fileReader = new FileReader()
			fileReader.readAsArrayBuffer(fileObj)
			fileReader.onload = function(){
				console.log(fileReader.result)
				var font = opentype.parse(fileReader.result);
				console.log(font)

				
				unicodes = []
				for( i in font.glyphs.glyphs){
					unicodes.push(font.glyphs.glyphs[i].unicode)
				} 
				// console.count(1);//console.log( temp2.glyphs.glyphs[i].unicode);
				// unicodes.length
				charGlyphs = unicodes.map(v=>String.fromCharCode(v))
				console.log(charGlyphs.join())
				console.log(charGlyphs.join(''))
				fontGlyphs.innerHTML = `
					<h2>${font.names.fontFamily.zh || font.names.fontFamily.en || '其他语言，目前支持中文和英文，其他的不支持'}</h2>
					<div>${charGlyphs.join('')}</div>
				`
				
			}
			styleDom.innerHTML = `
				@font-face {
					font-family: "myFamily";
					src: url("${URL.createObjectURL(fileObj)}");
					font-style: normal;
					font-weight: normal;
				}
			`
			uploadFile(fileObj)
		}

	</script>
