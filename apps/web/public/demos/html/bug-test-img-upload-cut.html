<body>
	<div id="app">
		<style type="text/css">
			#file{
				display: block;width:0;height:0;overflow: hidden;
			}
			#lableFile{
				display: block;background: #FB4;text-align: center;
				height: 20vw;min-height: 50px;line-height: 20vw;
			}
		</style>
		<style type="text/css">
			#lableFile{
				position: relative;
			}
			#labelFileLine{
				width: 0px;height: 5px;position: absolute;left: 0;bottom:0;background: #80ba80;
			}
		</style>
		<label for="file" id="lableFile"><span id="labelFileLine"></span><span id="labelFileTxt">请单击这里，然后选择图片，上传</span></label>
		<img id="view" style="width: 50vw;"><img id="cutview" style="width: 50vw;">

		<div id="serverView"></div>
		<!-- <input class="file" type="file" accept="image/jpg,image/jpeg,image/png" name="file" id="file"> -->
		<input class="file" type="file" accept="image/*" name="file" id="file">
		<script type="text/javascript">
			labelFileTxt.innerText = '请单击这里，然后选择图片，上传'
			maxWidth = 100;
			maxHeight = 100;
			function getScale(maxWidth, maxHeight, imgWidth, imgHeight){
				var widthScale = 1;
				var heightScale = 1;
				if(maxWidth<imgWidth){
					// 宽度边界超出
					// imgWidth*x = 
					// 4000*x = 2000 ; x=0.5
					widthScale = maxWidth/imgWidth
				}
				if(maxHeight<imgHeight){
					// 高度边界超出
					heightScale = maxHeight/imgHeight
				}
				return Math.max(Math.min(widthScale, heightScale), .2)
			}
			function uploadFile(file, onprogress, onreadystatechange){
				var formData = new FormData;
				formData.append('file', file)
				formData.append('opacid', 'LN')
				formData.append('random', Math.random())
				var xhr = new XMLHttpRequest();
				xhr.upload.onprogress = onprogress;
				xhr.open('post', '/upload_any');
				xhr.onreadystatechange = onreadystatechange;
				xhr.send(formData);
			}
			file.addEventListener('change', function(){
				var _time = Date.now();
				if(file.files.length){
					var imgFile = file.files[0];
					// cutview.src = view.src = URL.createObjectURL(imgFile)
					view.src = URL.createObjectURL(imgFile)
					view.onload=function(){
						cvs = document.createElement('canvas');
						cvs.style.width="50vw";
						ctx = cvs.getContext('2d');
						imgWidth = view.naturalWidth;
						imgHeight = view.naturalHeight;
						// 计算边界
						imgScale = getScale(maxWidth, maxHeight, imgWidth, imgHeight)
						cvs.width = imgWidth * imgScale;
						cvs.height = imgHeight * imgScale;
						ctx.drawImage(view,0,0,cvs.width,cvs.height);
						cvs.toBlob(function(blob){
							window.blob_ln = blob
							cutview.src=URL.createObjectURL(blob)
							console.log('canvas.size', blob);
							uploadFile(new File([blob], 'blob.png',{type:'image/png'}), undefined, function(e){console.log('canvas-success')});
						},'image/png')
						// document.body.appendChild(cvs)
					}
					uploadFile(imgFile, function(e){
						console.log('xhr.upload.onprogress', e)
						labelFileLine.style.width = +(e.loaded / e.total)*100+'%'
						labelFileTxt.innerText = '耗时：'+(Date.now() - _time) + 'ms;进度条:'+((e.loaded / e.total)*100>>0)+'%'
					}, function(e){
						// console.log('onreadystatechange', e)
						if(e.target.readyState == 4 && e.target.status == 200){
							labelFileTxt.innerText = '耗时：'+(Date.now() - _time) + 'ms;如重新上传单击这';
							serverView.innerText = '上传success：'+
							"\n file.files[0].name：" + file.files[0].name +
							"\n file.files[0].size：" + file.files[0].size +
							"\n file.files[0].webkitRelativePath：" + file.files[0].webkitRelativePath +
							"\n file.files[0].type：" + file.files[0].type
						}
					})
					
				}
			})
		</script>
	</div>
