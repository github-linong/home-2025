<body>
	<div id="app">
		
		<el-button @click="idx++">idx++</el-button>
		<div>
			inputValue:{{inputValue}}
			<input v-model.lazy="inputValue"></input>
			Date.now():{{Date.now()}}:{{now}}
			<audio 
				@durationchange="cLog"
				@loadedmetadata="cLog"
				@loadeddata="cLog"
				@timeupdate="cLog"
				ref="audioEl" :src="computedUrl"></audio>
		</div>
		<div>url: {{computedUrl}}</div>
		<div>audio-status:{{durationTime}}</div>
	</div>
	<script>
		new Vue({
			el: "#app",
			data(){
				return {
					inputValue: '123',
					now: 0,
					url: '//chuangshicdn.file.m.mvbox.cn/upload/1cfd8d964385aeb8d3b3051396146314_927674570_1.m4a',
					urls: [
						'//chuangshicdn.file.m.mvbox.cn/upload/56f41ce37672d1fb2c36eb9bf474e510_907713589_1.m4a',
						'//chuangshicdn.file.m.mvbox.cn/upload/682614592d678713b052d70a8009a263_907713589_1.m4a',
						'//chuangshicdn.file.m.mvbox.cn/upload/1cfd8d964385aeb8d3b3051396146314_927674570_1.m4a',
						'https://chuangshicdn.file.m.mvbox.cn/upload/56f41ce37672d1fb2c36eb9bf474e510_907713589_1.m4a',
						'https://chuangshicdn.file.m.mvbox.cn/upload/682614592d678713b052d70a8009a263_907713589_1.m4a',
						'https://chuangshicdn.file.m.mvbox.cn/upload/1cfd8d964385aeb8d3b3051396146314_927674570_1.m4a',
						'http://chuangshicdn.file.m.mvbox.cn/upload/56f41ce37672d1fb2c36eb9bf474e510_907713589_1.m4a',
						'http://chuangshicdn.file.m.mvbox.cn/upload/682614592d678713b052d70a8009a263_907713589_1.m4a',
						'http://chuangshicdn.file.m.mvbox.cn/upload/1cfd8d964385aeb8d3b3051396146314_927674570_1.m4a'
					],
					idx: 0,
					duration: 0,
					currentTime: 0,
				}
			},
			methods:{
				cLog(e){
					console.log(e.type, 'cLog')
					if(e.type == 'timeupdate'){
						this.$nextTick(()=>{
							this.currentTime = this.$refs.audioEl.currentTime
						})
					}else if(e.type == 'loadedmetadata'){
						this.$nextTick(()=>{
							this.duration = this.$refs.audioEl.duration
							this.$refs.audioEl.play()
						})
					}
				},
			},
			mounted(){
				setInterval(v=>{
					this.now = Date.now()
				}, 1000)
			},
			computed: {
				durationTime(){
					return `${this.currentTime}:${this.duration}`
				},
				computedUrl(){
					return `${this.urls[this.idx % this.urls.length]}?${this.idx}`
				}
			}
		})
	</script>
