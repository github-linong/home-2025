<body>
	<div id="app">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		h1,
		h2,
		h3,
		h4,
		h5,
		h6,
		a,
		p,
		label,
		ul,
		li,
		label,
		span {
			margin: 0;
			padding: 0;
			font-family: 微软雅黑
		}

		a,
		a:active,
		a:focus,
		a:hover {
			text-decoration: none
		}

		.clear {
			clear: both
		}

		body {
			background: #ededed
		}

		html,
		body {
			height: 100%
		}

		.device .deviceLeft {
			width: 220px;
			height: 100%;
			border-right: 1px solid #ccc;
			float: left;
			overflow: auto
		}

		.device .deviceLeft h3 {
			padding-left: 10px;
			font-size: 14px;
			background: #ddd;
			line-height: 36px;
			border-top: 1px solid #ccc;
			border-bottom: 1px solid #ccc
		}

		.device .deviceLeft .deviceLeft_box {
			overflow: hidden;
			padding: 10px 0
		}

		.device .deviceLeft .deviceLeft_box .node {
			user-select: none;
			width: 98px;
			height: 40px;
			line-height: 20px;
			float: left;
			margin: 5px
		}

		.device .node {
			width: 120px;
			height: 50px;
			line-height: 30px;
			box-shadow: 2px 2px 10px #aaa;
			border-radius: 3px;
			text-align: center;
			z-index: 20;
			background-color: #f1f1f2;
			color: #000;
			padding: 10px;
			font-size: 14px;
			cursor: pointer
		}

		.device .node:hover {
			box-shadow: 2px 2px 19px #444;
			opacity: .8;
			filter: alpha(opacity=80)
		}

		.device .node[data-type="1"]{
			border: #87cefa 1px solid
		}

		.device .node[data-type="2"]{
			border: orange 1px solid
		}

		.device .node[data-type="3"]{
			border: #cd5c5c 1px solid
		}

		.device .node[data-type="4"]{
			border: #adff2f 1px solid
		}

		.device .node[data-type="5"]{
			border: #ccc 1px solid
		}

		.device #deviceRight {
			position: absolute;
			right: 0;
			width: calc(100% - 220px);
			height: 100%;
			box-sizing: border-box;
			background: url(//www.lilnong.top/static/img/jsPlumb/bg.png)
		}

		.device #myDropDown {
			width: 80px;
			margin-left: -14px;
			border: 1px solid #ccc;
			text-align: center
		}

		.device #main {
			width: 100%;
			height: 100%
		}
	</style>
	<style>
		#dialog{
			display: none;
			position: fixed;
			z-index: 1000;
			top:0;right:0;bottom:0;left:0;
			background: rgba(0,0,0,.3);
		}
		#dialog .dialog-inner {
			height: 100%;
			background: #fff;
			width: 400px;
			padding: 10px;

	<script>
		var inNodePayload = [
			{
				title: '模板支持输入源的类型',
				key: 'supportType',
				type: 'select',
				options: [
					{value: 1, label: '仅支持相机输入',},
					{value: 2, label: '仅支持相册输入',},
					{value: 3, label: '支持相机和相册输入',},
				],
				// value: 1
			},
			{
				title: '相册输入片段列表',
				key: 'inputs',
				type: 'list',
				payload: [
					{
						title: '片段id',
						key: 'id',
						type: 'text',
						// value: ''
					},
					{
						title: '片段位置',
						key: 'index',
						type: 'text',
						// value: ''
					},
					{
						title: '片段类型',
						key: 'sourcetype',
						type: 'select',
						options: [
							{value: 1, label: '图片',},
							{value: 2, label: '视频',}
						],
						// value: 1
					},
					{
						title: '片段入点',
						key: 'inPoint',
						type: 'text',
						// value: '',
						tips: '片段在什么事件开始播放，单位微秒',
					},
					{
						title: '片段时长',
						key: 'duration',
						type: 'text',
						// value: '',
						tips: '片段播放时长，如果选取的是视频，则视频不能小于该时长，单位微秒'
					},
					{
						title: '片段是否静音',
						key: 'isMute',
						type: 'text',
						// value: ''
					},
				],
				value: {
					id: '',
					index: '',
					sourcetype: '',
					inPoint: '',
					duration: '',
					isMute: '',
				}
			}
		]	
		// 初始化配置
		var nodes = [
			{
				title: '输入源',
				child: [
					{
						id: 1,
						title: '相机',
						type: 1,//0无输入无输出 1只能输出 2只能输入 3有输入有输出	
						value: {// 默认值
							supportType: 1, // 1：仅支持相机输入      2：仅支持相册输入      3：支持相机和相册输入

						},
						payload: inNodePayload

						title: '相册',

						},

							fileName: '',
							toastString: '',
						},
						payload: [

								title: '特效文件',

								}

							},

							// 	title: '提示语',

						]
					},

						title: '美摄',
						type: 3,//0无输入无输出 1只能输出 2只能输入 3有输入有输出	
						value: {
							type: 1,
							videoFxId: '',
							intensity: 1.0,
							value: 'false',
						},
						payload: [
							{
								title: '美摄特效类型',
								key: 'type',
								type: 'select',
								options: [
									{value: 1, label: '表示package类型，需要有videofx文件和lic文件',},
									{value: 2, label: '表示buildin类型，不需要videofx和lic文件',}
								],
								// value: 1
							},
							{
								title: '美摄特效id',
								key: 'videoFxId',
								type: 'text',
								// value: ''
							},
							{
								title: '美摄特效强度',
								key: 'intensity',
								type: 'float',
								// value: '1.0',
								tips: '如果是package类型，需要与美摄videofx文件和lic文件同名，不带后缀。如果是buildin类型则在是固定的内置特效名，如Segmentation（背景分割）'
							},
							{
								title: '该特效是否改变原始内容',
								key: 'isChangeDetectArea',
								type: 'bool',
								// value: '',
								tips: '该特效是否改变了视频区域，如变形、翻转、改变大小等，如果改变，后续处理可能需要重新进行识别。'
							},
							{
								title: '特效文件',

							segmentType: 0,

								translateY: '',
								rotateX: '',
								rotateY: '',

										type: 'text',

										type: 'text',

									},
									{
										title: '沿X轴方向旋转',

									},

									},

										type: 'text',

									},

										type: 'text',

									},

										type: 'text',
										value: '0'
									},
									{
										title: '是否水平镜像',
										key: 'flipX',
										type: 'text',
										value: '0'
									},
									{
										title: '是否垂直镜像',
										key: 'flipY',
										type: 'text',
										value: '0'
									},
								],
								tips: '是否需要变换，无需则不显示以下信息（transform说明）。平移旋转缩放镜像等操作，如不配置此字段，则不做变换。'
							},
							{
								title: '特效文件',
								type: 'file',
								// value: ''
							},
							{
								title: '提示语',
								type: 'text',
								// value: ''
							}
						]				
					}
				]
			},
			{
				title: '输出源',
				child: [
					{
						id: 7,
						title: '固定输出',
						type: 2,//0无输入无输出 1只能输出 2只能输入 3有输入有输出		
					},
				]
			}
		];
		var nodesHash = {};
		nodes.forEach(v=>{
			// console.log(v)
			v.child.forEach(v1=>{
				v1._partent = v;
				nodesHash[v1.id] = v1
				// console.log(v1)
			})
		})
		// 构建一个node
		var getNodeItem = function (node){
			return `<div class="node" data-type="${node.type}" data-id="${node.id}">${node.title}</div>`
		}
		// 构建一组node
		var getNodeBox = function (node){
			return `<div class="deviceLeft_box">
				${node.child.map(node1=>getNodeItem(node1)).join('\n')}
			</div>`
		}
		// 构建左边整体node
		var getNodeHTML = function (nodes){
			return nodes.map(node=>{
				return `
					<h3>${node.title}</h3>
					${getNodeBox(node)}
				`
			}).join('\n')
			
		}
	</script>

		// 增加一个节点
		var appendPlumbNode = function appendPlumbNode(offset, node, value){
			// offset = {x, y} 绘制坐标
			if(offset == undefined) offset = {x: 0, y: 0}
			var left = (offset && offset.x) || 0
			var top = (offset && offset.y) || 0
			// node 要绘制的节点
			var dropItem = node;
			if(!dropItem) throw new Error('请传入节点');
			var type = dropItem.dataset.type;
			var nodeId = dropItem.dataset.id;
			var nodeObj = nodesHash[nodeId]
			PLUMB_NODE_COUNT++
			var id = "chart-server" + PLUMB_NODE_COUNT;
			// $('#main').append(`<div class="node node1css server" style="position: absolute" id="${id}" data-type="${type}" data-id="${nodeId}">${$(dropItem).html()}</div>`);
			$('#main').append(`<div class="node node1css server" style="position: absolute" id="${id}">${$(dropItem).html()}</div>`);
			var $el = $("#" + id).css("left", left).css("top", top).attr({
				'data-type': type,
				'data-id': nodeId,
				'data-value': JSON.stringify(Object.assign({},nodeObj.value,value))
			});
			var el = $el[0]
			if(type & 1){
				el.rightEndPoint = jsPlumb.addEndpoint(id, {
					anchors: "Right"
				}, hollowCircleOut);
			}
			if(type & 2){
				el.leftEndPoint = jsPlumb.addEndpoint(id, {
					anchors: "Left"
				}, hollowCircleIn);
			}
			jsPlumb.draggable(id);
			doubleclick("#" + id);
			return {
				id: id
			}
		}
		var _getFormItemHTML = function(payload, value){
			if(payload){
				if(payload.type == 'select'){
					return `
						<span>${payload.title}</span>
						<select name="${payload.key}" value="${value[payload.key]}">
							${payload.options.map(v=>{
								return `
									<option value="${v.value}">${v.value},${v.label}</option>
								`
							})}
						</select>
					`
				}else if(payload.type == 'list'){
					return `
						<span>${payload.title}</span><button>+</button>
						<ul>
							<li>${value[payload.key].map(v=>_getFormItemHTML(v, value[payload.key])+'<br>')}</li>
						</ul>
					`
				}else{
					return `
						<span>${payload.title}</span>
						<input  name="${payload.key}" value="${value[payload.key]}">
					`
				}
			}
		}
		var getFormHTML = function(data, value){
			console.log(data && data.payload)
			if(data && data.payload && data.payload.length){
				var payload = data.payload;
				return payload.map(v=>{
					return `<div>${_getFormItemHTML(v, value)}</div>`
				}).join('\n')
			}
			return false;
		}
