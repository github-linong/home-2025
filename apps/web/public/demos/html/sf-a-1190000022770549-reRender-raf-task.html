	<div id="app">
		<h2><a href="https://segmentfault.com/a/1190000022770549">深入解析你不知道的 EventLoop 和浏览器渲染、帧动画、空闲回调（动图演示）</a></h2>
		<h3>闪烁动画测试</h3>
		<p>假设我们现在想要快速的让屏幕上闪烁 红、蓝两种颜色，保证用户可以观察到，如果我们用 setTimeout 来写，并且带着我们长期的误解「宏任务之间一定会伴随着浏览器绘制」，那么你会得到一个预料之外的结果。</p>
		<p>测试方案：100ms执行一次，统计执行次数。统计requestAnimationFrame执行次数。统计fps</p>
		<div class="view-box">

		</div>

	</div>
	<style>
		.view-box{width: 100px;height: 100px;position: relative;z-index: 10;}
	</style>
	<script>
		var el = document.querySelector('.view-box');
		var intervalCountObj = {};
		var raFCountObj = {};
		function countAdd(obj, key = ''){
			var date = Date.now();
			var date_s = date/1000  >> 0;
			if( obj[date_s] ){
				obj[date_s].push(date + key)
			}else{
				obj[date_s]=[]
			}
			return obj
		}
		// 获取当前对象，秒级频率
		function getCountTotal_s(obj, s){
			if(obj[s]){
				return obj[s].length// / 60 >> 0
			}else{
				return 0
			}
		}
		// 获取平均后的数据
		function getAvg_s(obj, s, count){
			var sum = 0;
			for(var i = 0; i < count; i++){
				sum += getCountTotal_s(obj, s - i);
			}
			return sum / count >> 0
		}
		function getCountTotal(obj){
			var date = Date.now() / 1000  >> 0;
			return `一秒（实时）：${getAvg_s(obj,date,1)}
			一秒（上次）：${getAvg_s(obj,date - 1,1)}
			五秒（实时）：${getAvg_s(obj,date, 5)}
			五秒（上次）：${getAvg_s(obj,date - 1, 5)}`
		}
		var interval = setInterval(()=>{
			setTimeout(() => {
				el.style.background = "red"
				countAdd(intervalCountObj)
				setTimeout(() => {
					countAdd(intervalCountObj)
					el.style.background = "blue"
				})
			})
		}, 100)
		raF = function(){
			requestAnimationFrame(function(){
				countAdd(raFCountObj)
				// console.count('requestAnimationFrame')
				raF()
			})
			// console.clear()
			console.log({
				intervalCountObj: getCountTotal(intervalCountObj),
				raFCountObj: getCountTotal(raFCountObj),
			})
		}
		raF()
	</script>
