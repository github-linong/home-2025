        window.base = {
            //获取url参数
            getUrlParam: function (name) {
                var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
                var r = window.location.search.substr(1).match(reg);  //匹配目标参数
                if (r != null) {
                    return r[2];
                } else {
                    return null; //返回参数值
                }

            toHtml: function (val) {
                if (typeof val != 'string') return '';
                var entityMap = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': '&quot;',
                    "'": '&#39;',
                    "/": '&#x2F;'
                };
                return String(val).replace(/[&<>"'\/]/g, function (s) {
                    return entityMap[s];
                });
            },
            toUrl: function (url, defaultUrl) {
                if (defaultUrl == undefined) defaultUrl = 'https://music.51vv.com/wx/m/vv-base/images/logo.png'
                if (typeof url != 'string') return defaultUrl;
                if (url.match(/^http/i)) {
                    return encodeURI(url)
                }

            }

            var liveId = null, //直播间ID
                anchorId = null, //主播ID
                baseURL = window.location.origin + '/';
            //展示广告位
            var showThisSmallWeb = function () {
                $('.swiper-slide.ANNUAL_LIVING2').show();
                websSwiper.update();
                window.checkSlides();
            };
            //隐藏广告位
            var hideThisSmallWeb = function () {
                $('.swiper-slide.ANNUAL_LIVING2').hide();
                websSwiper.update();
                window.checkSlides();
            };
            var webInit = function () {
                window.onKroomInfoGot(function (info) {
                    anchorId = info.anchorID; //获取主播ID
                    liveId = info.liveID; //获取直播ID
                    getNowLiveData();
                });
                //推送
                window.onKroomDataPush(function (res) {
                    if (!res.activityId || res.activityId != '202101_live') return;
                    // alert('右边推送de数据'+JSON.stringify(res))
                    setDataDom(res); //更新数据
                });
            };
            // 数据更新
            var setDataDom = function (res) {
                var data = res;
                // alert('直播间渲染的数据信息右边'+JSON.stringify(data))
                /**
                 * 区分如果是端推送 不会返回 retCode字段 取非 一定是true
                 * 如果是接口返回数据 会有 retCode字段 且不为 0 判断 1000 即可
                 */
                if (!data.retCode || data.retCode == 1000) {
                    if (data.isEnd == 0 || data.isEnd == 2) {
                        //0（活动未开始）|| 2（活动已结束）关闭轮播图
                        hideThisSmallWeb();
                    }
                    if (data.isEnd == 1) {
                        //1（活动进行中）开启轮播图
                        // showThisSmallWeb();
                        if (data.rankNumAll || data.rankNumAll >= 0) {
                            // alert('右边更新视图'+JSON.stringify(data))
                            if (data.rankNumAll == 0 || data.rankNumAll > 100) {
                                //名次 > 100 显示未上榜
                                $('.two_box .rank_detail').css('display', 'none');
                                $('.two_box .all_value_detail').css('display', 'none');
                                $('.two_box .rank_empty').css('display', 'block');
                            } else if (data.rankNumAll == 1) {
                                // 名次 = 1
                                $('.two_box .rankValue').text(data.rankNumAll); //右侧数据当前排名
                                $('.two_box .value_num').text(data.hotValueAll === undefined ? '-' : data.hotValueAll); //巅峰值总和
                                $('.two_box .rank_gap').css('display', 'none'); //隐藏距上一名差的总数
                                $('.two_box .rank_empty').css('display', 'none'); //隐藏空状态
                                $('.two_box .rank_detail').css('display', 'block');
                                $('.two_box .all_value_detail').css('display', 'block');
                            } else if (data.rankNumAll >= 2 && data.rankNumAll <= 99) {
                                // alert(`1234:${$('.two_box .rankValue').length}-${data.rankNumAll}`)
                                $('.two_box .rankValue').text(data.rankNumAll); //右侧数据当前排名
                                $('.two_box .value_num').text(data.hotValueAll === undefined ? '-' : data.hotValueAll); //巅峰值总和
                                $('.two_box .gapCountValue').text(data.gapHotValueAll === undefined ? '-' : data.gapHotValueAll); //距离上一名差的总数
                                $('.two_box .rank_empty').css('display', 'none');//隐藏空状态
                                $('.two_box .rank_detail').css('display', 'block');
                                $('.two_box .all_value_detail').css('display', 'block');
                            }
                        }
                    }
                    // setTimeout(() => {
                    //   $('.two_box').html($('.two_box').html()+'<br><br><br><br><br><br><br>'+Math.random())
                    // }, 0);
                } else {
                    console.log('查询失败')
                }
            };
            // 查询直播间数据
            var getNowLiveData = function () {
                var params = {
                    liveId: liveId,
                    anchorId: anchorId,
                };
                vvliveBridgeObj.doHttpGetReq_unify(
                    {
                        reqUrl: baseURL + 'act/year/2021/live/getNowLiveData.htm',
                        parameter: params,
                    },
                    function (res) {
                        setDataDom(res.data);
                    }
                );
            };
            window.LIVING_FESTIVAL_TWOINIT = webInit;
        })(window);
        ;
        var baseURL = window.location.protocol + "//music.51vv.com/";
        var VV_LIVING_USERINFO = null; //用户信息
        var VV_LIVING_INFO = null; //直播间信息
        var VV_ACTIVITY_DATA = null; //推送消息
        var websSwiper = null;
        var managerWeb = {
            init: function () {
                this.aaaaa();
                this.getUserInfo();
                this.updateInfo();
                //初始化swiper
                this.initSwiper();
                //各个小页面初始化
                window.LIVING_FESTIVAL_ONEINIT();
                window.LIVING_FESTIVAL_TWOINIT();
            },
            initSwiper: function () {
                websSwiper = new Swiper('#swiper', {
                    autoplay: 5000,
                    pagination: '.swiper-pagination',
                    observer: true,
                    // // pagination: '.swiper-pagination',
                    // paginationClickable: true,
                    // loop: true,
                    // noSwiping: false,
                    // // autoplay: 5000,
                    // autoplayDisableOnInteraction: false,  // 用户操作后, 自动滑动会停掉, 改为false不会停
                    // speed: 800,// 滑动速度，即slider自动滑动开始到结束的时间（单位ms），也是触摸滑动时释放至贴合的时间。
                    // // observer: true,//修改swiper自己或子元素时，自动初始化swiper
                    // observeParents: true//修改swiper的父元素时，自动初始化swiper
                });
            },
            //获取直播间信息
            aaaaa: function () {
                vvliveBridgeObj.aaaaa(function (result) {
                    if (_isAndroid) {
                        try {
                            result = JSON.parse(result);
                        } catch (e) {
                        }
                    }
                    window.VV_LIVING_INFO = result;
                    $(document).trigger('vv-kroom-info-got', result);
                }.bind(this));
            },
            getUserInfo: function () {
                // 获取用户ID
                vvliveBridgeObj.b(function (result) {
                    var data = result.data;
                    window.VV_LIVING_USERINFO = data;
                    $(document).trigger('vv-user-info-got', data);
                });
            },
            // 实时更新
            updateInfo: function () {
                window.handleRoomActivityInfo = function (res) {
                    var data;
                    if (_isAndroid) {
                        try {
                            data = JSON.parse(res);
                        } catch (e) {
                            data = res;
                        }
                    } else {
                        data = res;
                    }
                    window.VV_ACTIVITY_DATA = data;
                    $(document).trigger('vv-kroom-data-push', data);
                };
                vvliveBridgeObj.c();

            },
            //获取当前正在显示的小页面个数
            getWebLength: function () {
                var $slides = $('.swiper-wrapper .swiper-slide');
                var len = 0;
                for (var i = 0; i < $slides.length; i++) {
                    if ($slides.eq(i).css('display') == 'block') {
                        len += 1;
                    }
                }
                return len;
            }
        };
        window.onKroomInfoGot = function (fn) {
            if (window.VV_LIVING_INFO) {
                fn(window.VV_LIVING_INFO);
            } else {
                $(document).on('vv-kroom-info-got', function (event, data) {
                    fn(data);
                })
            }
        };
        window.onUserInfoGot = function (fn) {
            if (window.VV_LIVING_USERINFO) {
                fn(window.VV_LIVING_USERINFO);
            } else {
                $(document).on('vv-user-info-got', function (event, data) {
                    fn(data);
                })
            }
        };
        window.onKroomDataPush = function (fn) {
            if (VV_ACTIVITY_DATA) {
                fn(window.VV_ACTIVITY_DATA);
            } else {
                $(document).on('vv-kroom-data-push', function (event, data) {
                    fn(data);
                })
            }
        };
        //检查有几个slide，据此隐藏或者展示小窗口
        window.checkSlides = function () {
            var len = managerWeb.getWebLength && managerWeb.getWebLength();
            if (len === 0) {
                //隐藏view
                vvliveBridgeObj.hideKRoomAd({
                    positionX: 0,
                });
                managerWeb.putButtonLeft && managerWeb.putButtonLeft();
            } else {
                //展示 view
                vvliveBridgeObj.showKRoomAd({
                    positionX: -152,
                });
                managerWeb.putButtonRight && managerWeb.putButtonRight();
            }
        };
        $(document).ready(function () {
            managerWeb.init();
        });

    </script>
    
    <script>
        // setInterval(v=>{
        //     1000
        // })
        // $('.rankValue').text(Date.now().toString().slice(-3))
        setRandom = function(){
            $('.rankValue').text(Date.now().toString().slice(-3))
            setTimeout(setRandom, 2000 + Math.random() * 500)
        }
        setRandom();
    </script>
