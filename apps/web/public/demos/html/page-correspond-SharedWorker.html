<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<script>
	  // 初始化
	  var vConsole = new VConsole();
	  console.log('Hello world');
	</script>
	<title>页面通信SharedWorker测试</title>
</head>
<body>
	<button id="sendMsg">发送</button>
	<script type="text/javascript">
		// 这段代码是必须的，打开页面后注册SharedWorker，显示指定worker.port.start()方法建立与worker间的连接
	    let worker
	    if (typeof Worker === "undefined") {
	      alert('当前浏览器不支持webworker')
	    } else {
	      worker = new SharedWorker('../js/page-correspond-worker.js')
	      worker.port.addEventListener('message', (e) => {
	        console.log('来自worker的数据：', e)
	      }, false)
	      worker.port.start()
	      window.worker = worker
	    }
		// 获取和发送消息都是调用postMessage方法，我这里约定的是传递'get'表示获取数据。
		window.worker.port.postMessage('get')
		window.worker.port.postMessage('发送信息给worker')

		document.querySelector('#sendMsg').addEventListener('click', e=>window.worker.port.postMessage(Math.random()))
	</script>

</html>
