<body>
	<div id="app">
		<el-table
	      :data="computedList"
	      style="width: 100%">
	      <el-table-column
	        prop="id"
	        sortable
	        label="ID">
	      </el-table-column>
	      <el-table-column
	        prop="nickname"
	        sortable
	        label="名称">
	      </el-table-column>
	      <el-table-column
	        prop="level"
	        sortable
	        label="等级">
	      </el-table-column>
	      <el-table-column
	        prop="rank"
	        sortable
	        label="排名">
	      </el-table-column>
	      <el-table-column
	        prop="desc"
	        sortable
	        width="300"
	        label="描述">
	      </el-table-column>
	      <el-table-column
	        prop="memberCount"
	        sortable
	        label="成员数">
	      </el-table-column>
	      <el-table-column
	        prop="adType"
	        sortable
	        label="adType">
	      </el-table-column>
	    </el-table>
	</div>

	<script type="text/javascript">
		new Vue({
			el: '#app',
			data(){
				return {
					list: []
				}
			},
			computed:{
				computedList(){
					return this.list
				}
			},
			created(){
				fetch('/static/json/herook.json')
					.then(v=>v.json())
					.then(v=>{
						this.list = v
						// console.log(v)
					})
			}
		})
	</script>
