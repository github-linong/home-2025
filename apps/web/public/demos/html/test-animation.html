		/* 规定动画，改变y轴偏移距离*/
		@keyframes animation-y {
		  0%{
		   transform:  translate(-50%, 100px) scale(0);
		  }
		  50%{
		   transform:  translate(-50%, -100px) scale(1.5);
		  }
		  100%{
		    transform:  translate(-50%, -300px) scale(1.5);
		  }
		}
		/* 规定动画，改变x轴偏移距离 */
		@keyframes animation-x {
		  0%{
		    margin-left: 0px;
		  }
		  25%{
		    margin-left: 25px;
		  }
		  75%{
		    margin-left: -25px;
		  }
		  100%{
		    margin-left: 0px;
		  }
		}
		/* 规定动画，改变x轴偏移距离 */
		@keyframes animation-x-1 {
		  0%{
		    transform: translateX(0px);
		  }
		  25%{
		    transform: translateX(25px);
		  }
		  75%{
		    transform: translateX(-25px);
		  }
		  100%{
		    transform: translateX(0px);
		  }
		}
		/* 规定动画，隐藏效果 */
		@keyframes animation-opacity {
		  0%{
		    opacity: 0;
		  }
		  5%{
		    opacity: 1;
		  }
		  50%{
		    opacity: 1;
		  }
		  90%{
		    opacity: 0;
		  }
		  100%{
		    opacity: 0;
		  }
		}
		.bubble {
		  opacity: 0;
		  /*animation: animation-x 3s -2s linear infinite,animation-y 4s 0s linear 1;*/
		  animation: animation-x 3s -2s linear infinite,animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;
		}
		.bubble--1 {
		  /*animation: animation-x 3s 0s linear infinite,animation-y 4s 0s linear 1;*/
		  animation: animation-x 3s -1s linear infinite,animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;
		}
		.bubble--2 {
		  /*animation: animation-x 3s 0s linear infinite,animation-y 4s 0s linear 1;*/
		  animation: animation-x 3s 0s linear infinite,animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;
		}

		  animation: animation-x 3s .5s linear infinite,animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;
		}
		.bubble--4 {
		  /*animation: animation-x 3s 0s linear infinite,animation-y 4s 0s linear 1;*/
		  animation: animation-x 3s -1.5s linear infinite,animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;
		}

		.bubble-1 {
		  opacity: 0;
		  animation: animation-y 4s 0s linear infinite,animation-opacity 4s 0s linear infinite;

		.bubble-1--1 {

		.bubble-1--2 {
