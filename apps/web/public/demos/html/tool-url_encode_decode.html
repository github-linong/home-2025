	<meta charset="utf-8">
	<title>URL 编码/解码 | lilnong.top</title>
	<meta name="keywords" content="URL 编码/解码,URL编码,URL解码">
	<meta name="description" content="对URL编码，对URL解码。提供不同的强度编解码。">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>

	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
</head>
<body>
	<div id="app">
		<div class="input-wrap">
			<label>url</label><textarea v-model="val" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>encodeURI</label><textarea :value="encodeURI" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>encodeURIComponent</label><textarea :value="encodeURIComponent" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>escape</label><textarea :value="escape" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>decodeURI</label><textarea :value="decodeURI" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>decodeURIComponent</label><textarea :value="decodeURIComponent" name="" ></textarea>
		</div>
		<div class="input-wrap">
			<label>unescape</label><textarea :value="unescape" name="" ></textarea>
		</div>
	</div>
	<style type="text/css">
		.input-wrap{
			display: flex;
		}
		.input-wrap textarea{
			flex: 1;
			min-height: 4em;
			margin-bottom: 10px;
		}
		.input-wrap label{
			width: 12em;display: inline-block;
			text-align: right;
		}
		.input-wrap label:after{
			content: ':'
		}
	</style>
	<script type="text/javascript">
		new Vue({
			el: '#app',
			data(){
				return {
					val: ''
				}
			},
			computed:{
				encodeURI(){
					try{
						return encodeURI(this.val)
					}catch(e){
						return e
					}
				},
				encodeURIComponent(){
					try{
						return encodeURIComponent(this.val)
					}catch(e){
						return e
					}
				},
				escape(){
					try{
						return escape(this.val)
					}catch(e){
						return e
					}
				},
				decodeURI(){
					try{
						return decodeURI(this.val)
					}catch(e){
						return e
					}
				},
				decodeURIComponent(){
					try{
						return decodeURIComponent(this.val)
					}catch(e){
						return e
					}
				},
				unescape(){
					try{
						return unescape(this.val)
					}catch(e){
						return e
					}
				},
			}
		})
	</script>
