	  // 初始化

	<title>Sortable 测试</title>
</head>
<body>
	<p>https://github.com/SortableJS/Sortable</p>
	<div id="grid" class="row">
		<h4 class="col-12">Grid Example</h4>
		<div id="gridDemo" class="col"></div>
	</div>

	<style>
		*{
		    user-select: none;
		}
		.col {
		    -ms-flex-preferred-size: 0;
		    flex-basis: 0;
		    -ms-flex-positive: 1;
		    flex-grow: 1;
		    max-width: 80%;}
	    .grid-square {
	        width: 25%;
	        display: inline-block;
	        background-color: #fff;
	        border: solid 1px rgb(0,0,0,0.2);
	        padding: 10px;
	        box-sizing: border-box;
	    }
	    .blue-background-class {
	    	background-color: #C8EBFB;
	    }
	</style>
	<script>

	    var str = ''
	    for(var i = 0;i < 100;i++){
	        str += '<div class="grid-square">Item '+i+'</div>';
	    }
	    gridDemo.innerHTML = str;

	    var el = document.getElementById('gridDemo');
	    Sortable.create(el,{
	    	delay: 1,
			animation: 150,
			ghostClass: 'blue-background-class'
		});
	</script>
