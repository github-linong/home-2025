	<script src="https://cdn.bootcdn.net/ajax/libs/element-ui/2.13.2/index.js"></script>

<body>
	<div id="app">
		<el-autocomplete
			class="inline-input"
			v-model="state1"
			:fetch-suggestions="querySearch"
			placeholder="请输入内容"
			@select="handleSelect"
		></el-autocomplete>
	</div>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					state1: ''
				}
			},
			methods: {
				querySearch(queryString, cb) {
					// var restaurants = this.restaurants;
					// var results = queryString ? restaurants.filter(this.createFilter(queryString)) : restaurants;
					// // 调用 callback 返回建议列表的数据
					// cb(results);
					axios('/tapi/el_autocomplete?keywords='+queryString)
						.then(v=>{
							cb(v.data.data)
						})
				},
				handleSelect(item) {
					console.log(item);
				}
			}
		})
	</script>
