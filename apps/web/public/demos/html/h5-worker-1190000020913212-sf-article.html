	<script type="text/javascript">
		wk = new Worker('/static/workers/1190000020913212.js');
		wkCallback = new Worker('/static/workers/1190000020913212-callback.js');
		swk = new SharedWorker('/static/workers/1190000020913212-SharedWorker.js');
		swk.port.start();
		swkPIP = new SharedWorker('/static/workers/1190000020913212-SharedWorker-pip.js');
		swkPIP.port.start();
	</script>
	<script type="text/javascript">
		str = '1'
		function reportString(str){
			return str+str
		}
		for(var i = 0 ; i < 21; i++){
			console.time('reportString');
			str = reportString(str);
			console.timeEnd('reportString');
		}
		demo1.addEventListener('click', function(){
			console.time('reportString');
			console.log(str.length, str.split('').join('+').length)
			console.timeEnd('reportString');
		})
		demo2.addEventListener('click', function(){
			wk.postMessage(str)
			// console.time('reportString');
			// console.log(str.length, str.split('').join('+').length)
			// console.timeEnd('reportString');
		})
		wkCallback.onmessage = function(data){
			console.log.apply(console, data.data)
			console.timeEnd('reportString'+data.data[2]);
		}
		demo3.addEventListener('click', function(){
			var random = Math.random();
			wkCallback.postMessage([str, random])
			console.time('reportString'+random);
		})

		swk.port.addEventListener('message', function(e){
			console.log(e.data)
		})
		demo4.addEventListener('click', function(){
			var args = [Date.now(), Math.random(), demo4Input.value];
			swk.port.postMessage(args)
			console.log(args)
		})
		swkPIP.port.addEventListener('message', function(e){
			console.log(e.data)
		})
		demo5.addEventListener('click', function(){
			var args = {type: 'private',data:[Date.now(), Math.random(), demo4Input.value]};
			swkPIP.port.postMessage(args)
			console.log(args)
		})
		demo6.addEventListener('click', function(){
			var args = {type: 'public',data:[Date.now(), Math.random(), demo4Input.value]};
			swkPIP.port.postMessage(args)
			console.log(args)
		})
		demo7.addEventListener('click', function(){
			var args = {type: 'publicNoSelf',data:[Date.now(), Math.random(), demo4Input.value]};
			swkPIP.port.postMessage(args)
			console.log(args)
		})
	</script>
