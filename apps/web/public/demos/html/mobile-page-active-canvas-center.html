		<canvas width="750" height="1335" style="min-width: 100vw;min-height: 100vh;width: 200px;height: 200px;position: fixed;left: 50%;top: 50%;transform: translate(-50%, -50%);"></canvas>
		<script type="text/javascript">
			cvs = document.querySelector('canvas');
			ctx = cvs.getContext('2d')
			imgs = [
				{url: '/static/img/20190515/index-title.png',position:{top:40,left: 66,z: 2}},
				{url: '/static/img/20190515/index-close.png',position:{top:40+35*7.5,z: 1}},
				{url: '/static/img/20190515/index-foot.png',position:{top:1004,z: 2}}
			].sort((n,m)=>n.z-m.z)
			var draw = function(){
				imgs.forEach(v=>{
					if(v.img){
						ctx.drawImage(v.img,v.position.left||0, v.position.top || 0);
					}
				})
			}
			imgs.forEach(v=>{
				let img = new Image();
				img.onload = function(){
					v.img = img;
					draw();	
				}
				img.src = v.url
			})
		</script>
