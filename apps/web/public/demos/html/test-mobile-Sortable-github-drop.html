<body>
	<p>https://github.com/SortableJS/Sortable</p>
	<ul id="sortable">
	</ul>

	<style>
		*{
		    user-select: none;
		}
		#sortable { list-style-type: none; margin: 0; padding: 0; width: 60%; }
		#sortable li { margin: 0 3px 3px 3px; padding: 0.4em; padding-left: 1.5em; font-size: 1.4em; height: 18px; }
		#sortable li span { position: absolute; margin-left: -1.3em; }
	</style>
	<script>

	    var str = ''
	    for(var i = 0;i < 20;i++){
	        str += '      <li class="ui-state-default"><span class="ui-icon ui-icon-arrowthick-2-n-s"></span>Item '+i+'</li>';
	    }
	    sortable.innerHTML = str;

	    var el = document.getElementById('sortable');
	    Sortable.create(el);
	</script>
