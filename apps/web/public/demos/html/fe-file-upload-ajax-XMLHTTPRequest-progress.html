	  var vConsole = new VConsole();

	<style type="text/css">
		*{padding:0;margin:0;}
		input{
			width:0;height:0;overflow: hidden;
		}
		img{
			/*width: 100vw;*/display: block;
			/*line-height: 30vh;min-height: 30vh;*/
			max-width: 100vw;min-height: 100px;line-height: 100px;
			text-align: center;background-color: #ccc
		}
	</style>
	<title>前端上传进度条</title>
</head>
<body>
	<div id="app">
		<input-date disabled/>
	</div>
	<script type="text/javascript">
		// new Vue({
		// 	el: '#app',
		// })
	</script>
	<label for="file">
		<img alt="请选择图片上传" id="prview">
		<input id="file" type="file" name="file" accept="image/*" capture="camera">
	</label>

	<script type="text/javascript">


		var _prviewDOM = document.querySelector('#prview');
		var _fileDOM =document.querySelector('#file')
		_fileDOM.onchange = function(){
			if(this.value!=''){
				var _file = this.files[0];

				var formData = new FormData;
				formData.append('file', _file)
				formData.append('opacid', 'LN')

				var xhr = new XMLHttpRequest();

				xhr.open('post', '/upload');

				xhr.onreadystatechange = (e)=>{
					console.log('onreadystatechange', e)
				}
				xhr.onprogress = (e)=>{//下载的事件
					console.log("progress", e)
				};
				xhr.upload.onprogress = (e)=>{//上传的事件
					console.log("upload.progress", e)
				};
				xhr.send(formData);

				this.value = '';
			}
		}
	</script>
	<script>

		  s.parentNode.insertBefore(hm, s);

	</script>
	</body>
</html>
