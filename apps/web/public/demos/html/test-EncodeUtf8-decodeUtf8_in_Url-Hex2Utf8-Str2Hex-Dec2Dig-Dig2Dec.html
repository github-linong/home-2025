	        function Hex2Utf8(s) {
	            var retS = "";
	            var tempS = "";
	            var ss = "";
	            if (s.length == 16) {

	                    retS += sss.charAt(Dig2Dec(ss.substring(0, 4)));
	                    retS += sss.charAt(Dig2Dec(ss.substring(4, 8)));
	                }

	            var c = "";

	            var s = "";
	            var n2 = 0;
	            for (var i = 0; i < 4; i++) {
	                n2 = Math.pow(2, 3 - i);
	                if (n1 >= n2) {
	                    s += '1';
	                    n1 = n1 - n2;
	                } else
	                    s += '0';
	            }
	            return s;
	        }

	            if (s.length == 4) {

	                    retV += eval(s.charAt(i)) * Math.pow(2, 3 - i);
	                }
	                return retV;
	            }
