<body>
	<div id="app">
		<span class="btn">btn1</span>
		<span class="btn">btn2</span>
		<video 
			id="video1" 
			style="height: 150px;width: 150px;" 
			src="https://www.lilnong.top/static/video/v1705221.mp4" 
			controls
			preload="auto" 
			webkit-playsinline="" 
			playsinline="" 
			x5-video-player-fullscreen="false" 
			x5-video-player-type="false"
			autoplay></video>
		<canvas id="canvas"
		width="150"
		height="150"
		style="height: 150px;width: 150px;"></canvas>
	</div>
	<style>
		#app{
			position: relative;
			display: inline-block;
		}
		.btn{
			padding: 10px;
			position: absolute;
		}
		.btn:nth-child(1){
			right: 0;
			bottom: 0;
		}
		.btn:nth-child(2){
			right:30px;
			bottom:30px;
		}
		.btn:nth-child(3){
			right:60px;
			bottom:60px;
		}
	</style>
	<script>
		var ctx = canvas.getContext('2d')
		paintCanvas = function(){
			ctx.drawImage(video1, 0, 0, 150, 150)
		}
		requestAnimationFrameHandler = function(){
			requestAnimationFrame(()=>{
				requestAnimationFrameHandler();
			})
			paintCanvas()
		}
		requestAnimationFrameHandler()
	</script>
	<script>
		$('.btn').click(function(){
			console.log('单击了', this.innerText)
		})
	</script>
