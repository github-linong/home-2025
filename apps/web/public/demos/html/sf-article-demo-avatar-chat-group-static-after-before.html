<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<style type="text/css">
		.avatar-view{
			width: 100px;height: 100px;position: relative;
		}
	      .avatar-view .avatar-image.avatar-image--1{
	        width: 90%;height: 90%;
	      }
	      .avatar-view .avatar-image.avatar-image--2{
	        width: 45%;height: 45%;
	      }
	      .avatar-view .avatar-image.avatar-image--3{
	        width: 30%;height: 30%;
	      }
		body{
		  padding: 10px;
		}
		.avatar-warp{
		  display: flex;
		  flex-wrap: wrap;
		}
		.list-view{
		  width: 50px;height:50px;vertical-align:top;
		}
		.avatar-view--2{
			padding-top: 22.5%;
		}
		.avatar-view--3:before{
			width: 22.5%;content: '';display: inline-block;
		}
		.avatar-view--5{
			padding-top: 15%;
		}
		.avatar-view--5:before{
			width: 15%;content: '';display: inline-block;
		}
		.avatar-view--6{
			padding-top: 15%;
		}
		.avatar-view--7:before{
			width: 41%;content: '';display: inline-block;
		}
		.avatar-view--7 .avatar-image:nth-child(1){
			position: relative;
		    left: -11%;
		}
		.avatar-view--8:before{
			width: 15%;content: '';display: inline-block;
		}
		    
	</style>
</head>
<body>
	<div id="app">
		<div id="app">
		  <img :src="item" class="list-view" v-for="item in ori" alt="" />
		  <div class="avatar-warp" key="avatar-b">
		    <avatar :imgs="item" v-for="item in list"></avatar>
		  </div>
		</div>
	</div>
	<script type="text/javascript">
		Vue.component('avatar', {
		  template: `
		  <div class="avatar">
		    <div class="avatar-title">avatar {{this.list.length}}</div>
		    <div class="avatar-view" :class="['avatar-view--'+list.length]">
		      <img class="avatar-image" :class="className" :src="item" v-for="item in list"/>
		    </div>
		  </div>
		`,
		  props:['imgs'],
		  data(){
		    return {};
		  },
		  computed:{
		    list(){
		      if(this.imgs){
		        if(typeof this.imgs === 'string'){
		          return [this.imgs]//.reverse()
		        }else if(Array.isArray(this.imgs)){
		          return this.imgs.slice(0,9)//.reverse();
		        }
		      }
		      return ['https://www.lilnong.top/static/img/Jellyfish.jpg']
		    },
		    className(){
		      return [{
						'avatar-image--1': this.list.length == 1,
		        'avatar-image--2': this.list.length > 1 && this.list.length<5,
		        'avatar-image--3': this.list.length > 4,
		      }]
		    }
		  }
		});
		new Vue({
		  el: '#app',
		  data: {
		    list:[
		      [],//1
		      [],//2
		      [],//3
		      [],//4
		      [],//5
		      [],//6
		      [],//7
		      [],//8
		      [],//9
		    ],
		    ori: new Array(10).fill(1).map((v,i)=>'https://www.lilnong.top/static/img/avator/avator-'+(i+11)+'.jpg')
		  },
		  created(){
		    this.list.forEach((v, i)=>{
		      v.push(...this.ori.slice(0, i+1));
		    })
		  }
		})
	</script>

</body>
</html>
