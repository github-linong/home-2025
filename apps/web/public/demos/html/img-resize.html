		<img src="" id="viewSource" alt="">
	</div>
	<script>
		function imageResize(file, width, height){
			return new Promise((resolve, reject)=>{
				width = width || 1024;
				height = height || 1024;
				var blobUrl = URL.createObjectURL(file);
				var imgEl = new Image();
				imgEl.src = blobUrl;
				imgEl.onload = function(){
					// if( imgEl.naturalWidth > width){

					// }
					var widthScale = imgEl.naturalWidth / width
					var heightScale = imgEl.naturalHeight / height
					var maxScale = Math.max(widthScale, heightScale);
					var canvas = document.createElement('canvas');
					var ctx = canvas.getContext('2d');
					if(maxScale > 1){
						canvas.width=width;
						canvas.height=height;
						ctx.drawImage(imgEl, 0, 0, imgEl.naturalWidth / maxScale >> 0,imgEl.naturalHeight / maxScale >> 0)
					}else{
						canvas.width=imgEl.naturalWidth;
						canvas.height=imgEl.naturalHeight;
						ctx.drawImage(imgEl, 0, 0)
					}
					canvas.toBlob(v=>{
						resolve(v);
					}, 'image/jpg')
					
				}
				imgEl.onerror = function(){
					reject()
				}
			})
		}
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file)
			formData.append('type', 'foreground')
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.responseType = 'json'
			xhr.open('post', '/upload_baidu_classify');
			xhr.onreadystatechange = onreadystatechange;
			xhr.send(formData);
		}
		file1.addEventListener('change', function(){
			var _time = Date.now();
			if(file1.files.length){
				var imgFile = file1.files[0];
				return imageResize(imgFile).then(v=>viewSource.src = URL.createObjectURL(v))
				uploadFile(imgFile, function(e){}, function(e){
					// console.log('onreadystatechange', e)
					if(e.target.readyState == 4 && e.target.status == 200){
						viewSource.src = 'data:image/jpeg;base64,'+e.target.response.data.foreground
					}
				})
			}
		})
	</script>
