	<script>
		function imageResize(file, width, height, isBase64){
			return new Promise((resolve, reject)=>{
				width = width || 1024;
				height = height || 1024;
				var blobUrl = URL.createObjectURL(file);
				var imgEl = new Image();
				imgEl.src = blobUrl;
				imgEl.onload = function(){
					// if( imgEl.naturalWidth > width){

					// }
					var widthScale = imgEl.naturalWidth / width
					var heightScale = imgEl.naturalHeight / height
					var maxScale = Math.max(widthScale, heightScale);
					var canvas = document.createElement('canvas');
					var ctx = canvas.getContext('2d');
					if(maxScale > 1){
						canvas.width=width;
						canvas.height=height;
						ctx.drawImage(imgEl, 0, 0, imgEl.naturalWidth / maxScale >> 0,imgEl.naturalHeight / maxScale >> 0)
					}else{
						canvas.width=imgEl.naturalWidth;
						canvas.height=imgEl.naturalHeight;
						ctx.drawImage(imgEl, 0, 0)
					}
					if(isBase64){
						return resolve(canvas.toDataURL('image/jpeg'))
					}
					return canvas.toBlob(v=>{
						resolve(v);
					})
					
				}
				imgEl.onerror = function(){
					reject()
				}
			})
		}
		function _uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file)
			var xhr = new XMLHttpRequest();
			xhr.open('post', '/upload_any');
			xhr.send(formData);
		}
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			// formData.append('file1', file1.files[0])
			// formData.append('file2', file2.files[0])
			formData.append('json', (JSON.stringify({
				image_template: {
					image: (image_template.src.replace('data:image/jpeg;base64,','').replace('data:image/png;base64,','')),
					image_type: 'BASE64'
				},
				merge_degree: 'HIGH',
				image_target: {
					image: (image_target.src.replace('data:image/jpeg;base64,','').replace('data:image/png;base64,','')),
					image_type: 'BASE64'
				}, 
			})))
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.responseType = 'json'
			xhr.open('post', '/upload_baidu_face_merge_any');
			xhr.onreadystatechange = function(e){
				if(e.target.readyState == 4 && e.target.status == 200){
					viewSource.src = 'data:image/jpeg;base64,'+e.target.response.data.result.merge_image
				}
			};
			xhr.send(formData);
		}
		file1.addEventListener('change', function(){
			if(file1.files.length){
				var imgFile = file1.files[0];
				_uploadFile(imgFile)
				return imageResize(imgFile, 1024, 1024, true).then(v=>{
					image_template.src = v
				})
			}
		})
		file2.addEventListener('change', function(){
			if(file2.files.length){
				var imgFile = file2.files[0];
				_uploadFile(imgFile)
				return imageResize(imgFile, 1024, 1024, true).then(v=>{
					image_target.src = v
				})
			}
		})
		btn1.addEventListener('click', function(){
			if(image_target.src && image_template.src){
				uploadFile();
			}else{
				alert('请上传 模板图和合成图')
			}
		})
	</script>
