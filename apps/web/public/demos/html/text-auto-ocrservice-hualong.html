	<script type="text/javascript">
		document.querySelector('input').onchange = function(e){
			if(!this.files.length) return 
			var filereader = new FileReader();
			filereader.readAsDataURL(document.querySelector('input').files[0])
			filereader.onload = (e)=>{
				// console.log(filereader.result)
				xhr = new XMLHttpRequest();
				xhr.open('post', 'https://ocrapi-document.taobao.com/ocrservice/document')
				xhr.setRequestHeader('Authorization', 'APPCODE 15ff5349cc744685b9b59ce302d2dfe2')
				xhr.send(JSON.stringify({img:filereader.result}))
				xhr.onreadystatechange = ()=>{
					if(xhr.readyState == 4 && xhr.status == 200) document.querySelector('textarea').value = JSON.parse(xhr.response).prism_wordsInfo.map(v=>v.word).join('\n')
				}
			}
		}
