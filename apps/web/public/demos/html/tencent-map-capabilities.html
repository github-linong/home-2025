<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>腾讯地图 · 能力测试台</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.qq.com https://*.gtimg.com https://*.lbs.net.cn https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://*.qq.com https://*.gtimg.com https://*.lbs.net.cn https://apis.map.qq.com; connect-src 'self' blob: https: wss: ws:; worker-src 'self' blob: data:; frame-src 'self' https:;" />
  <style>
    :root {
      --bg: #070b16;
      --bg2: #0c1326;
      --panel: rgba(18, 26, 48, 0.72);
      --panel-solid: #111a30;
      --border: rgba(120, 170, 230, 0.18);
      --text: #e8eefc;
      --muted: #8da3c7;
      --accent: #4ea1ff;
      --accent2: #7c5cff;
      --ok: #36d399;
      --warn: #fbbd23;
      --err: #f87272;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --r: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 12% -8%, rgba(78, 161, 255, 0.16), transparent 60%),
        radial-gradient(1000px 520px at 92% 4%, rgba(124, 92, 255, 0.14), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      background-attachment: fixed;
      min-height: 100%;
      padding: 18px clamp(14px, 4vw, 40px) 40px;
    }
    a { color: var(--accent); }

    /* 顶栏 */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      max-width: 1120px; margin: 0 auto 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 16px rgba(78, 161, 255, 0.7);
    }
    .brand h1 { font-size: clamp(20px, 3.4vw, 28px); margin: 0; letter-spacing: 0.5px; font-weight: 700; }
    .spacer { flex: 1; }
    .btn {
      font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04); color: var(--text);
      padding: 9px 14px; min-height: 44px; transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.09); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-icon { background: rgba(255, 255, 255, 0.05); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent; color: #fff; font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .wrap { max-width: 1120px; margin: 0 auto; }

    /* 能力卡片网格 */
    .grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .cap-card {
      text-align: left; width: 100%;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
      padding: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow); cursor: pointer; color: var(--text);
      transition: border-color 0.2s ease, transform 0.12s ease;
    }
    .cap-card:hover { border-color: rgba(78, 161, 255, 0.5); transform: translateY(-2px); }
    .cap-card.active { border-color: var(--accent); }
    .cap-card .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cap-card .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; letter-spacing: 0.3px;
    }
    .tag.ok { background: rgba(54, 211, 153, 0.16); color: var(--ok); }
    .tag.proxy { background: rgba(251, 189, 35, 0.16); color: var(--warn); }
    .cap-card .desc { color: var(--muted); font-size: 13px; margin: 6px 0 12px; min-height: 34px; }
    .quota { font-size: 12px; color: var(--muted); }
    .quota .bar { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); margin: 6px 0 4px; overflow: hidden; }
    .quota .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .quota .meta { display: flex; justify-content: space-between; }
    .used { color: var(--ok); }

    /* 测试面板 */
    .panel {
      margin-top: 16px; background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r); padding: 18px; box-shadow: var(--shadow);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .panel h2 { margin: 0 0 4px; font-size: 18px; }
    .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .field input, .field select {
      font: inherit; color: var(--text); background: rgba(8, 12, 24, 0.6);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 44px;
    }
    .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .res {
      margin-top: 16px; background: rgba(4, 8, 18, 0.7); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; overflow: auto; max-height: 420px;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-all;
    }
    .res.empty { color: var(--muted); }
    .res .k { color: var(--accent); }
    .res .ok { color: var(--ok); }
    .res .err { color: var(--err); }
    .res .warn { color: var(--warn); }
    .res img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
    .res .url { color: var(--accent2); word-break: break-all; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }

    /* Key 抽屉 */
    .sheet-mask {
      position: fixed; inset: 0; background: rgba(2, 5, 12, 0.6); z-index: 50;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
      width: min(520px, 94vw); background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 18px 18px 0 0; padding: 22px; z-index: 51; box-shadow: var(--shadow);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .sheet.show { transform: translate(-50%, 0); }
    .sheet h3 { margin: 0 0 6px; }
    .sheet p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .sheet input {
      width: 100%; font: inherit; color: var(--text); background: rgba(8, 12, 24, 0.6);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 44px;
      margin-bottom: 12px;
    }

    /* 测试 Modal */
    .test-mask {
      position: fixed; inset: 0; background: rgba(2, 5, 12, 0.62); z-index: 70;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .test-mask.show { opacity: 1; pointer-events: auto; }
    .test-modal {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(0.98);
      width: min(560px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
      background: var(--panel-solid); border: 1px solid var(--border);
      border-radius: 18px; z-index: 71; box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.26s cubic-bezier(0.2,0.8,0.2,1);
    }
    .test-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .test-modal .tm-head {
      flex: none; display: flex; align-items: flex-start; gap: 12px;
      padding: 20px 22px 12px; border-bottom: 1px solid var(--border);
    }
    .test-modal .tm-head h2 { margin: 0; font-size: 18px; }
    .test-modal .tm-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 5px; line-height: 1.5; }
    .test-modal .tm-close {
      margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(8,12,24,0.5); color: var(--text);
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .test-modal .tm-close:hover { border-color: var(--accent); }
    .test-modal .tm-body { flex: 1 1 auto; padding: 18px 22px; overflow: auto; }
    .test-modal .tm-foot { flex: none; padding: 14px 22px 20px; border-top: 1px solid var(--border); }
    .test-modal .form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .test-modal .res { max-height: 320px; }

    .toast {
      position: fixed; left: 50%; top: 18px; transform: translate(-50%, -12px);
      background: rgba(8, 14, 30, 0.92); border: 1px solid var(--border);
      color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 13px;
      z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .foot { max-width: 1120px; margin: 26px auto 0; color: var(--muted); font-size: 13px; text-align: center; }
    .foot code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    /* 隐藏的 GL 地图容器（仅供 TMap.service 使用，不参与展示） */
    #bgmap { position: fixed; left: -9999px; top: 0; width: 100px; height: 100px; opacity: 0; pointer-events: none; }

    /* Web / JS 端能力（地图渲染类） */
    .tag.js { background: rgba(167,139,250,0.16); color: #c4b5fd; border-color: rgba(167,139,250,0.42); }
    .test-modal.wide { width: min(764px, 96vw); }
    .cap-root { display: flex; flex-direction: column; gap: 12px; }
    .cap-map { width: 100%; height: 384px; border-radius: 12px; overflow: hidden; background: #0b1430; border: 1px solid var(--border); }
    .cap-ctl { display: flex; flex-direction: column; gap: 8px; }
    .cap-ctl .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .cap-ctl .lbl { font-size: 12.5px; color: var(--muted); }
    .cap-ctl input, .cap-ctl select, .cap-ctl textarea {
      width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(8,12,24,0.55); color: var(--text); font-size: 14px;
    }
    .cap-ctl textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; resize: vertical; }
    .cap-ctl input:focus, .cap-ctl select:focus, .cap-ctl textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cap-msg { font-size: 13px; color: var(--text); line-height: 1.6; }
    .cap-msg .hint { color: var(--muted); font-size: 12px; }
    .cap-msg .url { color: var(--accent2); word-break: break-all; }
    .tabs { display: flex; gap: 8px; }
    .tab {
      flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(8,12,24,0.5); color: var(--muted); cursor: pointer; font-size: 13px;
    }
    .tab.on { background: rgba(45,212,191,0.16); color: var(--accent); border-color: rgba(45,212,191,0.5); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pick-out { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--accent); }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>地图能力测试</h1>
    </div>
    <div class="spacer"></div>
    <button id="keyBtn" class="btn btn-icon" aria-label="设置腾讯地图 Key" title="设置腾讯地图 Key">⚙</button>
  </header>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="foot">
    腾讯地图能力测试台，共 <code>92</code> 项（WebService REST <code>85</code> + Web/JS 端 <code>7</code>）。
    <span class="used">绿色</span> 为浏览器可直连测试；<span style="color:var(--warn)">黄色</span> 为 WebService REST，浏览器直连受 CORS 限制，需经你自己的服务端代理转发（页面会给出完整请求 URL）；<span style="color:#c4b5fd">紫色</span> 为 Web/JS 端能力，浏览器实时渲染（需为内置 JS Key 配置当前域名白名单）。
  </div>

  <div id="bgmap" aria-hidden="true"></div>

  <!-- Key 设置抽屉 -->
  <div id="sheetMask" class="sheet-mask" aria-hidden="true"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">设置腾讯地图 Key</h3>
    <p>默认已内置一个 Key（仅前端 JS API 用途，靠域名白名单保护）。如需替换，填入你自己的 Key，仅存浏览器 localStorage，不上传。</p>
    <input id="keyInput" type="text" placeholder="输入腾讯地图 Key" spellcheck="false" autocomplete="off" />
    <div class="actions">
      <button id="keySave" class="btn btn-primary">保存</button>
      <button id="keyReset" class="btn">恢复默认</button>
      <button id="keyClose" class="btn">取消</button>
    </div>
  </section>

  <!-- 能力测试 Modal -->
  <div id="testMask" class="test-mask" aria-hidden="true"></div>
  <section id="testModal" class="test-modal" role="dialog" aria-modal="true" aria-labelledby="tmTitle" aria-hidden="true">
    <div class="tm-head">
      <div>
        <h2 id="tmTitle">能力测试</h2>
        <div class="sub" id="tmSub"></div>
      </div>
      <button class="tm-close" id="tmClose" aria-label="关闭测试">×</button>
    </div>
    <div class="tm-body" id="tmBody"></div>
    <div class="tm-foot" id="tmFoot"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var DEFAULT_KEY = "XNGBZ-MF3HD-EJP4Z-P2D7W-72HCK-ETBJ3";
      var LS_KEY = "tx_map_key_cap";
      function getKey() {
        try { var v = localStorage.getItem(LS_KEY); if (v) return v; } catch (e) {}
        return DEFAULT_KEY;
      }
      function setKey(v) { try { localStorage.setItem(LS_KEY, v); } catch (e) {} }
      function clearKey() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

      var $ = function (s) { return document.querySelector(s); };
      function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

      // 地图实例清理（切换/关闭能力时销毁，避免泄漏）
      var currentCleanup = null;
      function cleanupCurrent() {
        if (currentCleanup) { try { currentCleanup(); } catch (e) {} currentCleanup = null; }
      }

      var toastTimer = null;
      function toast(msg) {
        var t = $("#toast"); t.textContent = msg; t.classList.add("show");
        clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
      }

      // ---------- 坐标转换（纯算法，浏览器直连） ----------
      var PI = Math.PI, a = 6378245.0, ee = 0.00669342162296594323;
      function outOfChina(lat, lng) {
        return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
      }
      function transformLat(lng, lat) {
        var r = -100 + 2 * lng + 3 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
        r += (20 * Math.sin(6 * lng * PI) + 20 * Math.sin(2 * lng * PI)) * 2 / 3;
        r += (20 * Math.sin(lat * PI) + 40 * Math.sin(lat / 3 * PI)) * 2 / 3;
        r += (160 * Math.sin(lat / 12 * PI) + 320 * Math.sin(lat * PI / 30)) * 2 / 3;
        return r;
      }
      function transformLng(lng, lat) {
        var r = 300 + lng + 2 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
        r += (20 * Math.sin(6 * lng * PI) + 20 * Math.sin(2 * lng * PI)) * 2 / 3;
        r += (20 * Math.sin(lng * PI) + 40 * Math.sin(lng / 3 * PI)) * 2 / 3;
        r += (150 * Math.sin(lng / 12 * PI) + 300 * Math.sin(lng / 30 * PI)) * 2 / 3;
        return r;
      }
      function wgs84ToGcj02(lat, lng) {
        if (outOfChina(lat, lng)) return [lat, lng];
        var dLat = transformLat(lng - 105.0, lat - 35.0), dLng = transformLng(lng - 105.0, lat - 35.0);
        return [lat + dLat, lng + dLng];
      }
      function gcj02ToWgs84(lat, lng) {
        if (outOfChina(lat, lng)) return [lat, lng];
        var dLat = transformLat(lng - 105.0, lat - 35.0), dLng = transformLng(lng - 105.0, lat - 35.0);
        return [lat - dLat, lng - dLng];
      }
      function gcj02ToBd09(lat, lng) {
        var x = lng, y = lat, z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * PI);
        var th = Math.atan2(y, x) + 0.000003 * Math.cos(x * PI);
        return [z * Math.sin(th) + 0.006, z * Math.cos(th) + 0.0065];
      }
      function bd09ToGcj02(lat, lng) {
        var x = lng - 0.0065, y = lat - 0.006, z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * PI);
        var th = Math.atan2(y, x) - 0.000003 * Math.cos(x * PI);
        return [z * Math.sin(th), z * Math.cos(th)];
      }
      function convert(lat, lng, from, to) {
        var p = [lat, lng];
        if (from === "WGS84") { if (to === "GCJ02") p = wgs84ToGcj02(lat, lng); else if (to === "BD09") p = gcj02ToBd09(wgs84ToGcj02(lat, lng)[0], wgs84ToGcj02(lat, lng)[1]); }
        else if (from === "GCJ02") { if (to === "WGS84") p = gcj02ToWgs84(lat, lng); else if (to === "BD09") p = gcj02ToBd09(lat, lng); }
        else if (from === "BD09") { if (to === "GCJ02") p = bd09ToGcj02(lat, lng); else if (to === "WGS84") p = gcj02ToWgs84(bd09ToGcj02(lat, lng)[0], bd09ToGcj02(lat, lng)[1]); }
        return p;
      }

      // ---------- 地图服务（逆地址解析 / 地点搜索，客户端可用） ----------
      var revGeocoder = null, searchService = null, svcReady = false;
      function loadMapServices(key) {
        if (window.TMap && window.TMap.service) { initServices(); return; }
        var s = document.createElement("script");
        // Web/JS 端能力（绘制/测距/可视化）需要 tools + visualization 附加库
        s.src = "https://map.qq.com/api/gljs?v=1.exp&key=" + encodeURIComponent(key) + "&libraries=service,tools,visualization&callback=__txCapInit";
        window.__txCapInit = function () {
          try {
            new TMap.Map("bgmap", { center: new TMap.LatLng(39.9088, 116.3975), zoom: 12 });
            initServices();
          } catch (e) { console.warn("map services init failed", e); }
        };
        document.head.appendChild(s);
      }
      function initServices() {
        try { revGeocoder = new TMap.service.ReverseGeocoder({}); } catch (e) { revGeocoder = null; }
        try { searchService = new TMap.service.Search({ pageSize: 10, pageIndex: 1 }); } catch (e) { searchService = null; }
        svcReady = !!(revGeocoder && searchService);
      }

      // ---------- WebService REST 请求工具 ----------
      function wsUrl(path, params, key) {
        var u = "https://apis.map.qq.com" + path + "?key=" + encodeURIComponent(key);
        Object.keys(params || {}).forEach(function (k) {
          if (params[k] !== "" && params[k] != null) u += "&" + k + "=" + encodeURIComponent(params[k]);
        });
        return u;
      }
      function callWS(url) {
        return fetch(url).then(function (r) {
          return r.text().then(function (txt) {
            var j = null; try { j = JSON.parse(txt); } catch (e) { j = txt; }
            return { ok: r.ok, status: r.status, data: j, url: url };
          });
        }).catch(function (e) {
          return { ok: false, network: true, error: e && e.message ? e.message : String(e), url: url };
        });
      }

      // 经本地 api2 代理转发（Key 在服务端，规避 CORS）
      // 开发态（localhost/127.0.0.1，页面由 Astro :4321 提供）直连 api2 :3002；
      // 生产态（www.lilnong.top 等）用相对路径，由 nginx 反代到 api2。
      var PROXY_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")

              if (!f || !t) { msg("起点或终点坐标无效"); return; }
              msg("规划中…");
              if (line) try { line.setMap(null); } catch (e) {}
              line = new TMap.MultiPolyline({ map: capMap, geometries: [{ id: "r", paths: [new TMap.LatLng(f.lat, f.lng), new TMap.LatLng(t.lat, t.lng)] }] });
              capMap.setCenter(new TMap.LatLng((f.lat + t.lat) / 2, (f.lng + t.lng) / 2)); capMap.setZoom(11);
              proxyJSON("/ws/direction/v1/driving", { from: f.lat + "," + f.lng, to: t.lat + "," + t.lng }).then(function (res) {
                var d = res.data || {};
                if (d.status === 0 && d.result && d.result.routes && d.result.routes[0] && d.result.routes[0].polyline) {
                  var pts = decodePolyline(d.result.routes[0].polyline).map(function (p) { return new TMap.LatLng(p.lat, p.lng); });
                  if (line) try { line.setMap(null); } catch (e) {}
                  line = new TMap.MultiPolyline({ map: capMap, geometries: [{ id: "r", paths: pts }] });
                  var minLat = 1e9, maxLat = -1e9, minLng = 1e9, maxLng = -1e9;
                  pts.forEach(function (p) { minLat = Math.min(minLat, p.lat()); maxLat = Math.max(maxLat, p.lat()); minLng = Math.min(minLng, p.lng()); maxLng = Math.max(maxLng, p.lng()); });
                  try { capMap.fitBounds(new TMap.LatLngBounds(new TMap.LatLng(minLat, minLng), new TMap.LatLng(maxLat, maxLng))); } catch (e) {}
                  msg("✓ 真实驾车路线已绘制（" + pts.length + " 个路径点）");
                } else {
                  msg("代理返回 status=" + (d.status != null ? d.status : res.status) + "（多为 Key 未配 IP 白名单 110）。已用起终点示意连线，真实路网待白名单配置后生效。");
                }
              }).catch(function (e) { msg("请求失败：" + (e.message || e)); });
            };
          }
        },
        {
          id: "js-h5-pick", name: "H5 地图选点组件", quota: 0, mode: "js",
          desc: "类似微信「发送位置」：点击地图任意位置选取坐标并回传。对应官方 H5 地图选点组件。",
          mount: function (ctx) {
            var root = ctx.root;
            if (!sdkReady()) { root.innerHTML = sdkErr(); return; }
            root.innerHTML =
              '<div id="capMap" class="cap-map"></div>' +
              '<div id="capCtl" class="cap-ctl">' +
                '<div id="pickOut" class="pick-out">点击地图任意位置选取坐标</div>' +
                '<button class="btn btn-ghost" id="pickCopy" type="button">复制坐标</button>' +
              '</div>' +
              '<div id="capMsg" class="cap-msg">类似微信「发送位置」：点击地图选点，回传经纬度。</div>';
            var capMap, marker = null, picked = null;
            try { capMap = newMapEl("capMap", BJ, 13); } catch (e) { root.innerHTML = sdkErr(e); return; }
            currentCleanup = function () { try { if (capMap && capMap.destroy) capMap.destroy(); } catch (e) {} };
            capMap.on("click", function (e) {
              var ll = e.latLng; picked = { lat: ll.lat(), lng: ll.lng() };
              if (marker) try { marker.setMap(null); } catch (x) {}
              marker = new TMap.MultiMarker({ map: capMap, geometries: [{ id: "pk", position: new TMap.LatLng(picked.lat, picked.lng) }] });
              document.getElementById("pickOut").textContent = "已选 ✓  lat: " + picked.lat.toFixed(6) + "  lng: " + picked.lng.toFixed(6);
            });
            document.getElementById("pickCopy").onclick = function () {
              if (!picked) { toast("请先点击地图选点"); return; }
              var s = picked.lat.toFixed(6) + "," + picked.lng.toFixed(6);
              if (navigator.clipboard) navigator.clipboard.writeText(s).then(function () { toast("已复制 " + s); }, function () { toast("复制失败"); });
              else toast(s);
            };
          }
        },
        {
          id: "js-uri", name: "URI API（地图调起）", quota: 0, mode: "js",
          desc: "生成腾讯地图 URI 调起链接（marker / routeplan / geocoder / search），用于在 Web 或 App 中调起腾讯地图。纯前端生成，无需渲染。",
          mount: function (ctx) {
            var root = ctx.root, key = ctx.key;
            root.innerHTML =
              '<div id="capCtl" class="cap-ctl">' +
                '<label class="lbl">方法</label>' +
                '<select id="uMethod">' +
                  '<option value="marker">marker（地点标注）</option>' +
                  '<option value="routeplan">routeplan（路线规划）</option>' +
                  '<option value="geocoder">geocoder（逆地址解析）</option>' +
                  '<option value="search">search（地点搜索）</option>' +
                '</select>' +
                '<label class="lbl">坐标 lat,lng</label><input id="uCoord" type="text" value="39.9088,116.3975">' +
                '<label class="lbl">标题 / 名称</label><input id="uTitle" type="text" value="天安门">' +
                '<label class="lbl">终点坐标（routeplan 用，lat,lng）</label><input id="uTo" type="text" value="39.9841,116.3075">' +
                '<label class="lbl">路线方式（routeplan）</label><select id="uType"><option value="drive">drive 驾车</option><option value="bus">bus 公交</option><option value="walk">walk 步行</option></select>' +
                '<div class="row"><button class="btn btn-primary" id="uGen" type="button">生成并打开</button>' +
                '<button class="btn btn-ghost" id="uCopy" type="button">复制链接</button></div>' +
              '</div>' +
              '<div id="capMsg" class="cap-msg"></div>';
            function msg(s) { var m = document.getElementById("capMsg"); if (m) m.innerHTML = s; }
            function build() {
              var method = document.getElementById("uMethod").value;
              var coord = document.getElementById("uCoord").value.trim();
              var title = document.getElementById("uTitle").value.trim();
              var to = document.getElementById("uTo").value.trim();
              var type = document.getElementById("uType").value;
              var q = "https://apis.map.qq.com/uri/v1/" + method + "?referer=" + encodeURIComponent(key || "lilnong-top");
              if (method === "marker") q += "&marker=coord:" + coord + ";title:" + encodeURIComponent(title) + ";addr:" + encodeURIComponent(title);
              else if (method === "routeplan") q += "&type=" + type + "&to=" + encodeURIComponent(title) + "&tocoord=" + to;
              else if (method === "geocoder") q += "&coord=" + coord;
              else if (method === "search") q += "&keyword=" + encodeURIComponent(title);
              return q;
            }
            document.getElementById("uGen").onclick = function () { var q = build(); msg('链接：<span class="url">' + esc(q) + "</span>"); window.open(q, "_blank"); };
            document.getElementById("uCopy").onclick = function () { var q = build(); if (navigator.clipboard) navigator.clipboard.writeText(q).then(function () { toast("已复制链接"); }, function () { toast("复制失败"); }); else toast(q); };
            msg("URI API 用于调起腾讯地图（Web/App）。选择方法并生成链接，点击「生成并打开」即可调起。");
          }
        }
      ];

      // ---------- 渲染 ----------
      var grid = $("#grid"), activeId = null;

      function cardHTML(c) {
        var tagCls = c.mode === "ok" ? "ok" : (c.mode === "js" ? "js" : "proxy");
        var tagTxt = c.mode === "ok" ? "直连可用" : (c.mode === "js" ? "Web 端" : "经代理");
        var metaTxt = c.mode === "js" ? "浏览器实时渲染" : (c.quota > 0 ? ("配额 0 / " + c.quota) : "配额 未公开");
        return '<button class="cap-card" data-id="' + c.id + '">' +
          '<div class="name">' + esc(c.name) +
          '<span class="tag ' + tagCls + '">' + tagTxt + '</span></div>' +
          '<div class="desc">' + esc(c.desc) + '</div>' +
          '<div class="quota"><div class="bar"><i style="width:0%"></i></div>' +
          '<div class="meta"><span>' + metaTxt + '</span><span class="used">已用 0%</span></div></div>' +
          '</button>';
      }

      function renderGrid() {
        grid.innerHTML = CAPS.map(cardHTML).join("");
        Array.prototype.forEach.call(grid.querySelectorAll(".cap-card"), function (el) {
          el.addEventListener("click", function () { selectCap(el.getAttribute("data-id")); });
        });
      }

      function fieldHTML(f) {
        var id = "f_" + f.n;
        var ctrl = f.t === "select"
          ? '<select id="' + id + '">' + f.html + '</select>'
          : '<input id="' + id + '" type="' + (f.t === "number" ? "number" : "text") + '" value="' + esc(f.v) + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + ' />';
        return '<div class="field"><label for="' + id + '">' + esc(f.l) + '</label>' + ctrl + '</div>';
      }

      function selectCap(id) {
        activeId = id;
        var c = CAPS.filter(function (x) { return x.id === id; })[0];
        if (!c) return;
        Array.prototype.forEach.call(grid.querySelectorAll(".cap-card"), function (el) {
          el.classList.toggle("active", el.getAttribute("data-id") === id);
        });
        $("#tmTitle").textContent = c.name;
        $("#tmSub").textContent = c.desc;
        cleanupCurrent();
        testModal.classList.toggle("wide", !!c.mount);
        if (c.mount) {
          $("#tmBody").innerHTML = '<div id="capRoot" class="cap-root"></div>';
          $("#tmFoot").innerHTML = "";
          openTest();
          try { c.mount({ root: $("#capRoot"), foot: $("#tmFoot"), key: getKey() }); }
          catch (e) { $("#capRoot").innerHTML = '<div class="err">初始化失败：' + esc(e && e.message ? e.message : e) + '</div>'; }
          return;
        }
        $("#tmBody").innerHTML =
          '<div class="form">' + c.fields.map(fieldHTML).join("") + '</div>' +
          '<div class="res empty" id="resBox">点击「测试」查看结果</div>';
        $("#tmFoot").innerHTML = '<button class="btn btn-primary" id="runBtn">测试</button>';
        $("#runBtn").addEventListener("click", function () {
          var vals = {};
          c.fields.forEach(function (f) { vals[f.n] = $("#f_" + f.n).value; });
          var box = $("#resBox"); box.className = "res"; box.innerHTML = '<span class="warn">请求中…</span>';
          try { c.test(vals, getKey(), box); }
          catch (e) { box.innerHTML = '<div class="err">执行出错：' + esc(e && e.message ? e.message : e) + '</div>'; }
        });
        openTest();
      }

      // ---------- 测试 Modal 控制 ----------
      var testModal = $("#testModal"), testMask = $("#testMask"), lastFocused = null;
      function openTest() {
        lastFocused = document.activeElement;
        testModal.classList.add("show"); testMask.classList.add("show");
        testModal.setAttribute("aria-hidden", "false");
        var first = $("#tmBody").querySelector("input, select");
        if (first) setTimeout(function () { first.focus(); }, 60);
        $("#tmBody").scrollTop = 0;
      }
      function closeTest() {
        cleanupCurrent();
        testModal.classList.remove("wide");
        testModal.classList.remove("show"); testMask.classList.remove("show");
        testModal.setAttribute("aria-hidden", "true");
        if (lastFocused && lastFocused.focus) lastFocused.focus();
      }
      testMask.addEventListener("click", closeTest);
      $("#tmClose").addEventListener("click", closeTest);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && testModal.classList.contains("show")) closeTest();
      });

      // ---------- Key 抽屉 ----------
      var sheet = $("#sheet"), mask = $("#sheetMask"), keyInput = $("#keyInput");
      function openSheet() { keyInput.value = getKey() === DEFAULT_KEY ? "" : getKey(); sheet.classList.add("show"); mask.classList.add("show"); }
      function closeSheet() { sheet.classList.remove("show"); mask.classList.remove("show"); }
      $("#keyBtn").addEventListener("click", openSheet);
      $("#keyClose").addEventListener("click", closeSheet);
      mask.addEventListener("click", closeSheet);
      $("#keySave").addEventListener("click", function () {
        var v = keyInput.value.trim();
        if (!v) { toast("请输入 Key"); return; }
        setKey(v); closeSheet(); toast("已保存，刷新后生效");
      });
      $("#keyReset").addEventListener("click", function () { clearKey(); keyInput.value = ""; closeSheet(); toast("已恢复默认 Key"); });

      // ---------- 启动 ----------
      renderGrid();
      loadMapServices(getKey());
    })();
  </script>
</body>
</html>
