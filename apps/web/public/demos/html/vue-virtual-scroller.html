		new Vue({
		  el: '#app',
		  template: `		<div class="dynamic-scroller-demo">
		    <div class="toolbar">
		      <input
		        v-model="search"
		        placeholder="Filter..."
		      >
		    </div>

		    <DynamicScroller
		      :items="filteredItems"
		      :min-item-size="54"
		      class="scroller"
		    >
		      <template #before>
		        <div class="notice">
		          The message heights are unknown.
		        </div>
		      </template>

		      <template v-slot="{ item, index, active }">
		        <DynamicScrollerItem
		          :item="item"
		          :active="active"
		          :size-dependencies="[
		            item.message,
		          ]"
		          :data-index="index"
		          :data-active="active"
		          :title="\`Click to change message ${index}\`"
		          class="message"
		          @click.native="changeMessage(item)"
		        >
		          <div class="avatar">
		            <img
		              :key="item.avatar"
		              :src="item.avatar"
		              alt="avatar"
		              class="image"
		            >
		          </div>
		          <div class="text">
		            {{ item.message }}
		          </div>
		          <div class="index">
		            <span>{{ item.id }} (id)</span>
		            <span>{{ index }} (index)</span>
		          </div>
		        </DynamicScrollerItem>
		      </template>
		    </DynamicScroller>
		  </div>`,

		  data () {
		    return {
		      items: data,
		      search: '',
		    }
		  },

		  computed: {
		    filteredItems () {
		      const { search, items } = this
		      if (!search) return items
		      const lowerCaseSearch = search.toLowerCase()
		      return items.filter(i => i.message.toLowerCase().includes(lowerCaseSearch))
		    },
		  },

		  methods: {
		    changeMessage (message) {
		      Object.assign(message, data)
		    },
		  },
		})
	</script>
