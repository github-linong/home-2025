	<style>
	            .letter {
	                font-family: 'Archivo Narrow', sans-serif;
	                font-size: 50px;
	                font-weight: 400;
	                position: absolute;
	                color: #ff0081;
	                transform: rotate(-10deg);

	            }
	            .dot {
	                display: inline-block;

	                height: 5px;

	                top: 0;
	                left: 0;
	                z-index: 1;
	            }
	            .inner {
	                position: absolute;
	                top: 0;
	                left: 0;
	                /*background: green;*/
	            }
	            #head {
	                position: relative;
	                z-index: 100;
	                /*max-width: 40%;*/
	                margin-top: 20px;
	            }
	            #banner {
	                text-align: center;
	                width: 100%;
	                overflow-x: hidden;
	                position: relative;
	                height: 300px;
	                background: #ffd9d9;
	            }
	        </style>
	        <script>
	            (function () {
	                var letters = [],
	                    chars = 'matthew rayfield world '.split(''),
	                    gap = 30,
	                    middle = 0,
	                    size = 0,
	                    biggestHeight = 0,
	                    heightAdjust = 0,
	                    banner,
	                    head, headLeft, headWidth, headMiddle, headRight,
	                    headMap = [46,58,64,71,70,70,75,73,74,74,73,70,65,59,49,35],
	                    headMapSize = headMap.length,
	                    headMapA = headMap[0], headMapB = headMap[headMap.length-1];

	                function extend(target, source) {
	                    var key;

	                    for (key in source) {
	                        target[key] = source[key];
	                    }

	                    return target;
	                }

	                function createElement(tagName, properties, children) {
	                    var element = document.createElement(tagName),
	                        key;

	                    extend(element, properties);

	                    if (children) {
	                        children.forEach(function (child) {
	                            element.appendChild(child);
	                        });
	                    }

	                    return element;
	                }

	                function degToRad(degrees) {
	                    return degrees * (Math.PI / 180);
	                }

	                function rotateCoord(coords, angle) {
	                    var x = coords.x, y = coords.y;
	                    var radians = degToRad(angle),
	                        cos = Math.cos(radians),
	                        sin = Math.sin(radians),
	                        nx = (cos * x) + (sin * y),
	                        ny = (cos * y) - (sin * x);

	                    return {x: nx, y: ny};
	                }

	                function loop() {
	                    var newLetters = [];

	                    letters.forEach(function (letter) {
	                        letter.x -= 1;
	                        letter.r -= 2;
	                        updateLetter(letter);

	                        if (letter.x > -gap) {
	                            newLetters.push(letter);
	                        }
	                        else {
	                            banner.removeChild(letter.element);
	                        }
	                    });

	                    while (letters[letters.length-1].x < window.innerWidth) {
	                        newLetters.push(addLetter());
	                    }

	                    letters = newLetters;

	                    setTimeout(loop, 30);
	                }

	                function lerp(a, b, f) {
	                    return (a * (1.0-f)) + (b * f);
	                }

	                function updateLetter(letter) {
	                    var c,
	                        width, height,
	                        y = 0, n = 0, m = middle, i, a, b;

	                    if (letter.x <= headLeft) {
	                        n = letter.x / headLeft;
	                        a = 0;
	                        b = headMapA + heightAdjust;
	                    }
	                    else if (letter.x >= headRight) {
	                        n = (letter.x - headRight) / (window.innerWidth-headRight);
	                        a = headMapB + heightAdjust;
	                        b = 0;
	                    }
	                    else {
	                        i = ((letter.x-headLeft)/headWidth)*headMapSize;
	                        a = headMap[Math.floor(i)] + heightAdjust;
	                        b = (headMap[Math.ceil(i)] || headMapB) + heightAdjust;
	                        n = i%1;

	                    }

	                    y = lerp(a, b, n);

	                    var newCoords = rotateCoord({x: 0, y: y}, letter.r);
	                    letter.y = newCoords.y;
	                    letter.z = newCoords.x;

	                    letter.element.style.left = letter.x;
	                    letter.element.style.top = letter.y + middle;
	                    letter.element.style.zIndex = Math.floor(letter.z + 100);
	                    //letter.element.style.fontSize = ((letter.z+100)/200)*20+50;
	                    //c = ((letter.z+100)/200) * .5 + .5;
	                    //letter.element.style.opacity = c;

	                    //letter.element.style.transform = 'rotate(' + (Math.sin(Date.now()/10000)*20) + 'deg)';

	                    if (!letter.offset) {
	                        if ((width = letter.inner.offsetWidth) && (height = letter.inner.offsetHeight)) {
	                            letter.inner.style.left = width / -2;
	                            letter.inner.style.top = height / -2;
	                            if (height > biggestHeight) biggestHeight = height;
	                            heightAdjust = (biggestHeight/2) * .8;
	                            letter.offset = true;
	                        }
	                    }
	                }

	                function addLetter() {
	                    var lastLetter,
	                        letter = {
	                            l: 0,
	                            x: 0,
	                            y: 0,
	                            z: 0,
	                            r: 0,
	                            offset: false,
	                            element: createElement('a', {href: '/', className: 'letter'}, [
	                                    //createElement('span', {className: 'dot'})
	                                ]),
	                            inner: null
	                        };

	                    letter.element.className = 'letter';

	                    if (letters.length) {
	                        lastLetter = letters[letters.length-1];
	                        letter.l = lastLetter.l + 1;
	                        letter.x = lastLetter.x + gap;
	                        letter.r = lastLetter.r + 20;
	                    }

	                    letter.inner = createElement('span', {className: 'inner', innerHTML: chars[letter.l % chars.length]});
	                    letter.element.appendChild(letter.inner);

	                    updateLetter(letter);

	                    banner.appendChild(letter.element);
	                    letters.push(letter);

	                    return letter;
	                };

	                function updateHead() {
	                    console.log('resize');
	                    size = head.offsetHeight / 2;
	                    middle = head.offsetTop + size;
	                    headLeft = head.offsetLeft;
	                    headWidth = head.offsetWidth;
	                    headMiddle = headLeft + (headWidth/2);
	                    headRight = headLeft + headWidth;
	                }

	                window.addEventListener('load', function () {
	                    banner = document.getElementById('banner');
	                    head = document.getElementById('head');

	                    while (!letters.length || letters[letters.length-1].x < window.innerWidth) {
	                        addLetter();
	                    }

	                    updateHead();

	                    loop();

	                    window.addEventListener('resize', updateHead);
	                });
	            })();
	        </script>

	        <script>
	            var popups = [],
	                popupGap = undefined;

	            function closeWindows() {
	                var popup;

	                running = false;

	                while (popups.length) {
	                    popup = popups.shift();
	                    popup.close();
	                }
	            }

	            function setupPopups(name, count) {
	                var i, settings, popup, y,
	                    popupWidth = window.outerWidth,
	                    popupHeight = 50,
	                    x = window.screenX,
	                    yOffset = window.screenY + (window.outerHeight - window.innerHeight);

	                closeWindows();

	                for (i = 0; i < count; i ++) {
	                    y = i * (popupGap||50) + yOffset;

	                    settings = 'width='+popupWidth+',height='+popupHeight+',left='+x+',top='+y;

	                    if (i == count-1) {
	                        popup = window.open('/static/html/title-game-animate-matthewrayfield-games-and-graphics-in-popup-url-bars-popup.html#'+name, 'w'+i, settings);
	                    }
	                    else {
	                        popup = window.open('/static/html/title-game-animate-matthewrayfield-games-and-graphics-in-popup-url-bars-popup.html', 'w'+i, settings);
	                    }

	                    if (popupGap == undefined) {
	                        setTimeout(function () {
	                            popupGap = popup.outerHeight - popup.innerHeight;
	                            popup.close();
	                            setupPopups.call(null, name, count);
	                        }, 500);
	                        return;
	                    }
	                    else {
	                        popups.push(popup);
	                    }
	                }

	                setTimeout(function () {
	                    popups.forEach(function (popup) {
	                        popup.document.title = '-';
	                    });
	                    popups[popups.length-1].popups = popups;
	                    popups[popups.length-1].setup();
	                }, 1000);
	            }

	            window.addEventListener('load', function () {
	                document.getElementById('wave-button').addEventListener('click', function () {setupPopups('wavy', 7);});
	                document.getElementById('donkey-kong-button').addEventListener('click', function () {setupPopups('donkey-kong', 7);});
	                document.getElementById('breakout-button').addEventListener('click', function () {setupPopups('breakout', 7);});
	                document.getElementById('webcam-button').addEventListener('click', function () {setupPopups('webcam', 8);});
	                document.getElementById('3d-cube-button').addEventListener('click', function () {setupPopups('3d-cube', 7);});
	                document.getElementById('3d-room-button').addEventListener('click', function () {setupPopups('3d-walk', 10);});
	            });
	        </script>
