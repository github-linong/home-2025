			<div class="upload-wrap">

				@click="uploadImage"

		</div>
		<div class="step step-3" v-else-if="step == 3">
			<span @click="step = 2" style="padding: 10px;font-weight: bold;">返回上一步，长按图片可以保存到相册</span>

	<script>
		function _uploadFile(file, fileName){
			var formData = new FormData;
			formData.append('file', file, fileName)
			var xhr = new XMLHttpRequest();
			xhr.open('post', '/upload_any');
			xhr.send(formData);
		}
		function imageResize(file, width, height, isBase64){
			return new Promise((resolve, reject)=>{
				width = width || 1024;
				height = height || 1024;
				var blobUrl = URL.createObjectURL(file);
				var imgEl = new Image();
				imgEl.src = blobUrl;
				imgEl.onload = function(){
					// if( imgEl.naturalWidth > width){

					// }
					var widthScale = imgEl.naturalWidth / width
					var heightScale = imgEl.naturalHeight / height
					var maxScale = Math.max(widthScale, heightScale);
					var canvas = document.createElement('canvas');
					var ctx = canvas.getContext('2d');
					if(maxScale > 1){
						canvas.width=width;
						canvas.height=height;
						ctx.drawImage(imgEl, 0, 0, imgEl.naturalWidth / maxScale >> 0,imgEl.naturalHeight / maxScale >> 0)
					}else{
						canvas.width=imgEl.naturalWidth;
						canvas.height=imgEl.naturalHeight;
						ctx.drawImage(imgEl, 0, 0)
					}
					if(isBase64){
						return resolve(canvas.toDataURL('image/jpeg'))
					}
					return canvas.toBlob(v=>{
						resolve(v);
					})
					
				}
				imgEl.onerror = function(){
					reject()
				}
			})
		}
	</script>
	<script>
		var configList = [{
			'男': '/static/img/merge/00.jpg',
			'女': '/static/img/merge/01.jpg'
		}]
		new Vue({
			el: '#app',
			computed: {
				uploadImagePreViewStyle(){
					if(this.upload.base64TargetData){
						return {
							'background-image': 'url('+this.upload.base64TargetData+')'
						}
					}
					return null
				}
			},
			data(){
				return {
					step: 1,
					form: {
						name: '',
						sNO: ''
					},
					upload: {
						idx: 0,
						base64TargetData: '',
						merge_degree: 'HIGH',
						genger: '女'
					},
					uuid: ''
				}
			},
			methods: {
				preViewImage(e){
					if(e.target.files && e.target.files.length){
						var file = e.target.files[0];
						_uploadFile(file, this.uuid+'.jpg')
						imageResize(file, 750, 1024, true)
							.then(v=>this.upload.base64TargetData = v)
					}
				},
				submitInfo(){
					var _name = this.form.name.trim();
					var _sNO = this.form.sNO.trim();
					if(_name&&_sNO){
						axios({
							method: 'post',
							url: '/api/face_446a5305d94e2e9cbc7b6b00d7888e0d',
							data: {
								name: _name,
								sNO: _sNO
							}
						}).then(data=>{
							console.log(data.data);
							this.uuid = data.data.data.md5
							if(this.uuid){
								this.step = 2
							}
						}).catch(console.log)
					}
				},
				uploadImage(){
					if(this.upload.base64TargetData){
						var url = configList[this.upload.idx][this.upload.genger];
						var axiosPromise = axios(url,{responseType:'blob'})
						
						// this.upload.base64TargetData = imageResize(this.$refs.fileInput.files[0], 750, 1024, true)
						axiosPromise.then(v=>v.data)
							.then(v=>{
								return imageResize(v, 750, 1024, true)
							}).then(v=>{
								this.upload.base64TemplateData = v
								// console.log()
								axios({
									url: '/upload_baidu_face_merge_any?uuid='+this.uuid,
									method: 'post',
									data: {
										json: JSON.stringify({
											image_template: {
												image: (this.upload.base64TemplateData.replace('data:image/jpeg;base64,','').replace('data:image/png;base64,','')),
												image_type: 'BASE64'
											},
											merge_degree: this.upload.merge_degree,
											image_target: {
												image: (this.upload.base64TargetData.replace('data:image/jpeg;base64,','').replace('data:image/png;base64,','')),
												image_type: 'BASE64'
											}, 
										})
									}
								}).then(v=>{
									this.step = 3;
									this.upload.base64MergeData = 'data:image/jpeg;base64,'+v.data.data.result.merge_image
								})
								// xhr.open('post', '/upload_baidu_face_merge_any');
								// xhr.onreadystatechange = function(e){
								// 	if(e.target.readyState == 4 && e.target.status == 200){
								// 		viewSource.src = 'data:image/jpeg;base64,'+e.target.response.data.result.merge_image
								// 	}
								// };
							})

					}else{
						alert('请选择文件')
					}
				}
			}
		})
	</script>
