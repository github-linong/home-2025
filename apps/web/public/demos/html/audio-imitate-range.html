<body>
	<div id="app">
		<div>
			<audio controls src="/static/audio/1547430913173SXD5LH4UW.mp3"></audio>
		</div>
		<div>
			<input type="range" id="inputRange" value="0" min="0" max="0">
			<span id="inputRangeTips"></span>
		</div>
		<div id="imitateRange-warp">
			<div id="imitateRange">
				<div id="imitateRange-btn"></div>
			</div>
		</div>
		<style type="text/css">
			#imitateRange-warp{
				padding: 10px;
			}
			#imitateRange{
				height: 10px;
				background: #000;
				border-radius: 10px;
				position: relative;
			}
			#imitateRange-btn{
				width: 12px;
				height: 12px;
				background: #fff;
				border: 1px solid #f00;
				border-radius: 50%;
				position: relative;
				/*left: -2px;top: -2px;*/
				/*transform: translate(-2px,-2px);*/
				transform: translate(-7px,-2px);
				pointer-events: none;
			}
		</style>
		<script type="text/javascript">
			audio = document.querySelector('audio');
			inputRange = document.querySelector('#inputRange');
			inputRangeTips = document.querySelector('#inputRangeTips');
			imitateRangeBtn = document.querySelector('#imitateRange-btn');
			minTime = 10;
			// audio.addEventListener('canplay', function(){
			audio.addEventListener('loadeddata', function(){
				audio.currentTime;//当前播放时长
				audio.duration;//时长

				inputRange.max = Math.floor(audio.duration);
				inputRange.value = minTime;
				audio.currentTime = inputRange.value;
				// inputRangeTips.innerText = `${inputRange.value}/${inputRange.max}`
				inputRangeTips.innerText = inputRange.value+'/'+inputRange.max
				imitateRangeBtn.style.left= audio.currentTime/audio.duration*100+'%'
			})
			inputRange.addEventListener('input', function(){
				// inputRangeTips.innerText = `${inputRange.value}/${inputRange.max}`
				inputRangeTips.innerText = inputRange.value+'/'+inputRange.max
			})
			inputRange.addEventListener('change', function(){
				inputRange.value = Math.max(+inputRange.value, +minTime)
				// inputRangeTips.innerText = `${inputRange.value}/${inputRange.max}`
				inputRangeTips.innerText = inputRange.value+'/'+inputRange.max
				audio.currentTime = inputRange.value
			})
			moveTag = false;
			imitateRange.addEventListener('mousedown', function(e){

				// movementX: 0
				// movementY: 0
				// offsetX: 44
				// offsetY: 2
				// layerX: 44
				// layerY: 2

				// 距离浏览器边界的位置
				// clientX: 54
				// clientY: 93
				// 距离当前页面边界的位置
				// pageX: 54
				// pageY: 93
				// 距离屏幕边界的位置
				// screenX: 54
				// screenY: 196		

				// x: 54
				// y: 93
				// console.log(e.target, e.offsetX)
				moveTag = true;
			})
			imitateRange.addEventListener('mousemove', function(e){
				if(moveTag){
					// console.log(e.offsetX, e.target)
					imitateRangeBtn.style.left= e.offsetX/imitateRange.offsetWidth*100+'%'
				}
			})
			imitateRange.addEventListener('moveout', function(){
				setAudio()
			})
			imitateRange.addEventListener('mouseup', function(){
				setAudio()
			})
			setAudio = function(){
				moveTag = false;
				var num = imitateRangeBtn.style.left.replace(/%$/,'')*audio.duration*0.01
				if(num < minTime){
					imitateRangeBtn.style.left= 10/audio.duration*100+'%'
					audio.currentTime = 10;
				}else{
					audio.currentTime = Math.max(num, minTime);
				}
				
			}
			// 测试 audio
			// arrEvent = []
			// for(var i in audio)
			// 	/^on/.test(i) && !/move$/.test(i) && arrEvent.push(i.replace(/^on/,''))
			// arrEvent.forEach(v=>audio.addEventListener(v,function(){console.info('event', v)}))
			
			// 测试 input
			// inputRangeEvent = []
			// for(var i in inputRange)
			// 	/^on/.test(i) && !/move$/.test(i) && inputRangeEvent.push(i.replace(/^on/,''))
			// inputRangeEvent.forEach(v=>inputRange.addEventListener(v,function(){console.info('event', v)}))
			
		</script>
