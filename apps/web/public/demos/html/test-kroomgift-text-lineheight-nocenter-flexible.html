	<style type="text/css">

		.demo{
			text-align: center;border-radius: 50%;
			background: #f00;border: 1px solid #0f0;
			position: relative;
		}
		.demo:before{
			content: '';
			position: absolute;top: 0 ;bottom:0;left:50%;transform: translateX(-50%);width: 1px;background: #00f;
		}
		.demo:after{
			content: '';
			position: absolute;left: 0 ;right:0;top:50%;transform: translateY(-50%);height: 1px;background: #00f;
		}
		.demo1{
			width: 6.1333vw;height: 6.1333vw;line-height: 6.1333vw;
		}

		}
