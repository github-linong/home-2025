        window.arr = [];
        echartsTest([{"x":100,"y":0},{"x":150,"y":-50}],[{},{}],'main0')
        echartsTest([{"x":100,"y":0},{"x":150,"y":-50}],[{},{}],'main1')
        function echartsTest(datas,links,id){
            console.log(`id`+$(`#${id}`).length, JSON.stringify(datas),JSON.stringify(links),id)
            // if(id == 'main1') {return true;}
            // 基于准备好的dom，初始化echarts实例
            var _id=id;
            // console.log(_id)
            id = echarts.init($(`#${id}`).get(0));

            // 指定图表的配置项和数据
            _id = {
                title: {
                    text: 'demo'
                },
                tooltip: {},
                animationDurationUpdate: 1500,
                animationEasingUpdate: 'quinticInOut',
                series : [{
                    type: 'graph',
                    layout: 'none',
                    symbolSize: 50,
                    roam: true,
                    label: {
                        normal: {
                            show: true
                        }
                    },
                    edgeSymbol: ['circle', 'arrow'],
                    edgeSymbolSize: [4, 10],
                    edgeLabel: {
                        normal: {
                            textStyle: {
                                fontSize: 20
                            }
                        }
                    },
                    data: datas,
                    // links: [],
                    links: links,
                    lineStyle: {
                    normal: {
                        opacity: 0.9,
                        width: 2,
                        curveness: 0,
                        curveness: 0.2
                        }
                    }
                }]
            
            };

            // 使用刚指定的配置项和数据显示图表。
