	<style type="text/css">
		.nav a{padding: 10px 20px; margin: 5px;border: 1px solid #f00;display: inline-block;}
	</style>
	<div id="app">
	  <h1>Hello App! </h1>
	  <div>{{routerLog}}</div>
	  <div><button @click="goBack">goBack</button></div>
	  <p class="nav">
	    <router-link to="/a1">Go to a1</router-link>
	    <router-link to="/a2">Go to a2</router-link>

	    <router-link to="/list/1">Go to /list/1</router-link>
	    <router-link to="/list/2">Go to /list/2</router-link>

	    <router-link to="/user">Go to /user</router-link>
	    <router-link to="/user/profile">Go to /user/profile</router-link>
	    <router-link to="/user/posts">Go to /user/posts</router-link>

	    <router-link to="/user/1">Go to /user/1</router-link>
	    <router-link to="/user/1/profile">Go to /user/1/profile</router-link>
	    <router-link to="/user/1/posts">Go to /user/1/posts</router-link>
	    <router-link to="/posts">Go to /posts</router-link>
	  </p>
	  <router-view></router-view>
	</div>
	<script type="text/javascript">
		var A1 = {name:'a1', template: '<div>a1 <input></div>' }
		var A2 = {name:'a2', template: '<div>a2 <input></div>' }
		var UserHome = {name:'UserHome', template: '<div>UserHome <input></div>' }
		var UserProfile = {name:'UserProfile', template: '<div>UserProfile <input></div>' }
		var UserPosts = {name:'UserPosts', template: '<div>UserPosts <input></div>' }
		var ListInfo = {name: 'ListInfo',template: '<div>User {{$route.params.id}}  <input></div>',
			// beforeRouteUpdate (to, from, next) {
			// 	console.log('beforeRouteUpdate')
			// },
			// watch: {
			// 	'$route' (to, from) {console.log('watch', '$route')}
			// }
		}
		const User = {
		  template: `
		    <div class="user">
		      <h2>User {{ $route.params.id }}</h2>
		      <router-view></router-view>
		    </div>
		  `
		}
		var routes = [
		  { path: '/a1', component: A1 },
		  { path: '/a2', component: A2 },
		  { path: '/list/:id', component: ListInfo },
		  { path: '/user/:id', component: User,
		        children: [
		          { path: '', component: UserHome },
		          { path: 'profile', component: UserProfile },
		          { path: '/posts', component: UserPosts }
		        ]
		      }
		]
		var router = new VueRouter({
		  routes
		})
		var vm = new Vue({
		  router,
		  data(){
		  	return{

		  	}
		  },
		  computed:{
		  	routerLog(){
		  		console.log('routerLog');
		  		return this.$route.params
		  	}
		  },
		  methods: {
		    goBack() {
		      window.history.length > 1 ? this.$router.go(-1) : this.$router.push('/')
		    }
		  }
		}).$mount('#app')
	</script>
