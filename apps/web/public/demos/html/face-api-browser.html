<body>
	<div id="app">
		<input type="file" id="imageUploadDOM">
		<button id="detectAllFaces">detectAllFaces</button>
		<div style="position: relative;" id="imageViewWrap">
			<div style="position: absolute;left:0;top:0;width:0;height:0;border: 1px solid #f00" id="imageViewFace"></div>
			<img src="" alt="" id="imageViewDom">
		</div>
	</div>
	<script>
		console.log(faceapi.nets)
		faceapi.nets.ssdMobilenetv1.loadFromUri('/static/js/face-api/weights')
		imageUploadDOM.addEventListener('change', (e)=>{
			var file = e.target.files[0];
			if(file){
				imageViewDom.src = URL.createObjectURL(file)
			}
		})
		detectAllFaces.addEventListener('click', ()=>{
			faceapi.detectAllFaces(imageViewDom)
				.then(v=>{
					console.log(v)
					imageViewFace.style.left = v[0].box.left + 'px'
					imageViewFace.style.top = v[0].box.top + 'px'
					imageViewFace.style.width = v[0].box.width + 'px'
					imageViewFace.style.height = v[0].box.height + 'px'
					// temp1[0].box.width
				})
			// faceapi.detectAllFaces(imageViewDom, new faceapi.SsdMobilenetv1Options())
			// 	.then(console.log)
			// faceapi.ssdMobilenetv1(imageViewDom, {})
			// 	.then(console.log)
		})
	</script>
