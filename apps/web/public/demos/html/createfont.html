<body>
	<div id="app">
		<style type="text/css">
			#editor{font-family: "myFamily", monospace;overflow:scroll;resize:auto;}
		</style>
		<div contenteditable id="editor" style="height: 200px;border: 1px solid #f00;">
			测试文字
		</div>
		<button id="createFont">加载新的字体文件</button>
		<ul id="list">
		</ul>
	</div>
	<script type="text/javascript">
		createFont.onclick = function(){
			txt = editor.innerText
			fetch(`https://www.lilnong.top/createfont`, {method: 'post',body:new URLSearchParams(`txt=${txt}`)})
				.then(v=>v.json())
				.then(v=>{
					createLink(v.cssUrl)
					$(list).append('<li data-src="'+v.cssUrl+'">'+v.cssUrl+'('+txt+')</li>')
				})
		}
		$('#list').on('click', 'li', function(){
			var url = $(this).attr('data-src');
			createLink(url)
		})
		createLink = function(url){
			if(!window.el) el = document.createElement('link');
			el.href = url
			el.rel="stylesheet"
			document.body.appendChild(el);
		}
	</script>
