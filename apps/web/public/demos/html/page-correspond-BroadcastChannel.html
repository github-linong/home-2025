	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<script>
	  // 初始化
	  var vConsole = new VConsole();
	  console.log('Hello world');
	</script>
	<title>页面通信BroadcastChannel测试</title>
</head>
<body>
	<button id="sendMsg">发送</button>
	<script type="text/javascript">
		// 接收广播
		let broadcastChannel = new BroadcastChannel('mychannel');
		broadcastChannel.onmessage = function (e) {
		    console.log(e.data);
		}
		obj = { 
			ori_href: location.href,
			create_time: Date.now()
		};
		document.querySelector('#sendMsg').addEventListener('click', e=>{
			obj.send_time = Date.now();
			broadcastChannel.postMessage(obj);
		})
	</script>
