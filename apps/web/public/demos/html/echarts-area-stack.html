<body>
	<div id="app" style="display: none;">
		<button id="setEcharts">覆盖图表</button><button id="setUrl">覆盖URL</button>
		<textarea id="code" style="height: 300px; overflow:scroll;width: 100%">

		</textarea>
	</div>
	<div id="echarts_view" style="width: 100vw;height: 100vh"></div>
	<script>
		option = {
			title: {
				text: '堆叠区域图'
			},
			tooltip: {
				trigger: 'axis',
				axisPointer: {
					type: 'cross',
					label: {
						backgroundColor: '#6a7985'
					}
				}
			},
			legend: {
				data: ['邮件营销123','邮件营销', '联盟广告', '视频广告', '直接访问', '搜索引擎']
			},
			grid: {
				left: '5%',
				right: '5%',
				bottom: '5%',
				top: '5%',
				containLabel: true
			},
			xAxis: [
				{
					type: 'category',
					boundaryGap: false,
					data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
				}
			],
			yAxis: [
				{
					type: 'value'
				}
			],
			series: [
				{
					name: '邮件营销123',
					type: 'line',
					stack: '总量',
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [1200, 132, 101, 134, 90, 230, 210]
				},
				{
					name: '邮件营销',
					type: 'line',
					stack: '总量',
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [120, 132, 101, 134, 90, 230, 210]
				},
				{
					name: '联盟广告',
					type: 'line',
					stack: '总量',
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [220, 182, 191, 234, 290, 330, 310]
				},
				{
					name: '视频广告',
					type: 'line',
					stack: '总量',
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [150, 232, 201, 154, 190, 330, 410]
				},
				{
					name: '直接访问',
					type: 'line',
					stack: '总量',
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [320, 332, 301, 334, 390, 330, 320]
				},
				{
					name: '搜索引擎',
					type: 'line',
					stack: '总量',
					label: {
						show: true,
						position: 'top'
					},
					areaStyle: {},
					emphasis: {
						focus: 'series'
					},
					data: [820, 932, 901, 934, 1290, 1330, 1320]
				}
			]
		};
		option = JSON.parse(decodeURIComponent(location.search.match(/(\?|&)val=([^?&]+)/)[2]))
	</script>
	<script>
		if(location.search.match(/(\?|&)show=([^?&]+)/)[2] == 1){
			app.style.display = 'block'
		}
	</script>
	<script>
		code.value = JSON.stringify(option, null, 4)
	</script>
	<script>
		var myChart = echarts.init(document.getElementById('echarts_view'));
		myChart.setOption(option);

		window.onresize = myChart.resize
	</script>
	<script>
		setEcharts.addEventListener('click',function(){
			try{
				myChart.setOption(JSON.parse(code.value), {notMerge: true})
			}catch(e){
				alert('json不合法')
			}
		})
		setUrl.addEventListener('click',function(){
			try{
				location.search = 'val='+encodeURIComponent(JSON.stringify(JSON.parse(code.value)))
			}catch(e){
				alert('json不合法')
			}
		})
	</script>
