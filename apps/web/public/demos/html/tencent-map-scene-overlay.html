  <title>自定义地图 · 异形区域场景覆盖</title>

  <style>
    :root {
      --bg0: #070b14; --bg1: #0c1422; --panel: rgba(16, 24, 40, 0.72);
      --border: rgba(120, 160, 220, 0.18); --text: #e8eefc; --muted: #9bb0d6;
      --accent: #4ea1ff; --accent2: #7c5cff; --ok: #36d399; --warn: #fbbd23;
      --r: 16px; --shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Sora", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 800px at 70% -10%, #16223c 0%, var(--bg0) 60%);
      color: var(--text); overflow: hidden;
    }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; } /* 堆叠基线：地图 0 → 覆盖层 10 → UI 面板 40 */

    /* 场景覆盖层 —— DOM 覆盖在地图 canvas 之上，天然不受地图图层层级限制 */
    .scene-overlay {
      position: absolute;
      pointer-events: none;   /* 不拦截地图交互 */
      z-index: 10;            /* 在地图 canvas 之上、UI 面板(z-index:40)之下 */
      transition: opacity 0.25s ease;
    }

    .brand {
      position: fixed; left: 20px; top: 18px; z-index: 40;
      display: flex; flex-direction: column; gap: 2px;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
      padding: 12px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow); max-width: 280px;
    }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
    .brand p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

    .panel {
      position: fixed; right: 20px; top: 18px; z-index: 40; width: 268px;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
      padding: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
    }
    .panel-h { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }
    .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .seg button {
      font: inherit; font-size: 12px; padding: 9px 4px; border-radius: 10px; cursor: pointer;
      color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .seg button:hover { color: var(--text); border-color: var(--border); }
    .seg button.on { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
    .ctl { display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--text); }
    .ctl.row { flex-direction: row; align-items: center; gap: 9px; }
    .ctl .val { color: var(--accent); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    select {
      font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; color: var(--text);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); outline: none;
    }
    .btn {
      font: inherit; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 10px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; transition: transform 0.12s ease, filter 0.15s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .chk { width: 18px; height: 18px; accent-color: var(--accent); }
    .hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; min-height: 16px; }
    .hint.err { color: #ff8a8a; }

    .foot {
      position: fixed; left: 20px; bottom: 16px; z-index: 40; font-size: 11px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 12px; backdrop-filter: blur(10px); max-width: 360px; line-height: 1.5;
    }
    .foot code { color: var(--accent); }
    @media (max-width: 560px) {
      .panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; }
      .brand { right: 12px; left: 12px; max-width: none; }
      .foot { display: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 场景覆盖层容器（由 JS 动态创建 img 子元素） -->
  <div id="sceneOverlay" class="scene-overlay" style="display:none;"></div>

  <div class="brand">
    <h1>异形区域 · 场景覆盖</h1>
    <p>将自定义场景概念图按多边形遮罩裁剪后，以 DOM 覆盖层方式贴在地图上的真实地块之上。切换场景、调透明度、开关图层，支持拖拽/缩放联动。</p>
  </div>

  <div class="panel">
    <div class="panel-h">场景切换</div>
    <div class="seg" id="sceneSeg">
      <button data-s="park" class="on">公园插画</button>
      <button data-s="eco">生态俯视</button>
      <button data-s="future">未来街区</button>
    </div>

    <label class="ctl">图层透明度 · <span class="val" id="opVal">90%</span>
      <input id="op" type="range" min="0" max="100" value="90" />
    </label>

    <label class="ctl row"><input id="vis" type="checkbox" class="chk" checked /> 显示场景覆盖层</label>

    <label class="ctl">底图样式
      <select id="style">
        <option value="">标准矢量</option>
        <option value="style1">style1 · 标准</option>
        <option value="style2">style2 · 极夜</option>
        <option value="style3">style3 · 冷色</option>
        <option value="style4">style4 · 暖色</option>
        <option value="style5">style5 · 商务</option>
      </select>
    </label>

    <button id="fly" class="btn">飞向覆盖区域</button>
    <div class="hint" id="hint">初始化中…</div>
  </div>

  <div class="foot">

  </div>

    var SCENES = {
      park:   "assets/Aerial_top_down_photorealistic_2026-08-05T12-53-25_paths.png",
      eco:    "assets/Aerial_top_down_concept_render_2026-08-04T12-51-18.png",
      future: "assets/Cinematic_futuristic_city_dist_2026-08-04T12-51-44.png"
    };
    var SCENE_LABEL = { park: "公园插画", eco: "生态俯视", future: "未来街区" };

    // WGS-84 → GCJ-02 坐标转换（火星坐标），使 OSM 边界与腾讯地图底图对齐
    function outOfChina(lat, lng) { return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271); }
    function transformLat(x, y) {
      var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function transformLng(x, y) {
      var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }
    function wgs84ToGcj02(lat, lng) {
      if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
      var dLat = transformLat(lng - 105.0, lat - 35.0);
      var dLng = transformLng(lng - 105.0, lat - 35.0);
      var radLat = lat / 180.0 * Math.PI;
      var magic = Math.sin(radLat); magic = 1 - 0.00669342162296594323 * magic * magic;
      var sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((6378245.0 * (1 - 0.00669342162296594323)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (6378245.0 / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: lat + dLat, lng: lng + dLng };

    REGION = REGION.map(function (p) { var c = wgs84ToGcj02(p.lat, p.lng); return { lat: c.lat, lng: c.lng }; });

    var sw = { lat: Math.min.apply(null, REGION.map(function (p) { return p.lat; })), lng: Math.min.apply(null, REGION.map(function (p) { return p.lng; })) };

    // 朝阳公园真实边界框约 1:2（纵向），因此使用 1024×2048；更换 REGION 时请同步调整此尺寸并重新生成插画。

    function hint(s, err) { var h = document.getElementById("hint"); if (h) { h.textContent = s; h.className = "hint" + (err ? " err" : ""); } }

    // ============ 运行时：把场景图按多边形遮罩裁剪（生成带多边形裁剪的 data URL）============
    function buildSceneSrc(img) {
      var W = SCENE_W, H = SCENE_H;
      var canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext("2d");
      // 场景图 cover 铺满画布（对齐外包矩形）
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var scale = Math.max(W / iw, H / ih);
      var dw = iw * scale, dh = ih * scale;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      // 用多边形路径做 destination-in 裁剪（仅保留区域内）
      ctx.globalCompositeOperation = "destination-in";
      ctx.beginPath();
      REGION.forEach(function (p, i) {

      ctx.closePath();
      ctx.fill();

      ctx.globalCompositeOperation = "source-over";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(4, Math.round(7 * W / 1024)); ctx.strokeStyle = "rgba(120, 200, 255, 0.95)";
      ctx.stroke();
      return canvas.toDataURL("image/png");
    }

    function loadImg(src) {
      return new Promise(function (resolve, reject) {
        var im = new Image();
        im.onload = function () { resolve(im); };
        im.onerror = function () { reject(new Error("图片加载失败：" + src)); };
        im.src = src;
      });
    }

    // ============ 初始化 ============
    var map = null, outline = null, active = "park";

    // 场景数据：{ key -> { el:HTMLImageElement, dataUrl:string } }
    var sceneEls = {};
    var overlayDiv = null;       // 容器 div#sceneOverlay
    var currentOpacity = 0.9;
    var visible = true;

    // 坐标转换：LatLng → 地图容器内的像素坐标
    function latLngToPoint(lat, lng) {
      if (!map) return null;
      // 尝试多种可能的 API 名
      var methods = ["projectToContainer", "lngLatToContainerPoint"];
      for (var i = 0; i < methods.length; i++) {
        if (typeof map[methods[i]] === "function") {
          try {
            var pt = map[methods[i]](new TMap.LatLng(lat, lng));
            if (pt && typeof pt.x === "number" && typeof pt.y === "number") {
              return { x: pt.x, y: pt.y };
            }
          } catch (e) {}
        }
      }
      return null;
    }

    // 更新覆盖层位置和尺寸（随地图平移/缩放联动）
    function updateOverlayPosition() {
      if (!overlayDiv || !visible || !sceneEls[active]) return;
      var swPt = latLngToPoint(sw.lat, sw.lng);
      var nePt = latLngToPoint(ne.lat, ne.lng);
      // 防御：任一坐标缺失或值异常则跳过
      if (!swPt || !nePt) return;
      if (!isFinite(swPt.x) || !isFinite(swPt.y) || !isFinite(nePt.x) || !isFinite(nePt.y)) return;
      var w = Math.abs(nePt.x - swPt.x);
      var h = Math.abs(nePt.y - swPt.y);
      if (w <= 0 || h <= 0) return; // 尺寸无效则不渲染
      overlayDiv.style.left = Math.min(swPt.x, nePt.x) + "px";
      overlayDiv.style.top = Math.min(swPt.y, nePt.y) + "px";
      overlayDiv.style.width = w + "px";
      overlayDiv.style.height = h + "px";
    }

    function init() {
      if (!window.TMap || !TMap.Map) { hint("腾讯地图 JS API 未加载（请检查 Key 域名白名单）", true); return; }
      overlayDiv = document.getElementById("sceneOverlay");
      try {
        map = new TMap.Map("map", {
          center: new TMap.LatLng(center.lat, center.lng),
          zoom: 13.6, pitch: 0, rotation: 0,
          baseMap: { type: "vector", features: ["base", "building", "point"] }

        // 区域边界（始终可见，便于定位）
        outline = new TMap.MultiPolygon({
          map: map,
          geometries: [{ styleId: "polygon", paths: REGION.map(function (p) { return new TMap.LatLng(p.lat, p.lng); }) }],
          styles: { polygon: new TMap.PolygonStyle({ color: "rgba(78,161,255,0.10)", borderColor: "rgba(120,200,255,0.9)", borderWidth: 3, borderStyle: "solid" }) }
        });
        hint("地图已加载，正在合成场景图层…");

        // 监听地图移动/缩放 → 联动更新覆盖层位置
        try { map.on("update", updateOverlayPosition); } catch (e) {}
        try { map.on("zoom_changed", updateOverlayPosition); } catch (e) {}
        try { map.on("center_changed", updateOverlayPosition); } catch (e) {}

        // 预加载 3 张场景图并合成裁剪后的 data URL
        Promise.all(Object.keys(SCENES).map(function (k) { return loadImg(SCENES[k]); }))
          .then(function (imgs) {
            var keys = Object.keys(SCENES);
            keys.forEach(function (k, i) {
              var dataUrl = buildSceneSrc(imgs[i]);
              var img = document.createElement("img");
              img.src = dataUrl;
              img.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none;";
              overlayDiv.appendChild(img);
              sceneEls[k] = { el: img, dataUrl: dataUrl };
            });
            // 显示默认场景
            showScene(active);
            // 初始定位
            updateOverlayPosition();
            hint("就绪 ✓ 当前场景：" + SCENE_LABEL[active] + "。可在控制台切换 / 调透明度。");
            wireControls();
          })
          .catch(function (e) { hint("场景图合成失败：" + (e.message || e), true); });
      } catch (e) { hint("初始化失败：" + (e.message || e), true); }
    }

    // 显示指定场景（隐藏其他）
    function showScene(key) {
      if (!overlayDiv) return;
      Object.keys(sceneEls).forEach(function (k) {
        sceneEls[k].el.style.display = k === key ? "block" : "none";
      });
      active = key;
      // 确保容器可见
      if (visible) overlayDiv.style.display = "block";
    }

    function setOverlayOpacity(v) {
      currentOpacity = v;
      overlayDiv.style.opacity = String(v);
    }

    function setOverlayVisible(v) {
      visible = v;
      overlayDiv.style.display = v ? "block" : "none";
      if (v) updateOverlayPosition();
    }

    function wireControls() {
      // 场景切换
      document.getElementById("sceneSeg").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-s]"); if (!b) return;
        var s = b.getAttribute("data-s"); if (s === active) return;
        showScene(s);
        Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.classList.toggle("on", x === b); });
        hint("已切换场景：" + SCENE_LABEL[s]);
      });
      // 透明度
      var op = document.getElementById("op");
      op.addEventListener("input", function () {
        var v = (+op.value) / 100;
        setOverlayOpacity(v);
        document.getElementById("opVal").textContent = op.value + "%";
      });
      // 显隐
      document.getElementById("vis").addEventListener("change", function () {
        setOverlayVisible(this.checked);
        hint(this.checked ? "覆盖层已显示" : "覆盖层已隐藏");

        try { map.setMapStyleId(this.value || ""); hint(this.value ? "底图样式：" + this.value : "底图样式：标准矢量"); }
        catch (e) { hint("切换底图样式失败：" + (e.message || e), true); }
      });

        try { map.fitBounds(new TMap.LatLngBounds(new TMap.LatLng(sw.lat, sw.lng), new TMap.LatLng(ne.lat, ne.lng)), { padding: 60 }); } catch (e) {}
        // 飞行动画结束后重新定位覆盖层
        setTimeout(updateOverlayPosition, 500);
      });
