	<meta charset="utf-8">
	<title>Flex 可视化学习 - www.lilnong.top</title>

<body>
	<style>
		*{
			font-size: 12px;
		}
		h3 span{
			font-size: 16px;font-weight: bold;
			border-bottom: 1px dashed #eee;
		}
		/* h3 + label{
			margin-left: 2em;
		} */
	</style>
	<div id="app">
		<h1>Flex 可视化学习</h1>
		<div style="display: flex;"  v-for="box in parentList">
			<div style="flex: 1 0 200px">
				<h2>盒子属性设置</h2>
				<div>
					<div v-for="item in parentAttr" :key="item.key">
						<h3><el-checkbox v-model="box[item.key].checked"></el-checkbox> <span>{{item.key}}</span></h3>
						<template v-if="item.type == 'select'">
							<el-select  style="width: 120px" v-model="box[item.key].value">
								<el-option :value="option" :label="option" v-for="option in item.values" :key="option"></el-option>
							</el-select>
						</template>
						<template v-else-if="item.type == 'number'">
							<el-input style="width: 120px" type="number"  v-model="box[item.key].value"></el-input>
						</template>
						<template v-else>
							<el-input style="width: 120px" v-model="box[item.key].value"></el-input>
						</template>
					</div>
				</div>
			</div>
			<div style="flex: 1 1 800px">
				<h2>预览 <button @click="add(box.list)">add child</button></h2>
				<div style="display: flex;" :style="filterStyle(parentAttr, box)">
					<div v-for="child in box.list" :style="filterStyle(childAttr, child)">
						<div>id: {{child.id}}</div>
						<div v-for="item in childAttr" :key="item.key" >
							<h3><el-checkbox v-model="child[item.key].checked"></el-checkbox> <span>{{item.key}}</span></h3>
							
							<template v-if="item.type == 'select'">
								<el-select  style="width: 120px" v-model="child[item.key].value">
									<el-option :value="option" :label="option" v-for="option in item.values" :key="option"></el-option>
								</el-select>
							</template>
							<template v-else-if="item.type == 'number'">
								<el-input style="width: 120px" type="number"  v-model="child[item.key].value"></el-input>
							</template>
							<template v-else>
								<el-input style="width: 120px" v-model="child[item.key].value"></el-input>
							</template>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		count = 0;
		vm = new Vue({
			el: '#app',
			data(){
				return {
					parentList: [
						{
							'flex-direction': {
								value: 'row',
								checked: false,
							},
							'justify-content': {
								value: 'center',
								checked: false,
							},
							'align-items': {
								value: 'center',
								checked: false,
							},
							'align-content': {
								value: 'center',
								checked: false,
							},
							'flex-wrap': {
								value: 'nowrap',
								checked: false,
							},
							list: []
						}
					],
					parentAttr: [
						{
							key: 'flex-direction',
							values: ['row','row-reverse','column','column-reverse'],
							desc: '主轴可以通过flex-direction来进行设置，取值为row和column。当为row时，justify-content 控制水平方向的布局，align-items 控制垂直方向的布局。当为column时，justify-content 控制垂直方向的布局，align-items 控制水平方向的布局。',
							default: '',
							// value: 'row',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'justify-content',
							values: ['flex-start','flex-end','center',"space-between","space-around"],
							desc: '主轴方向的布局方式',
							default: '',
							// value: 'nowrap',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'align-items',
							values: ['flex-start','flex-end','center',"space-between","space-around"],
							desc: '交叉轴方向的布局方式',
							default: '',
							// value: 'nowrap',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'align-content',
							values: ['flex-start','flex-end','center','stretch',"space-between","space-around"],
							default: '',
							// value: 'nowrap',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'flex-wrap',
							values: ['nowrap','wrap','wrap-reverse'],
							default: '',
							// value: 'nowrap',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
					],
					childAttr: [
						{
							key: 'order',
							default: '',
							type: "number",// select选择，text字符串，number数值，px单位
						},
						{
							key: 'flex-grow',
							default: '',
							type: "number",// select选择，text字符串，number数值，px单位
						},
						{
							key: 'flex-shrink',
							default: '',
							type: 'number',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'flex-basis',
							default: '',
							type: 'px',// select选择，text字符串，number数值，px单位
						},
						{
							key: 'align-self',
							values: ['auto','flex-start','flex-end','center','base-line'],
							default: 'auto',
							type: 'select',// select选择，text字符串，number数值，px单位
						},
					],
					list: [

					]
				}
			},
			computed:{
			},
			mounted(){
				// this.parentList[0]
				for(let i = 0;i < 3;i++)
					this.add(this.parentList[0].list)
			},
			methods:{
				filterStyle(styleObj, values){
					var obj = {};
					// for(let i in styleObj){
					styleObj.forEach((element, i) => {
						var key = element.key
						let value = values[key];
						if(value.checked){
							obj[key] = value.value;	
						}
					});
					// }
					return obj
				},
				add(list){
					list.push({
						//id: Date.now() + Math.random(),
						id: ++count,
						'order': {
							value: 0,
							checked: false,
						},
						'flex-grow': {
							value: 0,
							checked: false,
						},
						'flex-shrink': {
							value: 0,
							checked: false,
						},
						'flex-basis': {
							value: "200px",
							checked: true,
						},
						'align-self': {
							value: 'auto',
							checked: false,
						} 
					})
				}
			}
		})
	</script>
