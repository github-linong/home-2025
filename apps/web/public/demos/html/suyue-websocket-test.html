	<div id="app">
		<button onclick="ws.send(JSON.stringify({type: 'reset'}))">reset</button>
		<button onclick="ws.send(JSON.stringify({type: 'getConfig'}))">getConfig</button>
		<button onclick="ws.send(JSON.stringify({type: 'getLogs'}))">getLogs</button>
		<hr>
		<textarea id="textarea" style="resize:both;width: 300px;height: 300px"></textarea>
		<button onclick="ws.send(JSON.stringify({type: 'setConfig', response: textarea.value.trim()}))">setConfig</button>
		<button onclick="ws.send(JSON.stringify({type: 'setConfigAddTime', response: textarea.value.trim()}))">setConfigAddTime</button>

		<!-- <button onclick="ws.send(JSON.stringify({type: 'setConfig', response: JSON.parse(textarea.value)}))">setConfig JSON</button> -->
	</div>
	<ul>
		<li>setConfig <span>设置定时json，并开启新一轮的推送</span></li>
		<li>setConfigAddTime <span>设置定时json，并累加timeout，并开启新一轮的推送</span></li>
		<li>reset <span>开启新一轮的推送</span></li>
		<li>getConfig <span>获取服务端推送配置</span></li>
		<li>getLogs  <span>获取服务端日志（不推荐使用）</span></li>
		<li>sendMessage <span>发什么，返回什么 {type: 'sendMessage',response:{}}<span></li>
	</ul>
	<script type="text/javascript">
		var ws
		var initWs = function initWs(){
			var protocol = 'ws'
			if(location.protocol == "http:"){
				protocol = 'ws'
			}else{
				protocol = 'wss'
			}
			ws = new WebSocket(protocol+"://ws.lilnong.top/suyue");
			ws.onopen = function (e) {console.log('连接成功');}
			//收到消息处理
			ws.onmessage = function (e) {
			    console.log(e)
			}
			//监听连接关闭情况
			ws.onclose = function (e) {
			    setTimeout(v=>initWs(), 2000);
			    console.log('连接关闭');
			}
		}
		initWs();
	</script>
	<script type="text/javascript">
		setInterval(v=>{
			ws.send(JSON.stringify({type: 'ping'}))
