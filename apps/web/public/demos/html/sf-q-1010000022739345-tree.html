	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>

<body>
	<div id="app">
		<el-tree :data="computedData" :props="defaultProps" @node-click="handleNodeClick"></el-tree>
	</div>
	<script>
		new Vue({
			el: '#app',
			data() {
				return {
					data: [{
						label: '一级 1',
						children: [{
							label: '二级 1-1',
							children: [],
							types: [
								{
									label: '三级 1-1-1'
								}
							]
						}]
					}, {
						label: '一级 2',
						children: [{
							label: '二级 2-1',
							children: [],
							types: [{
								label: '三级 2-1-1'
							}]
						}, {
							label: '二级 2-2',
							children: [],
							types: [{
								label: '三级 2-2-1'
							}]
						}]
					}, {
						label: '一级 3',
						children: [{
							label: '二级 3-1',
							children: [],
							types: [{
								label: '三级 3-1-1'
							}]
						}, {
							label: '二级 3-2',
							children: [],
							types: [{
								label: '三级 3-2-1'
							}]
						}],
						types: [
							{
								label: '二级 3-3'
							}
						]
					}],
					defaultProps: {
						children: 'children',
						label: 'label'
					}
				}
			},
			computed: {
				computedData(){
					var data = JSON.parse(JSON.stringify(this.data))
					return this.formData_Tree(data)
				}
			},
			methods: {
				formData_Tree(list){
					list.forEach(v=>{
						if(v.types && v.types.length){
							v.children.push(...v.types)
						}
						return (v.children && v.children.length)?this.formData_Tree(v.children):[]
					})
					return list;
				},
				handleNodeClick(data) {
					console.log(data);
				}
			}
		})
	</script>
