	<script type="text/javascript">
		// https://segmentfault.com/q/1010000008464216
		function getSelectionCoords(win) {
		    win = win || window;
		    var doc = win.document;
		    var sel = doc.selection, range, rects, rect;
		    var x = 0, y = 0;
		    if (sel) {
		        if (sel.type != "Control") {
		            range = sel.createRange();
		            range.collapse(true);
		            x = range.boundingLeft;
		            y = range.boundingTop;
		        }
		    } else if (win.getSelection) {
		        sel = win.getSelection();
		        if (sel.rangeCount) {
		            range = sel.getRangeAt(0).cloneRange();
		            if (range.getClientRects) {
		                range.collapse(true);
		                rects = range.getClientRects();
		                if (rects.length > 0) {
		                    rect = rects[0];
		                }
		                // 光标在行首时，rect为undefined
		                if(rect){
		                    x = rect.left;
		                    y = rect.top;
		                }
		            }
		            // Fall back to inserting a temporary element
		            if ((x == 0 && y == 0) || rect === undefined) {
		                var span = doc.createElement("span");
		                if (span.getClientRects) {
		                    // Ensure span has dimensions and position by
		                    // adding a zero-width space character
		                    span.appendChild( doc.createTextNode("\u200b") );
		                    range.insertNode(span);
		                    rect = span.getClientRects()[0];
		                    x = rect.left;
		                    y = rect.top;
		                    var spanParent = span.parentNode;
		                    spanParent.removeChild(span);

		                    // Glue any broken text nodes back together
		                    spanParent.normalize();
		                }
		            }
		        }
		    }
		    return { x: x, y: y };
		}
	</script>
	<script type="text/javascript">
		new Vue({
		  el: '#app',
		  data(){
		    return {
		     	destList:{
		     		x: 0,
		     		y: 0,
		     		isShow: false,
		     	}
		    }
		  },
		  methods:{
		    inputHandler(e){
			    var selection = document.getSelection()
			    if(selection.isCollapsed && selection.anchorNode.nodeType == 3){
					// 非选区状态 && 文本节点

					// 当前区域，光标之前内容
					var str = selection.anchorNode.nodeValue.slice(0, selection.anchorOffset);
					// 最后一个@的位置
					var lastDestIdx = str.lastIndexOf('@');
					// 获取最后一个@之后的字符串为查询字符串
					if(lastDestIdx == -1){
						// 未查询到@符号
			    		console.log(str, lastDestIdx, lastDestQuery, e)
						return this.destList.isShow = false;//直接隐藏
					}else{
						var lastDestQuery = str.slice(lastDestIdx + 1);
						this.destList.x = getSelectionCoords().x
						this.destList.y = getSelectionCoords().y

			    		console.log(str, lastDestIdx, lastDestQuery, e)
						return this.destList.isShow = true;//显示
					}
			    }else{
			      // 选区状态
			      return this.destList.isShow = false;//直接隐藏
			    }
		    }
		  }
		})
	</script>
