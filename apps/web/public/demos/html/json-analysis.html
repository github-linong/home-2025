<body>
	<div id="app">
		<div>
			JSON 在线解析
    		<i-button type="success" @click="gshyz">格式化并验证</i-button>
    		<i-button @click="yz">验证</i-button>
    		<i-button @click="gsh">格式化</i-button>
    		<i-button @click="mh">美化</i-button>
    		<i-input v-model="spaceValue" placeholder="Enter something..." style="width: 300px" ></i-input>
    		<div>
	    		<i-button @click="yszy">压缩并转义</i-button>
	    		<i-button @click="qczy">去除转义</i-button>
	    		<i-button @click="json2xml">JSON2XML</i-button>
	    		<i-button @click="json2csv">JSON2CSV</i-button>
    		</div>
		</div>
		<div id="clog">
			<Alert :type="tipsType" show-icon v-show="tips">{{tips}}</Alert>
		</div>
		<div>
			<textarea ref="myTextarea">{test: 1}</textarea>
		</div>
	</div>
	<style type="text/css">
		#clog{
			padding: 10px;
			min-height: 50px;
		}
		.CodeMirror{
			height: 600px;
		}
	</style>
	<script type="text/javascript">
		new Vue({
			el: '#app',
			data(){
				return {
					editor: null,
					jsonStr: '',
					spaceValue: 2,
					tips: '',
					tipsType: 'info'
				}
			},
			mounted(){
				this.$refs.myTextarea.value = localStorage.getItem(location.href)
				window.editor = CodeMirror.fromTextArea(this.$refs.myTextarea, {
			        lineNumbers: true,
			        height: '500px',
			        change: ()=>console.log('改变了'),
				    styleActiveLine: true,
				    matchBrackets: true,
				    theme: 'mbo'
			    });
			    editor.on('change', ()=>this.save())
			},
			methods:{
				save(){
					localStorage.setItem(location.href, window.editor.getValue())
				},
				gshyz(){
					this.tips = '格式化并验证失败'
					this.tipsType = 'error'
					this.gsh()
					this.yz()
					this.tips = '格式化并验证成功';
					this.tipsType = 'success'
				},
				yz(){
					this.jsonStr = window.editor.getValue()
					try{
						JSON.parse(this.jsonStr);
						this.tips = '验证成功';
						this.tipsType = 'success'
					}catch(e){
						console.warn(e);
						this.tips = '验证失败'
						this.tipsType = 'error'
					}
				},
				gsh(){
					this.jsonStr = window.editor.getValue()
					var json = null;
					try{
						json = JSON.parse(this.jsonStr);
						this.tips = '格式化成功';
						this.tipsType = 'success'
					}catch(e){
						try{
							json = eval(`(${this.jsonStr})`)
							this.tips = '格式化成功';
							this.tipsType = 'success'
						}catch(e){
							console.warn(e);
							this.tips = '格式化失败'
							this.tipsType = 'error'
						}
					}
					var str = JSON.stringify(json)
					window.editor.setValue(str)
				},
				mh(){
					this.jsonStr = window.editor.getValue()
					var json = null;
					try{
						json = JSON.parse(this.jsonStr);
						this.tips = '美化成功';
						this.tipsType = 'success'
					}catch(e){
						try{
							json = eval(`(${this.jsonStr})`)
							this.tips = '美化成功';
							this.tipsType = 'success'
						}catch(e){
							console.warn(e);
							this.tips = '美化失败'
							this.tipsType = 'error'
						}
					}
					window.editor.setValue(JSON.stringify(json, null, +this.spaceValue))
				},
				yszy(){
					try{
						window.editor.setValue(JSON.stringify(JSON.stringify(JSON.parse(window.editor.getValue()))))
						this.tips = '压缩并转义成功';
						this.tipsType = 'success'
					}catch(e){
						this.tips = '压缩并转义失败'
						this.tipsType = 'error'
					}
				},
				qczy(){
					try{
						window.editor.setValue(JSON.stringify(JSON.parse(JSON.parse(window.editor.getValue()))))
						this.tips = '去除转义成功';
						this.tipsType = 'success'
					}catch(e){
						this.tips = '去除转义失败'
						this.tipsType = 'error'
					}
				},
				json2xml(){
					this.jsonStr = window.editor.getValue()
					var json = null;
					try{
						json = JSON.parse(this.jsonStr);
					}catch(e){
						try{
							json = eval(`(${this.jsonStr})`)
						}catch(e){}
					}

					var str = `<?xml version="1.0" encoding="UTF-8" ?>`
					str+=this.json2xmlFun(json);
					console.log(str)
				},
				json2xmlFun(data, key){
					var str = '';
					if(typeof data != 'object') return data;
					// if(Array.isArray(data)){
					// 	for(var i in data){
					// 		str+=`<${i}>${this.json2xmlFun(data[i])}</${i}>`
					// 	}
					// }
					for(var i in data){
						str+=`<${i}>${this.json2xmlFun(data[i])}</${i}>`
					}
					return str
				},
				json2csv(){

				},
			}
		})
	</script>
