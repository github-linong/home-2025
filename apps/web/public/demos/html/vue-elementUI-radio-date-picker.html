<head>
	<meta charset="utf-8">
	<title>Vue element-ui 实现时间范围组件 - www.lilnong.top</title>
	<meta keywords="vue,element-ui">
	<meta description="时间范围选择组件">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>

	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
		<div>
			<div>radio:{{radio}}</div>
			<div>value1:{{value1}}</div>
			<div>computedValue:{{computedValue}}</div>
		</div>
		<el-radio-group v-model="radio"
			@change="value1 = []">
			<el-radio :label="item.val" v-for="item in radioList">{{item.txt}}</el-radio>
			<!-- <el-radio :label="3">备选项</el-radio> -->
			<!-- <el-radio :label="6">备选项</el-radio> -->
			<!-- <el-radio :label="9">备选项</el-radio> -->
		</el-radio-group>
		<el-date-picker
			v-model="value1"
			@change="radio = ''"
			type="datetimerange"
			range-separator="至"
			start-placeholder="开始日期"
			end-placeholder="结束日期">
		</el-date-picker>

	</div>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					radioList: [],
					radio: '',
					value1: []
				}
			},
			computed:{
				computedValue(){
					if(this.radio){
						return this.radio
					}else{
						return this.value1
					}
				}
			},
			mounted(){
				var date = new Date();
				date.setMonth(0)
				date.setDate(1)
				date.setHours(0,0,0,0)
				for(var i = 0; i<3; i++){
					this.radioList.push({
						txt: date.getFullYear() - i,
						val: [`${date.getFullYear() - i}-01-01 00:00:00`,`${date.getFullYear() - i}-12-31 23:59:59`]
					})
					
				}
			}
		})
	</script>
