<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>devicemotion 实现摇一摇功能 - www.lilnong.top</title>
	<meta keywords="devicemotion，摇一摇">
	<meta description="devicemotion 实现摇一摇功能">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <div>
            <!-- <div>acceleration:{{devicemotion.acceleration}}</div>
            <div>accelerationIncludingGravity:{{devicemotion.accelerationIncludingGravity}}</div>
            <div>interval:{{devicemotion.interval}}</div>
            <div>rotationRate:{{devicemotion.rotationRate}}</div>
            <div>timeStamp:{{devicemotion.timeStamp}}</div>
            <div>count:{{devicemotion.count}}</div> -->
            <div>
                <button @click="switchPause">暂停</button>
                <button @click="switchPlay">开始</button>
            </div>

            <h3>实时 devicemotion</h3>
            <pre>{{devicemotionComputed}}</pre>

            <h3>实时 - 上次 devicemotion</h3>
            <pre>{{devicemotionDiffComputedText}}</pre>

            <h3>sum(abs(实时 - 上次)) devicemotion</h3>
            <pre>{{devicemotionTotalComputedText}}</pre>
        </div>
    </div>
    <script>
        devicemotion = null;
        new Vue({
            el: '#app',
            data(){
                return {
                    devicemotion: {
                        acceleration: {x:null, y:null, z:null},
                        accelerationIncludingGravity: {x:null, y:null, z:null},
                        interval: null,
                        rotationRate: {alpha: null, beta: null, gamma: null},
                        timeStamp: 0,
                        count: 0,
                    },
                    totalHistoryDevicemotion: {
                        acceleration: {x:0, y:0, z:0},
                        accelerationIncludingGravity: {x:0, y:0, z:0},
                        rotationRate: {alpha: 0, beta: 0, gamma: 0},
                    },
                    historyDevicemotion: null,

                    devicemotionReturn: false
                }
            },
            methods:{
                switchPause(){
                    this.devicemotionReturn = true;
                },
                switchPlay(){
                    this.devicemotionReturn = false;
                }
            },
            watch:{
                devicemotionDiffComputed(){
                    this.totalHistoryDevicemotion.acceleration.x += Math.abs(this.devicemotionDiffComputed.acceleration.x)
                    this.totalHistoryDevicemotion.acceleration.y += Math.abs(this.devicemotionDiffComputed.acceleration.y)
                    this.totalHistoryDevicemotion.acceleration.z += Math.abs(this.devicemotionDiffComputed.acceleration.z)
                    
                    this.totalHistoryDevicemotion.accelerationIncludingGravity.x += Math.abs(this.devicemotionDiffComputed.accelerationIncludingGravity.x)
                    this.totalHistoryDevicemotion.accelerationIncludingGravity.y += Math.abs(this.devicemotionDiffComputed.accelerationIncludingGravity.y)
                    this.totalHistoryDevicemotion.accelerationIncludingGravity.z += Math.abs(this.devicemotionDiffComputed.accelerationIncludingGravity.z)

                    this.totalHistoryDevicemotion.rotationRate.alpha += Math.abs(this.devicemotionDiffComputed.rotationRate.alpha)
                    this.totalHistoryDevicemotion.rotationRate.beta += Math.abs(this.devicemotionDiffComputed.rotationRate.beta)
                    this.totalHistoryDevicemotion.rotationRate.gamma += Math.abs(this.devicemotionDiffComputed.rotationRate.gamma)
                }
            },
            computed:{
                devicemotionComputed(){
                    return JSON.stringify(this.devicemotion, null, 2)
                },
                devicemotionDiffComputed(){
                    if(this.devicemotion && this.historyDevicemotion){
                        return ({
                            acceleration: {
                                x:this.historyDevicemotion.acceleration.x - this.devicemotion.acceleration.x, 
                                y:this.historyDevicemotion.acceleration.y - this.devicemotion.acceleration.y, 
                                z:this.historyDevicemotion.acceleration.z - this.devicemotion.acceleration.z
                            },
                            accelerationIncludingGravity: {
                                x:this.historyDevicemotion.accelerationIncludingGravity.x - this.devicemotion.accelerationIncludingGravity.x, 
                                y:this.historyDevicemotion.accelerationIncludingGravity.y - this.devicemotion.accelerationIncludingGravity.y, 
                                z:this.historyDevicemotion.accelerationIncludingGravity.z - this.devicemotion.accelerationIncludingGravity.z
                            },
                            rotationRate: {
                                alpha: this.historyDevicemotion.rotationRate.alpha - this.devicemotion.rotationRate.alpha, 
                                beta: this.historyDevicemotion.rotationRate.beta - this.devicemotion.rotationRate.beta, 
                                gamma: this.historyDevicemotion.rotationRate.gamma - this.devicemotion.rotationRate.gamma},
                        })
                    }
                },
                devicemotionDiffComputedText(){
                    return JSON.stringify(this.devicemotionDiffComputed, null, 2)
                },
                devicemotionTotalComputedText(){
                    return JSON.stringify(this.totalHistoryDevicemotion, null, 2)
                }
            },
            mounted(){
                window.addEventListener('devicemotion', (e) => {
                    console.log(e)
                    if(this.devicemotionReturn) return ;
                    this.historyDevicemotion = JSON.parse(JSON.stringify(this.devicemotion))
                    this.devicemotion.acceleration.x = e.acceleration.x.toFixed(5)
                    this.devicemotion.acceleration.y = e.acceleration.y.toFixed(5)
                    this.devicemotion.acceleration.z = e.acceleration.z.toFixed(5)

                    this.devicemotion.accelerationIncludingGravity.x = e.accelerationIncludingGravity.x.toFixed(5)
                    this.devicemotion.accelerationIncludingGravity.y = e.accelerationIncludingGravity.y.toFixed(5)
                    this.devicemotion.accelerationIncludingGravity.z = e.accelerationIncludingGravity.z.toFixed(5)

                    this.devicemotion.interval = e.interval

                    this.devicemotion.rotationRate.alpha = e.rotationRate.alpha.toFixed(5)
                    this.devicemotion.rotationRate.beta = e.rotationRate.beta.toFixed(5)
                    this.devicemotion.rotationRate.gamma = e.rotationRate.gamma.toFixed(5)

                    this.devicemotion.timeStamp = e.timeStamp

                    this.devicemotion.count++
                })
            }
        })
    </script>
