	<script type="text/javascript">
		const isMobile = /(phone|pad|pod|iPhone|iPod|ios|iPad|Android|Mobile|BlackBerry|IEMobile|MQQBrowser|JUC|Fennec|wOSBrowser|BrowserNG|WebOS|Symbian|Windows Phone)/i.test(navigator.userAgent);
		const canvas = document.getElementById('canvas');
		// canvas.width=document.body.clientWidth
		// canvas.height=Math.min(window.innerHeight, 500)

		context = canvas.getContext('2d')
		context.lineWidth = 6;         // 直线宽度
		context.strokeStyle = 'black';     // 路径的颜色
		context.lineCap = 'round';         // 直线首尾端圆滑
		context.lineJoin = 'round';     // 当两条线条交汇时，创建圆形边角
		context.shadowBlur = 12;         // 边缘模糊，防止直线边缘出现锯齿
		context.shadowColor = 'black';  // 边缘颜色

		const points = []
		const point = {};
		let pressed = false; // 标示是否发生鼠标按下或者手指按下事件
		const createCanvasMouseEvent = signal => (e) => {
			const { left, top } = canvas.getBoundingClientRect();
		  if (signal === 1) {
		    pressed = true;
		  }
		  if (signal === 1 || pressed) {
		    e = isMobile ? e.touches[0] : e;
		    // point.x = e.clientX - left + 0.5; // 不加0.5，整数坐标处绘制直线，直线宽度将会多1px(不理解的不妨谷歌下)
		    // point.y = e.clientY - top + 0.5;
		    point.x = (e.clientX * 2) - left ; // 不加0.5，整数坐标处绘制直线，直线宽度将会多1px(不理解的不妨谷歌下)
		    point.y = (e.clientY * 2) - top ;
		    paint(signal);
		    points.push(point)
		  }
		};
		const start = createCanvasMouseEvent(1);
		const move = createCanvasMouseEvent(2);
		const requestAnimationFrame = window.requestAnimationFrame;
		const optimizedMove = requestAnimationFrame ? (e) => {
		  requestAnimationFrame(() => {
		    move(e);
		  });
		} : move;

        context.beginPath();
		const paint = (signal) => {
		  switch (signal) {
		    case 1: // 开始路径
		      context.moveTo(point.x, point.y);
		    case 2: // 前面之所以没有break语句，是为了点击时就能描画出一个点
		      context.lineTo(point.x, point.y);
		      context.clearRect(0,0,canvas.width,canvas.height)
		      context.stroke();
		      break;
		  }
		};

		// const touchstart = (e) => {
		//   /* TODO 定义起点 */
		//   // 开始路径（beginPath）
		//   // 定位起点（moveTo）
		//   // 移动画笔（lineTo）
		//   // 绘制路径（stroke）

		// };
		// const touchmove = (e) => {
		//   /* TODO 连点成线，并且填充颜色 */

		// };

		canvas.addEventListener('touchstart', start);
		canvas.addEventListener('touchmove', optimizedMove);

		  canvas.addEventListener('mousedown', start);
		  canvas.addEventListener('mousemove', optimizedMove);
		  ['mouseup', 'mouseleave'].forEach((event) => {
		    canvas.addEventListener(event, () => {
		      pressed = false;
		    });
		  });
	</script>
