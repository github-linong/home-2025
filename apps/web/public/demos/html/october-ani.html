	<style type="text/css">
		.ani-wrap{
			width: 300px;
			height: 300px;
			position: relative;
			background: #0cc
		}
		.ani-item{
			position: absolute;
			top: 50%;left: 50%;
			margin-left: -30px;margin-top: -30px;
		}
		/*.ani-item:nth-child(1){transform: translate(0, 100px);}
		.ani-item:nth-child(2){transform: translate(100px, 0);}
		.ani-item:nth-child(3){transform: translate(100px, 100px);}
		.ani-item:nth-child(4){transform: translate(-100px, 100px);}
		.ani-item:nth-child(5){transform: translate(100px, -100px);}
		.ani-item:nth-child(6){transform: translate(-100px, -100px);}
		.ani-item:nth-child(7){transform: translate(-100px, 0);}
		.ani-item:nth-child(8){transform: translate(0, -100px);}*/
		.ani-item{animation-iteration-count: 1;animation-fill-mode: forwards;animation-timing-function: linear;}
		.ani-item:nth-child(1){transform: translate(-120px, -100px);animation-name: mymove;animation-duration: 3s;}
		.ani-item:nth-child(2){transform: translate(-60px, -100px);animation-name: mymove;animation-duration: 2s;}
		.ani-item:nth-child(3){transform: translate(0px, -100px);animation-name: mymove;animation-duration: 1.8s;}
		.ani-item:nth-child(4){transform: translate(60px, -100px);animation-name: mymove;animation-duration: 3s;}
		.ani-item:nth-child(5){transform: translate(120px, -100px);animation-name: mymove;animation-duration: 2s;}
		.ani-item:nth-child(6){transform: translate(-120px, 100px);animation-name: mymove;animation-duration: 2s;}
		.ani-item:nth-child(7){transform: translate(-60px, 100px);animation-name: mymove;animation-duration: 3s;}
		.ani-item:nth-child(8){transform: translate(0px, 100px);animation-name: mymove;animation-duration: 2s;}
		.ani-item:nth-child(9){transform: translate(60px, 100px);animation-name: mymove;animation-duration: 1.5s;}
		.ani-item:nth-child(10){transform: translate(120px, 100px);animation-name: mymove;animation-duration: 3s;}

		@keyframes mymove{
			to {transform: translate(0, 0);}
		}

	</style>
	<div id="app">
		<div class="ani-wrap">
			<div
				class="ani-item" 
				v-for="i in 10" 
				style="width: 60px;height: 60px;background: url(//www.lilnong.top/static/img/2020october/word-list.png) 0 0;background-size: 120px;background-position: 0 0;"
				:style="{
					'background-position': `0 -${i*60-60}px`,
				}">

					<!-- 'transform': `translate(${i%2==0?'':'-'}${i%2==0?'100':'0'}px, ${i%2==0?'':'-'}${i%2==0?'100':'0'}px)` -->
			</div>
		</div>
		<div style="display:flex;flex-wrap:wrap;">
			<div style="width: 20%;display: flex;justify-content: center;align-items: center;" v-for="i in 10" >
				<div style="width: 60px;height: 60px;background: url(//www.lilnong.top/static/img/2020october/word-list.png) 0 0;background-size: 120px;background-position: 0 0;"
			:style="{'background-position': `0 -${i*60-60}px`}"></div>
			</div>
		</div>
		<img src="/static/img/2020october/word-list.png">
	</div>
