<body>
	<div id="app">
		<button id="openVibrate" class="btn btn-info">开启持续震动</button>
		<button id="stopVibrate" class="btn btn-danger">关闭持续震动</button>
		<button id="showVibrate" class="btn btn-info">震动一下</button>
		<button id="reload" onclick="location.reload(true)" class="btn btn-info">刷新</button>
	</div>
	<div id="accelerationIncludingGravityValue"></div>
	<div id="deviceorientationValue"></div>
	<script type="text/javascript">
		vibrateInterval = 0;
		openVibrate.onclick = function(){
			clearInterval(vibrateInterval)
			vibrateInterval = setInterval(function(){
				startVibrate(1000)
			}, 1500)
		}
		stopVibrate.onclick = function(){
			clearInterval(vibrateInterval)
			startVibrate(0);
		}
		showVibrate.onclick = function(){
			startVibrate(300)	
		}
		startVibrate = function(duration){
			navigator.vibrate(duration);
		}
	</script>
	<script type="text/javascript">
		var lastDevicemotion={}; 
		var devicemotionCount = 0;
		var startTime = Date.now();
		window.addEventListener('devicemotion', function(e){	// DeviceMotionEvent
			var acceleration = event.accelerationIncludingGravity;
			var x = Math.abs(acceleration.x-lastDevicemotion.X)>>0
			var y = Math.abs(acceleration.y-lastDevicemotion.y)>>0
			var z = Math.abs(acceleration.z-lastDevicemotion.z)>>0
			devicemotionCount++;
			if(x> 30 || y> 30 || z> 30){
		    	accelerationIncludingGravityValue.style.background='#0f0'
				accelerationIncludingGravityValue.innerText = `摇了，${(Date.now()-startTime)/devicemotionCount >> 0}/ms，${devicemotionCount}\nx:${acceleration.x}-${x}\ny:${acceleration.y}-${y}\nz:${acceleration.z}-${z}`
			}else{
		    	accelerationIncludingGravityValue.style.background='#fff'
				accelerationIncludingGravityValue.innerText = `没摇，${(Date.now()-startTime)/devicemotionCount >> 0}/ms，${devicemotionCount}\nx:${acceleration.x}-${x}\ny:${acceleration.y}-${y}\nz:${acceleration.z}-${z}`
			}
			lastDevicemotion = acceleration;
		}, false);

		var lastDeviceorientation={};    // 用来存储上一次的deviceorientation事件
		var deviceorientationCount = 0;
		window.addEventListener('deviceorientation', function(e){	//DeviceOrientationEvent
		    var delA = Math.abs(event.alpha - lastDeviceorientation.alpha);    // alpha轴偏转角
		    var delB = Math.abs(event.beta - lastDeviceorientation.beta);    // beta轴偏转角
		    var delG = Math.abs(event.gamma - lastDeviceorientation.gamma);    // gamma轴偏转角
		    lastDeviceorientation = event;    // 存储上一次的event
		    deviceorientationCount++
		    if ( (delA > 15 && delB > 15) || (delA > 15 && delG > 15) || (delB > 15 || delG > 15)) {
		    	deviceorientationValue.style.background='#f00'
				deviceorientationValue.innerText = `摇了，${(Date.now()-startTime)/deviceorientationCount >> 0}/ms，${deviceorientationCount}\nalpha:${event.alpha}\ny:${event.beta}\nz:${event.gamma}`
		    }else{
		    	deviceorientationValue.style.background='#fff'
				deviceorientationValue.innerText = `没摇，${(Date.now()-startTime)/deviceorientationCount >> 0}/ms，${deviceorientationCount}\nalpha:${event.alpha}\ny:${event.beta}\nz:${event.gamma}`
		    }
		}, false);
	</script>
