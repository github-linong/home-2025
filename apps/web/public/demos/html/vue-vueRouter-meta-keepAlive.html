	<div id="app">
		{{keepAlive}}
		{{matched}}
		<p class="nav">
		  <router-link to="/">Go to 首页</router-link>
		  <router-link to="/list">Go to 列表页</router-link>
		  <router-link to="/foo">/foo</router-link>
		  <router-link to="/foo/bar">/foo/bar</router-link>
		  <router-link to="/bar">/bar</router-link>
		  <router-link :to="{name: 'HOMEBAE', query: {random: Math.random()}}">/bar queryRandom</router-link>
		  <router-link :to="{name: 'HOMEBAE', query: {random: Math.random()}, params: {random: Math.random()}}">/bar queryRandom paramsRandom</router-link>
		</p>

		<!-- <router-view></router-view> -->

	        <router-view v-if="keepAlive"></router-view>
	    </keep-alive>
	    <router-view v-if="!keepAlive"></router-view>
	</div>
	<script type="text/javascript">
		var Foo = {name: 'Foo',template: '<div>Foo <input v-model="input"></div>',watch:{$route(){console.log('Foo','watch')}},activated(){console.log('Foo','activated')},deactivated(){console.log('Foo','deactivated')},data(){return {input:'test'}},created(){console.log('created', 'FOO')},mounted(){console.log('mounted', 'FOO')}}
		var Bar = {name: 'Bar',template: '<div>Bar <input v-model="input"></div>',watch:{$route(){console.log('Bar','watch')}},activated(){console.log('Bar','activated')},deactivated(){console.log('Bar','deactivated')},data(){return {input:'test'}},created(){console.log('created', 'BAR')},mounted(){console.log('mounted', 'BAR')}}
		var router = new VueRouter({
		  routes: [
		    {
		      path: '/foo',
		      name: 'HOMFOO',
		      component: Foo,
		      children: [
		        {
		          path: 'bar',
		          component: Bar,
		          meta: { 
		            keepAlive: true 
		          }
		        }
		      ]
		    },
		    {
		      path: '/bar',
		      name: 'HOMEBAE',
	          component: Bar,
	          meta: { 
	            keepAlive: true 
	          }
		    }
		  ]
		})
		vm = new Vue({
			el: '#app',
			router,
			data(){
				return {

				}
			},
			computed:{
				keepAlive(){
					return this.$route.meta.keepAlive
				},
				matched(){
					console.log('matched', this.$route.matched)
					// return JSON.stringify(this.$route.matched)//{{$route.matched}}
				}
			}
		})

	</script>
