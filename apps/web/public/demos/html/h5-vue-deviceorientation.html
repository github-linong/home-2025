<head>
	<meta charset="utf-8">
	<title>deviceorientation 实现摇一摇功能 - www.lilnong.top</title>
	<meta keywords="deviceorientation，摇一摇">
	<meta description="deviceorientation 实现摇一摇功能">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <div>
            <div>
                <button @click="switchPause">暂停</button>
                <button @click="switchPlay">开始</button>
            </div>

            <h3>实时 deviceorientation</h3>
            <pre>{{deviceorientationText}}</pre>

            <h3>实时 max(deviceorientation - historydeviceorientation)</h3>
            <pre>{{maxhistorydeviceorientation}}</pre>
        </div>
    </div>
    <script>
        deviceorientation = null;
        new Vue({
            el: '#app',
            data(){
                return {
                    deviceorientation: {
                        alpha: null, 
                        absolute: false,
                        beta: null, 
                        gamma: null,
                        count: 0,
                        timeStamp: 0,
                        interval: 0
                    },
                    historydeviceorientation: {
                        alpha: null, 
                        absolute: false,
                        beta: null, 
                        gamma: null,
                        count: 0,
                        timeStamp: 0,
                    },
                    max_deviceorientation_historydeviceorientation: {
                        alpha: null, 
                        beta: null, 
                        gamma: null,
                    },
                    deviceorientationReturn: false
                }
            },
            methods:{
                switchPause(){
                    this.deviceorientationReturn = true;
                },
                switchPlay(){
                    this.deviceorientationReturn = false;
                }
            },
            watch:{
            },
            computed:{
                deviceorientationText(){
                    return JSON.stringify(this.deviceorientation, null, 2)
                },
                maxhistorydeviceorientation(){
                    return JSON.stringify(this.max_deviceorientation_historydeviceorientation, null, 2)
                    
                    // return JSON.stringify({
                    //     alpha: this.deviceorientation.alpha - this.historydeviceorientation.alpha, 
                    //     beta: this.deviceorientation.beta - this.historydeviceorientation.beta, 
                    //     gamma: this.deviceorientation.gamma - this.historydeviceorientation.gamma,
                    // }, null, 2)
                }
            },
            mounted(){
                window.addEventListener('deviceorientation', (e) => {
                    console.log(e)
                    if(this.deviceorientationReturn) return;
                    this.historydeviceorientation = JSON.parse(JSON.stringify(this.deviceorientation))
                    if(this.deviceorientation.alpha && this.historydeviceorientation.alpha){
                        this.max_deviceorientation_historydeviceorientation.alpha = Math.max(
                            this.max_deviceorientation_historydeviceorientation.alpha,
                            Math.abs(e.alpha - this.deviceorientation.alpha)
                        ) 
                        this.max_deviceorientation_historydeviceorientation.beta = Math.max(
                            this.max_deviceorientation_historydeviceorientation.beta,
                            Math.abs(e.beta - this.deviceorientation.beta)
                        ) 
                        this.max_deviceorientation_historydeviceorientation.gamma = Math.max(
                            this.max_deviceorientation_historydeviceorientation.gamma,
                            Math.abs(e.gamma - this.deviceorientation.gamma)
                        ) 
                    }
                    this.deviceorientation.alpha = e.alpha
                    this.deviceorientation.absolute = e.absolute
                    this.deviceorientation.beta = e.beta
                    this.deviceorientation.gamma = e.gamma
                    this.deviceorientation.timeStamp = e.timeStamp
                    this.deviceorientation.count++
                    this.deviceorientation.interval =  e.timeStamp / this.deviceorientation.count + 'ms'
                })
            }
        })
    </script>
