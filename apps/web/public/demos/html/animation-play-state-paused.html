<body>
	<style type="text/css">
		body div{
			float:left;
		}
		body img{
			width: 100px;height: 100px;vertical-align: top;
		}
		body img{
			/*display: block;*/vertical-align: top
		}
		@-webkit-keyframes bounce {
		    0%,20%,53%,80%,to {
		        -webkit-animation-timing-function: cubic-bezier(.215,.61,.355,1);
		        animation-timing-function: cubic-bezier(.215,.61,.355,1);
		        -webkit-transform: translateZ(0);
		        transform: translateZ(0)
		    }

		    40%,43% {
		        -webkit-animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        -webkit-transform: translate3d(0,-30px,0);
		        transform: translate3d(0,-30px,0)
		    }

		    70% {
		        -webkit-animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        -webkit-transform: translate3d(0,-15px,0);
		        transform: translate3d(0,-15px,0)
		    }

		    90% {
		        -webkit-transform: translate3d(0,-4px,0);
		        transform: translate3d(0,-4px,0)
		    }
		}

		@keyframes bounce {
		    0%,20%,53%,80%,to {
		        -webkit-animation-timing-function: cubic-bezier(.215,.61,.355,1);
		        animation-timing-function: cubic-bezier(.215,.61,.355,1);
		        -webkit-transform: translateZ(0);
		        transform: translateZ(0)
		    }

		    40%,43% {
		        -webkit-animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        -webkit-transform: translate3d(0,-30px,0);
		        transform: translate3d(0,-30px,0)
		    }

		    70% {
		        -webkit-animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        animation-timing-function: cubic-bezier(.755,.05,.855,.06);
		        -webkit-transform: translate3d(0,-15px,0);
		        transform: translate3d(0,-15px,0)
		    }

		    90% {
		        -webkit-transform: translate3d(0,-4px,0);
		        transform: translate3d(0,-4px,0)
		    }
		}

		@-webkit-keyframes rotate {
		    0%{
		        -webkit-transform: rotate(0deg);
		        transform: rotate(0deg)
		    }
		    100%{
		        -webkit-transform: rotate(360deg);
		        transform: rotate(360deg)
		    }
		}

		@keyframes rotate {
		    0%{
		        -webkit-transform: rotate(0deg);
		        transform: rotate(0deg)
		    }
		    100%{
		        -webkit-transform: rotate(360deg);
		        transform: rotate(360deg)
		    }
		}

		.bounce {
		    -webkit-animation-name: bounce;
		    animation-name: bounce;
		    -webkit-transform-origin: center bottom;
		    transform-origin: center bottom
		}
		.rotate{
		    -webkit-animation-name: rotate;
		    animation-name: rotate;
		    -webkit-transform-origin: center center;
		    transform-origin: center center
		}

		.animated {
		    -webkit-animation-duration: 10s;
		    animation-duration: 10s;
		    -webkit-animation-fill-mode: both;
		    animation-fill-mode: both
		}

		.animated.infinite {
		    -webkit-animation-iteration-count: infinite;
		    animation-iteration-count: infinite
		}
		.ani{
			width: 100px;border-radius: 50%;
		    -webkit-animation-timing-function: linear;
			animation-timing-function: linear;
		}
		.parent.pause,.pause{
			-webkit-animation-play-state: paused;
		    animation-play-state: paused;
		}
		.parent{
			width: 100px;
		    -webkit-animation-name: rotate;
		    animation-name: rotate;
		    -webkit-transform-origin: center center;
		    transform-origin: center center
		    -webkit-animation-duration: 10s;
		    animation-duration: 10s;
		    -webkit-animation-fill-mode: both;
		    animation-fill-mode: both
			-webkit-animation-direction: reverse;
			animation-direction: reverse;
		    -webkit-animation-iteration-count: infinite;
			animation-timing-function: linear;
		    -webkit-animation-play-state: running;
		    animation-play-state: running;
		}
	</style>

	<script type="text/javascript">

			// if(this.classList.contains('rotate')){
				if(window.getComputedStyle(this.parentNode).transform=='none'){
					this.parentNode.style.transform = getComputedStyle(this).transform;
				}else{

				}
				app4img2.style.transform = window.getComputedStyle(this.parentNode).transform;
			// }
			this.classList.toggle('rotate')
			console.log(document.body.querySelectorAll('div').length)
		}
		app5img.ontouchstart = function(){
			console.time('getComputedStyle')
			// if(this.classList.contains('rotate')){
				var transform = getComputedStyle(this).transform;
				this.classList.toggle('rotate')
				var _this = this;
				// setTimeout(function(){
					if(window.getComputedStyle(_this.parentNode).transform=='none'){
						_this.parentNode.style.transform = transform;
					}else{
						_this.parentNode.style.transform = transform + ' '+ window.getComputedStyle(_this.parentNode).transform;
					}
					app4img2.style.transform = window.getComputedStyle(_this.parentNode).transform;
				// })
			// }
			
			console.log(document.body.querySelectorAll('div').length)
			console.timeEnd('getComputedStyle')
		}
	</script>
