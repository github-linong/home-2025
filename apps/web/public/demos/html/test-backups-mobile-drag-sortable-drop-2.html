    				// 插件 排序
    				initSort: function initSort() {
    					var _this = this;
    					if (sortable) return sortable;
    					this.$nextTick(function () {
    						var el = document.getElementById('gift-list');
    						sortable = Sortable.create(el, {
    							delay: 100,
    							sort: true,
    							// touchStartThreshold: 5,
    							scrollSensitivity: 100,
    							// scroll: false, //自动滚动
    							// dragoverBubble: true,
    							animation: 150,
    							ghostClass: 'gift-ghost-item',
    							chosenClass: 'gift-chosen-item',
    							// onChoose: function (/**Event*/evt) {
    							// 	console.log('onChoose')

    							// 	console.log('onUnchoose')

    							onEnd: function onEnd( /**Event*/evt) {
    								// console.log('onEnd',evt);
    								_this.kroomGiftList.splice(evt.newIndex, 0, _this.kroomGiftList.splice(evt.oldIndex, 1)[0]);
    							}
    						});
    					});
    				},

    				// 插件 移除排序
    				destroySort: function destroySort() {

    				// 自写 排序
    				initSortDraggable: function initSortDraggable() {
    					var defaultOptions = {
    						delay: 200,
    						scrollSensitivity: 3,
    						scroll_border: 100
    					};
    					var findParentDom = function findParentDom(className, dom) {
    						if (!className) {
    							return null; // 无效className
    						} else if (!dom) {
    							return null; // 非法DOM
    						} else if (dom.classList.contains(className)) {
    							return dom;
    						} else if (dom.tagName === 'BODY') {
    							return null; //return dom
    						} else {
    							return findParentDom(className, dom.parentNode);
    						}
    					};
    					this.$nextTick(function () {
    						var el = document.querySelector('#gift-list');
    						var _itemArr = el.childNodes; //el.children;
    						var _offset = [];
    						_itemArr.forEach(function (v) {
    							_offset.push({
    								left: v.offsetLeft,
    								top: v.offsetTop
    							});
    						});
    						var _touch_start_time = 0; //触摸开始时间，如果时间内移动了，就是滑动。
    						var _touch_start_isOne = false; //第一次移动标记
    						var _touch_move = true; //应该执行移动还是拖放
    						var _touch_Element = null; //拖放的DOM
    						window._touch_Element_copy = null; //let _touch_Element_copy = null;
    						var _touch_Element_offset = {};
    						el.addEventListener('touchstart', function (e) {
    							_touch_Element = findParentDom('gift-item', e.target);
    							if (_touch_Element) {
    								_touch_Element_offset.top = _touch_Element.offsetHeight / 2;
    								_touch_Element_offset.left = _touch_Element.offsetWidth / 2;
    								_touch_start_time = Date.now();
    								_touch_start_isOne = true;
    							} else {
    								_touch_start_isOne = false;
    								_touch_move = true;
    							}
    						});
    						var scroll_interval = 0;
    						el.addEventListener('touchmove', function (e) {
    							// 第一次进入
    							if (_touch_start_isOne == true) {
    								console.log(Date.now() - _touch_start_time, Date.now() - _touch_start_time < defaultOptions.delay);
    								// 规定事件内，应该走滑动
    								if (Date.now() - _touch_start_time < defaultOptions.delay) {
    									_touch_move = true;
    								} else {
    									_touch_move = false;
    									e.preventDefault();

    									_touch_Element_copy = _touch_Element.cloneNode(true);
    									_touch_Element_copy.classList.add('gift-item--drag');
    									// _touch_Element_copy.
    									el.appendChild(_touch_Element_copy);
    								}
    								_touch_start_isOne = false;
    							} else {
    								// 之后进入
    								if (_touch_move) {
    									// 移动不执行操作
    								} else {
    									e.preventDefault();
    									_touch_Element_copy.style.left = e.targetTouches[0].clientX - _touch_Element_offset.left + 'px';
    									_touch_Element_copy.style.top = e.targetTouches[0].clientY - _touch_Element_offset.top + 'px';
    									if (e.targetTouches[0].clientY < defaultOptions.scroll_border) {
    										if (scroll_interval) {} else {
    											clearInterval(scroll_interval);
    											scroll_interval = setInterval(function () {
    												document.scrollingElement.scrollTop -= defaultOptions.scrollSensitivity;
    											}, 16.7);
    										}
    									} else if (window.innerHeight - e.targetTouches[0].clientY < defaultOptions.scroll_border) {
    										// document.scrollingElement.scrollTop+=defaultOptions.scrollSensitivity
    										if (scroll_interval) {} else {
    											clearInterval(scroll_interval);
    											scroll_interval = setInterval(function () {
    												document.scrollingElement.scrollTop += defaultOptions.scrollSensitivity;
    											}, 16.7);
    										}
    									} else {
    										clearInterval(scroll_interval);
    										scroll_interval = 0;
    									}
    									
    									el.insertBefore(_touch_Element, findParentDom('gift-item', document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY)));
    								}
    							}
    						});
    						el.addEventListener('touchend', function (e) {
    							console.log('touchend', e.target);
    							clearInterval(scroll_interval);
    							scroll_interval = 0;
    							_touch_Element_copy.remove();
    						});
    					});
    				},

    				// 选中
    				checkedItem: function checkedItem(item, index) {
    					var _this2 = this;

    					var _index = this.checkedList.indexOf(index);
    					if (!~_index) {
    						this.checkedList.push(index);
    					} else {
    						this.checkedList.splice(_index, 1);
    					}
    					this.giftList.forEach(function (v) {
    						if (_this2.kroomGiftListHash[v.giftID]) {
    							v.checked = 0;
    						} else {
    							v.checked = -1;
    						}
    					});
    					this.checkedList.forEach(function (v, i) {
    						_this2.giftList[v].checked = i + 1;
    					});
    				},

    				// 移除
    				removeItem: function removeItem(item, index) {

    					this.kroomGiftList.splice(index, 1);
    				},

    				// 保存当前编辑列表
    				saveKroomGiftList: function saveKroomGiftList() {
    					var _this3 = this;

    					if (this.type == 1) {
    						// 新增
    						this.setRoomPrivateGift(JSON.stringify(this.kroomGiftList.concat(this.checkedList.map(function (v) {
    							return {

    						})).map(function (v, i) {
    							return { "giftID": v.giftID, "priotity": i + 1 };
    						})));
    					} else {
    						// 排序
    						this.setRoomPrivateGift(JSON.stringify(this.kroomGiftList.map(function (v, i) {
    							return { "giftID": v.giftID, "priotity": i + 1 };
    						})));
    					}
    				},

    				// 切换列表状态
    				switchNav: function switchNav(type) {
    					var _this4 = this;

    					//1直接添加 2正常视图 3直接编辑
    					this.destroySort();
    					if (type == 1) {
    						this.getRoomPrivateGiftList();

    					} else if (type == 2) {
    						// this.getRoomConfigGiftBaseList();
    						this.getRoomPrivateGiftList();
    					} else if (type == 3) {
    						// this.getRoomConfigGiftBaseList();
    						this.getRoomPrivateGiftList();
    						this.$nextTick(function () {
    							_this4.initSort();
    						});
    					}
    					this.type = type;
    				},

    				//17.4 获取歌房礼物配置基础信息列表
    				getRoomConfigGiftBaseList: function getRoomConfigGiftBaseList() {

    				getRoomPrivateGiftList: function getRoomPrivateGiftList() {

    				delRoomPrivateGift: function delRoomPrivateGift(giftID, item) {

    				//17.2	用户设置歌房专属礼物(全量)
    				setRoomPrivateGift: function setRoomPrivateGift(giftInfo /*{["giftID":1,"priotity":1],["giftID":2,"priotity":2],...}*/) {

    			},

    				kroomGiftListHash: function kroomGiftListHash() {
    					var _obj = {};
