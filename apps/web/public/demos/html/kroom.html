<!DOCTYPE html>
<html>
<head>

	<title>kroom</title>
	<style type="text/css">
		*{padding:0;margin:0;box-sizing: border-box;}
		body,html{min-height: 768px;min-width: 1024px}
		/*color 配置*/
		.m-c{color: #f6f6f6;}
		.s-c{color: #9f9fa9;}
		.t-c{color: #f17268;}
		/*整体结构*/
		#left,#center,#right{position: fixed;top:0;bottom:0;background: #30303f}
		#left{left:0;width:300px;z-index:2;box-shadow:  1px 0px 0px 0px #232331,  2px 0px 0px 0px #353649;}
		#center{left:300px;right:300px;}
		#right{right:0;width:300px;z-index:2;box-shadow: inset 1px 0px 0px 0px #232331, inset 2px 0px 0px 0px #353649;box-shadow: -1px 0px 0px 0px #353649, -2px 0px 0px 0px #232331;}
		/*left 模块结构*/
		#viewer{position: relative;overflow: hidden;height: 60vh;}
		#auchor{height: 72px;display: flex;}
		.auchor-photo{width: 42px;}
		.auchor-info{display: flex;}
		.auchor-txt{overflow: hidden;white-space: nowrap;text-overflow: ellipsis;}
		.auchor-icon{flex-shrink: 0;}

		.viewer-controler{display: flex;height: 28px;}
		.viewer-count{flex: 1;}

		.viewer-list{position: absolute;top: 100px;left:0;right:0;bottom:0;}
		.viewer-item{display: flex;}
		.viewer-photo{width: 42px;}
		.viewer-info{display: flex;}
		.viewer-txt{overflow: hidden;white-space: nowrap;text-overflow: ellipsis;}
		.viewer-icon{flex-shrink: 0;}

		#mic{position: relative;height: calc( 40vh - 50px);}
		.mic-controler{height: 28px;display: flex;}
		.mic-admin{display: flex;height: 42px;}
		.mic-list{position: absolute;top: 70px;left:0;right:0;bottom:0;}

		#voice{display: flex;height: 50px;}
	</style>
</head>
<body>
	<div id="app">
		<div id="left" class="left-warp m-c">
			<div id="viewer" class="viewer-warp">

							</div>

					</div>

			</div>
			<div id="mic" class="mic-warp">

					<div class="mic-icon">管理</div>
				</div>
				<div class="mic-admin">
					<div class="mic-controlertips">语音席</div>

					<div class="mic-auchor2"></div>

				</div>
				<div class="mic-list">

						</div>

				</div>
			</div>
			<div id="voice" class="voice-warp">
