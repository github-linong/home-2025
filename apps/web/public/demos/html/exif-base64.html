    <script>
        ;(function () {
            var debug = true;
            var root = this;
            var EXIF = function (obj) {
                if (obj instanceof EXIF) return obj;
                if (!(this instanceof EXIF)) return new EXIF(obj);
                this.EXIFwrapped = obj;
            };

            if (typeof exports !== 'undefined') {
                if (typeof module !== 'undefined' && module.exports) {
                    exports = module.exports = EXIF;
                }
                exports.EXIF = EXIF;
            } else {
                root.EXIF = EXIF;
            }
            function base64ToArrayBuffer(base64, contentType) {
                contentType = contentType || base64.match(/^data\:([^\;]+)\;base64,/mi)[1] || ''; // e.g. 'data:image/jpeg;base64,...' => 'image/jpeg'
                base64 = base64.replace(/^data\:([^\;]+)\;base64,/gmi, '');
                var binary = atob(base64);
                var len = binary.length;
                var buffer = new ArrayBuffer(len);
                var view = new Uint8Array(buffer);
                for (var i = 0; i < len; i++) {
                    view[i] = binary.charCodeAt(i);
                }
                return buffer;
            }

            function objectURLToBlob(url, callback) {
                var http = new XMLHttpRequest();
                http.open("GET", url, true);
                http.responseType = "blob";
                http.onload = function (e) {
                    if (this.status == 200 || this.status === 0) {
                        callback(this.response);
                    }
                };
                http.send();
            }

            function getImageData(img, callback) {
                function handleBinaryFile(binFile) {
                    var data = findEXIFinJPEG(binFile);
                    // img.exifdata = data || {};
                    if (callback) {
                        callback(data);
                    }
                }
                if (img.src) {
                    if (/^data\:/i.test(img.src)) { // Data URI
                        var arrayBuffer = base64ToArrayBuffer(img.src);
                        handleBinaryFile(arrayBuffer);
                    } else if (/^blob\:/i.test(img.src)) { // Object URL
                        var fileReader = new FileReader();
                        fileReader.onload = function (e) {
                            handleBinaryFile(e.target.result);
                        };
                        objectURLToBlob(img.src, function (blob) {
                            fileReader.readAsArrayBuffer(blob);
                        });
                    } else {
                        var http = new XMLHttpRequest();
                        http.onload = function () {
                            if (this.status == 200 || this.status === 0) {
                                handleBinaryFile(http.response);
                            } else {
                                throw "Could not load image";
                            }
                            http = null;
                        };
                        http.open("GET", img.src, true);
                        http.responseType = "arraybuffer";
                        http.send(null);
                    }
                } else if (self.FileReader && (img instanceof self.Blob || img instanceof self.File)) {
                    var fileReader = new FileReader();
                    fileReader.onload = function (e) {
                        if (debug) console.log("Got file of length " + e.target.result.byteLength);
                        handleBinaryFile(e.target.result);
                    };

                    fileReader.readAsArrayBuffer(img);
                }
            }

            function findEXIFinJPEG(file) {
                console.log('文件（ArrayBuffer）', file)
                var dataView = new DataView(file);
                console.log('文件（DataView）', dataView)
                if (debug) console.log("Got file of length " + file.byteLength);
                if ((dataView.getUint8(0) != 0xFF) || (dataView.getUint8(1) != 0xD8)) {
                    if (debug) console.log("Not a valid JPEG");
                    return { state: 1001, message: 'not a valid jpeg' };
                }
                var offset = 2,
                    length = file.byteLength,
                    marker;
                while (offset < length) {
                    if (dataView.getUint8(offset) != 0xFF) {
                        if (debug) console.log("Not a valid marker at offset " + offset + ", found: " + dataView.getUint8(offset));
                        return { state: 1002, message: 'not a valid marker, something is wrong' };
                    }
                    marker = dataView.getUint8(offset + 1);
                    if (debug) console.log(marker);
                    if (marker == 225) {
                        if (debug) console.log("Found 0xFFE1 marker");
                        return readEXIFData(dataView, offset + 4, dataView.getUint16(offset + 2) - 2);
                    } else {
                        offset += 2 + dataView.getUint16(offset + 2);
                    }
                }
            }
            function getStringFromDB(buffer, start, length) {
                var outstr = "";
                for (n = start; n < start + length; n++) {
                    outstr += String.fromCharCode(buffer.getUint8(n));
                }
                return outstr;
            }

            function readEXIFData(file, start) {
                // debugger;
                if (getStringFromDB(file, start, 4) != "Exif") {
                    if (debug) console.log("Not valid EXIF data! " + getStringFromDB(file, start, 4));
                    return { state: 1003, message: "Not valid EXIF data! " + getStringFromDB(file, start, 4) };
                }
                var bigEnd,
                    tiffOffset = start + 6;
                if (file.getUint16(tiffOffset) == 0x4949) {
                    bigEnd = false;
                } else if (file.getUint16(tiffOffset) == 0x4D4D) {
                    bigEnd = true;
                } else {
                    if (debug) console.log("Not valid TIFF data! (no 0x4949 or 0x4D4D)");
                    return { state: 1004, message: "Not valid TIFF data! (no 0x4949 or 0x4D4D)" };
                }

                if (file.getUint16(tiffOffset + 2, !bigEnd) != 0x002A) {
                    if (debug) console.log("Not valid TIFF data! (no 0x002A)");
                    return { state: 1005, message: "Not valid TIFF data! (no 0x002A)" };
                }

                var firstIFDOffset = file.getUint32(tiffOffset + 4, !bigEnd);
                if (firstIFDOffset < 0x00000008) {
                    if (debug) console.log("Not valid TIFF data! (First offset less than 8)", file.getUint32(tiffOffset + 4, !bigEnd));
                    return { state: 1006, message: "Not valid TIFF data! (First offset less than 8)" };
                }
                var _start = tiffOffset - 10;
                // var _end = parseInt(Array.from(new Uint8Array(file.buffer.slice(start - 2, start))).map(v => v.toString(16)).join(''), 16) + 4
                var _end = parseInt(Array.from(new Uint8Array(file.buffer.slice(start-2,start))).map(v=>v.toString(16)).join(''), 16)+start-2
                return {
                    state: 1000,
                    data: btoa(Array.from(new Uint8Array(file.buffer.slice(_start, _end))).map(v => String.fromCharCode(v)).join(''))
                }

            }


            EXIF.getData = function (img, callback) {
                if (((self.Image && img instanceof self.Image)
                    || (self.HTMLImageElement && img instanceof self.HTMLImageElement))
                    && !img.complete)
                    return false;

                // if (!imageHasData(img)) {
                getImageData(img, callback);
                // } else {
                //     if (callback) {
                //         callback.call(img);
                //     }
                // }
                return true;
            }

            if (typeof define === 'function' && define.amd) {
                define('exif-js', [], function () {
                    return EXIF;
                });
            }
        }.call(this));

        // EXIF.getData(file.files[0], function (data) {
        //     console.log('getData', data)
        // })
    </script>

    <script>
        file.addEventListener('change', function(){
            if(this.files.length){
                uploadFile(this.files[0])
                fileViewer.src = URL.createObjectURL(this.files[0])
                fileViewer.onload = function(){ 
                    fileViewerWidth.innerText = '宽：'+(fileViewer.naturalWidth || fileViewer.width)
                    fileViewerHeight.innerText = '高：'+(fileViewer.naturalHeight || fileViewer.height)
                }
                console.log('文件(file):', file.files[0])
                EXIF.getData(file.files[0], function (data) {
                    console.log('getData', data)
                    clog.innerText = data.data;
                })
            }
        })
    </script>

    <script type="text/javascript">
        function uploadFile(file, onprogress, onreadystatechange){
            var formData = new FormData;
            formData.append('file', file)
            formData.append('opacid', 'LN')
            formData.append('random', Math.random())
            var xhr = new XMLHttpRequest();
            xhr.upload.onprogress = onprogress;
            xhr.open('post', '/upload_any');
            xhr.onreadystatechange = onreadystatechange;
            xhr.send(formData);
        }
    </script>
