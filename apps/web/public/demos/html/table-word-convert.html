<body>
	<style type="text/css">
		body{
		    position: relative;padding: 0 20px 20px 0;
		}
		#app{
			border: 1px solid #f00;
			min-height: 100px;
		}
		#app table{
			width: 100%;
		}
		tr,th,td{
			border: 1px solid #000;
		}
		#right{
			display: none;
			position: absolute;top:0;bottom:0;right:0;width: 20px;    background: #f00;
		}
		#bottom{
			display: none;
			position: absolute;bottom:0;left:0;right:0;height: 20px;    background: #f00;
		}
		body:hover #right, body:hover #bottom{
			display: block;
		}
	</style>
	<div id="appControl">
		<div id="right">+</div>
		<div id="bottom">+</div>
	</div>
	<div id="app" contenteditable>
		<table>
			<tbody>
				<tr>
					<td></td>
				</tr>
			</tbody>
		</table>
	</div>
	<script type="text/javascript">
		document.querySelector('#right').addEventListener('click', ()=>{
			Array.from(document.querySelectorAll('tr')).forEach(v=>{
				v.appendChild(v.children[v.children.length - 1].cloneNode(true));
			})
		})
		document.querySelector('#bottom').addEventListener('click', ()=>{
			// document.querySelectorAll('tbody').append('<td></td>')
			var tbody = document.querySelector('tbody');
			tbody.appendChild(tbody.children[tbody.children.length - 1].cloneNode(true));
		})
	</script>
