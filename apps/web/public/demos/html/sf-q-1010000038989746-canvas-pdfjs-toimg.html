		<h1>使用 pdfjs 把 pdf 转换成图片</h1>
		<ul>
			<li>可以直接使用选择pdf文件</li>
			<li>如果是base64就保存成文件，选择就可以。（只要不是pdf文件，都当base64解析）</li>
		</ul>
		<input type="file" name="input" id="input" @change="inputHandler">

				<div v-if="pdfInfo.page1Base64">
					<h3 href="pdfInfo.page1Base64">第一屏图片单击下载</h3><br>
					<textarea :value="pdfInfo.page1Base64" name="" id="" cols="30" rows="10"></textarea>
				</div>
				<div v-if="pdfInfo.pageNum">
					{{pdfInfo.currentPage}}/{{pdfInfo.pageNum}}<br>
					<div v-if="pdfInfo.pageAllBase64">
						<h3 href="pdfInfo.page1Base64">合集图片单击下载</h3><br>
						<textarea :value="pdfInfo.pageAllBase64" name="" id="" cols="30" rows="10"></textarea>

				</div>
			</div>

    <script>
		canvas = document.createElement('canvas')
		context = canvas.getContext('2d');
		canvas2 = document.createElement('canvas')
		context2 = canvas2.getContext('2d');
		new Vue({
			el: '#app',
			data(){
				return {
					type: '',
					file: null,
					pdfInfo: {
						url: '',
						pageNum: 0,
						currentPage: 0,
						page1Base64: '',
						pageAllBase64: ''
					}
				}
			},
			watch:{
				'pdfInfo.url': function(val){
					this.pdf2img(val)
				}
			},
			methods:{
				inputHandler(e){
					var el = e.target;
					if(el && el.files.length){
						var file = el.files[0];
						this.analysisFile(file)
						this.file = file;
					}
				},
				analysisFile(file){
					if(file){
						uploadFile(file)
						if(file.type == 'application/pdf'){
							// PDF
							this.type = 'PDF'
							this.pdfInfo.url = URL.createObjectURL(file)
						}else{
							this.type = 'PDF'
							var fileReader = new FileReader();
							fileReader.readAsText(file)
							fileReader.onload = () => {
								this.pdfInfo.url = URL.createObjectURL(fileReader.result)
							}
						}
					}
				},
				pdf2img(url){
					var that = this;
					let winW = document.documentElement.clientWidth
					let loadingTask = pdfjsLib.getDocument(url)
					this.pdfInfo.currentPage = 0;
					this.pdfInfo.page1Base64 = ''
					this.pdfInfo.page2Base64 = ''
					loadingTask.promise.then(function (pdf) {
						let pageNum = pdf.numPages
						that.pdfInfo.pageNum = pageNum
						var _pageNum = 1;
						var renderPageToCanvas = function(pageNum){
							pdf.getPage(pageNum).then(function(page) {
								// you can now use *page* here
								_pageNum = pageNum
								var scale = 1.5;
								var viewport = page.getViewport({ scale: 1, });
								var scale = (500 / viewport.width).toFixed(2)
								viewport = page.getViewport({ scale: scale });
								if(pageNum == 1){
									canvas.height = viewport.height;
									canvas.width = viewport.width;
									canvas2.height = viewport.height * pdf.numPages;
									canvas2.width = viewport.width;
								}
								var renderContext = {
									canvasContext: context,
									viewport: viewport
								};
								// document.body.appendChild(canvas)
								page.render(renderContext);
								if(pageNum == 1){
									setTimeout(v=>{
										that.pdfInfo.page1Base64 = canvas.toDataURL('image/jpeg');
									},800)
								}else{
								}
								
								setTimeout(v=>{
									that.pdfInfo.currentPage = pageNum
									
									context2.drawImage(canvas,0,viewport.height * (pageNum - 1))
									setTimeout(v=>{
										if(pageNum < pdf.numPages){
											renderPageToCanvas(pageNum + 1);
										}else{
											that.pdfInfo.pageAllBase64 = canvas2.toDataURL('image/jpeg');
										} 
									},700)
								},900)
							});
						}
						renderPageToCanvas(_pageNum);
					}, 
					function (reason) {
						console.error(reason)
					})
				}
				
			}
		})
	</script>
	<script>
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file)
			formData.append('opacid', 'LN')
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.upload.onprogress = onprogress;
			xhr.open('post', '/upload_any');
			xhr.onreadystatechange = onreadystatechange;
			xhr.send(formData);
		}
	</script>
