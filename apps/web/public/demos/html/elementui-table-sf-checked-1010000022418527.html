	<meta charset="utf-8">

	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <el-table
            ref="multipleTable"
            :data="tableData"
            tooltip-effect="dark"
            style="width: 100%"
            @select="handleSelect"
            @selection-change="handleSelectionChange">
            <el-table-column
            type="selection"
            width="55">
            </el-table-column>
            <el-table-column
            label="日期"
            width="120">
            <template slot-scope="scope">{{ scope.row.date }}</template>
            </el-table-column>
            <el-table-column
            prop="name"
            label="姓名"
            width="120">
            </el-table-column>
            <el-table-column
            prop="address"
            label="地址"
            show-overflow-tooltip>
            </el-table-column>
        </el-table>
        
        <pre>{{multipleSelectionToJSONString}}</pre>
    </div>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    tableData: [{
                        date: '2016-05-03',
                        name: '王小虎',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-02',
                        name: '小二',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-04',
                        name: '王小虎',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-01',
                        name: '王小虎',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-08',
                        name: 'www.lilnong.top',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-06',
                        name: 'lilnong.top',
                        address: '上海市普陀区金沙江路 1518 弄'
                        }, {
                        date: '2016-05-07',
                        name: '小二',
                        address: '上海市普陀区金沙江路 1518 弄'
                    }],
                    multipleSelection: []
                }
            },
            computed:{
                multipleSelectionToJSONString(){
                    return JSON.stringify(this.multipleSelection, null, 2)
                }
            },
            methods: {
                handleSelect(list, item){
                    console.log('handleSelect', arguments)
                    this.$nextTick(v=>{
                        this.tableData.filter(v=>v.name == item.name).forEach(v=>{
                            this.$refs.multipleTable.toggleRowSelection(v, list.includes(item));
                        })
                    })
                },
                handleSelectionChange(val) {
                    console.log('handleSelectionChange', arguments)
                    this.multipleSelection = val;
                }
            }
        })
    </script>
