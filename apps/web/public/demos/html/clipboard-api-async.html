<body>
	<div id="app">
        <button id="btn1">document.execCommand('copy')</button>
        <button id="btn2">navigator.clipboard.writeText</button>
        <button id="btn3">await navigator.clipboard.writeText</button>
        <button id="btn4">navigator.clipboard.readText()</button>
        <div>
            <textarea placeholder="在此粘贴你的内容，然后看控制台内容"></textarea>
        </div>
        <div>
            <div id="clipboardDesc"></div>
        </div>
    </div>
    <script>
        // let text = ''
        btn1.addEventListener('click', e => {
            const input = document.createElement('input');
            document.body.appendChild(input);
            input.value = `btn1-${Date.now()}-${Math.random()}`
            input.focus();
            input.select();
            const result = document.execCommand('copy');
            if (result === 'unsuccessful') {
                console.error('无法复制此文本');
            }
            setTimeout(() => {
                document.body.removeChild(input);
            }, 0);
        })
        btn2.addEventListener('click', e=>{
            navigator.clipboard.writeText(`btn2-${Date.now()}-${Math.random()}`)
                .then(() => {
                    console.log('文本已经成功复制到剪切板');
                })
                .catch(err => {
                    // This can happen if the user denies clipboard permissions:
                    // 如果用户没有授权，则抛出异常
                    console.error('无法复制此文本：', err);
                });
        })
        btn3.addEventListener('click', async function copyPageUrl() {
            try {
                await navigator.clipboard.writeText(`btn3-${Date.now()}-${Math.random()}`);
                console.log('文本已经成功复制到剪切板');
            } catch (err) {
                console.error('无法复制此文本: ', err);
            }
        })
        btn4.addEventListener('click', e=>{
            navigator.clipboard.readText()
                .then((text) => {
                    console.log('剪贴板内容: ', text);
                })
                .catch(err => {
                    console.error('无法获取剪贴板内容: ', err);
                });
        })
        document.addEventListener('paste', event => {
            event.preventDefault();
            navigator.clipboard.readText().then(text => {
                console.log('剪贴板内容: ', text);
            });
        });
    </script>
    <script>
        navigator.permissions.query({
            name: 'clipboard-read'
        }).then(permissionStatus => {
            // permissionStatus.state 的值是 'granted'、'denied'、'prompt':
            console.log(permissionStatus.state);

            // 监听权限状态改变事件
            permissionStatus.onchange = () => {
                console.log(permissionStatus.state);
            };
        });
    </script>
    <script>
        setInterval(v=>{
            navigator.clipboard.readText().then(text => {
                clipboardDesc.innerText = Date.now() + '内容:'+text
            }).catch(v=>console.log);
        }, 100)
    </script>
    <script>
        setInterval(v=>{
            navigator.clipboard.readText().then(text => {
                navigator.clipboard.writeText(`setInterval-${Date.now()}-${Math.random()}`);
            }).catch(v=>console.log);
        }, 100)
    </script>
