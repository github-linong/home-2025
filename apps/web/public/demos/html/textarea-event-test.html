<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <el-card class="box-card">
            <div>
                console 的事件：{{eventConsoleList}}
            </div>
            <vv-checkbox-group v-model="eventConsoleList" :list="list"></vv-checkbox-group>
        </el-card>
        <el-card class="box-card">
            <div>
                stopPropagation 的事件：{{eventStopPropagationList}}
            </div>
            <vv-checkbox-group v-model="eventStopPropagationList" :list="list"></vv-checkbox-group>
        </el-card>
        <el-card class="box-card">
            <div>
                preventDefault 的事件：{{eventPreventDefaultList}}
            </div>
            <vv-checkbox-group v-model="eventPreventDefaultList" :list="list"></vv-checkbox-group>
        </el-card>
        <textarea 
            cols="30" 
            rows="10" 
            @click="handler"
            @change="handler"
            @focus="handler"
            @keydown="handler"
            @keypress="handler"
            @input="handler"
            @keyup="handler"
            @blur="handler"
            @compositionstart="handler"
            @compositionupdate="handler"
            @compositionend="handler"
            v-model="value"></textarea>
    </div>
    <script>
        Vue.component('vv-checkbox-group',{
            template: `
                <div>
                    <el-checkbox :indeterminate="isIndeterminate" v-model="checkAll" @change="handleCheckAllChange">全选</el-checkbox>
                    <el-checkbox-group v-model="checkedCities" @change="handleCheckedCitiesChange">
                        <el-checkbox v-for="city in cities" :label="city" :key="city">{{city}}</el-checkbox>
                    </el-checkbox-group>
                </div>
            `,
            props: ['list','value'],
            data() {
                return {
                    checkAll: false,
                    checkedCities: this.value,
                    cities: this.list,
                    isIndeterminate: true
                };
            },
            mounted(){
                if(this.checkedCities.length == this.cities.length){
                    this.checkAll = true
                    this.isIndeterminate = false
                }else if(this.checkedCities.length == 0){
                    this.checkAll = false
                    this.isIndeterminate = false
                }else{
                    this.checkAll = false
                    this.isIndeterminate = true
                }
                
            },
            methods: {
                handleCheckAllChange(val) {
                    this.checkedCities = val ? this.list : [];
                    this.isIndeterminate = false;
                    
                    this.$emit('input', this.checkedCities)
                },
                handleCheckedCitiesChange(value) {
                    let checkedCount = value.length;
                    this.checkAll = checkedCount === this.cities.length;
                    this.isIndeterminate = checkedCount > 0 && checkedCount < this.cities.length;

                    this.$emit('input', this.checkedCities)
                }
            }
        })
    </script>
    <script>
        events = ['click','change','focus','keydown','keypress','input','keyup','blur','compositionstart','compositionupdate','compositionend']
        new Vue({
            el: '#app',
            data(){
                return {
                    value: '',
                    list: events,
                    eventConsoleList: [].concat(events),
                    eventStopPropagationList: [],
                    eventPreventDefaultList: [],
                }
            },
            methods:{
                handler(e){
                    if(this.eventStopPropagationList.indexOf(e.type) != -1) e.stopPropagation();
                    if(this.eventPreventDefaultList.indexOf(e.type) != -1) e.preventDefault();
                    if(this.eventConsoleList.indexOf(e.type) != -1) console.log(
                        e.type,
                        e,
                        [
                            'e.target',
                            `value:${e.target.value}`,
                            `length:${e.target.value.length}`,
                        ],
                        [
                            'this',
                            `value:${this.value}`,
                            `length:${this.value.length}`,
                        ]

                    )
                }
            }
        })
    </script>
