<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title></title>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<style type="text/css">
		*{
			font-size: 12px;
			padding:0;margin:0;
		}
		
		/*整体部分*/
		::-webkit-scrollbar {
		  width: 10px;
		  height: 10px; }

		/*滑动轨道*/
		::-webkit-scrollbar-track {
		  border-radius: 5px; }

		/*滑块*/
		::-webkit-scrollbar-thumb {
		  height: 40px;
		  border-radius: 5px;
		  background: #d7d7d7; }

		/*滑块效果*/
		::-webkit-scrollbar-thumb:hover {
		  background: #999; }

		/*滑块效果*/
		::-webkit-scrollbar-thumb:active {
		  background: #949494; }

		html,body{width:100%;height:100%}
	</style>
</head>
<body>

</body>
</html>
