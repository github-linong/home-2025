	<script type="text/javascript">
		if ("geolocation" in navigator) {
		  /* 地理位置服务可用 */
		  navigator.geolocation.getCurrentPosition(function(position) {
		    console.log('getCurrentPosition:success', position, position.coords.latitude, position.coords.longitude);
		  }, function(a,b,c,d,e){
		    console.log('getCurrentPosition:success', a,b,c,d,e);
		  });
		  navigator.geolocation.watchPosition(function(position) {
		    console.log('watchPosition:success', position, position.coords.latitude, position.coords.longitude);
		  }, function(a,b,c,d,e){
		    console.log('watchPosition:success', a,b,c,d,e);
		  });
		} else {
		  /* 地理位置服务不可用 */
		}
	</script>
	<script type="text/javascript">
		// fetch('https://api.map.baidu.com/location/ip?ak=F7dLMZ2v9VbSr6C8iubN9yIfF4nzkuLs&jsonp')
		scriptDom = document.createElement('script')
		scriptDom.src = `https://api.map.baidu.com/location/ip?output=json&ak=F7dLMZ2v9VbSr6C8iubN9yIfF4nzkuLs&callback=consoleLog`
		document.body.appendChild(scriptDom)
		function consoleLog(a){
			console.log('百度地图：web API：',a)
		}
	</script>
	<script type="text/javascript">
		// 浏览器定位
		var map = new BMap.Map("allmap");
		var point = new BMap.Point(116.331398,39.897445);
		map.centerAndZoom(point,12);

		var geolocation = new BMap.Geolocation();
		geolocation.getCurrentPosition(function(r){
			if(this.getStatus() == BMAP_STATUS_SUCCESS){
				var mk = new BMap.Marker(r.point);
				map.addOverlay(mk);
				map.panTo(r.point);
				console.log('百度地图：javascript API:','浏览器定位:您的位置：'+r.point.lng+','+r.point.lat);
			}
			else {
				console.log('百度地图：javascript API:','浏览器定位:failed'+this.getStatus());
			}        
		});


		// ip
		var map = new BMap.Map("allmap");
		var point = new BMap.Point(116.331398,39.897445);
		map.centerAndZoom(point,12);

		function myFun(result){
			var cityName = result.name;
			map.setCenter(cityName);
			console.log('百度地图：javascript API:',"ip:当前定位城市:"+cityName);
		}
		var myCity = new BMap.LocalCity();
		myCity.get(myFun); 


		// 定位SDK辅助定位
		var map = new BMap.Map("allmap");
		var point = new BMap.Point(116.331398,39.897445);
		map.centerAndZoom(point,12);

		var geolocation = new BMap.Geolocation();
		// 开启SDK辅助定位
		geolocation.enableSDKLocation();
		geolocation.getCurrentPosition(function(r){
			if(this.getStatus() == BMAP_STATUS_SUCCESS){
				var mk = new BMap.Marker(r.point);
				map.addOverlay(mk);
				map.panTo(r.point);
				console.log('百度地图：javascript API:','开启SDK辅助定位:您的位置：'+r.point.lng+','+r.point.lat);
			}
			else {
				console.log('百度地图：javascript API:','开启SDK辅助定位:failed'+this.getStatus());
			}        
		});
	</script>
	<script type="text/javascript">
		mapObj = new AMap.Map('iCenter');
		mapObj.plugin('AMap.Geolocation', function () {
		    geolocation = new AMap.Geolocation({
		        enableHighAccuracy: true,//是否使用高精度定位，默认:true
		        timeout: 10000,          //超过10秒后停止定位，默认：无穷大
		        maximumAge: 0,           //定位结果缓存0毫秒，默认：0
		        convert: true,           //自动偏移坐标，偏移后的坐标为高德坐标，默认：true
		        showButton: true,        //显示定位按钮，默认：true
		        buttonPosition: 'LB',    //定位按钮停靠位置，默认：'LB'，左下角
		        buttonOffset: new AMap.Pixel(10, 20),//定位按钮与设置的停靠位置的偏移量，默认：Pixel(10, 20)
		        showMarker: true,        //定位成功后在定位到的位置显示点标记，默认：true
		        showCircle: true,        //定位成功后用圆圈表示定位精度范围，默认：true
		        panToLocation: true,     //定位成功后将定位到的位置作为地图中心点，默认：true
		        zoomToAccuracy:true      //定位成功后调整地图视野范围使定位位置及精度范围视野内可见，默认：false
		    });
		    mapObj.addControl(geolocation);
		    geolocation.getCurrentPosition();
		    AMap.event.addListener(geolocation, 'complete', function(a,b,c,d,e){console.log('高德地图：js API',a,b,c,d,e)});//返回定位信息
		    AMap.event.addListener(geolocation, 'error', function(a,b,c,d,e){console.log('高德地图：js API',a,b,c,d,e)});      //返回定位出错信息
		});
	</script>
