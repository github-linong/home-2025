<body>
	<div id="app1">
        <p>默认居中，无内容居中</p>
        <p>有焦点变长，居左</p>
        <p>有内容变长，居左</p>
        <label for="input" class="flex">
            <i class="el-icon-search"></i>
            <input 
                type="text" 
                placeholder="搜索歌手名/歌曲名" 
                id="input"
                                    
                autocomplete="off"
                required/>
            <i class="el-icon-close"></i>
        </label>
        <style>
            #app1 *{font-size: 14px;}

            #app1 .flex{display: flex;justify-content:center;align-items: center;}
            #app1 input{width: 8.5em;transition: all 1s;}
            #app1 input::placeholder{transition: all 1s;}
            #app1 input:focus,
            #app1 input:valid{width: 100%;box-shadow: 0px 1px 0 0 rgba(0,0,0,.2)}
            #app1 input:focus::placeholder,
            #app1 input:valid::placeholder{color: rgba(0,0,0,0);}
            
            #app1 .flex{padding: 10px 10px;border: 1px solid #f00}
            #app1 input{background:rgba(0,0,0,0);border:0 none;outline:0;padding:0;margin: 0 10px;}
        </style>
    </div>
    
    
	<div id="app2">
        <p>效果同上，但是增加了close的隐藏</p>
        <form>
            <label for="input" class="flex">
                <i class="el-icon-search"></i>
                <input 
                    type="text" 
                    placeholder="搜索歌手名/歌曲名" 
                    id="input"
                                        
                    autocomplete="off"
                    required/>
                <i class="el-icon-close"></i>
            </label>
        </form>
        <style>
            #app2 *{font-size: 14px;}

            #app2 .flex{display: flex;justify-content:center;align-items: center;}
            #app2 input{width: 8.5em;transition: all 1s;}
            #app2 input::placeholder{transition: all 1s;}
            #app2 input:focus,
            #app2 input:valid{width: 100%;box-shadow: 0px 1px 0 0 rgba(0,0,0,.2)}
            #app2 input:focus::placeholder,
            #app2 input:valid::placeholder{color: rgba(0,0,0,0);}
            
            #app2 .flex{padding: 10px 10px;}
            #app2 form .flex{border: 1px solid #f00}
            #app2 form .el-icon-close{opacity: 0;transition: all 1s;}
            #app2 form:valid .flex{border: 1px solid #0f0}
            #app2 form:valid .el-icon-close{opacity: 1;}
            #app2 input{background:rgba(0,0,0,0);border:0 none;outline:0;padding:0;margin: 0 10px;}
        </style>
	</div>
