	<meta charset="utf-8">
	<title>Vue 中 v-if 和 v-show 的使用 - www.lilnong.top</title>
	<meta keywords="Vue,v-if,v-show,v-if bug,">
	<meta description="Vue 中 v-if 的 bug">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
    <!-- <script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script> -->
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.11/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole();Vue.config.devtools=true;</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <button @click="isShow = !isShow">切换</button>
        <p>isShow: {{isShow}}</p>
        <p>value: {{value}}</p>
        <div class="">
            <h3>v-show</h3>
            <div v-show="isShow" key="1">可以理解为通过Vue的方式显示内容<input v-model="value"></div>
            <div v-show="isShow" key="2">可以理解为通过jQuery的方式显示内容<input class="jquery-input"></div>
            <v-input v-show="isShow" key="8" >可以理解为通过Vue组件的方式显示内容</v-input>
        </div>
        <div class="">
            <h3>v-if</h3>
            <div v-if="isShow" key="3">可以理解为通过Vue的方式显示内容<input v-model="value"></div>
            <div v-if="isShow" key="4">可以理解为通过jQuery的方式显示内容<input class="jquery-input"></div>
            <v-input v-if="isShow" key="8" >可以理解为通过Vue组件的方式显示内容</v-input>
        </div>
        <div class="">
            <h3>keep-alive + v-if</h3>
            <keep-alive>
                <div v-if="isShow" key="5">
                    可以理解为通过Vue的方式显示内容
                    <input v-model="value">
                </div>
            </keep-alive>
            <keep-alive>
                <div v-if="isShow" key="6">
                    可以理解为通过jQuery的方式显示内容
                    <input class="jquery-input">
                </div>
            </keep-alive>
            <keep-alive>
                <v-input v-if="isShow" key="9" >可以理解为通过Vue组件的方式显示内容</v-input>
            </keep-alive>
        </div>
    </div>
    <script>
        Vue.component('v-input',{
            template: '<div><slot></slot><input class="vue-component-input" v-model="value"></div>',
            data(){
                return {
                    value: '123'
                }
            },
            created(){
                console.log('v-input', 'created')
            },
            activated(){
                console.log('v-input', 'activated')
            }
        })
        Vue.config.errorHandler = function (err, vm, info) {
            // handle error
            // `info` 是 Vue 特定的错误信息，比如错误所在的生命周期钩子
            // 只在 2.2.0+ 可用
            console.log(err, vm, info)
        }
        Vue.config.warnHandler = function (msg, vm, trace) {
            // `trace` 是组件的继承关系追踪
            console.log(msg, vm, trace)
        }
        Vue.config.performance = true;

        new Vue({
            el: '#app',
            data(){
                return  {
                    isShow: true,
                    value: ''
                }
            },
            mounted(){
                this.$nextTick(v=>{
                    Array.from(document.querySelectorAll('input')).forEach(v=>{
                        v.value = Math.random()
                    })
                    this.value = Math.random()
                })
            }
        })
    </script>
