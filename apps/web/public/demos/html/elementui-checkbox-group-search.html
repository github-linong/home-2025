	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>

	<script type="text/javascript">new VConsole()</script>

<body>
	<div id="app">
        <p>全选功能Demo</p>
        <el-checkbox :indeterminate="isIndeterminate" v-model="checkAll" @change="handleCheckAllChange">全选</el-checkbox>
        <el-checkbox-group v-model="checkedCities" @change="handleCheckedCitiesChange">
            <el-checkbox v-for="city in cities" :label="city" :key="city">{{city}}</el-checkbox>
        </el-checkbox-group>
    </div>
    <script>
        cityOptions = ['上海', '北京', '广州', '深圳'];
        vm = new Vue({
            el: '#app',
            data(){
                return {
                    checkAll: false,
                    checkedCities: ['上海', '北京'],
                    cities: cityOptions,
                    isIndeterminate: true
                }
            },
            methods: {
                handleCheckAllChange(val) {
                    console.log('handleCheckAllChange')
                    this.checkedCities = val ? cityOptions : [];
                    this.isIndeterminate = false;
                },
                handleCheckedCitiesChange(value) {
                    console.log('handleCheckedCitiesChange')
                    let checkedCount = value.length;
                    this.checkAll = checkedCount === this.cities.length;
                    this.isIndeterminate = checkedCount > 0 && checkedCount < this.cities.length;
                }
            }
        })
    </script>
    <hr>
    <style>
        .flex{display: flex;}
            .vv-checkout-group-title{display:inline-block;width: 8em;}
            .vv-checkout-group-checkAll{margin-right: 3em;}
    </style>
    <div id="app1">
        <vv-checkbox-group title="立项填写" :checklist="list" v-model="listChecked1"></vv-checkbox-group>
        <vv-checkbox-group title="供应商选择" :checklist="list" v-model="listChecked2"></vv-checkbox-group>
        <vv-checkbox-group title="验收评估" :checklist="list" v-model="listChecked3"></vv-checkbox-group>
        <p>listChecked1: {{listChecked1}}</p>
        <p>listChecked2: {{listChecked2}}</p>
        <p>listChecked3: {{listChecked3}}</p>
        <el-button @click="reset">重置</el-button>
    </div>
    <script>
        Vue.component('vv-checkbox-group',{
            props: ['checklist', 'value', 'title'],
            template: `
                <div class="flex">
                    <span class="vv-checkout-group-title">{{title}}</span>
                    <el-checkbox class="vv-checkout-group-checkAll" :indeterminate="isIndeterminate" v-model="checkAll" @change="handleCheckAllChange">全选</el-checkbox>
                    <el-checkbox-group v-model="checkedCities" @change="handleCheckedCitiesChange">
                        <el-checkbox v-for="city in cities" :label="city" :key="city">{{city}}</el-checkbox>
                    </el-checkbox-group>
                </div>
            `,
            data(){
                return {
                    checkAll: false,
                    checkedCities: [],
                    cities: [],
                    isIndeterminate: true
                }
            },
            created(){
                this.cities = JSON.parse(JSON.stringify(this.checklist));
                this.checkedCities = this.value;
            },
            watch:{
                value(){
                    this.checkedCities = this.value;
                    if(this.checkedCities.length == 0){
                        this.checkAll = false;
                        this.isIndeterminate = false;
                    }
                }
            },
            methods: {
                handleCheckAllChange(val) {
                    if(this.checkedCities = val){
                        this.$emit('input', JSON.parse(JSON.stringify(this.checklist)))
                    }else{
                        this.$emit('input', [])
                    }
                    this.isIndeterminate = false;
                },
                handleCheckedCitiesChange(value) {
                    let checkedCount = value.length;
                    this.checkAll = checkedCount === this.cities.length;
                    this.isIndeterminate = checkedCount > 0 && checkedCount < this.cities.length;
                    this.$emit('input', JSON.parse(JSON.stringify(this.checkedCities)))
                }
            }
        })
        new Vue({
            el: '#app1',
            data(){
                return {
                    list: ['未开始', '编辑中', '审批中', '已完成'],
                    listChecked1: ['审批中', '已完成'],
                    listChecked2: ['审批中', '编辑中'],
                    listChecked3: []
                }
            },
            methods:{
                reset(){
                    this.listChecked1.splice(0,this.listChecked1.length)
                    this.listChecked2.splice(0,this.listChecked2.length)
                    this.listChecked3.splice(0,this.listChecked3.length)
                }
            }
        })
    </script>
