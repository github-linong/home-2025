    <script>
        function initFingerprintJS() {
        // Initialize an agent at application startup.
        const fpPromise = FingerprintJS.load()
    
        // Get the visitor identifier when you need it.
        fpPromise
            .then(fp => fp.get())
            .then(result => {
                console.log(result)
                // This is the visitor identifier:
                const visitorId = result.visitorId
                console.log(visitorId)
                el_value1.innerText = visitorId
            })
        }
    </script>
    <script>
        (function (canvas, ctx){
            canvas.width=500;
            canvas.height=50;
            //带有小写/大写/标点符号的文本
            var txt = "前端linong， BrowserLeaks,com <canvas> 1.0" ;
            ctx.textBaseline = "top" ;
            //最常见的类型
            ctx.font = " 14px Arial sans-serif" ;
            ctx.textBaseline = "字母顺序";
            ctx.fillStyle = "#f60" ;
            ctx.fillRect(125,1,62,23);
            //一些颜色混合的技巧,以增加渲染的差异
            ctx.fillStyle = "#069" ;
            ctx.fillText(txt,2,15);
            ctx.fillStyle = "rgba( 102,204,0,0.7 )" ;
            ctx.fillText(txt,4,17);

        })(BrowserLeaksCanvas, BrowserLeaksCanvas.getContext('2d'))
    </script>
    <script>
        function getUUID(){
            // xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (8-4-4-4-12)
            // 时间-随机数-xxxx-xxxx-xxxxxxxxxxxx (8-4-4-4-12)
            var time = new Date().getTime().toString(36).padStart(8,'0').slice(-8);
            var random = Math.random().toString().slice(-4).padStart(4,'0')
            var random2 = Math.random().toString().slice(-4).padStart(4,'0')
            var random3 = Math.random().toString().slice(-4).padStart(4,'0')
            var random4 = Math.random().toString().slice(-12).padStart(12,'0')
            return `${time}-${random}-${random2}-${random3}-${random4}`
        }
    </script>
    <script>
        // 打印ua
        el_ua1.innerText = navigator.userAgent
    </script>
    <script>
        // cookie
        var cookieStr = document.cookie || '';
        var webSignMatch = cookieStr.match(/web-sign=([^;]+)/)
        if(webSignMatch){
            // 已经有cookie记录了
            el_cookie1.innerText = webSignMatch[1]
        }else{
            // webSignMatch = getUUID;
            document.cookie = `web-sign=${getUUID()}; path=/`
        }
    </script>
    <script>
        // localStorage
        var localStorageStr = localStorage.getItem('web-sign') || '';
        var webSignMatch = localStorageStr
        if(webSignMatch){
            // 已经有localStorage记录了
            el_localStorage1.innerText = webSignMatch
        }else{
            localStorage.setItem('web-sign', getUUID())
        }
    </script>
    <script>
        // localStorage
        var sessionStorageStr = sessionStorage.getItem('web-sign') || '';
        var webSignMatch = sessionStorageStr
        if(webSignMatch){
            // 已经有sessionStorage记录了
            el_SessionStorage1.innerText = webSignMatch
        }else{
            sessionStorage.setItem('web-sign', getUUID())
        }
    </script>
