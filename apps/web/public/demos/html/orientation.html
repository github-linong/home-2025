<body>
	<style>
	        @media (orientation: portrait) { 
	            .orientation{font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;} 
	        } 
	        @media (orientation: landscape) { 
	            .orientation{font-family: monospace, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;}
	        }
	    </style>
	    <div id="app">
	    	<button >btn</button><input type="" name="">
	        <p>eventValue: {{eventValue}}</p>
	        <p>setIntervalScreen: {{setIntervalScreen}}</p>
	        <p>innerWidth，innerHeight: {{innerWidth}},{{innerHeight}}</p>
	        <p class="orientation">
	            fontFamily:{{fontFamily}}
	        </p>
	        <p>
	        	isOrientation: {{isOrientation}}
	        </p>
	        <p>
	        	matchMedia: {{matchMedia}}
	        </p>
	        <p>
	        	matchMediaAddEvent: {{matchMediaAddEvent}}
	        </p>
	    </div>
	    <script type="text/javascript">
		    var mediaQueryList = window.matchMedia("screen and (orientation: portrait)");
			console.log(mediaQueryList.media); //"screen and (max-width:480px)"
			console.log(mediaQueryList.matches); //true or false
	    </script>
	    <script>
	        new Vue({
	            el: '#app',
	            data: function(){
	                return {
	                    eventValue: 0,
	                    setIntervalScreen: 0, 
	                    innerWidth: 0,
	                    innerHeight: 0,
	                    fontFamily: '',
	                    isOrientation: ('orientation' in window && 'onorientationchange' in window),
	                    matchMedia: '',
	                    matchMediaAddEvent: ''
	                }
	            },
	            created: function(){
	                var _this = this;                
	                window.addEventListener("orientationchange", function(event) {
	                    _this.eventValue = event.orientation || (screen.orientation && screen.orientation.angle)//等于0|180、90|-90度来判断横竖屏
	                }, false);

	                setInterval(function(){
	                    _this.setIntervalScreen = (screen.orientation && screen.orientation.angle);
	                    _this.fontFamily = window.getComputedStyle(app.querySelector('.orientation'))['font-family']
	                    _this.matchMedia = window.mediaQueryList?(mediaQueryList.matches?'竖屏':'横屏'):'不支持mediaQueryList'
	                }, 40)


	                window.addEventListener("resize", function(event) {
	                    // var orientation=(window.innerWidth > window.innerHeight)? "landscape":"portrait";
	                    _this.innerWidth = window.innerWidth
	                    _this.innerHeight = window.innerHeight
	                }, false);
	                _this.innerWidth = window.innerWidth
	                _this.innerHeight = window.innerHeight

	                if(window.mediaQueryList && mediaQueryList.addListener){
	                	mediaQueryList.addListener(function(){
	                		_this.matchMediaAddEvent = mediaQueryList.matches?'竖屏':'横屏'
	                	})
	                }
	            },
	        })
	    </script>
