	<script>
		function GB2312UTF8() {
			this.Dig2Dec = function(s) {
				var retV = 0;
				if (s.length == 4) {
					for (var i = 0; i < 4; i++) {
						retV += eval(s.charAt(i)) * Math.pow(2, 3 - i);
					}
					return retV;
				}
				return - 1;
			}
			this.Hex2Utf8 = function(s) {
				var retS = "";
				var tempS = "";
				var ss = "";
				if (s.length == 16) {
					tempS = "1110" + s.substring(0, 4);
					tempS += "10" + s.substring(4, 10);
					tempS += "10" + s.substring(10, 16);
					var sss = "0123456789ABCDEF";
					for (var i = 0; i < 3; i++) {
						retS += "%";
						ss = tempS.substring(i * 8, (eval(i) + 1) * 8);
						retS += sss.charAt(this.Dig2Dec(ss.substring(0, 4)));
						retS += sss.charAt(this.Dig2Dec(ss.substring(4, 8)));
					}
					return retS;
				}
				return "";
			}
			this.Dec2Dig = function(n1) {
				var s = "";
				var n2 = 0;
				for (var i = 0; i < 4; i++) {
					n2 = Math.pow(2, 3 - i);
					if (n1 >= n2) {
						s += '1';
						n1 = n1 - n2;
					} else s += '0';
				}
				return s;
			}

			this.Str2Hex = function(s) {
				var c = "";
				var n;
				var ss = "0123456789ABCDEF";
				var digS = "";
				for (var i = 0; i < s.length; i++) {
					c = s.charAt(i);
					n = ss.indexOf(c);
					digS += this.Dec2Dig(eval(n));
				}
				return digS;
			}
			this.Gb2312ToUtf8 = function(s1) {
				var s = escape(s1);
				var sa = s.split("%");
				var retV = "";
				if (sa[0] != "") {
					retV = sa[0];
				}
				for (var i = 1; i < sa.length; i++) {
					if (sa[i].substring(0, 1) == "u") {
						retV += this.Hex2Utf8(this.Str2Hex(sa[i].substring(1, 5)));
						if (sa[i].length) {
							retV += sa[i].substring(5);
						}
					} else {
						retV += unescape("%" + sa[i]);
						if (sa[i].length) {
							retV += sa[i].substring(5);
						}
					}
				}
				return retV;
			}
			this.Utf8ToGb2312 = function(str1) {
				var substr = "";
				var a = "";
				var b = "";
				var c = "";
				var i = -1;
				i = str1.indexOf("%");
				if (i == -1) {
					return str1;
				}
				while (i != -1) {
					if (i < 3) {
						substr = substr + str1.substr(0, i - 1);
						str1 = str1.substr(i + 1, str1.length - i);
						a = str1.substr(0, 2);
						str1 = str1.substr(2, str1.length - 2);
						if (parseInt("0x" + a) & 0x80 == 0) {
							substr = substr + String.fromCharCode(parseInt("0x" + a));
						} else if (parseInt("0x" + a) & 0xE0 == 0xC0) { //two byte
							b = str1.substr(1, 2);
							str1 = str1.substr(3, str1.length - 3);
							var widechar = (parseInt("0x" + a) & 0x1F) << 6;
							widechar = widechar | (parseInt("0x" + b) & 0x3F);
							substr = substr + String.fromCharCode(widechar);
						} else {
							b = str1.substr(1, 2);
							str1 = str1.substr(3, str1.length - 3);
							c = str1.substr(1, 2);
							str1 = str1.substr(3, str1.length - 3);
							var widechar = (parseInt("0x" + a) & 0x0F) << 12;
							widechar = widechar | ((parseInt("0x" + b) & 0x3F) << 6);
							widechar = widechar | (parseInt("0x" + c) & 0x3F);
							substr = substr + String.fromCharCode(widechar);
						}
					} else {
						substr = substr + str1.substring(0, i);
						str1 = str1.substring(i);
					}
					i = str1.indexOf("%");
				}

				return substr + str1;
			}
		}

	<script language="JavaScript">
		function utf8(wide) {
				var c, s;
				var enc = "";
				var i = 0;
				while (i < wide.length) {
					c = wide.charCodeAt(i++);
					// handle UTF-16 surrogates
					if (c >= 0xDC00 && c < 0xE000) continue;
					if (c >= 0xD800 && c < 0xDC00) {
						if (i >= wide.length) continue;
						s = wide.charCodeAt(i++);
						if (s < 0xDC00 || c >= 0xDE00) continue;
						c = ((c - 0xD800) << 10) + (s - 0xDC00) + 0x10000;
					}
					// output value
					if (c < 0x80) enc += String.fromCharCode(c);
					else if (c < 0x800) enc += String.fromCharCode(0xC0 + (c >> 6), 0x80 + (c & 0x3F));
					else if (c < 0x10000) enc += String.fromCharCode(0xE0 + (c >> 12), 0x80 + (c >> 6 & 0x3F), 0x80 + (c & 0x3F));
					else enc += String.fromCharCode(0xF0 + (c >> 18), 0x80 + (c >> 12 & 0x3F), 0x80 + (c >> 6 & 0x3F), 0x80 + (c & 0x3F));
				}
				return enc;
			}
			var hexchars = "0123456789ABCDEF";
			function toHex(n) {
				return hexchars.charAt(n >> 4) + hexchars.charAt(n & 0xF);
			}
			var okURIchars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-";
			function encodeURIComponentNew(s) {
				var s = utf8(s);
				var c;
				var enc = "";
				for (var i = 0; i < s.length; i++) {
					if (okURIchars.indexOf(s.charAt(i)) == -1)
						enc += "%" + toHex(s.charCodeAt(i));
					else
						enc += s.charAt(i);
				}
				return enc;
			}
			// alert(encodeURIComponentNew("中文"))
			// alert(decodeURIComponent(encodeURIComponentNew("中文")))
	</script>
	<script>

		new Vue({
			el: '#app',
			data(){
				return {
					key: "傅如乔 微微",
					// vkey: "AC2CDD0E19804ADB5DA8A843AD272480EA454301725AF0F4DC92E95A0EE919AA2A2E615644364B9EAAD0FA105B780EB165774F7B7F659C6F",
					searchResultList: [],
					blobUrlLlist: []
				}
			},
			methods:{

				// 获取文件下载地址
				getFileURL(ksongmid, accompanymid, songmid){
					return axios(`https://www.lilnong.top/vapi/kg-qq_getksongfileURL?ksongmid=${ksongmid}&accompanymid=${accompanymid}&songmid=${songmid}`)
						.then(v=>v.data)
				},
				// 查询列表
				getSearchResult(){
					var key = this.key.trim()
					axios(`https://www.lilnong.top/vapi/kg-qq_search?searchValue=`+key)
						.then(v=>v.data)
						.then(v=>{
							v.data.forEach(v=>{
								v.vv_download_state = 0;
								v.vv_download_task1 = 0;
								v.vv_download_task2 = 0;
								v.vv_download_task3 = 0;
								v.vv_download_task4 = 0;
							})
							this.searchResultList = v.data;
							var headItem = v.data[0]
							if(headItem){
								this.downloadSongInfo(headItem)				
							}
							var keySplit = key.split(' ')
							if(keySplit[0] == headItem.strSingerName && keySplit[1] == headItem.strSongName){
								// 傅如乔 微微  
							}else if(headItem){
								for(var i = 1, l = v.data.length; i < l; i++){
									if(keySplit[0] == v.data[i].strSingerName && keySplit[1] == v.data[i].strSongName){	
										this.downloadSongInfo(v.data[i]);
										break;
									}	
								}
							}
								// strSingerName: "傅如乔"
								// strSongName: "微微"
						})
						.catch(v=>{
							this.$message({type:'error', message: '搜索异常'})	
						})
				},
				// 下载解密资源
				downloadSongInfo(headItem){
					if(headItem.vv_download_state == 1) return;
					headItem.vv_download_state = 1;// 1 下载中
					this.getProtoKsongInfo(headItem.strKSongMid)
						.then(v=>{
							this.getFileURL(
								headItem.strKSongMid, 
								(v.data.data.strHqAccompanyFileMid ).slice(4) || v.data.data.strAccompanyFileMid, 
								(v.data.data.strHqSongFileMid ).slice(4) || v.data.data.strSongFileMid
							).then(v=>{
								this.$set(headItem, 'strAccompanyFile_url', v.data.accompany_url)
								this.$set(headItem, 'strSongFile_url', v.data.song_url)

								this.tkm2m4a(v.data.accompany_url, (event)=>headItem.vv_download_task1 = event.loaded / event.total * 100)
									.then(v=>this.$set(headItem, 'accompanyFile_blob_download', this.blob2url(v)))

								this.tkm2m4a(v.data.song_url, (event)=>headItem.vv_download_task2 = event.loaded / event.total * 100)
									.then(v=>this.$set(headItem, 'strSongFile_blob_download', this.blob2url(v)))
							})

							var mapContent = v.data.data.mapContent;
							var qrc = mapContent[1].strContent;
							this.hex2utf8(qrc)
								.then(v=>v.data)
								.then(this.hex2arrayBuffer)
								.then(v=>(new Blob(['[offset:0].', v])))
								.then(v=>{
									this.$set(headItem, 'qrc_blob_download', this.blob2url(v))
								})
							
							var lrc = mapContent[10].strContent
							this.hex2utf8(lrc)
								.then(v=>v.data)
								.then(v=>{
									// console.log('hex2utf8', v)
									this.$set(headItem, 'lrc_blob_download', this.blob2url(new Blob([v])))

									// this.$set(headItem, 'ksc_blob_download', this.blob2url(new Blob([(['karaoke := CreateKaraokeObject;',
									// 'karaoke.clear;',
									// 'karaoke.songname := '+JSON.stringify(headItem.strSongName.replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))+';',
									// 'karaoke.singer := '+JSON.stringify(headItem.strSingerName.replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))+';',
									// ''].join('\n')
									// + '\n' 
									// + this.lrc2ksc(v))
									// 	// .replace(/'/g,'\\\'')
									// 	.replace(/"/g,'\'').trim() ])))
									var str = 
									this.utf82gb2312(
										([
											'',
											'karaoke := CreateKaraokeObject;',
											'karaoke.clear;',
											'',
											'karaoke.internalnumber := 0;',
											'karaoke.songname := '+JSON.stringify(headItem.strSongName.replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))+';',
											'karaoke.singer := '+JSON.stringify(headItem.strSingerName.replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))+';',
											'karaoke.audioorder := 1;',
											'karaoke.wordcount := 0;',
											'karaoke.songclass := \'\';',
											'karaoke.langclass := \'\';',
											'karaoke.pinyin := \'\';',
											'karaoke.songstyle := \'\';',
											'karaoke.tag(\'lyrics\', \'\');',
											'karaoke.tag(\'music\', \'\');',
											'karaoke.tag(\'quality\', \'\');',
											'karaoke.tag(\'mute\', \'0\');',
											'karaoke.tag(\'valid\', \'1\');',
											'karaoke.tag(\'authFlag\', \'1\');',
											'karaoke.tag(\'authOrigin\', \'0\');',
											'karaoke.tag(\'authAccompany\', \'1\');',
											'karaoke.tag(\'canDownload\', \'1\');',
											'karaoke.tag(\'userid\', \'\');',
											'karaoke.tag(\'nickname\', \'\');',
											'',
											''
										].join('\n')+ this.lrc2ksc(v))
										.replace(/"/g,'\'').trim()
									).then(v=>{
										this.$set(headItem, 'ksc_blob_download', this.blob2url(v.data))
									})
								})
						})
				},
				kscFormDate(str){
					var _str = str.toString().padStart(10, 0);
					var s = _str / 1000 >> 0
					
					return `${(s/60>>0).toString().padStart(2, 0)}:${(s%60).toString().padStart(2, 0)}.${_str.slice(-3)}`
				},
				lrc2ksc(str){
					var str1 = $(str).find('LyricInfo').children().attr('LyricContent')
					var arr = str1.split('\n').map(v=>v.trim()).filter(v=>/^\[\d+,\d+\]/.test(v))
					var arr1 = arr.reduce((s, v)=>{
						var time = v.match(/^\[(\d+),(\d+)\]/)
						if(time){
							var startTime = this.kscFormDate(time[1]);
							var endTime = this.kscFormDate(+time[1] + +time[2]);
							s.push([startTime, endTime, v.replace(/(\[|\()\d+,\d+(\]|\))/g,''), v.match(/\(\d+,(\d+)\)/g).map(v=>v.match(/(\d+)/g)[1]).join()])
						}
						return s
					}, [])
					return arr1.map(v=>
						`karaoke.add(${
							JSON.stringify(v[0].replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))
						}, ${
							JSON.stringify(v[1].replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))
						}, ${
							JSON.stringify(v[2].replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))
						}, ${
							JSON.stringify(v[3].replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;'))
						});`).join('\n')
				},
				// 获取详情
				getProtoKsongInfo(key){
					key = (key || '').trim()
					return axios(`https://www.lilnong.top/vapi/kg-qq_protoKsonginfo?searchValue=`+key)
				},
				// blob 转 url
				blob2url(blob){
					var url = URL.createObjectURL(blob);
					this.blobUrlLlist.push(blob);
					return url;
				},
				utf82gb2312(str){
					return axios({
						url: '/vapi/utf82gb2312',
						method: 'post',
						data: {
							searchValue: str//'123abc李'
						},
						responseType: 'blob'
					})
				},
				// hex 转 utf8
				hex2utf8(val){
					return axios({
						url: '/vapi/hex2utf8',
						data: {
							'searchValue': val
						},
						method: 'post'
					})
				},
				// hex 转 arraybuffer
				hex2arrayBuffer: function(hex){
					var abuffer = new ArrayBuffer(hex.length/2);
					var dataview = new DataView(abuffer)
					hex.match(/[a-z0-9]{2}/gi).map((v, i)=>dataview.setUint8(i, parseInt(v, 16)))
					return abuffer
				},
				// tkm 转 m4a
				tkm2m4a(url, onDownloadProgress){
					return axios({
						url: '/vapi/tkmUrl2m4a',
						params: {
							url: url
						},
						onDownloadProgress: onDownloadProgress,
						responseType: 'blob'
					}).then(v=>v.data)
				}
			}
