    <style>
        .wrap{width: 100vw;height: 100vh;overflow: hidden;position: relative;}
        .background-wrap{width: 100%;height: 100%;position: absolute;top: 0;left: 0;z-index: -1;background: url() #161824 no-repeat center center;background-size: cover;}
            .background-wrap:before {content: " ";position: absolute;left: 0;right: 0;bottom: 0;top: 0;background-color: rgba(0,0,0,.5);}
        .volume-wrap{padding: .4rem .4rem .2rem;}
            .volume-icon{margin-right: .2rem}
        /* .lrc-wrap{position: absolute;top:2rem;left:0;right:0;bottom:2rem;} */
        .lrc-wrap{position: relative;height: calc(100vh - 3.75rem);}
          .song-controls-wrap{color: #f18821;;font-size: .4rem;position: absolute;top: 50%;transform: translate(0,-50%);left: 0;right: 0;}
            .song-controls-btn{padding: 1rem .2rem;}
          .lrc-scroll-wrapper{height: 100%;overflow: auto;}
          /* .lrc-scroll-content{padding: 50% 0;} */
          .lrc-scroll-wrapper:before{content:''}
          .lrc-scroll-wrapper:after{content:''}
          .lrc-scroll-content{padding: calc((100vh - 3.75rem) / 2) 0;}
            .lrc-scroll-item{white-space: nowrap;line-height: 2;font-size: .5rem;text-align:center;color: RGBA(200,200,200,.5);}
            /* .lrc-scroll-item.verse:before{content:'主';float:left} */
            /* .lrc-scroll-item.refrain:after{content:'副';float:right} */
            .lrc-scroll-item.current{color: rgba(200,200,200,1);outline: 1px solid rgba(200,200,200,1)}
            .lrc-scroll-item.refrain{color: rgb(255, 97, 97)}
            .lrc-scroll-item.hover{outline: 1px solid #f00;}
        .audio-controls{width:0;height:0;}
        .progress-wrap{padding: .3rem 0;}
            .progress-time{width:10em;text-align: center;font-size: .4rem;color: #9c9c9c;text-shadow: rgba(255, 255, 255, 0.44) 0px 0px 0px;}
        /* .controls-wrap{padding: 10vw 0;} */



        .flex{display: flex;align-items: center;}
        .flex-justify-center{justify-content: center;}
        .flex-justify-evenly{justify-content: space-evenly;}
        .flex-justify-between{justify-content: space-between;}
        

    </style>
	<div id="app">
        <div class="wrap">
            <div class="background-wrap" :style="{backgroundImage:backgroundImage}"></div>
            <div class="flex volume-wrap">
                <van-icon class="volume-icon" size=".5rem" color="#ccc" name="volume-o" @click="volume = 0"></van-icon>
                <van-slider class="volume-slider" active-color="#ccc" button-size=".3rem"  inactive-color="#888" v-model="volume"></van-slider>
            </div>
            <div class="lrc-wrap"  @touchstart="pause">
                <div class="lrc-scroll-wrapper">
                    <ul class="lrc-scroll-content">
                      <li  
                        v-for="(item, idx) in columns" 
                        class="lrc-scroll-item" 
                        :class="{hover: lyricHover == idx,current: lyricCurrent == idx,refrain: item.state == 'refrain'}"

                    </ul>
                </div>
                <div class="flex song-controls-wrap flex-justify-between" v-show="audioIsPlayer">
                  <span class="song-controls-btn" @touchstart.stop="switchRefrainState(1)">标记为开始</span>
                  <span class="song-controls-btn" @touchstart.stop="switchRefrainState(0)">标记为结束</span>
                </div>
            </div>
            <div class="flex progress-wrap">
                <span class="progress-time">{{progressCurrentText}}</span>
                <van-slider :value="progressCurrent" @input="progressChange" :max="progressLength"  active-color="#ccc" button-size=".3rem"  inactive-color="#888"></van-slider>
                <span class="progress-time">{{progressLengthText}}</span>
            </div>

            <div class="flex controls-wrap flex-justify-evenly">
                <van-button type="primary" round  :disabled="submitDisabled" @click="submit">提交</van-button>
                <van-icon name="play-circle-o" color="#ccc" v-show="!audioIsPlayer" @click="play" size="1.5rem"></van-icon>
                <van-icon name="pause-circle-o" color="#ccc" v-show="audioIsPlayer" @click="pause" size="1.5rem"></van-icon>
                <van-button type="primary" style="visibility: hidden;" round  size="mini">重置</van-button>
            </div>
            <audio class="audio-controls" autoplay ref="audio" @loadedmetadata="loadedmetadata" @timeupdate="timeupdate" ></audio>
        </div>

                  if(this.refrainEndBtnTime > this.refrainStartBtnTime){
                    // 结束按钮单击时间大于开始按钮单击时间
                    if(this.columns.some(v=>v.state == 'refrain')){
                      return false

                  }

                    return `${String(this.progressLength/60>>0).padStart(2,'0')}:${String(this.progressLength%60>>0).padStart(2,'0')}`

                })

                    wrapper = document.querySelector('.lrc-scroll-wrapper')
                    betterScrollList = new BScroll(wrapper,{
                        probeType: 2
                    })
                    betterScrollList.on('scroll', ()=>{
                        var idx = Math.min(Math.max(Math.min(betterScrollList.y / betterScrollList.maxScrollY, 1),0) * this.columns.length >> 0, this.columns.length-1);
                        this.pause();
                        this.lyricHover = idx;
                        if(this.refrainState){
                          this.switchRefrainState(1)
                          this.switchRefrainState(0)
                        }
                    })
                    betterScrollList.on('scrollEnd', ()=>{
                        if(this.lyricHover != -1){
                            this.lrcpickerchange(document.querySelector('.lrc-scroll-item.hover'), this.columns[this.lyricHover].time)
                            this.lyricHover = -1
                        }
                    })
                })
            },
            methods:{
                play(){
                    clearTimeout(playTimeoutTag)
                    playTimeoutTag = setTimeout(v=>{
                        this.$refs.audio.play()
                    }, 200);
                },
                pause(){
                    clearTimeout(playTimeoutTag)
                    this.$refs.audio.pause()
                    this.$nextTick(v=>{
                        this.audioIsPlayer = false;
                    })
                },
                progressChange(val){
                    this.pause()
                    this.$refs.audio.currentTime = val;
                    this.play();
                },
                loadedmetadata(){
                    this.progressCurrent = this.$refs.audio.currentTime;
                    this.progressLength =  this.$refs.audio.duration;
                    this.volume = this.$refs.audio.volume * 100
                },

                    this.$refs.audio.currentTime = time;
                    this.play()
                },

                  console.log({
                    startTime: this.refrainStartBtnTime,
                    endTime: this.refrainEndBtnTime,
                    list: JSON.stringify(this.columns)
                  })
                },
                switchRefrainState(state){
                  if(state == 1){
                    refrainStartBtnTime = Date.now()
                    // 开启
                    this.refrainState = true
                    this.columns.forEach(v=>{
                      v.state = 'verse'
                    })
                    this.refrainStartBtnTime = this.$refs.audio.currentTime
                  }else{
                    refrainEndBtnTime = Date.now()
                    this.refrainState = false
                    this.refrainEndBtnTime = this.$refs.audio.currentTime
                  }
                },
                timeupdate(){
                    this.progressCurrent = this.$refs.audio.currentTime;
                    this.audioIsPlayer = true
                    var findItem = (this.columns.findIndex(v=>{
                        return v.time>this.$refs.audio.currentTime
                    }) - 1)
                    this.lyricCurrent = findItem || (this.$refs.audio.currentTime > 10?(this.columns.length - 1 ):0);
                    if(this.refrainState){
                        this.columns[this.lyricCurrent].state = 'refrain'
                    }
                    betterScrollList.scrollToElement(document.querySelectorAll('.lrc-scroll-item')[this.lyricCurrent], 300, true, true)
                }
            }
        })
