<body class="box">
	<h1>这是一个测试</h1>
    <div class="scroll" style="height:1500px;overflow:hidden">
        
    </div>
    <div class="noscroll" style="height:1500px;overflow:hidden">
        
    </div>
    <script type="text/javascript">
    	
    	var list = [];
    	var loadList = (len = 10) => {
			for(var i =0; i < len; i++){
				var _num = Math.floor(Math.random()* 999)
				list.push(`
					<div class="item">
						<img src="https://picsum.photos/400/800/?image=${_num}">
						<p>${_num}</p>
						<p>${Math.floor(Math.random()* 999)}-${_num}</p>
					</div>
				`)
				document.querySelector('.noscroll').innerHTML = document.querySelector('.scroll').innerHTML = list.join('');
			}
    	}
    	loadList(30);

    	var overscroll = function(el) {
    	    el.addEventListener('touchstart', function() {
    	        var top = el.scrollTop
    	        ,totalScroll = el.scrollHeight
    	        ,currentScroll = top + el.offsetHeight;
    	        if(top === 0) {
    	            el.scrollTop = 1;
    	        }else if(currentScroll === totalScroll) {
    	            el.scrollTop = top - 1;
    	        }
    	    });

    	    el.addEventListener('touchmove', function(evt) {
    	    if(el.offsetHeight < el.scrollHeight)
    	        evt._isScroller = true;
    	    });
    	}
    	        
    	overscroll(document.querySelector('.scroll'));
    	document.body.addEventListener('touchmove', function(evt) {
    	    if(!evt._isScroller) {
    	    	console.log(1)
    	        evt.preventDefault();
    	    }
    	});
    </script>
