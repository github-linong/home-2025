	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>

<body>
	<div id="app">
		<ul class="list">
			<li v-for="item in list">{{item}}</li>
		</ul>
		<div class="chat-send">
			<input type="text" class="chat-input" v-model.trim="val" @keyup.enter="send"/><button @click="send">发送</button>
		</div>
	</div>
	<style>
		*{padding:0;margin:0}
		body,html,#app{height: 99vh}
		.chat-send{display:flex;position: absolute;;align-items:flex-start;bottom:0;left:0;right:0;background:#f00;height: 100px}
		.chat-input{flex:1}

		.list{height: 200px;overflow: scroll}
	</style>
	<script>
		new Vue({
			el: '#app',
			data() {
				return {
					list: [],
					val: ''
				}
			},
			methods: {
				send() {
					if (!this.val) return;
					this.list.push(this.val)
					this.val = ''
					this.$nextTick(()=>{
						document.documentElement.scrollTop = 0
					})
				}
			}
		})
	</script>
