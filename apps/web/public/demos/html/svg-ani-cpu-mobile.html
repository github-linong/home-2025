<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
	<style type="text/css">
		*{padding:0;margin:0;}
		svg{
		  stroke-dasharray: 280%, 800%; 
		  stroke-dashoffset: 1px; 
		  transition: all 10s linear 0s;
		  transform: scale(-1, 1);
		}
		svg.ani{
		  stroke-dasharray: 0, 800%; 
		}
	</style>
	<svg viewBox="0 0 100 100">
	  <path 
	    d="M 50,50 m 0,-44 a 44,44 0 1 0 0,88 a 44,44 0 1 0 0,-88" 
	    stroke-linecap="round" 
	    stroke="#ffd145" 
	    stroke-width="8" 
	    fill-opacity="0" 
	    style="">
	  </path>

	</svg>
	<script type="text/javascript">
		setTimeout(v=>{
		  document.querySelector('svg').classList.add('ani');
		  
		},1000)
	</script>
</body>
</html>
