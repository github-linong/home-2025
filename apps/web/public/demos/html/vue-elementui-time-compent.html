<body>
	<div id="app">
        <p><button @click="value = []">重置</button>{{value}}</p>
        <v-time v-model="value"></v-time>
    </div>
    <script>
        Vue.component('v-time',{
            props: ['value'],
            data(){
                return {
                    radio: '',
                    value1: ''
                }
            },
            watch: {
                value(val){
                    console.log('watch-value', val)
                    if(val == '' || val.length == 0){
                        this.value1 = ''
                        this.radio = ''
                    }
                }
            },
            methods: {
                timeChange(){
                    console.log('timeChange', arguments);
                    this.radio = '';
                    this.$emit('input', arguments[0])
                },
                radioChange(){
                    console.log('radioChange', arguments)
                    this.value1 = ''
                    this.$emit('input', [arguments[0]])
                }
            },
            template: `
                <div>
                    <el-radio-group
                      @change="radioChange"
                      v-model="radio">
                        <el-radio :label="1028">1028</el-radio>
                        <el-radio :label="2019">2019</el-radio>
                        <el-radio :label="2020">2020</el-radio>
                    </el-radio-group>
                    <el-date-picker
                        @change="timeChange"
                        v-model="value1"
                        type="daterange"
                        range-separator="至"
                        start-placeholder="开始日期"
                        end-placeholder="结束日期">
                    </el-date-picker>
                </div>
            `
        })
        new Vue({
            el: '#app',
            data(){
                return {
                    value: []
                }
            }
        })
    </script>
