<html>
<head>
	<meta charset="utf-8">
	<title>Vue 实现弹幕效果 - www.lilnong.top</title>
	<meta keywords="Vue,弹幕,">
	<meta description="Vue 实现弹幕效果">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/theme-chalk/index.min.css">
	<script src="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/index.min.js"></script>
</head>
<body>
    <h2>BUG修复 DEMO</h2>
	<div id="app">
        <div class="flex">
            <input style="flex: 1 1 auto" type="text" ref="input" v-model="value">
            <button style="flex: 0 1 3em;text-align: center;" @click="sendBullet">发送</button>
        </div>
        <div class="bullet-wrap">
            <div class="bullet-item bullet-animation" 
                :class="{'bullet-item--c': item.isLoginUser}" 
                :data-line="item.line"
                v-for="(item, idx) in bulletlist" 
                @animationend="animationend"
                :key="item.id">{{item.name}}</div>
        </div>
    </div>
    <style>
        .flex{display: flex;}
        
        .bullet-wrap{height: 400px;position: relative;overflow: hidden;font-size: 36px;background: url(https://www.lilnong.top/static/img/Desert.jpg) center center no-repeat;background-size: cover;}
		    .bullet-item{text-shadow: 1px 1px #000;color: #ffffff82;white-space: nowrap;user-select: none;position: absolute;top:0;left:0;}
            .bullet-item--c{border: 1px solid  #ff000082;}
            .bullet-item[data-line="1"]{top: 0px}
            .bullet-item[data-line="2"]{top: 80px}
            .bullet-item[data-line="3"]{top: 160px}
            .bullet-item[data-line="4"]{top: 240px}
            .bullet-item[data-line="5"]{top: 320px}
            .bullet-animation{animation: right2left 7s linear both;}
        
        @keyframes right2left {
            0% {transform: translate(100vw)}
            100% {transform: translate(-100%);}
        }
    </style>
    <script>
        function getUUID(){
            return Date.now() + Math.random()
        }
        new Vue({
            el: '#app',
            data(){
                return {
                    list: [
                        {id: getUUID(), name: 'www.lilnong.top', isLoginUser: true, line: 0},
                        {id: getUUID(), name: '微信搜一搜：前端linong', isLoginUser: true, line: 0},
                        {id: getUUID(), name: 'Vue 实现弹幕效果', isLoginUser: true, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀1', isLoginUser: false, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀2', isLoginUser: false, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀3', isLoginUser: false, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀4', isLoginUser: false, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀5', isLoginUser: false, line: 0},
                        {id: getUUID(), name: '小帅哥快来玩呀6', isLoginUser: false, line: 0}
                    ], // 普通的弹幕队列
                    clist: [], // c位的弹幕队列
                    bulletlist: [], // 当前正在执行的
                    value: '',
                    idx: 3,
                }
            },
            mounted(){
                setInterval(()=>{
                    var item = null;
                    if(this.idx == 3){
                        // c 位
                        item = this.clist.shift();
                    }
                    if(!item){
                        item = this.list.shift();
                    }
                    if(item){
                        item.line = this.idx;
                        this.idx = (this.idx % 5 + 1);
                        this.bulletlist.push(item)
                    }else{
                        if(this.clist.length){
                            item = this.clist.shift();
                            item.line = 3;
                            this.idx = 3;
                            this.bulletlist.push(item)
                        }
                    }
                }, 1000)
            },
            methods:{
                animationend(){
                    // console.log('animationend');
                    this.list.push(this.bulletlist.shift())
                },
                sendBullet(){
                    if(this.value){
                        this.clist.push({
                            id: getUUID(), 
                            name: this.value, 
                            isLoginUser: true,
                            line: 0
                        })
                        this.value = ''
                        this.$nextTick(v=>{
                            this.$refs.input.focus()
                        })
                    }
                }
            }
        })
    </script>
