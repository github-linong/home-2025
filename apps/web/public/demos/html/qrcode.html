	<title>构建二维码</title>
	<style type="text/css">
		#myTextarea{
			display: block;
		    width: 100%;
			min-height:3em;
		}
	</style>
</head>
<body>
	<textarea id="myTextarea">https://segmentfault.com/u/linong</textarea>
	<div id="qrcode"></div>
	<script type="text/javascript">

		var qrcode = new QRCode(document.getElementById("qrcode"), {
			text: $.trim($('#myTextarea').val()),
			width: 500,
			height: 500,
			colorDark : "#000000",
			colorLight : "#ffffff",
			correctLevel : QRCode.CorrectLevel.H
		});

		$('#myTextarea').on('input', function(){
			//new QRCode($("#qrcode").html('').get(0), $.trim($(this).val()));
			qrcode.clear(); // clear the code.
			qrcode.makeCode($.trim($(this).val())); // make another code.
		})//.trigger('input')
		setInterval(v=>{
			document.querySelector('#qrcode').querySelector('img').style.width = Math.random()*100 + '%'
			document.querySelector('#qrcode').querySelector('canvas').style.width = Math.random()*100 + '%'
		}, 3000)
	</script>
