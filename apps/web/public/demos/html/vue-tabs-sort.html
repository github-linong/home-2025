<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>tabs 搜索重置 - www.lilnong.top</title>
	<meta keywords="Vue, tabs 搜索重置">
	<meta description="Vue, tabs 搜索重置">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
		<p>activeName: {{activeName}}</p>
		<p>sort: {{sort}}</p>
		<el-tabs v-model="activeName" @tab-click="handleClick">
			<el-tab-pane label="用户管理" name="first">
				<span slot="label"><i @click="sort = 'asc'" v-show="'first' == activeName && sort == 'desc'">升</i> <i @click="sort = 'desc'" v-show="'first' == activeName &&sort == 'asc'">降</i> 用户管理</span>
				用户管理
			</el-tab-pane>
			<el-tab-pane label="配置管理" name="second">
				<span slot="label"><i @click="sort = 'asc'" v-show="'second' == activeName &&sort == 'desc'">升</i> <i @click="sort = 'desc'" v-show="'second' == activeName &&sort == 'asc'">降</i> 配置管理</span>
				配置管理
			</el-tab-pane>
			<el-tab-pane label="角色管理" name="third">角色管理</el-tab-pane>
			<el-tab-pane label="定时任务补偿" name="fourth">定时任务补偿</el-tab-pane>
		</el-tabs>
	</div>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					activeName: 'second',
					sort: 'asc'
				}
			},
			watch: {
				activeName(val, oldVal){
					if(val != oldVal){
						this.sort = 'desc'
					}
				}
			},
			methods: {
				handleClick(tab, event) {
					console.log(tab, event);
				}
			}
		})
	</script>
	
	<br>
	<hr>
	<br>
	<div id="app1">
		<p>多开关控制场景</p>
		<p>activeName: {{activeName}}</p>
		<p>sort1: {{sort1}}</p>
		<p>sort2: {{sort2}}</p>
		<el-tabs v-model="activeName" @tab-click="handleClick">
			<el-tab-pane label="用户管理" name="first">
				<span slot="label"><i @click="sort1 = 'asc'" v-show="'first' == activeName && sort1 == 'desc'">升</i> <i @click="sort1 = 'desc'" v-show="'first' == activeName &&sort1 == 'asc'">降</i> 用户管理</span>
				用户管理
			</el-tab-pane>
			<el-tab-pane label="配置管理" name="second">
				<span slot="label"><i @click="sort2 = 'asc'" v-show="'second' == activeName &&sort2 == 'desc'">升</i> <i @click="sort2 = 'desc'" v-show="'second' == activeName &&sort2 == 'asc'">降</i> 配置管理</span>
				配置管理
			</el-tab-pane>
			<el-tab-pane label="角色管理" name="third">角色管理</el-tab-pane>
			<el-tab-pane label="定时任务补偿" name="fourth">定时任务补偿</el-tab-pane>
		</el-tabs>
	</div>
	<script>
		new Vue({
			el: '#app1',
			data(){
				return {
					activeName: 'second',
					sort1: 'asc',
					sort2: 'asc'
				}
			},
			watch: {
				activeName(val, oldVal){
					if(val != oldVal){
						this.sort1 = 'desc'
						this.sort2 = 'desc'
					}
				}
			},
			methods: {
				handleClick(tab, event) {
					console.log(tab, event);
				}
			}
		})
	</script>
