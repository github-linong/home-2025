<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows File Manager (Vue 2 + Element UI)</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            height: 40px;
            background: #f5f5f5;
            border-bottom: 1px solid #dcdfe6;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            border-right: 1px solid #dcdfe6;
            overflow-y: auto;
            background: #fff;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .breadcrumb-bar {
            padding: 10px 20px;
            border-bottom: 1px solid #ebeef5;
        }

        .file-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 15px;
        }

        .file-item {
            width: 100px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .file-item:hover {
            background-color: #e8f3ff;
            border-color: #cce8ff;
        }

        .file-item.active {
            background-color: #cce8ff;
            border-color: #99d1ff;
        }

        .file-icon {
            font-size: 48px;
            color: #409EFF;
            margin-bottom: 10px;
        }

        .file-icon.is-folder {
            color: #E6A23C;
        }

        .file-name {
            font-size: 12px;
            text-align: center;
            word-break: break-all;
            padding: 0 5px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="header">
            <el-button type="text" icon="el-icon-back" :disabled="!canGoBack" @click="goBack">后退</el-button>
            <el-divider direction="vertical"></el-divider>
            <span>Vue 2 File Manager Demo</span>
        </div>

        <div class="main-container">
            <div class="sidebar">
                <!-- Tree Node -->
                <el-tree ref="tree" :data="treeData" :props="defaultProps" node-key="id" highlight-current
                    :default-expanded-keys="[1]" @node-click="handleNodeClick" icon-class="el-icon-folder">
                </el-tree>
            </div>

            <div class="content">
                <div class="breadcrumb-bar">
                    <el-breadcrumb separator="/">
                        <el-breadcrumb-item v-for="(item, index) in breadcrumbs" :key="index">{{ item.label
                            }}</el-breadcrumb-item>
                    </el-breadcrumb>
                </div>

                <div class="file-list" @click.self="currentSelection = null">
                    <div v-for="file in currentFiles" :key="file.id" class="file-item"
                        :class="{ active: currentSelection === file.id }" @click="selectFile(file)"
                        @dblclick="openFile(file)">
                        <i class="file-icon" :class="getFileIcon(file)"></i>
                        <span class="file-name">{{ file.label }}</span>
                    </div>
                    <div v-if="currentFiles.length === 0"
                        style="width: 100%; text-align: center; color: #909399; margin-top: 50px;">
                        暂无文件
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Vue -->
    <script src="https://unpkg.com/vue@2.7.14/dist/vue.js"></script>
    <!-- 引入 Element UI -->
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: function () {
                return {
                    currentSelection: null,
                    currentPathNode: null,
                    historyStack: [],

                    // 模拟文件树结构
                    treeData: [{
                        id: 1,
                        label: '此电脑',
                        type: 'root',
                        children: [{
                            id: 2,
                            label: '本地磁盘 (C:)',
                            type: 'drive',
                            children: [{
                                id: 11,
                                label: 'Windows',
                                type: 'folder',
                                children: []
                            }, {
                                id: 12,
                                label: 'Program Files',
                                type: 'folder',
                                children: [
                                    { id: 101, label: 'Vue.js', type: 'file', ext: 'js' },
                                    { id: 102, label: 'React.js', type: 'file', ext: 'js' }
                                ]
                            }, {
                                id: 13,
                                label: 'Users',
                                type: 'folder',
                                children: [
                                    {
                                        id: 131, label: 'Documents', type: 'folder', children: [
                                            { id: 201, label: 'Project A', type: 'folder', children: [] },
                                            { id: 202, label: 'Report.docx', type: 'file', ext: 'docx' }
                                        ]
                                    },
                                    {
                                        id: 132, label: 'Downloads', type: 'folder', children: [
                                            { id: 301, label: 'installer.exe', type: 'file', ext: 'exe' },
                                            { id: 302, label: 'image.png', type: 'file', ext: 'png' }
                                        ]
                                    }
                                ]
                            }]
                        }, {
                            id: 3,
                            label: '本地磁盘 (D:)',
                            type: 'drive',
                            children: [
                                { id: 21, label: 'Games', type: 'folder', children: [] },
                                { id: 22, label: 'Music', type: 'folder', children: [] }
                            ]
                        }]
                    }],
                    defaultProps: {
                        children: 'children',
                        label: 'label'
                    }
                };
            },
            computed: {
                currentFiles() {
                    if (!this.currentPathNode) return [];
                    return this.currentPathNode.children || [];
                },
                breadcrumbs() {
                    // 简单的面包屑生成逻辑，实际可能需要通过 tree 查找父级链
                    // 这里简化处理，只显示当前节点
                    if (!this.currentPathNode) return [];
                    // 实际项目中可以通过 node.parent 递归获取完整路径
                    // 这是一个简化版
                    return [{ label: this.currentPathNode.label }];
                },
                canGoBack() {
                    return this.historyStack.length > 0;
                }
            },
            mounted() {
                // 初始化选中第一个节点
                this.currentPathNode = this.treeData[0];
                this.$nextTick(() => {
                    this.$refs.tree.setCurrentKey(this.treeData[0].id);
                });
            },
            methods: {
                handleNodeClick(data) {
                    if (this.currentPathNode && this.currentPathNode.id !== data.id) {
                        this.pushHistory(this.currentPathNode);
                    }
                    this.currentPathNode = data;
                    this.currentSelection = null;
                },
                selectFile(file) {
                    this.currentSelection = file.id;
                },
                openFile(file) {
                    if (file.type === 'folder' || file.type === 'drive' || file.type === 'root') {
                        // 展开树节点
                        const node = this.$refs.tree.getNode(file.id);
                        if (node) {
                            node.expand();
                            this.$refs.tree.setCurrentKey(file.id);
                        }
                        this.handleNodeClick(file);
                    } else {
                        this.$message.success('打开文件: ' + file.label);
                    }
                },
                getFileIcon(file) {
                    if (file.type === 'folder' || file.type === 'root') return 'el-icon-folder is-folder';
                    if (file.type === 'drive') return 'el-icon-coin is-folder'; // 近似硬盘图标

                    // 根据扩展名简单的图标映射
                    if (file.ext === 'png' || file.ext === 'jpg') return 'el-icon-picture-outline';
                    if (file.ext === 'js' || file.ext === 'html') return 'el-icon-document';
                    return 'el-icon-document';
                },
                pushHistory(node) {
                    this.historyStack.push(node);
                },
                goBack() {
                    if (this.historyStack.length > 0) {
                        const prev = this.historyStack.pop();
                        this.currentPathNode = prev;
                        this.$refs.tree.setCurrentKey(prev.id);
                        // 确保树节点展开
                        const node = this.$refs.tree.getNode(prev.id);
                        if (node && node.parent) {
                            node.parent.expand();
                        }
                    }
                }
            }
        });
    </script>
</body>

</html>
