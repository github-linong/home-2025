<body>
	<div id="app">
		<p>{{val}}</p>
		<v-input :value="val" @input="val = $event"></v-input>
	</div>
	<script>
		Vue.component('v-input', {
			props: ['val'],
			template: '<input :value="val" @input="emitInput">',
			methods:{
				emitInput(e){
					this.$emit('input', e.target.value)
				}
			}
		})
	</script>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					val: ''
				}
			}
		})
	</script>
