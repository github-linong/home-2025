	<script src="https://cdn.bootcdn.net/ajax/libs/EaselJS/1.0.2/easeljs.min.js"></script>

<body>
	<div id="app">
		<p>https://github.com/CreateJS/EaselJS</p>
		<canvas id="myCanvas"></canvas>
	</div>
	<script>
		//Draw a square on screen.
		//Simple Example
		var stage = new createjs.Stage('myCanvas');
		var shape = new createjs.Shape();
		shape.graphics.beginFill('red').drawRect(0, 0, 120, 120);
		stage.addChild(shape);
		stage.update();



		// Sprite Animation Example
		var ss = new createjs.SpriteSheet({
			frames: {
				// width: 32,
				// height: 64,
				width: 150,
				height: 150,
				numFrames: 4
			},
			animations: {run: [0, 25], jump: [26, 63, "run"]},
			// images: ["./assets/runningGrant.png"]
			images: ["//www.lilnong.top/static/img/avator/avator-21.jpg"]
			
		});
			
		var sprite = new createjs.Sprite(ss, "run");
		sprite.scaleY = sprite.scaleX = 0.4;
		stage.addChild(sprite);
			
		sprite.on("click", function() { 
			sprite.gotoAndPlay("jump");
		});
			
		createjs.Ticker.on("tick", stage);

		stage.update();
	</script>
