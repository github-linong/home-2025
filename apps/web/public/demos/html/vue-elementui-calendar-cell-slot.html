<body>
	<div id="app">
		<p>{ type, isSelected, day}，
			type 表示该日期的所属月份，可选值有 prev-month，current-month，next-month；
			isSelected 标明该日期是否被选中；
			day 是格式化的日期，格式为 yyyy-MM-dd</p>
		<el-calendar>
		  <!-- 这里使用的是 2.5 slot 语法，对于新项目请使用 2.6 slot 语法-->
		  <template
		    slot="dateCell"
		    slot-scope="{date, data}">
		    <!-- <p :class="data.isSelected ? 'is-selected' : ''">
		      {{ data.day.split('-').slice(1).join('-') }} {{ data.isSelected ? '' : ''}}
		    </p> -->
		    <div style="width:100%;height: 100%;overflow: hidden;color: #333" :style="{color: filterDate(date)?'#000':'#ddd'}">
			    <!-- <div>date:{{date}}</div> -->
			    <!-- <div>data:{{data}}</div> -->
			    <div>{{filterDate(date)}}</div>
			    <div>{{data.day}}</div>
		    </div>
		  </template>
		</el-calendar>
	</div>
	<script type="text/javascript">
		var date = new Date();
		date.setHours(0,0,0,0)
		var showTimes = 1000*60*60*24*14;
		var showTimes = 1000*60*60*24*5;
		new Vue({
			el: '#app',
			data(){
				return {

				}
			},
			methods:{
				filterDate(_date){
					if(_date.getTime()>date.getTime()
						&& _date.getTime()-date.getTime() < showTimes){
						return true;
					}
					return false;
				}
			}
		})
	</script>
