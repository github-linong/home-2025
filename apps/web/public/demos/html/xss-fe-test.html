		function escapeHtml(string) {
			// https://segmentfault.com/q/1010000002395872
		    var entityMap = {
		        "&": "&amp;",
		        "<": "&lt;",
		        ">": "&gt;",
		        '"': '&quot;',
		        "'": '&#39;',
		        "/": '&#x2F;'
		    };
		    return String(string).replace(/[&<>"'\/]/g, function (s) {
		        return entityMap[s];
		    });
		}
		div = document.createElement('div');
		url = '" onerror="alert(5)'
