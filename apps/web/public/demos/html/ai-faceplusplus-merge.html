<body>
	
	<style type="text/css">
		.file{
			display: block;width:0;height:0;overflow: hidden;
		}
		.lableFile{
			display: block;background: #FB4;text-align: center;
			height: 20vw;min-height: 50px;line-height: 20vw;
		}
	</style>
	<style type="text/css">
		.lableFile{
			position: relative;
		}
		.labelFileLine{
			width: 0px;height: 5px;position: absolute;left: 0;bottom:0;background: #80ba80;
		}
	</style>
	<div id="app">
		<div>
			<h2>人脸融合 旷视</h2>
			<input type="file" id="file1" class="file">
			<label for="file1" class="lableFile"><span id="labelFileLine" class="labelFileLine"></span><span id="labelFileTxt">请单击这里，然后选择图片，上传</span></label>
			<div id="serverView" class="serverView"></div>
			<div>
				merge_rate: <input id="merge_rate_input" type="number" min="1" max="100" value="50">
				<br>
				feature_rate: <input id="feature_rate_input" type="number" min="1" max="100" value="50">
			</div>
			<img style="max-width: 200px;max-height: 200px;" src="/static/img/merge/1.jpg" alt="">
			<img id="sourceImg" style="max-width: 200px;max-height: 200px;" src="data:image/jpeg;base64," alt="">
			<img id="serverImg" style="max-width: 200px;max-height: 200px;" src="data:image/jpeg;base64," alt="">
		</div>
	</div>
	<script>
		
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file)
			formData.append('merge_rate', merge_rate_input.value)
			formData.append('feature_rate', feature_rate_input.value)
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.upload.onprogress = onprogress;
			xhr.responseType = 'json'
			xhr.open('post', '/upload_faceplusplus_merge');
			xhr.onreadystatechange = onreadystatechange;
			xhr.send(formData);
		}
		file1.addEventListener('change', function(){
				var _time = Date.now();
				if(file1.files.length){
					var imgFile = file1.files[0];
					uploadFile(imgFile, function(e){
						console.log('xhr.upload.onprogress', e)
						labelFileLine.style.width = +(e.loaded / e.total)*100+'%'
						labelFileTxt.innerText = '耗时：'+(Date.now() - _time) + 'ms;进度条:'+((e.loaded / e.total)*100>>0)+'%'
					}, function(e){
						// console.log('onreadystatechange', e)
						if(e.target.readyState == 4 && e.target.status == 200){
							labelFileTxt.innerText = '耗时：'+(Date.now() - _time) + 'ms;如重新上传单击这';
							serverView.innerText = '上传success：'+
							"\n file.files[0].name：" + file1.files[0].name +
							"\n file.files[0].size：" + file1.files[0].size +
							"\n file.files[0].webkitRelativePath：" + file1.files[0].webkitRelativePath +
							"\n file.files[0].type：" + file1.files[0].type;
							serverImg.src = 'data:image/jpeg;base64,'+e.target.response.data.result
						}
					})
					sourceImg.src = URL.createObjectURL(imgFile)
				}
			})
	</script>
