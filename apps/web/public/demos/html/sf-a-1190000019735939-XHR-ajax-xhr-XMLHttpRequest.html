<body>
	<div id="app">
		<button id="get1">发送get</button>
		<button id="get2">发送get(a=1&b=2)-send中</button>
		<button id="get3">发送get(a=1&b=2)-open中</button>
		<button id="post1">发送POST</button>
		<button id="post2">发送POST(a=1&b=2)</button>
		<button id="post3">发送POST(FormData)</button>
		<button id="post4">发送POST(blob)</button>
		<button id="post5">发送POST(a=1&b=2)-setRequestHeader</button>
		<button id="post6">发送POST(FormData)-application/x-www-form-urlencoded</button>
	</div>
	<script type="text/javascript">
		get1.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('GET', '/CORS/GET1')
			xhr.send();
		})
		get2.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('GET', '/CORS/GET2')
			xhr.send('a=1&b=2');
		})
		get3.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('GET', '/CORS/GET3?'+'a=1&b=2')
			xhr.send();
		})
		post1.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST1')
			xhr.send();
		})
		post2.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST2')
			xhr.send('a=1&b=2');
		})
		post3.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST3')
			formData = new FormData();
			formData.append('a',3)
			formData.append('b','4')
			xhr.send(formData);
		})
		post4.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST4')
			blob = new Blob([1,2,3,4,5,1,1,2,21,1])
			xhr.send(blob);
		})
		post5.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST5')
			xhr.setRequestHeader("Content-type","application/x-www-form-urlencoded");
			xhr.send('a=1&b=2');
		})
		post6.addEventListener('click', function(){
			xhr = new XMLHttpRequest();
			xhr.open('POST', '/CORS/POST5')
			xhr.setRequestHeader("Content-type","application/x-www-form-urlencoded");
			formData = new FormData();
			formData.append('a',3)
			formData.append('b','4')
			formData.append('c',new Blob([3,2,2,,1,1,]))
			xhr.send(formData);
		})
	</script>
