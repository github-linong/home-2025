	<div id="app">

			<button @click="push">add</button>

				<span>{{item.value}}</span>

	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					list: []
				}
			},
			mounted(){
				setTimeout(v=>{
					for(var i = 0, l = 4+ Math.random()*5;i<l;i++) this.push()
				}, 2000)
			},
			methods:{
				push(){
					this.list.push({'title': this.list.length, value: Math.random() * 400 >> 0})
				}
			},
			computed: {
				computedList(){
					if(this.list.length < 1) return this.list; 
					this.list.sort((n,m)=>m.value-n.value)
					var maxValue = this.list[0].value;
					return this.list.map(({title, value})=>({
						value,
						title,
						rate: (value / maxValue * 100).toFixed(2) + '%'
					}))
				}
			}
		})
	</script>
