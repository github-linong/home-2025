<body>
  <div id="root"></div>
  <script>
    const { useState, useRef, useEffect, useCallback, createElement: h, Fragment } = React;
    const { createRoot } = ReactDOM;

    const SAMPLE =
      "Streaming is not about making the model faster — it is about showing the first token sooner. " +
      "Fetch gives you response.body as a ReadableStream. Read chunks with getReader(), decode with TextDecoder({ stream: true }), " +
      "and flush UI updates with requestAnimationFrame so React does not re-render on every byte.";

    const SUGGESTIONS = [
      { title: "解释 ReadableStream", sub: "用一句话 + 一个例子" },
      { title: "对比 Naive 与 rAF", sub: "为什么 commits 会变少" },
      { title: "写一段 fetch 读流代码", sub: "含 TextDecoder 半包处理" },
      { title: "打字机效果怎么优化", sub: "React 高频 setState 场景" },
    ];

    const CODE = {
      fetch: `const res = await fetch("/api/demo/chat-stream", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ messages }),
});
const reader = res.body.getReader();
const decoder = new TextDecoder();
while (true) {
  const { done, value } = await reader.read();
  if (done) break;
  onChunk(decoder.decode(value, { stream: true }));
}`,
      naive: `// Naive: setState on every network chunk
onChunk((text) => {
  setDisplayed((prev) => prev + text);
});`,
      raf: `// Optimized: one React update per frame
pending.current += text;
if (!raf) {
  raf = requestAnimationFrame(() => {
    shown.current += pending.current;
    pending.current = "";
    setDisplayed(shown.current);
  });
}`,
    };

    async function readTextStream(body, onChunk, signal) {
      if (!body) throw new Error("Response has no body (not a stream)");
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let reads = 0;
      try {
        while (true) {
          if (signal?.aborted) {
            await reader.cancel("aborted");
            throw new DOMException("Aborted", "AbortError");
          }
          const { done, value } = await reader.read();
          if (done) break;
          reads += 1;
          const text = decoder.decode(value, { stream: true });
          if (text) onChunk(text, reads);
        }
        const tail = decoder.decode();
        if (tail) {
          reads += 1;
          onChunk(tail, reads);
        }
      } finally {
        reader.releaseLock?.();
      }
      return reads;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;");
    }

    function renderMarkdown(text) {
      // helpers
      function inlineFmt(s) {
        s = s.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
        s = s.replace(/~~(.+?)~~/g, "<del>$1</del>");
        s = s.replace(/`([^`\n]+)`/g, (_m, c) => `<code>${escapeHtml(c)}</code>`);
        s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        return s;
      }

      // step 1: protect fenced code blocks
      const codeBlocks = [];
      const src = (text || "").replace(/```([^\n]*)\n([\s\S]*?)```/g, (_m, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push(
          `<pre><code class="lang-${escapeHtml(lang.trim())}">${escapeHtml(code)}</code></pre>`,
        );
        return `\x00CODE${idx}\x00`;
      });

      // step 2: line-by-line parser (handles --- / table even without blank lines)
      const lines = src.split("\n");
      const out = [];
      let i = 0;

      while (i < lines.length) {
        const raw = lines[i];
        const line = raw.trimEnd();

        // blank line
        if (!line.trim()) { i++; continue; }

        // code block placeholder
        if (/^\x00CODE\d+\x00$/.test(line.trim())) {
          const idx = Number(line.trim().replace(/\x00CODE(\d+)\x00/, "$1"));
          out.push(codeBlocks[idx]);
          i++; continue;
        }

        // heading
        const hm = line.match(/^(#{1,6})\s+(.+)$/);
        if (hm) {
          out.push(`<h${hm[1].length}>${inlineFmt(escapeHtml(hm[2]))}</h${hm[1].length}>`);
          i++; continue;
        }

        // horizontal rule (---, ***, ___  — whole line, 3+ chars)
        if (/^([-*_])\1{2,}\s*$/.test(line.trim())) {
          out.push("<hr/>");
          i++; continue;
        }

        // blockquote
        if (/^>\s?/.test(line)) {
          const bqLines = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            bqLines.push(escapeHtml(lines[i].replace(/^>\s?/, "")));
            i++;
          }
          out.push(`<blockquote>${inlineFmt(bqLines.join("<br/>"))}</blockquote>`);
          continue;
        }

        // table: current line is a | row, next line is |---|---| separator
        if (/^\|.+\|$/.test(line) && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())) {
          const header = line.split("|").slice(1, -1)
            .map((c) => `<th>${inlineFmt(escapeHtml(c.trim()))}</th>`).join("");
          i += 2; // skip header + separator
          const bodyRows = [];
          while (i < lines.length && /^\|.+\|$/.test(lines[i].trimEnd())) {
            const cells = lines[i].split("|").slice(1, -1)
              .map((c) => `<td>${inlineFmt(escapeHtml(c.trim()))}</td>`).join("");
            bodyRows.push(`<tr>${cells}</tr>`);
            i++;
          }
          out.push(`<table><thead><tr>${header}</tr></thead><tbody>${bodyRows.join("")}</tbody></table>`);
          continue;
        }

        // unordered list
        if (/^[-*+]\s/.test(line)) {
          const items = [];
          while (i < lines.length && /^[-*+]\s/.test(lines[i].trimStart())) {
            items.push(`<li>${inlineFmt(escapeHtml(lines[i].replace(/^[-*+]\s+/, "").trim()))}</li>`);
            i++;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }

        // ordered list
        if (/^\d+\.\s/.test(line)) {
          const items = [];
          while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
            items.push(`<li>${inlineFmt(escapeHtml(lines[i].replace(/^\d+\.\s+/, "").trim()))}</li>`);
            i++;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }

        // paragraph: collect lines until block boundary
        const pLines = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^\x00CODE\d+\x00/.test(lines[i]) &&
          !/^(#{1,6}\s|[-*_]{3,}\s*$|>\s?|[-*+]\s|\d+\.\s|\|.+\|$)/.test(lines[i])
        ) {
          pLines.push(escapeHtml(lines[i].trimEnd()));
          i++;
        }
        if (pLines.length) out.push(`<p>${inlineFmt(pLines.join("<br/>"))}</p>`);
      }

      return out.join("");
    }

    function createLocalStreamResponse(text, delayMs, signal) {
      const encoder = new TextEncoder();
      const tokens = text.match(/\S+\s*|\s+/g) ?? [text];
      const stream = new ReadableStream({
        async start(controller) {
          for (const token of tokens) {
            if (signal?.aborted) {
              controller.error(new DOMException("Aborted", "AbortError"));
              return;
            }
            await new Promise((r) => setTimeout(r, delayMs));
            controller.enqueue(encoder.encode(token));
          }
          controller.close();
        },
      });
      return new Response(stream, {
        headers: { "Content-Type": "text/plain; charset=utf-8" },
      });
    }

    function Metric({ label, value, tone }) {
      return h("div", { className: "metric" },
        h("div", { className: "k" }, label),
        h("div", { className: `v${tone ? ` ${tone}` : ""}` }, value),
      );
    }

    function App() {
      const [messages, setMessages] = useState([]);
      const [draft, setDraft] = useState("");
      const [running, setRunning] = useState(false);
      const [error, setError] = useState("");
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [source, setSource] = useState("api");
      const [mode, setMode] = useState("raf");
      const [delayMs, setDelayMs] = useState(20);
      const [codeTab, setCodeTab] = useState("fetch");
      const [stats, setStats] = useState({ reads: 0, renders: 0, chars: 0, ms: 0 });

      const abortRef = useRef(null);
      const pendingRef = useRef("");
      const shownRef = useRef("");
      const rafRef = useRef(0);
      const renderCountRef = useRef(0);
      const startedAtRef = useRef(0);
      const scrollRef = useRef(null);
      const textareaRef = useRef(null);
      const shouldAutoScrollRef = useRef(true);

      const isNearBottom = () => {
        const el = scrollRef.current;
        if (!el) return true;
        return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
      };

      const scrollRafRef = useRef(0);
      const scheduleScrollBottom = () => {
        if (!shouldAutoScrollRef.current) return;
        if (scrollRafRef.current) return; // already queued
        scrollRafRef.current = requestAnimationFrame(() => {
          scrollRafRef.current = 0;
          const el = scrollRef.current;
          if (el && shouldAutoScrollRef.current) el.scrollTop = el.scrollHeight;
        });
      };

      useEffect(() => {
        renderCountRef.current += 1;
      });

      useEffect(() => {
        scheduleScrollBottom();
      }, [messages]);

      const stop = useCallback(() => {
        abortRef.current?.abort();
        abortRef.current = null;
        if (rafRef.current) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = 0;
        }
        setRunning(false);
      }, []);

      const resetStreamBuffers = () => {
        if (rafRef.current) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = 0;
        }
        pendingRef.current = "";
        shownRef.current = "";
        renderCountRef.current = 0;
        setError("");
        setStats({ reads: 0, renders: 0, chars: 0, ms: 0 });
      };

      const patchAssistant = (id, text) => {
        setMessages((prev) =>
          prev.map((m) => (m.id === id ? { ...m, content: text } : m)),
        );
      };

      const send = async (rawText) => {
        const text = String(rawText ?? draft).trim();
        if (!text || running) return;

        stop();
        resetStreamBuffers();

        const userMsg = { id: `u-${Date.now()}`, role: "user", content: text };
        const assistantId = `a-${Date.now()}`;
        const assistantMsg = { id: assistantId, role: "assistant", content: "" };
        const nextMessages = [...messages, userMsg];
        setMessages([...nextMessages, assistantMsg]);
        setDraft("");
        setRunning(true);
        shouldAutoScrollRef.current = true;
        startedAtRef.current = performance.now();

        const ac = new AbortController();
        abortRef.current = ac;

        const flushRaf = () => {
          rafRef.current = 0;
          if (!pendingRef.current) return;
          shownRef.current += pendingRef.current;
          pendingRef.current = "";
          patchAssistant(assistantId, shownRef.current);
        };

        const onChunk = (chunk) => {
          if (mode === "naive") {
            shownRef.current += chunk;
            patchAssistant(assistantId, shownRef.current);
            return;
          }
          pendingRef.current += chunk;
          if (!rafRef.current) {
            rafRef.current = requestAnimationFrame(flushRaf);
          }
        };

        try {
          let res;
          if (source === "local") {
            res = createLocalStreamResponse(
              `关于「${text}」：\n\n${SAMPLE}`,
              delayMs,
              ac.signal,
            );
          } else {
            const history = nextMessages.map((m) => ({
              role: m.role,
              content: m.content,
            }));

            res = await fetch("/api/demo/chat-stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ messages: history }),
              signal: ac.signal,
            });

            if (!res.ok) {
              let detail = `HTTP ${res.status}`;
              try {
                const body = await res.json();
                detail = body.message || body.error || detail;
              } catch {}
              throw new Error(detail);
            }
          }

          const reads = await readTextStream(res.body, onChunk, ac.signal);

          if (mode === "raf" && pendingRef.current) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            flushRaf();
          }

          setStats({
            reads,
            renders: renderCountRef.current,
            chars: shownRef.current.length,
            ms: Math.round(performance.now() - startedAtRef.current),
          });
        } catch (err) {
          if (err?.name === "AbortError") {
            setStats({
              reads: 0,
              renders: renderCountRef.current,
              chars: shownRef.current.length,
              ms: Math.round(performance.now() - startedAtRef.current),
            });
          } else {
            setError(err?.message || String(err));
            if (!shownRef.current) {
              patchAssistant(assistantId, "（请求失败，请打开配置检查数据源或稍后重试）");
            }
          }
        } finally {
          setRunning(false);
          abortRef.current = null;
        }
      };

      const onKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };

      const renderTone =
        mode === "naive" && stats.renders > 40
          ? "warn"
          : mode === "raf" && stats.renders > 0
            ? "ok"
            : "";

      return h("div", { className: "app" },
        h("aside", { className: "sidebar" },
          h("button", {
            type: "button",
            className: "side-btn primary",
            onClick: () => {
              stop();
              setMessages([]);
              setError("");
              setStats({ reads: 0, renders: 0, chars: 0, ms: 0 });
            },
          }, "＋ 新对话"),
          h("div", { className: "side-label" }, "Recent"),
          h("div", { className: "side-history" },
            messages.filter((m) => m.role === "user").slice(-6).reverse().map((m) =>
              h("button", {
                key: m.id,
                type: "button",
                className: "side-item",
                title: m.content,
                disabled: running,
                onClick: () => send(m.content),
              }, m.content),
            ),
            !messages.some((m) => m.role === "user")
              ? h("div", { className: "side-item", style: { cursor: "default" } }, "还没有历史消息")
              : null,
          ),
          h("div", { className: "side-foot" },
            "Demo · Fetch ReadableStream + React",
          ),
        ),

        h("main", { className: "main" },
          h("div", { className: "topbar" },
            h("div", { className: "brand" }, "Chat · Stream Demo"),
            h("button", {
              type: "button",
              className: "icon-btn",
              onClick: () => setDrawerOpen(true),
            }, "配置"),
          ),

          h("div", {
            className: "chat-scroll",
            ref: scrollRef,
            onScroll: () => {
              // only disable auto-scroll when user explicitly scrolls up
              if (running) {
                shouldAutoScrollRef.current = isNearBottom();
              }
            },
          },
            h("div", { className: "chat-inner" },
              messages.length === 0
                ? h("div", { className: "empty" },
                    h("div", null,
                      h("h1", null, "你今天在想些什么?"),
                      h("p", null,
                        "连接真实 Qwen 流式接口（/api/demo/chat-stream）。边收边展示；点右上角「配置」可切换 Naive / rAF 打字机策略。",
                      ),
                      h("div", { className: "suggestions" },
                        SUGGESTIONS.map((s) =>
                          h("button", {
                            key: s.title,
                            type: "button",
                            onClick: () => send(s.title),
                          },
                            s.title,
                            h("small", null, s.sub),
                          ),
                        ),
                      ),
                    ),
                  )
                : messages.map((m) =>
                    h("div", {
                      key: m.id,
                      className: `msg ${m.role === "user" ? "user" : "assistant"}`,
                    },
                      h("div", { className: "avatar" }, m.role === "user" ? "你" : "AI"),
                      h("div", null,
                        h("div", { className: "msg-role" },
                          m.role === "user" ? "你" : "助手",
                        ),
                        h("div", { className: "msg-body" },
                          m.role === "assistant"
                            ? h("div", {
                                className: "msg-body markdown",
                                dangerouslySetInnerHTML: { __html: renderMarkdown(m.content || "") },
                              })
                            : (m.content || (running && m.role === "assistant" ? "" : "")),
                          running &&
                          m.role === "assistant" &&
                          m.id === messages[messages.length - 1]?.id
                            ? h("span", { className: "cursor", "aria-hidden": "true" })
                            : null,
                        ),
                      ),
                    ),
                  ),
            ),
          ),

          h("div", { className: "composer-wrap" },
            error ? h("p", { className: "err" }, error) : null,
            h("div", { className: "composer" },
              h("button", {
                type: "button",
                className: "round",
                title: "配置",
                onClick: () => setDrawerOpen(true),
              }, "＋"),
              h("textarea", {
                ref: textareaRef,
                rows: 1,
                placeholder: "有问题，尽管问",
                value: draft,
                disabled: running,
                onChange: (e) => {
                  setDraft(e.target.value);
                  const el = e.target;
                  el.style.height = "auto";
                  el.style.height = `${Math.min(160, el.scrollHeight)}px`;
                },
                onKeyDown,
              }),
              running
                ? h("button", {
                    type: "button",
                    className: "round send",
                    onClick: stop,
                    title: "停止",
                  }, "■")
                : h("button", {
                    type: "button",
                    className: "round send",
                    disabled: !draft.trim(),
                    onClick: () => send(),
                    title: "发送",
                  }, "↑"),
            ),
            h("div", { className: "hint-row" },
              h("span", null,
                source === "api" ? "真实模型 · /api/demo/chat-stream" : "本地 mock 流",
                " · ",
                mode === "raf" ? "rAF 批处理" : "Naive setState",
              ),
              h("span", null, "Enter 发送 · Shift+Enter 换行"),
            ),
          ),
        ),

        h("div", {
          className: `backdrop${drawerOpen ? " open" : ""}`,
          onClick: () => setDrawerOpen(false),
        }),
        h("aside", {
          className: `drawer${drawerOpen ? " open" : ""}`,
          "aria-hidden": !drawerOpen,
        },
          h("div", { className: "drawer-head" },
            h("h2", null, "打字机与渲染配置"),
            h("button", {
              type: "button",
              className: "icon-btn",
              onClick: () => setDrawerOpen(false),
            }, "关闭"),
          ),
          h("div", { className: "drawer-body" },
            h("label", { className: "field" },
              "数据源",
              h("select", {
                value: source,
                disabled: running,
                onChange: (e) => setSource(e.target.value),
              },
                h("option", { value: "api" }, "真实模型 /api/demo/chat-stream"),
                h("option", { value: "local" }, "本地 mock Response"),
              ),
            ),
            h("label", { className: "field" },
              "渲染策略（打字机）",
              h("select", {
                value: mode,
                disabled: running,
                onChange: (e) => setMode(e.target.value),
              },
                h("option", { value: "raf" }, "优化：rAF 批处理"),
                h("option", { value: "naive" }, "Naive：每 chunk setState"),
              ),
            ),
            h("label", { className: "field" },
              "Mock token 间隔 (ms)",
              h("input", {
                type: "number",
                min: 0,
                max: 200,
                value: delayMs,
                disabled: running || source !== "local",
                onChange: (e) => setDelayMs(Number(e.target.value) || 0),
              }),
            ),
            h("div", { className: "metrics" },
              h(Metric, { label: "stream reads", value: stats.reads }),
              h(Metric, {
                label: "React commits",
                value: stats.renders,
                tone: renderTone,
              }),
              h(Metric, { label: "chars", value: stats.chars }),
              h(Metric, { label: "elapsed", value: `${stats.ms} ms` }),
            ),
            h("p", { className: "note" },
              mode === "naive"
                ? h(Fragment, null,
                    "当前 ",
                    h("strong", null, "Naive"),
                    "：每个网络 chunk 触发一次 setState。切到本地 mock 并把间隔调到 0～10ms，commits 会接近 reads。",
                  )
                : h(Fragment, null,
                    "当前 ",
                    h("strong", null, "rAF"),
                    "：同帧内多个 chunk 合并后再 setState，commits 通常远小于 reads。",
                  ),
            ),
            h("div", { className: "tabs" },
              ["fetch", "naive", "raf"].map((key) =>
                h("button", {
                  key,
                  type: "button",
                  className: codeTab === key ? "active" : "",
                  onClick: () => setCodeTab(key),
                }, key === "fetch" ? "读流" : key === "naive" ? "Naive" : "rAF"),
              ),
            ),
            h("pre", { className: "code" }, CODE[codeTab]),
          ),
        ),
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
