	<meta description="execCommand将内容复制到剪贴板">

	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
		<input type="text" value="abc" />
		<button id="copy-touchstart-btn">copy-touchstart</button>
		<button id="copy-touchend-btn">copy-touchend</button>
		<button id="copy-click-btn">copy-click</button>
	</div>
	<script>
		var input = document.querySelector('input');
		// input.focus()
		var copy = ()=>{
			input.select();
			console.log(document.execCommand('copy'))
		}
		// copy();
		document.querySelector('#copy-touchstart-btn').addEventListener('touchstart', ()=>{
		// copy()
			var input = document.createElement('input');
			input.value = '123'+(Date.now());
			document.body.appendChild(input)
			input.select();
			console.log(document.execCommand('copy'));
			document.body.removeChild(input)
		});
		document.querySelector('#copy-touchend-btn').addEventListener('touchend', ()=>{
		// copy()
			var input = document.createElement('input');
			input.value = '123'+(Date.now());
			document.body.appendChild(input)
			input.select();
			console.log(document.execCommand('copy'));
			document.body.removeChild(input)
		});
		document.querySelector('#copy-click-btn').addEventListener('click', ()=>{
		// copy()
			var input = document.createElement('input');
			input.value = '123'+(Date.now());
			document.body.appendChild(input)
			input.select();
			console.log(document.execCommand('copy'));
			document.body.removeChild(input)
		});

	</script>
