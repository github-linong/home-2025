	<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/theme-chalk/index.min.css">

<body>
	<style>
		.box{width: 100px;height: 100px;background: red;}
			.inner{width: 50px;height: 50px;background: black;color: red;}

		.demo1{
			margin: -9999px 9999px 9999px -9999px;
		}
		.demo2{
			display: none;
		}
		.demo3{
			visibility: hidden;
		}
		.demo4{
			opacity: 0;
		}
		.demo5{
			width: 0;height: 0;border: none;outline: none;overflow: hidden;
		}
		.demo6{
			left: -9999px;top: -9999px;position: absolute;
		}
		.demo7{
			left: -9999px;top: -9999px;position: relative;
		}
		.demo8{
			left: -9999px;top: -9999px;position: fixed;
		}
		.demo9{
			transform: translate(-9999px, -9999px);
		}
		.demo10{
			transform: scale(0,0)
		}
		.transition{
			transition: all .6s;
		}
	</style>
	<div id="app">
		<div>
			<h2>隐藏页面元素测试DEMO <button @click="isTransition = !isTransition">切换 transition:{{isTransition}}</button></h2>
			<section class="section" v-for="item in list" :key="item.id">
				<h3 :id="item.id" :name="item.id">
					<a :href="'#'+item.id"># {{item.title}}</a>
					<button @click="item.isOpen = !item.isOpen">切换 isOpen: {{item.isOpen}}</button>
				</h3>
				<div class="box" :class="[
					item.isOpen?item.class:'',
					isTransition?'transition':'',
				]" >
					<div class="inner">
						abc
					</div>
					def
				</div>
				hij
			</section>
			<section class="section">
				<h3 id="hiddenTest1" name="hiddenTest1">
					<a href="#hiddenTest1"># html: hidden 属性</a>
					<button @click="hiddenTest.isOpen = !hiddenTest.isOpen">切换 isOpen: {{hiddenTest.isOpen}}</button>
				</h3>
				<div class="box" :hidden="hiddenTest.isOpen">
					<div class="inner">
						abc
					</div>
					def
				</div>
				hij
			</section>
		</div>
	</div>
	<script>
		new Vue({
			el: "#app",
			data(){
				return {
					isTransition: false,
					list: [
						{title: 'css: margin: -9999px 9999px 9999px -9999px; 负值隐藏', class: 'demo1', id:'demo1', isOpen: true},
						{title: 'css: display:none', class: 'demo2', id:'demo2', isOpen: true},
						{title: 'css: visibility:hidden', class: 'demo3', id:'demo3', isOpen: true},
						{title: 'css: opacity:0', class: 'demo4', id:'demo4', isOpen: true},
						{title: 'css: width: 0;height: 0;overflow: hidden;', class: 'demo5', id:'demo5', isOpen: true},
						{title: 'css: left: -9999px;top: -9999px;position: absolute;', class: 'demo6', id:'demo6', isOpen: true},
						{title: 'css: left: -9999px;top: -9999px;position: relative;', class: 'demo7', id:'demo7', isOpen: true},
						{title: 'css: left: -9999px;top: -9999px;position: fixed;', class: 'demo8', id:'demo8', isOpen: true},
						{title: 'css: transform: translate(-9999px, -9999px);', class: 'demo9', id:'demo9', isOpen: true},
						{title: 'css: transform: scale(0,0);', class: 'demo10', id:'demo10', isOpen: true},
						// {title: 'html: hidden', class: 'demo5', id:'demo5', isOpen: true}
					],
					hiddenTest: {
						isOpen: true
					}
				}
			},
			created(){
			}
		})
	</script>
