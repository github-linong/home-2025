<body>
	<div id="app">
		<div class="btn">
			我是个鬼东西 
		</div>
		<div class="btn btn--relative">
			我是个鬼东西 relative
		</div>
		<div class="btn btn--absolute">
			我是个鬼东西 absolute
		</div>
		<div class="btn btn--fixed">
			我是个鬼东西 fixed
		</div>
		<div class="btn btn--static">
			我是个鬼东西 static
		</div>
		<div class="btn btn--sticky">
			我是个鬼东西 sticky
		</div>
		<div class="btn btn--initial">
			我是个鬼东西 initial
		</div>
		<div class="btn btn--inherit">
			我是个鬼东西 inherit
		</div>
		<div class="btn btn--unset">
			我是个鬼东西 unset
		</div>
		<style>
			.btn{height: 100px;width: 100px;background: #0cc;}
			.btn--relative{position: relative;}
			.btn--absolute{position: absolute;}
			.btn--fixed{position: fixed;}
			.btn--static{position: static;}
			.btn--sticky{position: sticky;}
			.btn--initial{position: initial;}
			.btn--inherit{position: inherit;}
			.btn--unset{position: unset;}

			.btn--click{position: absolute;top:0;left:0;width:100%;height:100%;background: #f00;}
		</style>
		<script>
			clickHandle = function(e){
				console.log('clickHandle', e)
				this.removeEventListener('click', clickHandle);
				setTimeout(v=>{
					this.parentNode.removeChild(this)
				})
			}
			document.body.addEventListener('touchstart', (e)=>{
				var el = e.target;
				if(el.classList.contains('btn')){
					console.log('touchstart', e);
					console.log(`h:${el.offsetHeight},w:${el.offsetWidth},l:${el.offsetLeft},t:${el.offsetTop}`)
					if(el.querySelector('.btn--click')){
						// 存在
						console.log('存在btn--click')
					}else{
						// 不存在
						var _el = document.createElement('div')
						_el.classList.add('btn--click')
						_el.addEventListener('click', clickHandle)
						if(getComputedStyle(document.body).position == 'static'){
							el.style.position = 'relative'
						}
						el.appendChild(_el)
					}
				}
			})
		</script>
