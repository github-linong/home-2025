	<p>消息发送框，iframe，保留焦点，发送图标，发送图片，@好友</p>
	<button onclick="app.classList.toggle('resize')">toggle resize</button>
	<style type="text/css">
		/*整体部分*/
		::-webkit-scrollbar {
		  width: 10px;
		  height: 10px; }

		/*滑动轨道*/
		::-webkit-scrollbar-track {
		  border-radius: 5px; }

		/*滑块*/
		::-webkit-scrollbar-thumb {
		  height: 40px;
		  border-radius: 5px;
		  background: #d7d7d7; }

		/*滑块效果*/
		::-webkit-scrollbar-thumb:hover {
		  background: #999; }

		/*滑块效果*/
		::-webkit-scrollbar-thumb:active {
		  background: #949494; }

		#app{
			width:770px;
			height:500px;
			background:rgba(245,245,245,1);
			box-shadow:0px 0px 10px 0px rgba(0,0,0,0.04);
			border-radius:6px;
			border:1px solid rgba(229,229,229,1);
			font-size: 12px;
		}
		#app.resize{
			padding: 10px;
		    resize: both;
    		overflow: hidden;
		}
		.pointer{cursor:pointer;}
		.ellipsis{white-space: nowrap;overflow: hidden;text-overflow: ellipsis;}
		.noselect{user-select:none;}
		.scroll-list{overflow-y: scroll}

		.wrap{display: flex;}
		.side-wrap{width:60px;background:rgba(38,38,38,1);display: flex;flex-direction: column;align-items: center;}
		.session-wrap{width:260px;background:linear-gradient(180deg,rgba(244,244,244,1) 0%,rgba(229,229,229,1) 100%);border-right: 1px solid rgba(229,229,229,1);position: relative;}
		.chat-wrap{flex:1;position: relative;}
		.wrap-title{height:20px;width:100%;}
		.wrap-header{height:40px;border-bottom: 1px solid rgba(229,229,229,1);}

		.side-avatar{width:40px;height:40px;background: url(/static/img/avator/avator-18.jpg) no-repeat center center;background-size:cover;margin-bottom: 30px;}
		.side-icon{width:24px;height:24px;margin-bottom: 30px;fill: #dbdbdb;cursor: pointer;}
			.side-icon:hover,.side-icon.side-icon--hover{fill: rgb(236,109,109)}
			.side-icon--last{margin-top: auto;}

		.search-title{display: flex;padding: 0 12px}
		.search-input-wrap{width:180px;height:26px;background:rgba(214,214,214,1);border-radius:4px;border:1px solid rgba(208,208,208,1);display: flex;align-items: center;}
			.search-icon{width:18px;height:18px;padding: 0 4px 0;fill:#707070}
			.search-input{width:0px;flex:1;outline: 0;border:0;background: rgba(0,0,0,0);font-size:12px;color:rgba(130,130,130,1);}
		.search-btn{width:46px;height:26px;line-height:26px;text-align:center;background:rgba(214,214,214,1);border-radius:4px;border:1px solid rgba(208,208,208,1);margin-left: 10px;color:rgba(102,102,102,1);}
			.search-btn-icon{width: 10px;height: 10px;fill:#707070}

		.session-list{position: absolute;top:61px;bottom:0;left:0;right:0;}
			.session-item{padding:12px;display: flex;}
				.session-item:hover,.session-item--hover{background:rgba(212,212,212,1);}
			.session-avatar{width: 44px;height: 44px;flex-shrink: 0;background: url(/static/img/avator/avator-17.jpg) no-repeat center center;background-size:cover;position: relative;margin-right: 10px;}
			.session-info{flex:1;color:rgba(136,136,136,1);overflow: hidden;}
				.session-title{display: flex;line-height: 26px;}
				.session-name{color:rgba(0,0,0,1);font-size:14px;flex:1;}
				.session-time{flex-shrink:0;}
			.session-unread{position: absolute;right:0;top:0;width:18px;line-height:18px;height:18px;text-align:center;background:rgba(238,70,62,1);border-radius: 50%;transform: translate(50%,-50%);color:rgba(255,255,255,1);}
				.session-unread:empty{display: none}

		.chat-header{display: flex;font-size:18px;color:rgba(0,0,0,1);padding: 0 20px;line-height: 26px;}
			.chat-header-icon{width: 26px;height:26px;margin-left:auto;fill:#707070}
		.messages-wrap{position: absolute;left:0;right:0;top:60px;bottom: 154px;}
		.send-wrap{position: absolute;left:0;right:0;bottom:0;height:154px;border-top: 1px solid rgba(229,229,229,1);background:rgba(245,245,245,1);}

		.messages-tips-wrap{position: absolute;right: 5px;top: 5px;display: flex;flex-direction: column;align-items: flex-end;}
			.messages-tips{display: flex;align-items: center;padding: 10px 20px;}
			.messages-tips-icon{width: 8px;height: 8px;transform: scale(-1)}

		.send-controls{display: flex;padding: 6px 20px;position: absolute;top:0;left:0;right:0;}
			.send-controls-icon{width: 18px;height: 18px;fill:#707070}
			.send-controls-icon-menu{width: 8px;}
			.send-controls-icon-margin{margin-right: 15px}
		.send-editor{border:0;outline:0;width:100%;height:100%;box-sizing: border-box;}
		.send-btn-group{display: flex;justify-content: flex-end;padding: 0 15px;position: absolute;bottom:5px;left:0;right:0;}
			.send-btn{width:66px;height:28px;line-height:28px;background:rgba(255,255,255,1);border-radius:3px;border:1px solid rgba(229,229,229,1);font-size:14px;color:rgba(51,51,51,1);text-align: center;}
	</style>
