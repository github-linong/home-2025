	<script type="text/javascript">
		function toStringify(obj){
			var _obj = {}
			for(var i in obj){
				_obj[i] = obj[i]
			}
			return JSON.stringify(_obj)
		}
	</script>
	<script type="text/javascript">
		setInterval(function(){

				// $(el).next().text(
				$(el).next()[0].textContent = (
					[
						'val()='+$(el).val(),
						'.value='+el.value,
						'validity=' + toStringify(el.validity),
						'validationMessage=' + el.validationMessage
					].join(';\n')
				)
			})
		}, 300)
