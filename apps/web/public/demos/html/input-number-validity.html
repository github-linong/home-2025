		new Vue({
			el: "#app",
			data(){

				inputKeyUp: function inputKeyUp(e) {
				    var val = e.target.value;
				    var {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} = e.target.validity
				    console.log('获取到的value:', val, e.target.validationMessage , {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} )
				    var limitNum = 9999,
				        limitLen = 4;
				    val = val.replace(/\.+|\s+/g, '');
				    if (val.length > limitLen) {
				        val = val.substr(0, limitLen);
				    }
				    if (Number(val) > limitNum) {
				        val = limitNum;
				    }
				    if (val == '0') {
				        val = 1;
				    }
				    if (0 < Number(val) && Number(val) <= limitNum) {
				        this.changeBG = 1;
				    } else {
				        this.changeBG = 0;
				    }
				    console.log('赋值时value:',e.target.value,val)
				    e.target.value = val;
				},
				inputKeyUp2(e){
					var val = e.target.value;
				    var {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} = e.target.validity
				    console.log('获取到的value:', val, e.target.validationMessage , {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} )
				},

					var val = e.target.value;
				    var {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} = e.target.validity
				    console.log('获取到的value:', val, e.target.validationMessage , {badInput,customError,patternMismatch,rangeOverflow,rangeUnderflow,stepMismatch,tooLong,tooShort,typeMismatch,valid,valueMissing} )

				    console.log('赋值时value:',e.target.value,val)
				    e.target.value = val;
				},
				inputKeyUp4: function inputKeyUp(e) {
					var el = e.target;
				    el.type= 'text'
			    	var val = el.value;
			    	var limitNum = 9999,
			    	    limitLen = 4;
			    	val = val.replace(/[^0-9]/g, '');
			    	if (val.length > limitLen) {
			    	    val = val.substr(0, limitLen);
			    	}
			    	if (Number(val) > limitNum) {
			    	    val = limitNum;
			    	}
			    	if (val == '0') {
			    	    val = 1;
			    	}
			    	console.log('赋值时value:',e.target.value,val)
			    	e.target.value = val;
			    	el.type = 'number'
				},
			}
		})
