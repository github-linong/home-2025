	<script src="https://cdn.bootcdn.net/ajax/libs/element-ui/2.13.2/index.js"></script>
</head>
<body>
	<div id="app">
		<div>
			渠道：
			<el-radio-group v-model="query.business">
				<el-radio label="qq">QQ 音乐</el-radio>
				<el-radio label="163" disabled>网易云音乐</el-radio>
			</el-radio-group>
		</div>
		<div>
			关键词：
			<el-radio-group v-model="query.searchType">
				<el-radio label="id">id</el-radio>
				<el-radio label="key" disabled>关键词</el-radio>
			</el-radio-group>
			<el-input type="text" v-model="query.searchValue" @keyup.native.enter="searchHandler"></el-input>
			<el-button @click="searchHandler">查询</el-button>
		</div>
		<div>
			表格显示字段：
			<el-checkbox-group v-model="data.showCols">
			  <el-checkbox :label="item" v-for="item in data.cols">{{item}}</el-checkbox>
			</el-checkbox-group>
		</div>
		<!-- <ul>
			<li></li>
		</ul> -->
		<div>
			<!-- {{computedList}} -->
			<!-- {{data.showCols}} -->
		</div>
		<!-- <el-table
			:data="computedList"
			style="width: 100%">
			<el-table-column
				v-for="item in data.showCols"
				:key="item"
				:prop="item"
				:label="item">
			</el-table-column>
		</el-table> -->
	</div>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {
					query: {
						business: 'qq',
						searchType: 'id',
						searchValue: ''
					},
					data: {
						list: [],
						dissInfo: {},
						cols: ['dissName', 'dissTag', 'dissId', 'song_name','song_title', 'songId', 'singerName'],
						showCols: ['dissName', 'song_name','song_title', 'singerName'],
					}
				}
			},
			computed:{
				computedList(){
					return this.data.list.map(v=>({
						...v,
						...this.data.dissInfo
					}))
				}
			},
			methods: {
				searchHandler(){
					this.query.searchValue = this.query.searchValue.trim()
					if(this.query.searchValue){
						axios({
							url: '/vapi/playlist',
							params: this.query
						}).then(v=>{
							if(v.data.state == 1000){
								this.data.list = v.data.data.songList
								this.data.dissInfo = v.data.data.dissInfo
							}else{
								this.$messages(v.data.msg)
							}
						})
					}
				}
			}
		})
	</script>
