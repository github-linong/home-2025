	<style type="text/css">
		.content-visibility-auto {
		  content-visibility: auto;
		  contain-intrinsic-size: 100px 100px;
		}
		.content-visibility-visible {
		  content-visibility: visible;
		}
		.content-visibility-hidden {
		  content-visibility: hidden;
		  contain-intrinsic-size: 100px 100px;
		}
	</style>
	<p>
		在Chromium 85中，content-visibility属性可能是在提高页面加载性能方面最具影响力的新CSS属性之一。因为content-visibility-auto可跳过不在屏幕上的内容渲染，包括布局和渲染，直到真正需要布局渲染的时候为止。所以利用它可以使初始用户加载速度更快，还能与屏幕上的内容进行更快的交互。
		<br>
		它有三个值：
		<br>
		visible — 元素渲染正常进行
		<br>
		hidden — 跳过元素渲染时，无论是在屏幕外还是在屏幕上
		<br>
		auto — 当元素在屏幕外时，将跳过其渲染； 当它出现在屏幕上时，将自动渲染
	</p>
	<div id="app">
	</div>

		<template v-for="item in 20">

			<img class="content-visibility-auto" :src="'https://k.51vv.com/vvsing/images/banner/top_logo.png?vue&auto&'+item" style="height: 100px">
		</template>
		<hr>
		<template v-for="item in 20">

		</template>
