<body>
	<script>
		function uploadFile(file, onprogress, onreadystatechange){
			var formData = new FormData;
			formData.append('file', file)
			formData.append('opacid', 'LN')
			formData.append('random', Math.random())
			var xhr = new XMLHttpRequest();
			xhr.upload.onprogress = onprogress;
			xhr.open('post', '/upload_any');
			xhr.onreadystatechange = onreadystatechange;
			xhr.send(formData);
		}
	</script>
	<div id="app">
		<el-dialog
			title="提示"
			:visible.sync="dialogVisible"
			width="30%">
			<el-progress :text-inside="true" :stroke-width="26" :percentage="progress"></el-progress>
			<span slot="footer" class="dialog-footer">
				<el-button @click="dialogVisible = false">取 消</el-button>
				<el-button type="primary" @click="dialogVisible = false">确 定</el-button>
			</span>
		</el-dialog>
		<el-upload
			class="upload-demo"
			action="https://www.lilnong.top/upload_any"
			:on-preview="handlePreview"
			:on-remove="handleRemove"
			:before-remove="beforeRemove"
			multiple
			:limit="3"
			:on-progress="handleProgress"
			:on-exceed="handleExceed"
			:file-list="fileList">
			<el-button size="small" type="primary">点击上传</el-button>
				<div slot="tip" class="el-upload__tip">只能上传jpg/png文件，且不超过500kb</div>
		</el-upload>
	</div>
	<script>
		new Vue({
			el: '#app',

			data() {
				return {
					fileList: [],
					progress: 0,
					dialogVisible: false
				};
			},
			methods: {
				handleProgress(event, file, fileList){
					console.log(event, file, fileList)
					this.dialogVisible = true;
					this.progress = event.loaded / event.total * 100
					// on-progress	文件上传时的钩子	function(event, file, fileList)
				},
				handleRemove(file, fileList) {
					console.log(file, fileList);
				},
				handlePreview(file) {
					console.log(file);
				},
				handleExceed(files, fileList) {
					this.$message.warning(`当前限制选择 3 个文件，本次选择了 ${files.length} 个文件，共选择了 ${files.length + fileList.length} 个文件`);
				},
				beforeRemove(file, fileList) {
					return this.$confirm(`确定移除 ${ file.name }？`);
				}
			}
		})
	</script>
