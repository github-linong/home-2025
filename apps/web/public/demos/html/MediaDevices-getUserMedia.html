<body>
	<div id="app">
		<button @click="getUserMedia">开启摄像头录制</button>
		<button @click="getUserMedia2">开启摄像头录制</button>
		<button @click="getDisplayMedia">开启屏幕录制</button>
		
		<video ></video>
	</div>
	<script>
		// 例如, 在移动设备上面，如下的例子表示优先使用前置摄像头（如果有的话）：

		// { audio: true, video: { facingMode: "user" } }
		// 强制使用后置摄像头，请用：

		// { audio: true, video: { facingMode: { exact: "environment" } } }
		constraints = { audio: true, video: true }
		function getUserMedia(){

			navigator.mediaDevices.getUserMedia(constraints)
			.then(function(stream) {
				/* 使用这个stream stream */
				console.log('navigator.mediaDevices.getUserMedia', 'then', stream)
			})
			.catch(function(err) {
				/* 处理error */
				console.log('navigator.mediaDevices.getUserMedia', 'catch', err)
			});
		}
		function getUserMedia2(){
			// 想要获取一个最接近 1280x720 的相机分辨率
			var constraints = { audio: true, video: { width: 1280, height: 720 } }; 

			navigator.mediaDevices.getUserMedia(constraints)
			.then(function(mediaStream) {
				console.log('navigator.mediaDevices.getUserMedia', 'then', mediaStream)
				var video = document.querySelector('video');
				video.srcObject = mediaStream;
				video.onloadedmetadata = function(e) {
					video.play();
				};
			})
			.catch(function(err) {
				console.log('navigator.mediaDevices.getUserMedia', 'catch', err) 
				console.log(err.name + ": " + err.message); 
			}); // 总是在最后检查错误
		}
		function getDisplayMedia(){
			var constraints = { audio: true, video: { width: 1280, height: 720 } }; 

			navigator.mediaDevices.getDisplayMedia(constraints)
				.then(function(mediaStream) {
					console.log('navigator.mediaDevices.getDisplayMedia', 'then', mediaStream)
					var video = document.querySelector('video');
					video.srcObject = mediaStream;
					video.onloadedmetadata = function(e) {
						video.play();
					};
				})
				.catch(function(err) { 
					console.log('navigator.mediaDevices.getDisplayMedia', 'catch', err)
					console.log(err.name + ": " + err.message); 
				}); // 总是在最后检查错误
			
		}
	</script>
	<script>
		new Vue({
			el: '#app',
			data(){
				return {}
			},
			methods:{
				getUserMedia(){
					getUserMedia()
				},
				getUserMedia2(){
					getUserMedia2();
				},
				getDisplayMedia(){
					getDisplayMedia();
				}
			}
		})
	</script>
