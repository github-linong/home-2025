	<!-- <script src="https://cdn.bootcdn.net/ajax/libs/Vue.Draggable/15.0.0/vuedraggable.min.js"></script> -->
	<script src="https://cdn.bootcdn.net/ajax/libs/Vue.Draggable/2.22.0/vuedraggable.umd.min.js"></script>
</head>

<body>
	<style>
		.dargwrap {
			border: 1px solid #f00;
			padding: 10px;
			margin: 10px;
			display: flex;
		}

		.dargwrap .ul {
			flex: 1 1 auto;
			margin: 10px;
			padding: 10px;
			border: 1px solid #ff0;
			list-style: none
		}
	</style>
	<div id="app">
		<p>
			list: {{list}}
		</p>
		<p>
			list1: {{list1}}
		</p>
		<p>
			list2: {{list2}}
		</p>
		<el-dialog title="收货地址" :visible.sync="dialogDrag.visible">
			<el-input v-model="dialogDrag.val"></el-input>
			<div slot="footer" class="dialog-footer">
			  <el-button @click="closeDialogDrag(0)">取 消</el-button>
			  <el-button type="primary" @click="closeDialogDrag(1)">确 定</el-button>
			</div>
		</el-dialog>
		<div class="dargwrap">
			<draggable class="dragArea list-group ul" :list="list"
				:move="moveHandle"
				:clone="cloneHandle" 
				:group="{ name: 'people', pull: 'clone', put: false }">
				<div class="list-group-item" v-for="element in list" :key="element">
					{{ element.txt }}
				</div>
			</draggable>

			<!-- <draggable :move="moveHandle" class="dragArea list-group ul" :list="list1" group="people" @change="log"> -->
			<draggable :clone="cloneHandle" :move="moveHandle" class="dragArea list-group ul" :list="list1" group="people" @change="log">
				<div class="list-group-item" v-for="element in list1" :key="element">
					{{ element.txt }}.{{element.child}}
				</div>
			</draggable>

			<!-- <draggable :move="moveHandle" class="dragArea list-group ul" :list="list2" group="people" @change="log"> -->
			<draggable :clone="cloneHandle" :move="moveHandle" class="dragArea list-group ul" :list="list2" group="people" @change="log">
				<div class="list-group-item" v-for="element in list2" :key="element">
					{{ element.txt }}.{{element.child}}
				</div>
			</draggable>
			<!-- <ul>
				<li v-for="item in list">{{item}}</li>
			</ul> -->
			<!-- <ul>
				<li v-for="item in list1">{{item}}</li>
			</ul> -->
			<!-- <ul>
				<li v-for="item in list2">{{item}}</li>
			</ul> -->
		</div>
	</div>
	<script>
		new Vue({
			el: '#app',
			data() {
				return {
					list: [
						{txt:'人教大法师'},
						{txt:'人教小法师'},
						{txt:'长庚道友'},
						{txt:'长寿道友'},
						{txt:'海神'},
						{txt:'水神'},
						{txt:'苟寿'},
						{txt:'大兴西北'},
					],
					list1: [],
					list2: [],
					dialogDrag: {
						visible: false,
						val: '',
						element: null
					}
				}
			},
			computed:{},
			methods: {
				cloneHandle(item){
					console.log(JSON.parse(JSON.stringify(item)))
					return JSON.parse(JSON.stringify(item))
				},
				closeDialogDrag(type){
					if(type == 0){
						// 取消
						var list1idx = this.list1.findIndex(v=>v.child.length == '')
						if(list1idx != -1) this.list1.splice(list1idx, 1)
						var list2idx = this.list2.findIndex(v=>v.child.length == '')
						if(list2idx != -1) this.list2.splice(list2idx, 1)
					}else{
						this.dialogDrag.element.child.push(this.dialogDrag.val)
					}
					this.dialogDrag.visible = false
				},
				log: function (evt) {
					window.console.log(evt);
					if(evt.added){
						this.$set(evt.added.element, 'child', [])
						this.dialogDrag.element = evt.added.element
						this.dialogDrag.visible = true;
						this.dialogDrag.val = ''
					}
				},
				moveHandle(ctx){
					// console.log(arguments, this)
					var key = ctx.draggedContext.element.txt
					if(ctx.relatedContext.list == this.list) return false
					if(ctx.relatedContext.list.find(v=>v.txt == key)){
						if(ctx.from == ctx.to) return true
						return false
					}
					return true
				}
			}
		})
	</script>
