	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

<body>
	<div id="app">
        <div>
            <h3>非 input 根节点情况， @focus.native 无法触发</h3>
            <v-base-div-input 
                @input.native="consoleLog($event.target, 'oninput', 'v-base-div-input')"  
                @focus.native="consoleLog($event.target, 'onfocus', 'v-base-div-input')"
            ></v-base-div-input>
        </div>

        <div>
            <h3>input 是根节点情况， @focus.native 可以触发</h3>
            <v-base-input 
                @input.native="consoleLog($event.target, 'oninput', 'v-base-input')"  
                @focus.native="consoleLog($event.target, 'onfocus', 'v-base-input')"
            ></v-base-input>
        </div>
    </div>
    <script>
        Vue.component('v-base-div-input',{
            data(){
                return {
                    val: ''
                }
            },
            template: '<div><input v-model="val"></div>'
        })
        Vue.component('v-base-input',{
            data(){
                return {
                    val: ''
                }
            },
            template: '<input v-model="val">'
        })
        new Vue({
            el: '#app',
            data(){
                return {}
            },
            methods: {
                consoleLog(){
                    console.log(arguments)
                }
            }
        })
    </script>
