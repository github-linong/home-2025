<head>
	<meta charset="utf-8">
	<title>deviceorientation 实现摇一摇功能 - www.lilnong.top</title>
	<meta keywords="deviceorientation，摇一摇">
	<meta description="deviceorientation 实现摇一摇功能">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/public_header.js"></script>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script type="text/javascript" src="/static/js/utils.js"></script>
	<script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<link rel="stylesheet" type="text/css" href="/static/css/normalize-8.0.0.css">
	<script type="text/javascript">new VConsole()</script>
	<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
	<script src="https://unpkg.com/element-ui/lib/index.js"></script>
</head>
<body>
	<div id="app">
        <div>
            <div>
                <button @click="switchPause">暂停</button>
                <button @click="switchPlay">开始</button>
            </div>

            <h3>实时 deviceorientation</h3>
            <pre :style="styleComputed">{{deviceorientationComputed}}</pre>
            <p>{{styleComputed}}</p>
        </div>
    </div>
    <script>
        deviceorientation = null;
        new Vue({
            el: '#app',
            data(){
                return {
                    deviceorientation: {
                        alpha: null, 
                        beta: null, 
                        gamma: null,
                        timeStamp: 0,
                        thresholdCount_1: 0,
                        thresholdCount_5: 0,
                        thresholdCount_10: 0,
                        thresholdCount_15: 0,
                        thresholdCount_20: 0,
                        thresholdCount_25: 0,
                        thresholdCount_50: 0,
                        thresholdCount_100: 0,
                        count: 0,
                        shakeValue: 0,
                    },
                    historydeviceorientation: null,
                    deviceorientationReturn: false
                }
            },
            methods:{
                switchPause(){
                    this.deviceorientationReturn = true;
                },
                switchPlay(){
                    this.deviceorientationReturn = false;
                }
            },
            watch:{
                
            },
            computed:{
                deviceorientationComputed(){
                    return JSON.stringify(this.deviceorientation, null, 2)
                },
                styleComputed(){
                    return {
                        background: '#'+Math.min(255,Math.max(0, this.deviceorientation.shakeValue)).toString(16).padStart(2, '0')+'ff00'
                    }
                }
            },
            mounted(){
                window.addEventListener('deviceorientation', (e) => {
                    console.log(e)
                    if(this.deviceorientationReturn) return ;
                    this.historydeviceorientation = JSON.parse(JSON.stringify(this.deviceorientation))

                    this.deviceorientation.alpha = e.alpha
                    this.deviceorientation.beta = e.beta
                    this.deviceorientation.gamma = e.gamma

                    this.deviceorientation.timeStamp = e.timeStamp

                    this.deviceorientation.count++
                    
                    if(this.historydeviceorientation.alpha || 
                        this.historydeviceorientation.beta || 
                        this.historydeviceorientation.gamma){
                            var thresholdCount = Math.max(
                                Math.abs(this.historydeviceorientation.alpha - e.alpha),
                                Math.abs(this.historydeviceorientation.beta - e.beta),
                                Math.abs(this.historydeviceorientation.gamma - e.gamma)   
                            )
                            if(thresholdCount > 1) this.deviceorientation.thresholdCount_1++;
                            if(thresholdCount > 5) this.deviceorientation.thresholdCount_5++;
                            if(thresholdCount > 10) this.deviceorientation.thresholdCount_10++;
                            if(thresholdCount > 15) this.deviceorientation.thresholdCount_15++;
                            if(thresholdCount > 20) this.deviceorientation.thresholdCount_20++;
                            if(thresholdCount > 25) this.deviceorientation.thresholdCount_25++;
                            if(thresholdCount > 50) this.deviceorientation.thresholdCount_50++;
                            if(thresholdCount > 100) this.deviceorientation.thresholdCount_100++;

                            // 颜色变化逻辑
                            if(thresholdCount > 20) this.deviceorientation.shakeValue = Math.min(255, this.deviceorientation.shakeValue + 10)
                            
                    }
                    this.deviceorientation.shakeValue = Math.max(0, this.deviceorientation.shakeValue - 1);
                })
            }
        })
    </script>
