"简介":"飞鱼文苑是一处文化益友创作的田园。旨在弘扬中华文化，发布美丽诗歌、杂文、小说、摄影美篇等。传递社会正能量，提高文化艺术创作水平！广交文友，互相学习，共同进步。拒绝各类广告发布！","成员":"4209","文章":"1.7w","话题":"1798","公告":"《群之铭》              群者，以情会友，以诚待友，以实交友。朋友相聚，本于缘，增于份。无远近之分，无贵贱之别。君子相交，清淡如水，馨香若菊。不以位尊而趋附，不以位卑而疏远。朋友之交，习之以长。正所谓，尺有所短，寸有所长。大凡君子，见贤思齐，从善如流，求同存异。不以异见而憎，不以特性而恶。海纳百川，有容乃大。君子也，同道而谋之，非同道而习之。察纳雅言，咨诹善道。君子也，非同类而同性。以水为师，效其澹泊；以竹为友，慕其虚怀。近朱者赤，近墨者黑。与君子交，如水，如竹，如谷，如菊。       今之群也，藏龙蛟，卧虎豹，栖凤鸾，遨鲲鹏。人才济济，才华耀庭。故言有雅俗，音有宫商，不为奇也。群之大，不过森林一叶。人之大，不过沧海一粟。故，人以谦卑为怀，方能成其大；以厚德为基，方能载其物。这篇《群之铭》写的很好，推荐给师友们雅赏！共勉之!","_圈主信息":[{"编号":"0","昵称":"会飞的鱼〔词作者〕","用户id":"2800283","粉丝数":"3.9万","是否认证":"0","认证图标":"0","用户简介":"吟一阕小令，徜徉词海诗渊！","文章数":"719","空间地址":"https://www.meipian.cn/c/2800283/1","圈主":true,"管理员":false}],"_管理员信息":[{"编号":"1","昵称":"冰雪无痕","用户id":"23570107","粉丝数":"2.2万","是否认证":"1","认证图标":"1","用户简介":"笑着面对生活不管一切如何（拒加微信•拒闲聊）","文章数":"218","空间地址":"https://www.meipian.cn/c/23570107/1","圈主":false,"管理员":true},{"编号":"2","昵称":"春暖花开","用户id":"24745446","粉丝数":"43","是否认证":"1","认证图标":"1","用户简介":"心存美好，春暖花开","文章数":"0","空间地址":"https://www.meipian.cn/c/24745446/1","圈主":false,"管理员":true},{"编号":"3","昵称":"翩若惊鸿","用户id":"64890039","粉丝数":"295","是否认证":"1","认证图标":"1","用户简介":"以文会友，只爱诗词","文章数":"18","空间地址":"https://www.meipian.cn/c/64890039/1}  }","圈主":false,"管理员":true}]},{"分类":"美文","名称":"山歌亭","ID":"38960","标签":"诗歌美文","地点":"广西壮族自治区柳州市城中区罗池路东1巷23","简介":"本圈以快乐地写写唱唱为抒发点，安享人生美篇的幸福时光。","成员":"956","文章":"2745","话题":"1312","公告":"问候","_圈主信息":[{"编号":"0","昵称":"了然","用户id":"25061613","粉丝数":"3.0万","是否认证":"1","认证图标":"1","用户简介":"我在《山歌亭》圈子用诚挚热情觞曲欢迎朋友们！🌹🌹🌹☕️☕️☕","文章数":"109","空间地址":"https://www.meipian.cn/c/25061613/1}  }","圈主":true,"管理员":false}],"_管理员信息":[]},{"分类":"美文","名称":"蔷薇书屋","ID":"50740","标签":"美文","地点":"北京市丰台区西三环南路9号","简介":"让文字流淌于岁月的河","成员":"297","文章":"1804","话题":"184","公告":"","_圈主信息":[{"编号":"0","昵称":"若琳","用户id":"53262336","粉丝数":"1149","是否认证":"1","认证图标":"1","用户简介":"一琴一剑一壶茶，不染凡尘桃李花。","文章数":"100","空间地址":"https://www.meipian.cn/c/53262336/1","圈主":true,"管理员":false}],"_管理员信息":[{"编号":"1","昵称":"浴火重生·诗思","用户id":"29969385","粉丝数"
