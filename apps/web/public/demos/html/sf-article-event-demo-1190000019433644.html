<body>
	<div id="app">
		<style type="text/css">
			/*#app h3{
				margin-top: 10px;
			}	*/
			#app div{
				/*border: 1px solid #f00;*/
				border-left: 10px solid #f00;
			}
		</style>

		<h3>冒泡阶段触发事件</h3>
		<div class="div1">
			div1
			<div class="div1-1">
				div1-1
				<div class="div1-1-1">div1-1-1</div>
			</div>
		</div>

		<h3>捕获阶段触发事件</h3>
		<div class="div2">
			div2
			<div class="div2-1">
				div2-1
				<div class="div2-1-1">div2-1-1</div>
			</div>
		</div>

		<h3>冒泡&捕获阶段触发事件</h3>
		<div class="div3">
			div3
			<div class="div3-1">
				div3-1
				<div class="div3-1-1">div3-1-1</div>
			</div>
		</div>
		<h3>冒泡&捕获阶段触发事件2</h3>
		<div class="div4">
			div4
			<div class="div4-1">
				div4-1
				<div class="div4-1-1">div4-1-1</div>
			</div>
		</div>
		<h3>IE触发事件</h3>
		<div class="div5">
			div5
			<div class="div5-1">
				div5-1
				<div class="div5-1-1">div5-1-1</div>
			</div>
		</div>

		<h3>错误案例，两个方法不是同一引用，导致清除不掉</h3>
		<div class="div6">
			div6
		</div>
		<h3>正确案例，同一引用，可以清除</h3>
		<div class="div7">
			div7
		</div>
		<script type="text/javascript">
			// document.querySelector('.div1').addEventListener('click', function(){
			// 	console.log('div1')
			// })
			function bingClickEvent(className){
				document.querySelector('.'+className).addEventListener('click', function(e){
					console.log('冒泡:'+className, e)
				})
			}
			bingClickEvent('div1');
			bingClickEvent('div1-1');
			bingClickEvent('div1-1-1');


			function bingClickEvent2(className){
				// 一个指定有关 listener 属性的可选参数对象。可用的选项如下：
				// capture:  Boolean，表示 listener 会在该类型的事件捕获阶段传播到该 EventTarget 时触发。
				// once:  Boolean，表示 listener 在添加之后最多只调用一次。如果是 true， listener 会在其被调用之后自动移除。
				// passive: Boolean，设置为true时，表示 listener 永远不会调用 preventDefault()。如果 listener 仍然调用了这个函数，客户端将会忽略它并抛出一个控制台警告。
				document.querySelector('.'+className).addEventListener('click', function(e){
					console.log('捕获:'+className, e)
				}, {capture: true})
			}
			bingClickEvent2('div2');
			bingClickEvent2('div2-1');
			bingClickEvent2('div2-1-1');


			bingClickEvent('div3');
			bingClickEvent('div3-1');
			bingClickEvent('div3-1-1');
			bingClickEvent2('div3');
			bingClickEvent2('div3-1');
			bingClickEvent2('div3-1-1');

			bingClickEvent2('div4');
			bingClickEvent2('div4-1');
			bingClickEvent2('div4-1-1');
			bingClickEvent('div4');
			bingClickEvent('div4-1');
			bingClickEvent('div4-1-1');
		</script>
		<script type="text/javascript">
			function bingClickEvent2attachEvent(className){
				document.getElementsByClassName(className)[0].attachEvent('onclick', function(){
					console.log('只有冒泡:'+className)
				})
			}
			bingClickEvent2attachEvent('div5')
			bingClickEvent2attachEvent('div5-1')
			bingClickEvent2attachEvent('div5-1-1')
		</script>
		<script type="text/javascript">
			document.querySelector('.div6').addEventListener('click', function(){console.log(1)})
        	document.querySelector('.div6').removeEventListener('click', function(){console.log(1)})
        	function documentClick(){console.log(1)}
			document.querySelector('.div7').addEventListener('click', documentClick)
        	document.querySelector('.div7').removeEventListener('click', documentClick)
		</script>
