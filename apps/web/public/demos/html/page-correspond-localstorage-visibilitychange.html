	  // 初始化
	  var vConsole = new VConsole();
	  console.log('Hello world');
	</script>
	<title>页面通信storage测试</title>
</head>
<body>
	<button id="sendMsg">发送</button>
	<script type="text/javascript">
		// window.addEventListener('storage', (e) => console.log(e))
		document.querySelector('#sendMsg').addEventListener('click', e=>localStorage.setItem('page_correspond_private', Math.random()))
	    var isAndroid = (/android/gi).test(navigator.userAgent);
	    localStorage.setItem('page_correspond_private',0);
	    if(isAndroid){
	        window.addEventListener('storage',function (e) {
	        	console.log('localStorage',e)
	        })
		}else{
	        document.addEventListener("visibilitychange", function(){
	            if(!document.hidden){
	            	console.log('visibilitychange', localStorage.getItem('page_correspond_private'))
				}
	        });
		}
	</script>
