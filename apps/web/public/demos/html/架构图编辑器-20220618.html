<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架构图编辑器</title>
</head>
<body>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <div id="app" class="flex">
        <div class="left">
            <div class="group">
                <div class="group-title">Gird 布局</div>
                <div data-tag="Row" data-tag-arg1="0" class="item"> Row </div>
                <div data-tag="Row" data-tag-arg1="1" class="item"> Row 12 </div>
                <div data-tag="Row" data-tag-arg1="2" class="item"> Row 6 6 </div>
                <div data-tag="Row" data-tag-arg1="3" class="item"> Row 4 4 4 </div>
                <div data-tag="Row" data-tag-arg1="4" class="item"> Row 3 3 3 3</div>
                <div data-tag="Column" data-tag-arg1="0" class="item"> Column </div>

                <!-- <div class="group-title">Flex 布局</div>
                <div class="item"> Flex </div>
                <div class="item"> Flex 1 </div>
                <div class="item"> Flex 2 </div>
                <div class="item"> Flex 3 </div> -->
            </div>

            <div class="group">
                <div class="group-title">Text 文案</div>
                <div data-tag="Span" class="item"> Span </div>
                <div data-tag="Div" class="item"> Div </div>
                <div data-tag="Input" class="item"> Input </div>
                <div data-tag="Title" class="item"> Title </div>
            </div>
        </div>
        
        <div class="right flex-auto">
            <div class="container-fluid">

            </div>
            <div class="container-fluid demo">
                <div class="row">
                    <div class="col-6">col-6</div>
                    <!-- <div contenteditable class="col-6">col-6</div> -->
                    <div class="col-6">col-6</div>
                    <!-- <div contenteditable class="col-6">col-6</div> -->
                </div>
                <div class="row">
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                </div>
                <div class="row">
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                </div>
                <div class="row">
                    <div class="col">col</div>
                    <!-- <div contenteditable class="col">col</div> -->
                </div>
                <div class="row">
                    <div class="col">
                        <div class="DIV">内容</div>
                        <!-- <div contenteditable class="DIV">内容</div> -->
                        <div class="row">
                            <div class="col">
                                <div class="DIV">内容</div>
                                <!-- <div contenteditable class="DIV">内容</div> -->
                                <div class="row">
                                    <div class="col">
                                        <div class="DIV">内容</div>
                                        <!-- <div contenteditable class="DIV">内容</div> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        *{padding:0;margin:0;box-sizing: border-box;}

        .flex{display: flex;justify-content: flex-start;align-items: flex-start;}
        .flex-auto{flex: auto;}
        .container-fluid{overflow: hidden;}
        .container-fluid:first-child{margin-top: 0;}
        
        .left{width: 200px;flex: none;background: #ccc}
        .left .group{padding: 10px;}
        .left .group-title{font-size: 14px;color: #fff;text-shadow: 0 1px 0 rgb(0 0 0 / 30%);}
        .left .item{background: #bbb;margin: 8px;padding: 4px 6px;border-radius: 4px;font-size: 12px;cursor: move;}
        
        .right div{
            /* padding: 20px 12px 12px 12px; */
            padding-top: 30px;
            padding-bottom: 10px;
            /* padding-left: 10px; */
            /* padding-right: 10px; */
            box-shadow: inset 0 1px 13px rgb(0 0 0 / 10%);
            min-height: 80px;
            min-width: 10px;
            /* margin-left: 20px; */
            margin-top: 10px;
            margin-bottom: 10px;
            position: relative;
            border-radius: 4px;
            padding-left: 20px;
            padding-right: 20px;
            overflow: hidden;
        }
        .right div:before{
            background-color: #F5F5F5;
            border: 1px solid #DDDDDD;
            border-radius: 4px 0 4px 0;
            color: #9DA0A4;
            content: attr(class);
            font-size: 12px;
            font-weight: bold;
            left: 0px;
            padding: 3px 7px;
            position: absolute;
            top: 0px;
            
        }
        /* .right .container,  */
        .right .row,
        .right .col{
            /* margin-left: 10px; */
            /* padding-left: 10px; */
        }
        .demo{border: 1px solid #f00}
    </style>
    <script>
        childTag = {
            'container-fluid': ['row'],
            'row': ['col'],
            'col': ['span', 'row', 'div'],
        }

        var nestedSortables = [].slice.call(document.querySelectorAll('.left .group'));
        nestedSortables.forEach(v=>{
            new Sortable(v, {
            // new Sortable(document.querySelector('.left'), {
                group: {
                    name: 'shared',
                    pull: 'clone',
                    put: false // 不允许拖拽进这个列表
                },
                // filter: '.group, .group-title',
                handle: '.item',
                animation: 150,
                sort: false // 设为false，禁止sort
            });
        })

        var rightSortables = [].slice.call(document.querySelectorAll('.right *'));
        rightSortables.forEach(v=>{
            // new Sortable(document.querySelector('.right'), {
            new Sortable(v, {
                group: 'shared',
                animation: 150,
                fallbackOnBody: true,
            });
        })
    </script>
</body>
</html>
