<body>
	<style type="text/css">
		*{padding:0;margin:0;line-height:1;box-sizing: border-box;}
		.session-list{height: 700px;overflow: auto}
		.session-item{height: 70px;}
		.session-item:hover{color: red;}
	</style>
	<div id="app">
		<div>
			人数{{list.length}} 
			<button @click="testSort">sort</button> 
			<button @click="testPush()">随机push</button>
			<button @click="testPush(0)">头push</button>
			<button @click="testPush(0, list.length)">尾push</button>
		</div>
		<recycle-scroller
		    class="scroller session-list"
		    :items="list"
		    :item-size="70"
		    key-field="id"
		    v-slot="{ item, index }"
		  >
		  	<session-item  :item="item"  
				@stick="testStick(item)"  
				@remove="testRemove(list, item, index)"
				@update="testUpdate(item)"></session-item>
		  </recycle-scroller>
	</div>
	<template id="session-item">
		<div  class="session-item">
			<button @click="$emit('stick')">{{item.stickTime?'取消置顶':'置顶'}}</button>
			<button @click="$emit('remove')">删除</button>
			<button @click="$emit('update')">更新</button>
			<div>
				[id: {{item.id}}]
				[name: {{item.name}}]
			</div>
			<div>
				[stickTime: {{item.stickTime | formatDate}}]
				[lastTime: {{item.lastTime | formatDate}}]	
			</div>
		</div>
	</template>
	<script type="text/javascript">
		count = 0;
		function createUserInfo(){
			return {
				id: Math.random(),
				name: Mock.mock('@cname'),
				lastTime: Mock.mock('@integer(1596684567072, 1597289367072)'),
				stickTime: Math.random() < 0.005?Mock.mock('@integer(1596684567072, 1597289367072)'):0,
			}
		}
		sortFunList = [
			((n,m)=>Math.sign(m.stickTime)-Math.sign(n.stickTime)),//置顶的在未置顶之前
			((n,m)=>m.stickTime==0?(m.lastTime-n.lastTime):(n.stickTime-m.stickTime)),//置顶的在未置顶之前,置顶时间是升序,聊天时间是降序
			((n,m)=>m.id-n.id)//id来防止异常排序
		]
	</script>
	<script type="text/javascript">
		Vue.component('session-item', {
			template: '#session-item',
			data(){return{}},
			props: ['item'],
		})
		Vue.filter('formatDate', function(val){
			var date = new Date(val);
			return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()} ${date.getHours()}:${date.getMinutes()}:${date.getSeconds()}`
		})
		vm = new Vue({
			el: '#app',
			data(){
				return {
					list: [
						// {"id":0.5551809255290645,"name":"蔡磊","lastTime":1596857753396,"stickTime":1596722201051}
					],
					hash:{
						// 0.5551809255290645: {"id":0.5551809255290645,"name":"蔡磊","lastTime":1596857753396,"stickTime":1596722201051, vv_isSession: true}
					}
				}
			},
			created(){
				var data = localStorage.getItem('sessionList')
				if(data){
					var list = JSON.parse(data);
					for(var i = 0; i < list.length; i++){
						this.sessionListInserAndUpdate(list[i])
					}
				}else{
					for(var i = 0; i < 5000; i++){
						this.sessionListInserAndUpdate(createUserInfo())
					}
					localStorage.setItem('sessionList', JSON.stringify(this.list))
				}
			},
			methods:{
				sortByComputedFun(x){
				    var isStick = !(x.stickTime === 0);
				    return [
				        isStick? 1:2,
				        isStick? x.stickTime: 5e12-x.lastTime,
				        x.id        
				    ];
				},
				sessionListInserAndUpdate(info){
					console.time('sessionListInserAndUpdate')
					if(this.list.length == 0){
						// 没有数据，直接push
						this.list.push(info)
					}else{
						// 直接从hash拿数据，来判断存在不存在
						var hashResult = this.hash[info.id];
						if(hashResult && hashResult.vv_isSession){
							// 存在的需要用原始数据，然后遍历之后的找到对应元素
							var index = _.sortedIndexBy(this.list,hashResult,this.sortByComputedFun);
							console.log(this.list[index].id, info.id)
							this.list.splice(index, 1)
						}
						var index = _.sortedIndexBy(this.list,info,this.sortByComputedFun);
						this.list.splice(index, 0, info)
					}
					info.vv_isSession = true;
					this.hash[info.id] = info;
					console.timeEnd('sessionListInserAndUpdate')
				},
				testSort: _.debounce(function testSort(){
					console.time('testSort')
					this.list.sort((n,m)=>{
						for(var i = 0, l = sortFunList.length; i < l; i++){
							var result = sortFunList[i](n,m);
							if(result === 0){
								continue;
							}else{
								return result;
							}
						}
						return 0
					})
					console.timeEnd('testSort')
					return this.list
				}, 300, {leading: true, maxWait: 1000}),
				testPush(start, end){
					var user = createUserInfo();
					if(arguments.length == 0){
					}else if(arguments.length == 1){
						user.lastTime = Date.now();
					}else if(arguments.length == 2){
						user.lastTime = this.list[Math.min(end, this.list.length - 1)].lastTime - 1
					}
					console.log(user)
					this.sessionListInserAndUpdate(user)
				},
				testUpdate(item){
					var user = JSON.parse(JSON.stringify(item))
					user.lastTime = Date.now();
					this.sessionListInserAndUpdate(user)
				},
				testStick(item){
					var user = JSON.parse(JSON.stringify(item))
					user.stickTime=user.stickTime?0:Date.now();
					this.sessionListInserAndUpdate(user)
				},
				testRemove(list, item, index){
					item.vv_isSession = false;
					list.splice(index,1)
				}

			}
		})
	</script>
