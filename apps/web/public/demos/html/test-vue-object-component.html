<body>
	<p>验证一个问题，sesslist先渲染，users后渲染，messages动态更新问题。</p>
	<div id="app">
		users:{{users}}
		<br>
		users[1]:{{users[1]}}
		<br>
		<ln-test></ln-test>
	</div>
	<hr>
	<div id="app2">
		users:{{users}}
		<br>
		users[1]:{{users[1]}}
		<br>
		<ln-test-2 :users="users"></ln-test-2>
		<br>
		<ln-test-3 :user="users[1]"></ln-test-3>
	</div>
	<script type="text/javascript">
		window.users = {}
		Vue.component('ln-test', {
			template: `<span>{{user}}</span>`,
			computed:{
				user(){
					return window.users[2]
				}
			}
		})
		top.vm = new Vue({
		  el:'#app',
		  data(){
		    return {
		      users:window.users,
		      count: 1,
		    }
		  },
		  mounted(){
		    setInterval(v=>{
		      Vue.set(this.users, this.count++, {
		        random: Math.random()
		      })
		    }, 1000)
		  }
		})

		Vue.component('ln-test-2', {
			template: `<span>{{users}} {{users[1]}}</span>`,
			props: ['users']
		})
		Vue.component('ln-test-3', {
			template: `<span>{{user}}</span>`,
			props: ['user']
		})
		top.vm2 = new Vue({
		  el:'#app2',
		  data(){
		    return {
		      users: {},
		      count: 1,
		    }
		  },
		  mounted(){
		    setInterval(v=>{
		      Vue.set(this.users, this.count++, {
		        random: Math.random()
		      })
		    }, 1000)
		  }
		})
	</script>
