<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name='viewport' content='width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no'/>
	<script type="text/javascript" src="/static/js/falseReport.js"></script>
	<script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script>
	<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
	<script>
	  // 初始化
	  var vConsole = new VConsole();
	  console.log('Hello world');
	</script>
	<title>移动端日期时间选择面板</title>
</head>
<body>
<button onclick="location.reload(true)">刷新</button>
	<div id="app">
	  <div class="d1 list" @scroll="listScroll">
	    <div></div><div></div>
	    <div v-for="item in 20">{{2000+item}}</div>
	    <div></div><div></div>
	  </div>
	  <div class="d2 list" @scroll="listScroll">
	    <div></div><div></div>
	    <div v-for="item in 12">{{item}}</div>
	    <div></div><div></div>
	  </div>
	  <div class="d3 list" @scroll="listScroll">
	    <div></div><div></div>
	    <div v-for="item in 31">{{item}}</div>
	    <div></div><div></div>
	  </div>
	  <div class="d4 list" @scroll="listScroll">
	    <div></div><div></div>
	    <div v-for="(item, index) in 24">{{index}}</div>
	    <div></div><div></div>
	  </div>
	  <div class="d5 list" @scroll="listScroll">
	    <div></div><div></div>
	    <div v-for="(item, index) in 59">{{index}}</div>
	    <div></div><div></div>
	  </div>
	</div>
	<script type="text/javascript">
		var _tiemout = 0;
		new Vue({
		  el: '#app',
		  methods:{
		  	listScroll(e){
		  		// console.log(e.target.scrollTop);
		  		clearTimeout(_tiemout)
		  		_tiemout = setTimeout(()=>{
		  			e.target.scrollTop = parseInt(e.target.scrollTop/25)*25
		  		}, 100)
		  		
		  	}
		  }
		})
	</script>
	<style type="text/css">
	#app {
		display: flex;
	  	position: relative;
	}
    #app .list {
    	flex-grow: 1;
	  	overflow-y: scroll;
	  	overflow-x: hidden; 
	  	height: 125px;
	}
  	#app .list div {
	    height: 25px;
	    line-height: 25px;
	    text-align:center;
	}
	#app:after{
		content: '';
		display: block;
		height: 25px;
		left:0;right:0;
		top: 0;bottom:0;
		margin:auto;
		z-index: -1;
		position: absolute;
		background: red;
	}


    </style>
<script>
		var _hmt = _hmt || [];
		(function() {
		  var hm = document.createElement("script");
		  hm.src = "https://hm.baidu.com/hm.js?0b53b11d3930be87062f66b4b8ce2822";
		  var s = document.getElementsByTagName("script")[0]; 
		  s.parentNode.insertBefore(hm, s);
		})();
	</script></body>
</html>
