	<div id="app">
		<!-- <table>
			<tr>
				<th>id</th><th>名称</th><th>描述</th><th>标签</th><th>活跃值</th><th>成员数</th>
			</tr>
			<tr v-for="item in computedList">
				<td>{{item.group_id}}</td>
				<td>{{item.name}}</td>
				<td><div style="max-width: 600px">{{item.desc}}</div></td>
				<td><span v-for="tag in item.tags">{{tag}}</span></td>
				<td>{{item.activeNum}}</td>
				<td>{{item.memberNum}}</td>
			</tr>
		</table> -->
		<el-table
	      :data="computedList"
	      style="width: 100%">
	      <el-table-column
	        prop="group_id"
	        sortable
	        label="id"
	        width="120">
	      </el-table-column>
	      <el-table-column
	        prop="name"
	        sortable
	        label="名称">
	      </el-table-column>
	      <el-table-column
	        prop="desc"
	        sortable
	        width="500"
	        label="描述">
	      </el-table-column>
	      <el-table-column
	        prop="activeNum"
	        sortable
	        label="活跃值">
	      </el-table-column>
	      <el-table-column
	        prop="memberNum"
	        sortable
	        label="成员数">
	      </el-table-column>
	      <el-table-column
	        prop="tags"
	        sortable
	        label="标签">
	      </el-table-column>
	    </el-table>
	</div>

	<script type="text/javascript">
		var arr = [{"group_id":10570,"count":98},{"group_id":10312,"count":157},{"group_id":10880,"count":81},{"group_id":10088,"count":151},{"group_id":10232,"count":196},{"group_id":10365,"count":151},{"group_id":10886,"count":29},{"group_id":10788,"count":61},{"group_id":10344,"count":151},{"group_id":10717,"count":70}]
		new Vue({
			el: '#app',
			data(){
				return {
					list: []
				}
			},
			computed:{
				computedList(){
					return this.list.map(v=>{
						var memberNum, activeNum;
						var group_id = v.group_id
						v.tags.forEach(v=>{
							var num = v.match(/\d+/);
							if(num){
								if(v.indexOf('活跃值') == -1){
									memberNum = +num[0]
								}else{
									activeNum = +num[0]
								}
							}else{
								memberNum = arr.find(item=>item.group_id == group_id).count
							}
						})
						return {
							...v,
							memberNum, activeNum
						}
					})
				}
			},
			created(){
				fetch('/static/json/colorv-group.json')
					.then(v=>v.json())
					.then(v=>{
						this.list = v
						// console.log(v)
					})
			}
		})
	</script>
