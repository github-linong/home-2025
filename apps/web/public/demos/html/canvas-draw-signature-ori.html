<body>
	<div id="app">
		<img class="img" src="//www.lilnong.top/static/img/wx-linong.jpg" alt="">
		<canvas id="canvas"></canvas>
		<div class="controls">
			<button id="rotateRect">旋转</button>
			<button id="clearRect">清屏</button>
			<button id="upload">上传</button>
		</div>
	</div>
	<style type="text/css">
		#app{
			position: relative;
		}
		#app .controls{
			position: absolute;
			bottom: 0;
			right: 0;
			z-index: 3;
		}
		#app .controls button{
			padding: 30px;
		}
		#app.ori .controls{
			/* transform: rotate(90deg) translate(0, 100%);
			transform-origin: right bottom; */
			transform: rotate(90deg) translate(-100%);
    		transform-origin: left bottom;
			right: auto;
			left: 0;
		}
		#app .img{
			position: absolute;
			top: 0;right: 0;bottom: 0;left: 0;margin: auto;
			opacity: .4;
			z-index: 1;
			max-width: 100vmin;
			max-height: 100vmin;
		}
		#app.ori .img{
			transform: rotate(90deg);
		}
		#canvas{
			/* background: #eee; */
			background-color: rgba(230,230,230, .3);
			display: block;
			position: relative;
			z-index: 2;
		}
	</style>
	<script type="text/javascript">
		clearRect.onclick = function(){
			context.clearRect(0,0,canvas.width,canvas.height)
        	context.beginPath();
		}
		upload.onclick = function(){
        	canvas.toBlob((result)=>{
        	    // console.log(result)
        	    uploadFile(result)
				var blobUrl = URL.createObjectURL(result);
				var el = new Image();
				el.src = blobUrl;
				el.style.height = '100px'
				el.style.width = '100px'
				document.body.appendChild(el)
        	})
		}
		rotateRect.onclick = function(){
			// app.classList.contains('ori')
			app.classList.toggle('ori')
		}
		window.onresize = function(){
			
			canvas.width=document.body.clientWidth
			// canvas.height=Math.min(window.innerHeight, document.body.clientWidth)
			canvas.height=(window.innerHeight)

			
			context = canvas.getContext('2d')
			context.lineWidth = 10;         // 直线宽度
			context.strokeStyle = 'black';     // 路径的颜色
			context.lineCap = 'round';         // 直线首尾端圆滑
			context.lineJoin = 'round';     // 当两条线条交汇时，创建圆形边角
			context.shadowBlur = 4;         // 边缘模糊，防止直线边缘出现锯齿
			context.shadowColor = 'black';  // 边缘颜色
		}
	</script>
	<script type="text/javascript">
		const isMobile = /(phone|pad|pod|iPhone|iPod|ios|iPad|Android|Mobile|BlackBerry|IEMobile|MQQBrowser|JUC|Fennec|wOSBrowser|BrowserNG|WebOS|Symbian|Windows Phone)/i.test(navigator.userAgent);
		const canvas = document.getElementById('canvas');
		// canvas.width=document.body.clientWidth
		// // canvas.height=Math.min(window.innerHeight, document.body.clientWidth)
		// canvas.height=(window.innerHeight)
		
		window.onresize()
		context = canvas.getContext('2d')

		const points = []
		const point = {};
		let pressed = false; // 标示是否发生鼠标按下或者手指按下事件
		const create = signal => (e) => {
			const { left, top } = canvas.getBoundingClientRect();
		  if (signal === 1) {
		    pressed = true;
		  }
		  if (signal === 1 || pressed) {
		    e = isMobile ? e.touches[0] : e;
		    // point.x = e.clientX - left + 0.5; // 不加0.5，整数坐标处绘制直线，直线宽度将会多1px(不理解的不妨谷歌下)
		    // point.y = e.clientY - top + 0.5;
		    point.x = e.clientX - left ; // 不加0.5，整数坐标处绘制直线，直线宽度将会多1px(不理解的不妨谷歌下)
		    point.y = e.clientY - top ;
		    paint(signal);
		    points.push(point)
		  }
		};
		const start = create(1);
		const move = create(2);
		const requestAnimationFrame = window.requestAnimationFrame;
		const optimizedMove = requestAnimationFrame ? (e) => {
		  requestAnimationFrame(() => {
		    move(e);
		  });
		} : move;

        context.beginPath();
		const paint = (signal) => {
		  switch (signal) {
		    case 1: // 开始路径
		      context.moveTo(point.x, point.y);
		    case 2: // 前面之所以没有break语句，是为了点击时就能描画出一个点
		      context.lineTo(point.x, point.y);
		      context.clearRect(0,0,canvas.width,canvas.height)
		      context.stroke();
		      break;
		  }
		};

		// const touchstart = (e) => {
		//   /* TODO 定义起点 */
		//   // 开始路径（beginPath）
		//   // 定位起点（moveTo）
		//   // 移动画笔（lineTo）
		//   // 绘制路径（stroke）

		// };
		// const touchmove = (e) => {
		//   /* TODO 连点成线，并且填充颜色 */

		// };

		canvas.addEventListener('touchstart', start);
		canvas.addEventListener('touchmove', optimizedMove);

		  canvas.addEventListener('mousedown', start);
		  canvas.addEventListener('mousemove', optimizedMove);
		  ['mouseup', 'mouseleave'].forEach((event) => {
		    canvas.addEventListener(event, () => {
		      pressed = false;
		    });
		  });
	</script>
