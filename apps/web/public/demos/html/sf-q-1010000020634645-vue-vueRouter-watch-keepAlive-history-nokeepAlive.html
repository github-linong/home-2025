	<p>

	<hr>
	<div id="app">
	  <p>computed</p>
	  <p>
	  	首页 <input>
	  </p>
	  <p class="nav">
	    <router-link to="/">Go to 首页</router-link>
	    <router-link to="/list">Go to 列表页</router-link>
	  </p>
	  <router-view></router-view>
	</div>
	<script type="text/javascript">
		var Home = {
			name: 'Home',
			computed:{
				routerLog(){
					console.log('vm','Home', 'routerLog', this.$route.params);
					return this.$route.params
				}
			},
			template: `
			<div>
				Home ({{routerLog}}) <input>
				<router-link to="/list">Go to 列表页</router-link>  
			</div>
			`
		}
		var List = {
			name: 'List',
			computed:{
				routerLog(){
					console.log('vm','List', 'routerLog', this.$route.params);
					return this.$route.params
				}
			},
			template: `
			<div>
				List ({{routerLog}}) <input>
				<p v-for="item in 10"><router-link :to="'/list/'+item">Go to 详情页{{item}}</router-link></p>
			</div>
			`
		}
		var ListInfo = {
			name: 'ListInfo',
			// computed:{
			// 	routerLog(){
			// 		console.log('vm','ListInfo', 'routerLog', this.$route.params);
			// 		return this.$route.params
			// 	}
			// },
			template: `
			<div>
				ListInfo ({{routerLog}}) <input> 
				{{$route.params.id}}  
			</div>
			`
		}
		var routes = [
		  { path: '/', component: Home },
		  { path: '/list', component: List },
		  { path: '/list/:id', component: ListInfo }
		]
		var router = new VueRouter({
		  routes
		})
		var vm = new Vue({
		  router,
		  data(){
		  	return{

		  	}
		  },
		  computed:{
		  	routerLog(){
		  		console.log('vm', 'routerLog', this.$route.params);
		  		return this.$route.params
		  	}
		  },
		  methods: {
		    goBack() {
		      window.history.length > 1 ? this.$router.go(-1) : this.$router.push('/')
		    }
		  }
		}).$mount('#app')
	</script>
