<body>
	<div id="app" style="">
		<div style="display:flex;">
			<input type="" placeholder="url" name="" value="https://p.51vv.com/vp/OSHseIfx" id="urlInput" style="width: 100%;border: 0;outline: 0;box-sizing: border-box;padding: 20px;border-bottom: 1px solid #eee;">
			<button class="btn btn-primary" id="searchBtn">查询</button>
		</div>
		<ul id="list">
			<li>https://p.51vv.com/vp/OSHseIfx</li>
			<li>https://www.meipian.cn/1zlh6wry</li>
			<li>https://segmentfault.com/a/1190000020910442</li>
		</ul>
	</div>
	<script type="text/javascript">
		$('#searchBtn').on('click', function(){
			var val = $.trim($('#urlInput').val());
			var xhr = new XMLHttpRequest();
			xhr.open('get', `/proxy?url=${val}`)
			xhr.responseType = 'document';
			xhr.onload = function(){
				// console.log('xhr', xhr.response)
				var obj = {
					title: xhr.response.title,
					article: [
						// {text: '',image: ''}
					]
				}
				if(val.indexOf('//p.51vv.com')>-1){
					Array.from(xhr.response.querySelector('.vp_wrap').children).forEach(v=>{
						// 	console.log(v)
						if(v.classList.contains('section')){
							// 		console.log(v.innerText, v.querySelector('img'))
							var img = v.querySelector('img');
							obj.article.push({
								text: v.innerText.trim(), 
								img: img && (img.src || img.dataset.img)
							})
						}
					})
				}else if(val.indexOf('//www.meipian.cn/')>-1){
					Array.from(xhr.response.querySelector('.content-container').children).forEach(v=>{
						if(v.classList.contains('section')){
							var img = v.querySelector('img');
							obj.article.push({
								text: v.innerText.trim(), 
								img: img && (img.src || img.dataset.img)
							})
						}
					})
				}else if(val.indexOf('//segmentfault.com/')>-1){
					Array.from(xhr.response.querySelector('.article__content').children).forEach(v=>{
						// if(v.classList.contains('section')){
						// 	var img = v.querySelector('img');
						// 	obj.article.push({
						// 		text: v.innerText.trim(), 
						// 		img: img && (img.src || img.dataset.img)
						// 	})
						// }
						var str = $.trim(v.innerText);
						var img = v.querySelector('img');
						if(str || img){
							obj.article.push({
								text: str, 
								img: img && (img.src || img.dataset.img)
							})
						}
					})
				}else{
					alert('暂不支持')
				}
				obj.article.push({
					text: `版权归属原著者，来源于${val}`,
					img: ''
				})
				console.log(obj)
			}
			xhr.send();
		})
		$('#list').on('click', 'li', function(){
			$('#urlInput').val($(this).text());
			$('#searchBtn').trigger('click');
		})
	</script>
