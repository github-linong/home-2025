	<div id="app">
		<ul>
			<!-- 
				<li>一次只能从一堆石子中拿去，不能同时从两堆或三堆中拿</li>
				<li>每次最少拿1个，最多可以把该堆拿光</li>
				<li>双方轮流</li>
				<li>谁拿走了桌面上最后一个石子，谁就输了</li> 
			-->
		</ul>

		<div v-for="(item1, index1) in list">
  			<transition-group name="slide-fade" tag="div"  class="list"  :class="{'list-current': lastOpe&&lastOpe.listIndex == index1}">
				<!-- <transition name="slide-fade"> -->
				<div v-for="(item2, index2) in item1.total" :key="index2" @click="selectItem(index1, index2)" class="cir"></div>
				<!-- <div @click="item1++" class="cir add">+</div> -->
			</transition-group>
		</div>
		<el-button @click="stepGame">下一回合</el-button>
		<el-button @click="resetCurrent">重置当前回合</el-button>
		<el-button @click="initGame">从头来过</el-button>
		<div>
			<ul>
				<li v-for="item in query">{{item}}</li>
			</ul>
		</div>
		<!-- <el-button>完成</el-button>
		<el-button>取消</el-button>
		<div>各个位数合计：{{resultList}}</div>
		<div>必胜：{{result}}</div>
		<div>异或结果：{{result2}}：{{result3}}</div>
		<div>最高位：{{result4}}</div>
		<div>应该从第{{result5 + 1}}行，拿{{result6}}个</div> -->
	</div>
	<script>
		var data = function data(){
				return {
					list: [
						{total: 3}, 
						{total: 6}, 
						{total: 5},
					],
					// 操作记录
					query: [
						/*
						{
							user: 1, // 那个用户 //1用户 2电脑
							listIndex: -1, // 操作的是那个列
							listQuery: 0, // 操作了几个
							state: 1 // 1操作中 2操作结束
						}
						*/
					],
					user: 1,//1用户 2电脑
				}
			}
	</script>
	<script>
		var computed = {
				lastOpe(){
					return this.query[this.query.length - 1]
				},
				getComputedArrayResult(){
					// console.log(this.list)
					return this.computedArrayResult(this.list)
				},
				resultList(){
					var list = this.list.map(v=>this.surplus2String(v.total));
					console.log(list);
					return list.reduce((s,n)=>{
						for(var i = 0; i < n.length; i++) s[i] += +n[i]
						return s;
					}, [0,0,0,0,0,0,0,0])
					// return list
				},
				result(){
					return this.resultList.every(v=>v%2==0)
				},
				result2(){
					return this.list.reduce((s,n)=>s^n.total,0)
				},
				result3(){
					return this.surplus2String(this.result2)
				},
				result4(){
					var num = parseInt(this.result3,2);
					if(num == 0) return 0;
					return Math.pow(2, num.toString(2).length - 1)
				},
				result5(){
					return this.list.findIndex(v=> v.total != 0 && (v.total & this.result4) == this.result4);
				},
				result6(){
					// return 5-(5^7)
					return this.list[this.result5].total - (this.list[this.result5].total ^ this.result2);
				}
			}
	</script>
	<script>
		new Vue({
			el: '#app',
			data: data,
			computed: computed,
			mounted(){
				this.initGame();
			},
			methods: {
				initGame(){
					console.log('游戏开始');
					this.list = [{total: (Math.random() * 10 + 3)>>0}, {total: (Math.random() * 10 + 3)>>0}, {total: (Math.random() * 10 + 3)>>0},]
					this.query = [{
						user: 1,
						listIndex: -1,
						listQuery: [],
						state: 1
					}]
				},
				resetCurrent(){
					let last = this.lastOpe
					this.list[last.listIndex].total+=last.listQuery.length
					last.listIndex = -1;
					last.listQuery.splice(0)
					
				},
				stepGame(){
					let last = this.lastOpe;
					if(last.listIndex == -1){
						return console.warn('需要至少拿走一个')
					} else {
						var resultTag = this.computedArrayResult(this.list);
						console.log(resultTag)
						if(resultTag){
							var result5 =  this.result5;
							var result6 =  this.result6;
							if(this.list.filter(v=>v.total > 0).length == 1){
								result6 = Math.max(this.result6 - 1, 0)
							}
							this.lastOpe.state = 2;
							this.list[result5].total = Math.max(this.list[result5].total - result6, 0)
							this.query.push({
								user: 2,
								listIndex: result5,
								listQuery: new Array(result6).fill(0).map((v, idx)=>this.list[result5].total + result6 - idx - 1),
								state: 2
							})
							// console.log(JSON.stringify(this.query))
							this.query.push({
								user: 1,
								listIndex: -1,
								listQuery: [],
								state: 1
							})
						}
					}
				},
				//
				computedArrayResult(list){
					return list.reduce((s,n)=>s^n.total, 0)
				},
				selectItem(row, col){
					console.log('选择了', arguments);
					if(this.list[row].total == (col + 1)){
						let last = this.lastOpe;
						if(last.listIndex != -1 && last.listIndex != row){
							return console.warn('一次只能从一行中拿，不能同时从多行中拿')
						}else{
							last.listIndex = row;
							this.list[row].total--;
							if(last.listQuery[last.listQuery.length - 1] != col)last.listQuery.push(col);
						}
					}
				},
				surplus2String(surplus){
					return (surplus || 0).toString(2).padStart(8,0)
				}
			}
		})
	</script>
