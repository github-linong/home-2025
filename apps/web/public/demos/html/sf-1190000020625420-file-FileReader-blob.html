<body>
	<style type="text/css">
		#app1ClogImage{max-width: 100px;max-height: 100px;}
		#app2Editor{border: 1px solid #f00;min-height: 100px;}
		#app3Editor{border: 1px solid #f00;min-height: 100px;}
	</style>
	<div id="app">
		<div id="app1">
			<h3><a href="#app1">表单选择 input</a></h3>
			<input type="file" name="" id="app1Input">
			<div>
				<p id="app1ClogName">文件名称</p>
				<p id="app1ClogSize">文件大小</p>
				<p id="app1ClogType">文件类型</p>
				<p id="app1ClogTime">最后修改时间</p>
				<img id="app1ClogImage">
			</div>
			<script type="text/javascript">
				app1Input.addEventListener('change', function(){
					files = this.files;
					if(files.length){
						file = files[0];
						app1ClogName.innerText = '文件名称：'+file.name
						app1ClogSize.innerText = '文件大小：'+file.size + 'B 、'+(file.size/1024).toFixed(2) + 'KB 、'+(file.size/1024/1024).toFixed(2) + 'MB 、';
						app1ClogType.innerText = '文件类型：'+file.type
						app1ClogTime.innerText = '最后修改时间：'+file.lastModified + '、' + new Date(file.lastModified)
						if(file.type.indexOf('image')==0){
							app1ClogImage.src = URL.createObjectURL(file)
						}
					}
				})
			</script>
		</div>
		<div id="app2">
			<h3><a href="#app2">粘贴</a></h3>
			<div contentEditable id="app2Editor"></div>
			<script type="text/javascript">
				app2Editor.addEventListener('paste', function(e){
					clipboardFiles = [];
					for(var i = 0 ; i < e.clipboardData.files.length; i ++){
						clipboardFiles.push(e.clipboardData.files[i]);
					}
					console.log(clipboardFiles)
					// console.log(e, e.clipboardData, e.clipboardData.files.length,clipboardFiles)
				})
			</script>
		</div>
		<div id="app3">
			<h3><a href="#app3">拖拽</a></h3>
			<div contentEditable id="app3Editor"></div>
			<script type="text/javascript">
				app3Editor.addEventListener('drop', function(e){
					e.preventDefault();
					// console.log(e.dataTransfer)
					dataTransferFiles = [];
					for(var i = 0 ; i < e.dataTransfer.files.length; i ++){
						dataTransferFiles.push(e.dataTransfer.files[i]);
					}
					console.log(e, e.dataTransfer, e.dataTransfer.files.length,dataTransferFiles)
				})
			</script>
		</div>
	</div>
