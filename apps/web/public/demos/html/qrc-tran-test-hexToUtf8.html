	<script type="text/javascript">
		hexToUtf8 = function(str){
			var arr = str.match(/.{2}/g).map(v=>parseInt(v,16).toString(2).padStart(8,0))
			var i = 0;
			while(i<arr.length){
				var tag = arr[i].match(/^1+0/);
				if(tag === null){
					i++;
					continue;
				}else if(tag[0] == '10'){
					// 			console.error('异常数据', i, arr[i])
					i++;
					continue;
				}else if(tag[0] == '110'){
					arr.splice(i,2,arr[i].slice(3)+(arr[i+1].slice(2)))
				}else if(tag[0] == '1110'){
					arr.splice(i,3,arr[i].slice(4)+(arr[i+1].slice(2))+(arr[i+2].slice(2)))
				}else if(tag[0] == '11110'){
					arr.splice(i,4,arr[i].slice(5)+(arr[i+1].slice(2))+(arr[i+2].slice(2))+(arr[i+3].slice(2)))
				}
			}
			return arr
				.map(v=>parseInt(v, 2).toString(16).padStart(4, '0'))
				.map(v=>`"\\u${v}"`)
				.map(v=>JSON.parse(v))
				.join('')
		}
		
		fetch('//www.lilnong.top/static/json/ksnginfo-001VIAqg2RTg2B.json')
			.then(v=>v.json())
			.then(v=>v.data['ksonginfo.get'])
			.then(v=>{
				return hexToUtf8(v.mapContent[10].strContent)
			}).then(v=>{
				console.log(v)
			})
	</script>
