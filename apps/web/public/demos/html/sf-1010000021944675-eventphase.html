<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            height: 500px;
        }
    </style>
    <div>
        <button id="myBtn">myBtn</button>
    </div>
    <script>
        var btn = document.getElementById('myBtn')
        btn.onclick = function(event){
            event = event || window.event
            console.log('1:',event.eventPhase,event.target,this == event.target)
        }
    </script>
    <script>
        document.body.addEventListener('click', function(event){
            event = event || window.event
            console.log('2:',event.eventPhase,event.target,this == event.target)
        })
    </script>
    <script>
        document.body.onclick = function(event){
            event = event || window.event
            console.log('3:',event.eventPhase,event.target,this == event.target)
        }
    </script>
</body>
</html>
