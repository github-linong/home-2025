<body>
	<div id="app">
        <div class="ball" style="background: #f00;position: static">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;accelerationIncludingGravity</div>
        <div class="ball" style="background: #0f0;position: static">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;acceleration</div>
        <div class="ball" style="background: #00f;position: static">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;rotationRate</div>

        <div class="garden">
            <div class="ball" style="background: #f00;"></div>
            <div class="ball" style="background: #0f0;"></div>
            <div class="ball" style="background: #00f;"></div>
        </div>
        
        <pre class="output"></pre>
    </div>
    <style>
        .garden {
            position: relative;
            width : 200px;
            height: 200px;
            border: 5px solid #CCC;
            border-radius: 10px;
        }

        .ball {
            position: absolute;
            top   : 90px;
            left  : 90px;
            width : 20px;
            height: 20px;
            background: green;
            border-radius: 100%;
        }
    </style>
    <script>
        var ball   = document.querySelectorAll('.garden .ball');
        var garden = document.querySelector('.garden');
        var output = document.querySelector('.output');

        var maxX = garden.clientWidth  - ball[0].clientWidth;
        var maxY = garden.clientHeight - ball[0].clientHeight;

        function handleOrientation(event) {
            
            var x = event.accelerationIncludingGravity.x;
            var y = event.accelerationIncludingGravity.y;
            x += 90;
            y += 90;
            ball[0].style.top  = (maxX*x/180 - 10) + "px";
            ball[0].style.left = (maxY*y/180 - 10) + "px";

            
            var x = event.acceleration.x;
            var y = event.acceleration.y;
            x += 90;
            y += 90;
            ball[1].style.top  = (maxX*x/180 - 10) + "px";
            ball[1].style.left = (maxY*y/180 - 10) + "px";

            var x = event.rotationRate.beta;
            var y = event.rotationRate.gamma;
            x += 90;
            y += 90;
            ball[2].style.top  = (maxX*x/180 - 10) + "px";
            ball[2].style.left = (maxY*y/180 - 10) + "px";
        }

        window.addEventListener('devicemotion', handleOrientation);
    </script>
