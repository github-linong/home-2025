<body>
    <p>https://codepen.io/linong/pen/qBdXJwq</p>
	<div id="app1">
        <input type="text" v-model="value1">
        <input type="text" v-model.lazy="value2">
        <div>倒计时：{{time}}</div>
        <div>
          <div>{{value1}}</div>
          <div>{{value2}}</div>
        </div>
      </div>
      <hr>
      <div id="app2">
        优化后：
        <input type="text" v-model="value1">
        <input type="text" v-model.lazy="value2">
        <div>倒计时：<v-time :value="time"></v-time></div>
        <div>
          <div>{{value1}}</div>
          <div>{{value2}}</div>
        </div>
      </div>
    <script>
        new Vue({
            el: '#app1',
            data(){
                return {
                value1: '1',
                value2: '2',
                time: 500
                }
            },
            created(){
                setInterval(v=>{
                this.time--
                }, 1000)
            }
        });

        Vue.component('v-time', {
            props: ['value'],
            data: function(){
                return {
                time: this.value
                }
            },
            template: `<div>{{time}}</div>`,
            created(){
                setInterval(v=>{
                this.time--
                }, 1000)
            }
        });

        new Vue({
            el: '#app2',
            data(){
                return {
                value1: '1',
                value2: '2',
                time: 500
                }
            }
        })
    </script>
