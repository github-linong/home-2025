    <meta charset="UTF-8">

<body>
    <!-- <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.2.0-beta.7/vue.global.js"></script> -->

    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/theme-chalk/index.min.css">

    <script src="https://cdn.bootcdn.net/ajax/libs/axios/0.21.0/axios.min.js"></script>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.js"></script>

    <script src="https://cdn.bootcdn.net/ajax/libs/lodash.js/4.17.21/lodash.js"></script>


    <!-- <link href="https://cdn.bootcss.com/twitter-bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet"> -->
    
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">

    <!-- <script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script> -->
    <!-- <script type="text/javascript">new VConsole()</script> -->

    <div class="body">
        <div class="header"></div>
        <div class="container">
            <div class="aside"></div>
            <div class="main">
                <div class="breadcrumb"></div>
                <div class="filter"></div>
                <div class="viewer"></div>
            </div>
        </div>
    </div>
    <style>
        .to-light-blue-100 {
            --tw-gradient-to: #e0f2fe;
        }

        .from-light-blue-50 {
            --tw-gradient-from: #f0f9ff;
            --tw-gradient-stops: var(--tw-gradient-from),var(--tw-gradient-to,rgba(240,249,255,0));
        }
        .markdown-body{
            padding: 16px;
        }
        #app{position: relative;padding-left: 300px}
        #app > .section-list{position: fixed;top: 0;left:0;bottom:0;width: 300px;overflow: scroll;}
        #app > .markdown-body{}
    </style>
    <style>.markdown-body{word-break:break-word;line-height:1.75;font-weight:400;font-size:16px;overflow-x:hidden;color:#333}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{line-height:1.5;margin-top:35px;margin-bottom:10px;padding-bottom:5px}.markdown-body h1{font-size:24px;margin-bottom:5px}.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{font-size:20px}.markdown-body h2{padding-bottom:12px;border-bottom:1px solid #ececec}.markdown-body h3{font-size:18px;padding-bottom:0}.markdown-body h6{margin-top:5px}.markdown-body p{line-height:inherit;margin-top:22px;margin-bottom:22px}.markdown-body img{max-width:100%}.markdown-body hr{border:none;border-top:1px solid #ddd;margin-top:32px;margin-bottom:32px}.markdown-body code{word-break:break-word;border-radius:2px;overflow-x:auto;background-color:#fff5f5;color:#ff502c;font-size:.87em;padding:.065em .4em}.markdown-body code,.markdown-body pre{font-family:Menlo,Monaco,Consolas,Courier New,monospace}.markdown-body pre{overflow:auto;position:relative;line-height:1.75}.markdown-body pre>code{font-size:12px;padding:15px 12px;margin:0;word-break:normal;display:block;overflow-x:auto;color:#333;background:#f8f8f8}.markdown-body a{text-decoration:none;color:#0269c8;border-bottom:1px solid #d1e9ff}.markdown-body a:active,.markdown-body a:hover{color:#275b8c}.markdown-body table{display:inline-block!important;font-size:12px;width:auto;max-width:100%;overflow:auto;border:1px solid #f6f6f6}.markdown-body thead{background:#f6f6f6;color:#000;text-align:left}.markdown-body tr:nth-child(2n){background-color:#fcfcfc}.markdown-body td,.markdown-body th{padding:12px 7px;line-height:24px}.markdown-body td{min-width:120px}.markdown-body blockquote{color:#666;padding:1px 23px;margin:22px 0;border-left:4px solid #cbcbcb;background-color:#f8f8f8}.markdown-body blockquote:after{display:block;content:""}.markdown-body blockquote>p{margin:10px 0}.markdown-body ol,.markdown-body ul{padding-left:28px}.markdown-body ol li,.markdown-body ul li{margin-bottom:0;list-style:inherit}.markdown-body ol li .task-list-item,.markdown-body ul li .task-list-item{list-style:none}.markdown-body ol li .task-list-item ol,.markdown-body ol li .task-list-item ul,.markdown-body ul li .task-list-item ol,.markdown-body ul li .task-list-item ul{margin-top:0}.markdown-body ol ol,.markdown-body ol ul,.markdown-body ul ol,.markdown-body ul ul{margin-top:3px}.markdown-body ol li{padding-left:6px}.markdown-body .contains-task-list{padding-left:0}.markdown-body .task-list-item{list-style:none}@media (max-width:720px){.markdown-body h1{font-size:24px}.markdown-body h2{font-size:20px}.markdown-body h3{font-size:18px}}</style>
    <div id="app" class="flex"> 
        <div class="flex flex-col items-center section-list bg-gradient-to-r from-light-blue-50 to-light-blue-100" >
            <div 
                class="section flex-auto bg-white rounded-xl shadow-md m-2 cursor-pointer" 
                v-for="(section, idx) in sectionList"
                :data-section="JSON.stringify(section, null, 4)"
                @click="openSection(section, idx)"
                :class="{'bg-blue-500': idx == sectionIdx}"
                >
                <!-- :style="{background: `url(${section.background_img})`}" -->
                <div class="flex p-3">
                    <div class="section-title text-sm font-medium text-black" v-if="section">
                        <!-- <span v-show="idx === sectionIdx">current</span>  -->
                        {{section.title}}
                    </div>
                </div>
            </div>
        </div>
        <div class="markdown-body" v-if="sectionList && sectionList[sectionIdx]">
            <h2>{{sectionList[sectionIdx].title}}</h2>
            <div :data-section="sectionList[sectionIdx]" v-html="markdownTrans">
            </div>
        </div>
    </div>
    <script>
        (async function(){

            const id = location.href.match(/(&|\?)id=(\d*)/)[2];

            pre_url = '//cors-www.lilnong.top/static/project/juejin-booklet/';
            list = [
                "bookletshelflist--1652604785813.json",
                "getBookLetInfo-6844723704639782920-1652604814246.json",
                "getBookLetSection-7054754754529853475-7064933291312283678-1652604969500.json"
            ];
            list = await fetch('//cors-www.lilnong.top/static/project/juejin-booklet')
                .then(v=>v.text())
                .then(v=>v.match(/href="[0-9a-z-]+\.json"/gi).map(v=>v.slice(6, -1)))
                // .then(v=>v.match(/href="[0-9a-z-]+\.json"/gi).map(v=>v.slice(6, -6)))
                    // .replace(/-+/g,'-')
                .then(v=>v.map(v=>pre_url+v))
                // .then(console.log)
            console.log(list)
            listGroup = _.groupBy(list, (v)=>{
                return v.slice(pre_url.length).match(/[a-z]+/i, )
            });
            console.log(listGroup)
            if(listGroup.bookletshelflist && listGroup.bookletshelflist.length){
                listGroup.bookletshelflist = [listGroup.bookletshelflist[1]]
            }
            if(listGroup.getBookLetInfo && listGroup.getBookLetInfo.length){
                listGroup.getBookLetInfo = listGroup.getBookLetInfo.filter(v=>v.indexOf(id)!=-1);
                // listGroup.getBookLetInfo = [listGroup.getBookLetInfo[1]]
            }
            
            new Vue({
                el: "#app",
                data(){
                    return {
                        bookletList: [],
                        sectionList: [],
                        sectionIdx: 0,
                        id: 0,
                    }
                },
                computed: {
                    markdownTrans(){
                        let txt = this.sectionList[this.sectionIdx].content
                            .replace(/<img /g, '<img referrer="noopener no-referrer" rel="noopener noreferrer" ')
                            .replace(/src="([^"]+)"/g, function(s, url){
                                return `src="http://www.lilnong.top/urlTrans?group=juejin&url=${url}"`;
                            })
                        return txt;
                    }
                },
                async created(){
                    fetch(listGroup.getBookLetInfo[0])
                        .then(v=>v.json())
                        .then(v=>{
                            this.sectionList = v.data.sections
                        })
                        
                    const id = location.href.match(/(&|\?)id=(\d*)/)[2];
                    this.id = id;
                    this.sectionIdx = ((location.href.match(/(&|\?)sectionIdx=(\d*)/) || [])[2]) || 0;
                    // const list = (await Promise.all(listGroup.getBookLetSection.filter(v=>v.indexOf(id) !== -1).map(v=>fetch(v).then(v=>v.json())))).map(v=>v.data.section)
                    // this.sectionList = list;
                    listGroup.getBookLetSection.filter(v=>v.indexOf(id) !== -1).map(v=>fetch(v).then(v=>v.json()))
                        .forEach((v, idx)=>v.then(v1=>{
                            console.log(v1,idx)
                            // this.sectionList[idx] = v1.data.section
                            this.sectionList.splice(idx, 1, v1.data.section)
                        }))
                },
                methods: {
                    openSection(section, idx){
                        this.sectionIdx = idx;
                        history.pushState({},'',`./booklet.html?id=${this.id}&sectionIdx=${idx}`)
                    }
                }
            });
        })()
    </script>
</body>
