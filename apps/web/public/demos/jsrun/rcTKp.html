<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多组件el-table, 编辑列在外层</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="rcTKp" />
  <style>
#app {
    width: 100%;
    height: 100%;
}

.breadcrumb_box .bdb-item-box {
    display: inline-block;
    position: relative;
    cursor: pointer;
}

.breadcrumb_box .bdb-item-box .children_menu {
    cursor: pointer;
    box-sizing: border-box;
    position: absolute;
    left: 0;
    top: 20px;
    display: block;
    content: "";
    width: 235px;
    min-height: 250px;
    background: #ffffff;
    box-shadow: 0 4px 4px -4px rgba(0, 0, 0, 0.1), 0 5px 10px 1px rgba(0, 0, 0, 0.06), 0 -4px 14px 1px rgba(0, 0, 0, 0.05);
    border-radius: 4px;
    z-index: 10;
}

.breadcrumb_box .bdb-item-box .children_menu .cf-input {
    width: 211px;
    background: #FFFFFF;
    border-radius: 4px;
    margin: 10px 0 5px 10px;
}

.breadcrumb_box .bdb-item-box .children_menu .children_menu_item {
    padding-left: 10px;
    height: 40px;
    line-height: 40px;
}

.breadcrumb_box .bdb-item-box .children_menu .children_menu_item:hover {
    color: #3A84FB;
    background: #F5F7FB;
}

.breadcrumb_box .bdb-item-box .children_menu .active-text {
    color: #3A84FB;
}

.breadcrumb_box .bdb-item-box .cf_el-icon {
    cursor: pointer;
}
  </style>
</head>
<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js">

</script>

<div id="app">
    <!-- {{opDisabld}} -->
	<el-table :data="dataList" border resizable="true" highlight-current-row :stripe="true">
		<child v-for="item in header" :column="item" :key="item.fieldCode"></child>
		<el-table-column label="操作" fixed="right" width="100" v-if="opDisabld">
			<template slot-scope="scope">
				<el-button v-if="header[scope.$index].hasEditDisplay" @click="header[scope.$index].hasEditDisplay = !header[scope.$index].hasEditDisplay">编辑 {{header[scope.$index].hasEditDisplay}}</el-button>
			</template>
		</el-table-column>
	</el-table>
</div>
<script>
Vue.component('child', {
    template: `
        <el-table-column 
            :label="column.displayName" 
            :key="column.fieldCode"
            :prop="column.fieldCode"
        >
            <template slot="default" slot-scope="scope">
                {{filterColumn(scope.row, scope.column, column)}}
            </template>
        </el-table-column>   
	`,
    props: ['column'],
    data() {
        return {
        }
    },
    methods: {
        filterColumn(row, column, item, itemkey) {
            console.log(row, column, item, itemkey)
            // console.log(row, row[item.fieldCode], "sdd")
            return row[item.fieldCode]
        },
    }
})


new Vue({
    el: '#app',
    data: {
        dataList: [
            {
                "VAR1": "2021/03/12",
                "VAR2": "2021/03/12",
            },
            {
                "VAR1": "结束2021/03",
                "VAR2": "开始2021/02",
            }
        ],
        header: [
            {
                "fieldCode": "VAR1",
                "displayName": "时间结束",
                "hasEditDisplay": true
            },
            {
                "fieldCode": "VAR2",
                "displayName": "开始",
                "hasEditDisplay": true
            },
        ]
    },
    computed:{
        opDisabld(){
            return this.header.some(v=>v.hasEditDisplay)
        }
    },
    methods: {
    }
})
</script>
</body>
</html>
