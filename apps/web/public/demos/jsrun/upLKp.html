<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>focusin</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="upLKp" />
  <style>

  </style>
</head>
<body>
<div id="app">
    <div class="item"
        @focusout="log($event, '1-1')" 
        @focusin="log($event, '1-1')"
        @focus="log($event, '1-2')" 
        @blur="log($event, '1-2')">
        <select 
            v-model="selectValue" 
            @focusout="log($event, '2-1')" 
            @focusin="log($event, '2-1')"
            @focus="log($event, '2-2')" 
            @blur="log($event, '2-2')">
            <option v-for="item in list">{{item}}</option>
        </select>
        <input type="" v-model="value1" 
            @focusout="log($event, '3-1')" 
            @focusin="log($event, '3-1')"
            @focus="log($event, '3-2')" 
            @blur="log($event, '3-2')">
        <input type="" v-model="value2" 
            @focusout="log($event, '4-1')" 
            @focusin="log($event, '4-1')"
            @focus="log($event, '4-2')" 
            @blur="log($event, '4-2')">
    </div>
    <div class="item" 
        @focusout="log($event, '5-1')" 
        @focusin="log($event, '5-1')"
        @focus="log($event, '5-2')" 
        @blur="log($event, '5-2')">
        <input type="" v-model="value3" 
            @focusout="log($event, '6-1')" 
            @focusin="log($event, '6-1')"
            @focus="log($event, '6-2')" 
            @blur="log($event, '6-2')">
    </div>
    <div class="result">
        list:{{list}}
    </div>
    <div class="result">
        selectValue:{{selectValue}}
        <br>
        value1:{{value1}}
        <br>
        value2:{{value2}}
        <br>
        value3:{{value3}}
    </div>
    <div class="result">
        arr:{{arr}}
    </div>
</div>
<script>
new Vue({
    el: '#app',
    data(){
        return {
            selectValue: '',
            list: ['test1', 'test2'],
            value1: '',
            arr: [],
            value2: '',
            value3: ''
        }
    },
    methods:{
        blur(){
            if(!this.value1) return 
            this.arr.push(this.value1);
            this.value1 = ''
        },
        log(e, key){
            console.log([e, this, key, e.type, e.target])
        }
    }
})
</script>
</body>
</html>
