	<div>
		<input type="file" id="input" accept="image/*">
    <div>
        <img id="oriImg" />
        <img id="watermarkImg" />
        <img id="decodeWatermarkImg" />
    </div>
    <script>
        async function addWatermark(imageSrc, watermarkText) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imageSrc;
            return new Promise((resolve)=>{
                img.onload = async function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    ctx.font = '48px serif';
                    ctx.rotate(-0.4)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(watermarkText, canvas.width / 2, canvas.height / 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
                    ctx.fillText(watermarkText, canvas.width / 2 + 20, canvas.height / 2+20);
                    canvas.toBlob(resolve);
                    decodeWatermark(canvas)
                    canvas.toBlob((blob)=>{
decodeWatermarkImg.src = URL.createObjectURL(blob)
                    });
                };
            })
        }
    </script>
    <script>
        const decodeWatermark = (
            canvas,
            colorKey = 3,
            otherColorValue = 0,//0,
            flag,
        ) => {
        const ctx = canvas.getContext('2d');
        const originalData = ctx.getImageData(
            0,
            0,
            ctx.canvas.width,
            ctx.canvas.height,
        );
        const data = originalData.data;
        for (let i = 0; i < data.length; i++) {
            // 找到像素点的颜色通道值，由下标 i % 4 的值确定：0 -> R，1 -> G，2 -> B，3 -> A
            if (i % 4 == colorKey) {
            if (data[i] % 2 == 0) {
                // 如果色值为偶数
                data[i] = flag ? 255 : 0;
            } else {
                // 如果色值为奇数
                data[i] = flag ? 0 : 255;
            }
            } else if (i % 4 == 3) {
            // 透明度不作处理
            continue;
            } else {
            // 关闭其他色值
            if (otherColorValue !== undefined) {
                data[i] = otherColorValue;
            }
            }
        }
        ctx.putImageData(originalData, 0, 0);
        };
    </script>
    <script>
