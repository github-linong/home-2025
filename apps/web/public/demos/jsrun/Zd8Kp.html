放置区域

<div style="background: red">
    <h2>文件预览区域</h2>
    <div class="view" id="viewFiles">

    <h2>全量内容预览区域</h2>
    <div class="view" id="viewItems">

<style>
    *{padding:0;margin:0;}
    .textarea{
        height: 200px;
        width: 200px;
        border: 1px solid #f00;
        box-sizing: border-box;
        margin: 10px;
    }
</style>
<script>
    textarea.onpaste = function(e){
        // debugger;
        // top.console.log(e.clipboardData)
        // top.console.log(e.clipboardData.files.length, e.clipboardData.files)
        // top.console.log(e.clipboardData.items.length, e.clipboardData.items)
        top.console.log(
            e.clipboardData.types, 
            e.clipboardData.files.length, 
            e.clipboardData.items.length
        )

        let files = e.clipboardData.files;
        let fileResult = ''
        for(var i = 0; i < files.length; i++){
            const file = files[i];
            const blobUrl = URL.createObjectURL(file);
            fileResult += `<div>
                ${i+1}. ${blobUrl}
                <div>${JSON.stringify({name: file.name,size: file.size,type: file.type})}</div>
                ${file.type?.indexOf('image') == 0?`<img style="max-height: 100px;max-widtht: 100px" src="${blobUrl}">`:''}
            </div>`
        }
        viewFiles.innerHTML = fileResult

        let items = e.clipboardData.items;
        let itemReuslt = []
        for(let i = 0; i < items.length; i++){
            const item = items[i];
            console.log(item);
            if(item.kind == 'file'){
                const file = item.getAsFile()
                if(!file) continue;
                top.console.log(file)
                const blobUrl = URL.createObjectURL(file);
                top.console.log(blobUrl)
                itemReuslt.push(`<div>
                    ${i+1}. ${blobUrl}
                    <div>${JSON.stringify({name: file.name,size: file.size,type: file.type})}</div>
                    ${file.type?.indexOf('image') == 0?`<img style="max-height: 100px;max-widtht: 100px" src="${blobUrl}">`:''}
                </div>`)
            }else{
                itemReuslt.push('')
                item.getAsString(function(val){
                    itemReuslt.splice(i,1,val)
                    viewItems.innerHTML = itemReuslt.join('')
                })
            }
        }
        viewItems.innerHTML = itemReuslt.join('')
    }
</script>
