<html lang="zh-CN">

<body>
<input id="selectall" type="button" class="btn btn-primary" value="全选" />

    <div id="main" style="width: 600px;height:400px;"></div>
<script>
var myChart = echarts.init(document.getElementById('main'));
// 指定图表的配置项和数据
option = {
  title: {
    text: '折线图堆叠'
  },
  tooltip: {
    trigger: 'axis'
  },
  legend: {
    data: ['邮件营销', '联盟广告', '视频广告', '直接访问', '搜索引擎'],
    selected: {
      '直接访问': false,
      '搜索引擎': false,
    },
    // selectedMode: 'single', 
    // selectedMode: 'multiple', 
  },
  grid: {
    left: '3%',
    right: '4%',
    bottom: '3%',
    containLabel: true
  },
  toolbox: {
    feature: {
      saveAsImage: {}
    }
  },
  xAxis: {
    type: 'category',
    boundaryGap: false,
    data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
  },
  yAxis: {
    type: 'value'
  },
  series: [
    {
      name: '邮件营销',
      type: 'line',
      stack: '总量',
      areaStyle: {},
      data: [120, 132, 101, 134, 90, 230, 210],
    },
    {
      name: '联盟广告',
      type: 'line',
      stack: '总量',
      areaStyle: {},
      data: [220, 182, 191, 234, 290, 330, 310]
    },
    {
      name: '视频广告',
      type: 'line',
      stack: '总量',
      areaStyle: {},
      data: [150, 232, 201, 154, 190, 330, 410]
    },
    {
      name: '直接访问',
      type: 'line',
      stack: '总量',
      areaStyle: {},
      data: [320, 332, 301, 334, 390, 330, 320]
    },
    {
      name: '搜索引擎',
      type: 'line',
      stack: '总量',
      areaStyle: {},
      data: [820, 932, 901, 934, 1290, 1330, 1320]
    }
  ]
};

// 使用刚指定的配置项和数据显示图表。
myChart.setOption(option);
var selectAll = myChart.getOption().legend[0].data;

$('#selectall').click(function () {
  var flag = $(this).attr('flag');
  var obj;
  if (flag == 0) {
    var val = false;
    $(this).attr('flag', 1);
    $(this).val('全选');
    obj = window.selected;
  } else {
    var val = true;
    window.selected = option.legend.selected
    obj = {};
    for (var key in selectAll) {
      obj[selectAll[key]] = val;
    }
    $(this).attr('flag', 0);
    $(this).val('取消全选');
  }
  option.legend.selected = obj;
  console.log(window.selected)
  myChart.setOption(option);
});
</script>
</body>
