<script>
    top.console.clear();
    top.console.log(Date.now());
    const Observable = Rx.Observable;
    const source$ = new Observable((obs) => {
        top.console.log('Observable', Date.now())
        let i = 0;
        setInterval(()=>{
            top.console.log('obs.next(i++)', Date.now())
            obs.next(i++);
        }, 500);
        setTimeout(()=>{
            top.console.log('obs.complete()', Date.now())
            obs.complete();
        }, 5000)
    })
    const observer = (key = '', i) => {
        top.console.log('接收数据', key, i, Date.now())
    }

    source$.subscribe(observer.bind(undefined, 'user1'))
    source$.subscribe(observer.bind(undefined, 'user2'))
    setTimeout(()=>{
        source$.subscribe(observer.bind(undefined, 'user3'))
    }, 2000)
    source$.skip(4).take(5).subscribe(observer.bind(undefined, 'user4'))
</script>
