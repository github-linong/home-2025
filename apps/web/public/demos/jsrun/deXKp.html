<p>请问，ajax post请求返回的response data是content-type:'某一文件类型'的二进制数据，可以用URL.createObjectURL()生成blob放在< a >标签里下载么？</p>
  <input type="file" id="file"/>
  <img id="img"/>
  <a href="" id="a" download="download-ln">点击下载</a>
<script>
// document.querySelector('#img').style.display = 'none'
// document.querySelector('#a').style.display = 'none'
fetch('//cdn.jsrun.top/css/img/logo.png')
  .then(v=>v.blob())
  .then(v=>{
  	var _url = URL.createObjectURL(v)
    document.querySelector('#img').src=_url
    document.querySelector('#a').href=_url
	})
document.querySelector('#file').onchange = function(){
  if(this.files){
    var _url = URL.createObjectURL(this.files[0]);
    document.querySelector('#img').src=_url
    document.querySelector('#a').href=_url
  }
}
</script>
