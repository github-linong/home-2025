<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>https://element.eleme.cn/#/zh-CN/component/radio</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="98QKp" />
  <style>

  </style>
</head>
<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js">

</script>
<div id="app">
	<el-form :model="ruleForm" :rules="getRules" 
    ref="ruleForm" label-width="100px" class="demo-ruleForm">
		<el-form-item label="活动名称" prop="name" >
			<el-input :disabled="root" v-model="ruleForm.name"></el-input>
		</el-form-item>
		<el-form-item>
			<el-button type="primary" @click="">新增</el-button>
			<el-button type="primary" @click="submitForm('ruleForm')">立即创建</el-button>
			<el-button @click="resetForm('ruleForm')">重置</el-button>
		</el-form-item>
	</el-form>
	<br>
    <el-button @click="root=!root">{{root}}</el-button>
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            ruleForm: {
                name: ''
            },
            root: true,
            rules: {
                name: [
                    { required: true, message: '请输入活动名称', trigger: 'blur' },
                    { min: 3, max: 5, message: '长度在 3 到 5 个字符', trigger: 'blur' }
                ]
            }
        };
    },
    computed: {
        getRules(){
            return {
                ...this.rules,
                name: !this.root?this.rules.name: null,
            }
        }
    },
    methods: {
        submitForm(formName) {
            this.$refs[formName].validate((valid) => {
                if (valid) {
                    alert('submit!');
                } else {
                    console.log('error submit!!');
                    return false;
                }
            });
        },
        resetForm(formName) {
            this.$refs[formName].resetFields();
        }
    }
})
</script>
</body>
</html>
