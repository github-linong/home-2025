	<!-- <script src="https://cdn.bootcss.com/vConsole/3.2.0/vconsole.min.js"></script> -->

<div id="app">
    <div>{{1}}</div>
    <div>{{list}}</div>
    <div>{{splitList}}</div>
    <!-- <div class="wrap">
        <div class="item" v-for="item in list">{{item}}</div>
    </div> -->
    <div class="wrap" >
        <div class="list" v-for="item1 in splitList">
            <div class="item" v-for="item2 in item1">{{item2}}</div>
        </div>
    </div>
</div>
<style>
    .list{
        display: flex;
        flex-wrap: wrap;
    }
    .list:nth-child(2n+1){
        flex-direction: row-reverse;
    }
    .list:first-child{
        flex-direction: row;
    }
    .item{
        padding: 10px 20px;
        background: #999;
        /* margin: 10px; */
        flex: 0 0 25%;
    }
    


    .item:after{
        content: '右'
    }
    .list:nth-child(2n+1) .item:after{
        content: '左'
    }
    .list .item:last-child:after{
        content: '下'
    }
    .list:first-child .item:after{
        content: '下'
    }
    .list:last-child .item:last-child:after{
        content: '上'
    }
</style>
<script>
    new Vue({
        el: '#app',
        data(){
            return {
                // list: Array.from({length: 20}).map((v,i)=>i+1),

                list: Array.from({length: 18}).map((v,i)=>i+1)
            }
        },
        computed: {
            splitList(){
                const list = [];
                let i = 0;
                list.push(this.list.slice(0,1));
                i++;
                while(i < this.list.length){
                    list.push(this.list.slice(i,i+4));
                    i+=4;
                }
                return list;
            }
        }
    })
</script>
