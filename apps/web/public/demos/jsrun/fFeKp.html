<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<!-- <script src="https://unpkg.com/element-ui/lib/index.js"> -->
<script src="https://cdn.ckeditor.com/ckeditor5/10.0.1/decoupled-document/ckeditor.js">
</script>
<div id="app">
    <span>编辑器取值问题</span>
	<!-- 工具栏容器 -->
	<div id="toolbar-container"></div>
	<!-- 编辑器容器 -->
	<div id="editor" class="ckeditorSegment"></div>

    <button @click="getData">获取内容</button>
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            radio: '',
            value1: '',
            value2: '',
            ckeditorContent: ''
        }
    },
    watch: {

    },
    methods: {
        getData(){
            top.console.log('editor.getData()', editor.getData())
        },
        initCKEditor() {
            let data = this.ckeditorContent || '';
            const parms_1 = {
                heading: {
                    options: [
                        { model: 'paragraph', title: '段落', class: 'ck-heading_paragraph' },
                        { model: 'heading6', view: 'h6', title: '标题6', class: 'ck-heading_heading6' },
                        { model: 'heading5', view: 'h5', title: '标题5', class: 'ck-heading_heading5' },
                        { model: 'heading4', view: 'h4', title: '标题4', class: 'ck-heading_heading4' },
                        { model: 'heading3', view: 'h3', title: '标题3', class: 'ck-heading_heading3' },
                        { model: 'heading2', view: 'h2', title: '标题2', class: 'ck-heading_heading2' },
                        { model: 'heading1', view: 'h1', title: '标题1', class: 'ck-heading_heading1' }
                    ]
                },
                removePlugins: ['SegmentField', 'TableField'],
                segmentCallback: "测试",
                fieldCallback: "测试",
                tableFieldCallback: "测试",
                fieldDialogName: '#ckeditor_field_dialog',
                segmentDialogName: '#ckeditor_segment_dialog',
                tableFieldDialogName: '#ckeditor_table_field_dialog',
                language: 'zh-cn',
                extraPlugins: [],
                //  onReady: () => { console.log('Editor.js is ready to work!') }
            }
            // const parms_2 = {
            //     onReady: () => { console.log('Editor.js is ready to work!') }
            // }
            DecoupledEditor.create(data, parms_1)
            .then(editor => {
                window.editor = editor;
                document.querySelector('#toolbar-container').appendChild(editor.ui.view.toolbar.element);
                document.querySelector('#editor').appendChild(editor.ui.view.editable.element);
                
                editor.model.document.on( 'change', () => {
                    top.console.log( 'The document has changed!', editor.getData());
                } );
                
            })
            .catch(error => {
                console.error('There was a problem initializing the editor.', error);
            });
        },
    },
    mounted() {
        this.initCKEditor()
    }
})
</script>
</body>
</html>
