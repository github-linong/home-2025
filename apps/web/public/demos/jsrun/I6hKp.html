throttle2 = (func, time = 500)=>{
  var _tag = true;
  var _data = undefined;
  return function(...args){
    if(_tag){
        func(...args);
        _tag = false;
      	setTimeout(()=>{
          if(_data === undefined){
            _tag = true;
          }else{
            func(..._data);
            _data = undefined
          }
          
        }, time)
    }else{
        _data = args;
    }
  }
}
