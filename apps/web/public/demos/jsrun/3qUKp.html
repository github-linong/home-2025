<script>
      var myChart = echarts.init(document.getElementById('main'));
    list = [

sum = list.reduce((s,n)=>{
    s = s + (+n.money)
    n._sum = s
    return s
}, 0)

// console.log('圆心：（300，200），', '半径：170')
width = main.offsetWidth;
height = main.offsetHeight;
x = width /2
y = height / 2
r = 160
getPointer = (deg) => {
    return [ x + r * Math.cos(deg* Math.PI / -180), y + r * Math.sin(deg* Math.PI / -180) ]
    return [ 300 + 160 * Math.cos(deg* Math.PI / -180), 200 + 160 * Math.sin(deg* Math.PI / -180) ]
    return [ 300 + 170 * Math.cos(deg* Math.PI / -180), 200 + 170 * Math.sin(deg* Math.PI / -180) ]
}

// console.log(45, getPointer(45))

        min: 0,
        max: 1,
        splitNumber: 100,
