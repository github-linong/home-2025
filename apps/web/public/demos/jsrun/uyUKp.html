<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vue 列表 滚动 特效</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="uyUKp" />
  <style>

  </style>
</head>
<body>
<div id="app">
    <div class="list">
        <div class="list-scroll" @animationiteration="list.push(list.shift())">
            <div class="item" v-for="item in list" :key="item">
                {{item}}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.14/vue.js"></script>
<script>
    new Vue({
        el: '#app',
        data(){
            return {
                list: Array.from({length: 10}).map((v,i)=>(i.toString().repeat(5+Math.random() * 10)))
            }
        }
    })
</script>
<style>
    .list{
        overflow: hidden;
        height: 5em;
        line-height: 1em;
    }
    .list-scroll{
        animation: scrollToTop1em 1s linear infinite;
    }
    @keyframes scrollToTop1em{
        0%{transform: translate(0,0)}
        100%{transform: translate(0,-1em)}
    }
</style>
<script>

</script>
</body>
</html>
