<body>
<canvas></canvas>
<style>
    canvas{border: 1px solid #f00};
</style>
<script>
    canvas = document.querySelector('canvas')
    ctx = canvas.getContext('2d')
    ctx.fillRect(20,20, 100, 100)

    ctx.beginPath(0); 
    ctx.arc(30, 30, 10, 0, Math.PI * 2);
    ctx.closePath();
    ctx.strokeStyle = "#0f0";
    ctx.stroke();


    /*画一个空心梯形*/
    ctx.beginPath(0);
    ctx.moveTo(40, 40);
    ctx.lineTo(60,60);
    ctx.lineTo(60,90);
    ctx.lineTo(40, 110);
    ctx.fillStyle = "#0ff";
    ctx.closePath();
    ctx.fill();
</script>
