<div id="app">
    {{1}}

        <input v-model="message" @input="handlerInput">
    </div>
    <div>
        {{message}}

<script>
  const { createApp } = Vue

  createApp({
    data() {
      return {
        message: 'Hello Vue!'
      }
    },
    methods: {
        handlerInput(){
            console.log('handlerInput', this.characterStatistics(this.message))
            const len = this.characterStatistics(this.message);
            if(len > 14){
                this.message = this.message.slice(0, -1);
                this.handlerInput();
            }
        },
        characterStatistics(value){
            return Array.from(value).reduce((s,v)=>{
                // console.log(s, v, v.charCodeAt())
                if( v.charCodeAt() < 127){
                    // console.log(v, '这看上去是个英文')
                    return s + 1
                }else{
                    // console.log(v, '这看上去是个中文')
                    return s + 2
                }
                //return s
            }, 0)
        },
    }
  }).mount('#app')
</script>
