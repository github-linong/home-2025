        width: 100%;height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 11;
        color: #fff;
    }
    .animation-round{
        width: 200px;
        height: 200px;
        background: rgba(0, 0, 255, 0);
        border-radius: 100px;
        position: absolute;
        left: 50%;top: 50%;
        margin-left: -100px;
        margin-top: -100px;
        animation: centerRotateTransition 5.2s -3.9s linear infinite;
        background: linear-gradient(45deg, #35B3FF, #007DFF);
    }
    .animation-round:nth-child(2){
        animation: centerRotateTransition 5.2s linear -2.6s infinite;
    }
    .animation-round:nth-child(3){
        animation: centerRotateTransition 5.2s linear -1.3s infinite;
    }
    .animation-round:nth-child(4){
        animation: centerRotateTransition 5.2s linear 0s infinite;
    }
