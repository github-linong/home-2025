<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>http://element-cn.eleme.io/#/zh-CN/component/tree#tree-shu-xing-kong-jian</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="WChKp" />
  <style>

  </style>
</head>
<body>
<div id="app">
    <el-tree 
        :data="data" 
        :default-expand-all="true"
        :props="defaultProps" 
        :highlight-current="true"
        node-key="label"
        @node-click="handleNodeClick"></el-tree>
        <!-- @click.native="handleNodeClick"></el-tree> -->
</div>
<script>
new Vue({
    el:'#app',
    data() {
      return {
        data: [{
          label: '一级 1',
          children: [{
            label: '二级 1-1',
            children: new Array(10).fill(1).map((v,i)=>({
              label: '三级 1-1-'+(i+1)
            }))
          }]
        }, {
          label: '一级 2',
          children: [{
            label: '二级 2-1',
            children: new Array(10).fill(1).map((v,i)=>({
              label: '三级 2-1-'+(i+1)
            }))
          }, {
            label: '二级 2-2',
            children: [{
              label: '三级 2-2-1'
            }]
          }]
        }, {
          label: '一级 3',
          children: [{
            label: '二级 3-1',
            children: [{
              label: '三级 3-1-1'
            }]
          }, {
            label: '二级 3-2',
            children: [{
              label: '三级 3-2-1'
            }]
          }]
        }],
        defaultProps: {
          children: 'children',
          label: 'label'
        }
      };
    },
    methods: {
      handleNodeClick(data, e_target) {
        console.log(data, e_target);
        a = document.querySelector('.is-current')
        if(a) a.scrollIntoView()
      }
    }
  })
</script>
</body>
</html>
