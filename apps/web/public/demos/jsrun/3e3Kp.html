<script>
    Vue.component('vv-form', {
        props: [
            'data', // 当前 list
            'type', // 当前 list 类型
            "returnValue", // 当前返回
        ],
        data(){
            return {
                addkey: 'id',
                typeList: ['string','int','float','file','bool','select','list','object'],
                // data: defaultValue,
            }
        },
        template: `
           <ul>
                <input v-model="addkey"><button @click="add">add</button>
                <li v-for="(item, itemkey) in data">
                    <button @click="remove(data, item, itemkey)">remove</button>
                    <input v-model="item.title">
                    <input v-model="item.key">
                    <select v-model="item.type">
                        <option v-for="option in typeList">{{option}}</option>
                    </select>
                    <input v-model="item.value" v-if="item.type == 'string'">
                    <input v-model.number="item.value" v-else-if="item.type == 'int'" type="number">
                    <input v-model.number="item.value" v-else-if="item.type == 'float'" type="number">
                    <input v-model="item.value" v-else-if="item.type == 'file'" type="file">
                    <select  v-else-if="item.type == 'select'" v-model="item.value">
                        <option v-for="option in item.options" :value="option.value">{{option.label}}</option>
                    </select>
                    <input v-model="item.value" v-else-if="item.type == 'bool'" type="checkbox">
                    <vv-form :data="item.value" v-else-if="item.type == 'list'"></vv-form>
                </li>
            </ul> 
        `,
        methods:{
            add(){
                this.addkey = this.addkey.trim();
                if(!this.addkey) return new Error('key不能为空');
                if(this.data.find(item => item.key == this.addkey)) return new Error('key不能重复');
                this.data.push({
                    title: '提示文案',
                    key: this.addkey,
                    type: 'string',
                    value: '',
                })
            },
            remove(data, item, itemkey){
                data.splice(itemkey,1)
            }
        }
    })
</script>
<script>
    new Vue({
        el: '#app',
        data(){
            return {
                addkey: 'id',
                typeList: ['string','int','float','file','bool','select','list','object'],
                data: defaultValue,
            }
        },
        computed:{
            dataJSON(){
                return JSON.stringify(this.data, null, 4);
            },
            dataHash(){
                return this.data.reduce((s,n)=>{
                    s[n.key]=n.value;
                    return s;
                },{})
            }
        },
        methods:{
            add(){
                this.addkey = this.addkey.trim();
                if(!this.addkey) return new Error('key不能为空');
                if(this.data.find(item => item.key == this.addkey)) return new Error('key不能重复');
                this.data.push({
                    title: '提示文案',
                    key: this.addkey,
                    type: 'string',
                    value: '',
                })
            },
            remove(data, item, itemkey){
                data.splice(itemkey,1)
            }
        }
    })
</script>
