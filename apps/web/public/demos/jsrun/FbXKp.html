<body>
<div id="app">
  <div>
    <inputnumber v-model="val1"></inputnumber> {{val1}}
  </div>
  <div>
    <inputnumber v-model="val2"></inputnumber> {{val2}}
  </div>
  <button @click="val1 = Math.random()">val1 = Math.random()</button>
  <button @click="val2 = Math.random()">val2 = Math.random()</button>
</div>
<script>
Vue.component('inputnumber', {
  template: `
		<div>
			<input :value="value" @input="change"/>
			<button @click="add">+</button>
			<button @click="minus">-</button>
		</div>
	`,
  props: ['value'],
  methods: {
  	add(){
  		this.$emit('input',this.value+1)
		},
  	minus(){
  		this.$emit('input',this.value-1)
		},
    change(e){
  		this.$emit('input',e.target.value)
		}
	}
})
new Vue({
  el: '#app',
  data: {
    val1: 0,
    val2: 0
  }
})
</script>
