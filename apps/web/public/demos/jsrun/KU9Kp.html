        <component-a v-if="flag"></component-a>
        <component-b v-else></component-b>
    </div>
    <script>
        a = {template: '<div>a</div>',beforeDestroy(){console.log('a', 'beforeDestroy')}}
        b = {template: '<div>b</div>',beforeDestroy(){console.log('b', 'beforeDestroy')}}
        new Vue({
            el: '#app',
            data(){
                return {
                    flag: false
                }
            },
            components: {
                'component-a': a,
                'component-b': b
            }
        })
