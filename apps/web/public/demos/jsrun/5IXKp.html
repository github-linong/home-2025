  <style>

		.editor{
			display: block;
			width:100%;
			height: 100px;
			border: 1px solid #f00;
		}
  </style>
</head>
<body>
<textarea class="editor"></textarea>
	<input class="editor" type="" name="">
	<div class="editor" contentEditable></div>
<script>

		let forEach = function(arr, cb=()=>{}){
			// 用于遍历 FileList
			for(let i = 0, il = arr.length; i < il; i++){
				cb(arr[i], i);
			}
			// 链式操作
			return arr;
		}
		document.querySelectorAll('.editor').forEach(v=>{
			// 拖拽
			v.addEventListener('drop', (e)=>{
				let isFiles = !!e.dataTransfer.files.length
				if(isFiles) e.preventDefault(); //阻止下载
			})
		})
		window.addEventListener('dragenter', ()=>{
			console.log('window-dragenter-进入投放区时触发')
		})
		window.addEventListener('dragover', ()=>{
			console.log('window-dragover-在投放区时触发）',Date.now())
		})
		window.addEventListener('dragleave', ()=>{
			console.log('window-dragleave-离开投放区时触发')
		})
</script>
</body>
</html>
