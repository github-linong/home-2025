<script>
    Vue.component('ln-child',{
        template: `<div>{{a}}</div>`,
        props: ['a','b'],

        beforeUpdate(){
            top.console.log('child-beforeUpdate', this.a)

            top.console.log('child-updated', this.a)
        }
    })
    new Vue({
       el: '#app',
       data(){
           return {
               count: 2
           }
       },
       beforeUpdate(){
           top.console.log('parent-beforeUpdate', this.count)
       },
       updated(){
           top.console.log('parent-updated', this.count)
       }
    })
</script>
