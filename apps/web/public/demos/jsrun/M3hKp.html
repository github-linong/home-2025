<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />

/* original CSS missing from upstream JSRUN */

<body>
<canvas id="cvs">
  
</canvas>
<script>
var imgData;
var c=document.getElementById("cvs");
var ctx=c.getContext("2d");
var img = new Image();
// img.crossOrigin = 'anonymous';
img.crossOrigin="anonymous";
img.src='http://cdn.jsrun.net/css/img/logo.png';
img.onload = ()=>{
  ctx.drawImage(img,0,0,100,100);
  // imgData=ctx.createImageData(0,0);
  imgData = ctx.getImageData(0,0,500,500)
  putImage()
}
putImage = (x=0,y=0)=>{
  ctx.putImageData(imgData,0,0);
  ctx.lineWidth=100;
  
  // var grd=ctx.createRadialGradient(0,0,5,50,50,100);
  // grd.addColorStop(0,"rgba(0,0,0,.7)");
  // grd.addColorStop(1,"rgba(0,0,0,1)");
  
// var grd=ctx.createRadialGradient(50,50,30,90,60,100);
  var grd=ctx.createRadialGradient(x,y,30,x,y,100);
  grd.addColorStop(0,"rgba(0,0,0,0)");
	grd.addColorStop(1,"rgba(0,0,0,1)");
  ctx.strokeStyle=grd;
  
	ctx.beginPath();
  ctx.arc(x,y,100,0,2*Math.PI);
  ctx.stroke();
}
document.addEventListener('mousemove', (e)=>{
  putImage(e.x,e.y)
})
</script>
</body>
</html>
