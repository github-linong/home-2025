        template:`
            <div>

                <div><button @click="$emit('input1', Date.now())">$emit('input2', Date.now())</button></div>
                <div>a: {{ a }}</div>
                <div><slot >slot 默认未传入东西</slot></div>
                <div><slot name="search1">slot search1  未传入东西</slot></div>
                <div><slot name="search2">slot search2  未传入东西</slot></div>

        `

<script>
    top.vm = vm = new Vue2({
        template: `<vue2Data ref="componentEl" v-model="value" a="2">
            <template>
            1 默认 slot
            </template>
            <template v-for="item in slots" v-slot:[item.name]>
            serach slot {{item}}
            </template>
        </vue2Data>`,
        data(){
            return {
                // 读到哪些参数是必传的，然后传入进去
                value: 1,

                // slot 动态渲染
                slots: [
                    {name: 'search1', value: 'value'},
                    {name: 'search2', slot: 'slot'},
                    {name: 'search3', component: 'component'},
                ]
            }
        },
        mounted(){
            top.console.log(this.$refs.componentEl)
            const vm = this.$refs.componentEl;
            // 这里需要外部传入。然后再去监听。
            vm.$on('input1', (...args)=>{
                top.console.log('input1', args)
            })
            vm.$on('input', (...args)=>{
                top.console.log('input', args)
            })
        },
        components: {
            vue2Data
        }
    }).$mount('#vue2_1')
</script>

        for(var i in data){
            const item = data[i];
            if(item.default !== undefined){
                data[i] = item.default 
            } else if(item.type && item.type.length){
                // 不同 iframe String 应该会不相等
                if(item.type[0] === String){
                    data[i] = ''
                }else if(item.type[0] === Number){
                    data[i] = 0
                }else if(item.type[0] === Boolean){
                    data[i] = false
                }
            }
        }
        return data
    }
