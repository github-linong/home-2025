<script>
var setStyle = (v) => {
   // if(v.width>v.height){
   //    v.style.width="100%"
   //  }else{
   //    v.style.height="100%"
   //  }
  if(v.width/v.parentNode.offsetWidth<v.height/v.parentNode.offsetHeight){
     
    v.style.height="100%"
  }else{
    v.style.width="100%"
  }
}

document.querySelectorAll('img').forEach(v=>{
  // console.log(v.width,v.height, v.parentNode.offsetWidth, v.parentNode.offsetHeight);
  // v.width/v.parentNode.offsetWidth
  // v.height/v.parentNode.offsetHeight
  if((v.width === 0 && v.height === 0) || 
    (v.width === undefined && v.height === undefined)){
    v.addEventListener('onload', ()=>{
      setStyle(v)
    })
  }else{
    setStyle(v)
  }
})

</script>
