#input{

  line-height: 20px;
  background: #fff;
}
#input.focus:after{ 
  content:"";
  background-color: #000;
  width: 1px;height: 16px;
  display:inline-block;
  overflow: hidden;
  position:relative;
  top: 2px;
  animation: opacity .5s infinite;
}

    0% {
        opacity: 0
    }
    to {
        opacity: 1
    }
}

<div id="input" class=''>1</div>
<button id="add">add</button>
<script>
document.querySelector('#input').addEventListener('click',e=>{
  e.stopPropagation();
  console.log('input')
  document.querySelector('#input').classList.add('focus')
});
document.body.addEventListener('click',e=>{
  console.log('body')
  document.querySelector('#input').classList.remove('focus')
});
document.querySelector('#add').addEventListener('click',e=>{
  e.stopPropagation();
  console.log('add')
  document.querySelector('#input').append(Math.random().toFixed(2).slice(-1))
})
</script>
