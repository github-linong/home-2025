<body>
<div id="app">
  <button @click="onEvent('test1')">订阅 test1</button>
  <button @click="onEvent('test2')">订阅 test2</button>
  <button @click="onEvent('test3')">订阅 test3</button>
  <button @click="emitEvent('test3', 3)">发布3</button>
  <button @click="emitEvent('test2', 2)">发布2</button>
  <button @click="emitEvent('test1', 1)">发布1</button>
</div>
<script>
new Vue({
  el: '#app',
  data(){
    return {
      event:{
        
      }
    }
  },
  methods:{
    onEvent(eventName){
      if(!this.event[eventName]){
        this.event[eventName] = []
      }
      let onTime = Date.now();
      this.event[eventName].push((val)=>{
        console.log(onTime, val, Date.now() - onTime)
      })
    },
    emitEvent(eventName, value){
      if(this.event[eventName]){
         this.event[eventName].forEach(v=>{
           v(value);
         })
      }
    }
  }
})
</script>
