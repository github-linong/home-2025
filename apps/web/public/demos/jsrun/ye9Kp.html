<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />

<body>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.14/vue.js">
</script>
<div id="app">
    <p>
        perspective: {{perspective}} <input type="number" v-model="perspectiveValue">
        <br>
        perspectiveOrigin: {{perspectiveOrigin}}
    </p>
	<div class="container">
		<!-- <div class="cube pers250" :style="cubeStyle" @click="cubeClick" @mousemove="cubeClick"> -->
		<div class="cube pers250" :style="cubeStyle">
			<div class="face front">1</div>
			<div class="face back">2</div>
			<div class="face right">3</div>
			<div class="face left">4</div>
			<div class="face top">5</div>
			<div class="face bottom">6</div>
		</div>
	</div>
</div>
<script>
	new Vue({
        el: '#app',
        data(){
            return {
                perspectiveValue: 200,
                perspectiveX: 0,
                perspectiveY: 0,
            }
        },
        mounted(){
            window.onmousemove = this.cubeClick
        },
        methods:{
            cubeClick(event){
                // list = [];
                // for(var i in event) list.push(i);
                // console.log(list.filter(v=>v.toLowerCase().indexOf('x')!=-1))
                // console.log({
                //     // x: event.x,
                //     // pageX: event.pageX,

                //     // tiltX: event.tiltX,
                //     // screenX: event.screenX,
                //     // clientX: event.clientX,
                //     // pageX: event.pageX,
                //     // x: event.x,
                //     offsetX: event.offsetX,
                //     // movementX: event.movementX,
                //     layerX: event.layerX,

                //     offsetWidth: event.target.offsetWidth,
                // })
                // // layerX

                // // this.perspectiveX = event.offsetX / event.target.offsetWidth * 100;
                // // this.perspectiveY = event.offsetY / event.target.offsetHeight * 100;
                // this.perspectiveX = event.offsetX / 100 * 100;
                // this.perspectiveY = event.offsetY / 100 * 100;
                // this.perspectiveX = event.pageX / 100 * 100;
                // this.perspectiveY = event.pageY / 100 * 100;
                this.perspectiveX = (event.pageX - 100) / 10 * 100;
                this.perspectiveY = (event.pageY - 100) / 10 * 100;
            }
        },
        computed:{
            perspective(){
                return `${this.perspectiveValue}px`;
            },
            perspectiveOrigin(){
                return `${this.perspectiveX}% ${this.perspectiveY}% `;
            },
            cubeStyle(){
                return {
                    perspective: this.perspective,
                    perspectiveOrigin: this.perspectiveOrigin,
                }
            }
        }
    })

</script>

<style>
    /* Shorthand classes for different perspective values */
.pers250 {
  perspective: 250px;
}

.pers350 {
  perspective: 350px;
}

.pers500 {
  perspective: 500px;
}

.pers650 {
  perspective: 650px;
}
    /* Define the container div, the cube div, and a generic face */
.container {
  width: 200px;
  height: 200px;
  margin: 75px 0 0 75px;
  border: none;
}

.cube {
  width: 100%;
  height: 100%;
  backface-visibility: visible;
  perspective-origin: 150% 150%;
  transform-style: preserve-3d;
}

.face {
  display: block;
  position: absolute;
  width: 100px;
  height: 100px;
  border: none;
  line-height: 100px;
  font-family: sans-serif;
  font-size: 60px;
  color: white;
  text-align: center;
}

/* Define each face based on direction */
.front {
  background: rgba(0, 0, 0, 0.3);
  transform: translateZ(50px);
}

.back {
  background: rgba(0, 255, 0, 1);
  color: black;
  transform: rotateY(180deg) translateZ(50px);
}

.right {
  background: rgba(196, 0, 0, 0.7);
  transform: rotateY(90deg) translateZ(50px);
}

.left {
  background: rgba(0, 0, 196, 0.7);
  transform: rotateY(-90deg) translateZ(50px);
}

.top {
  background: rgba(196, 196, 0, 0.7);
  transform: rotateX(90deg) translateZ(50px);
}

.bottom {
  background: rgba(196, 0, 196, 0.7);
  transform: rotateX(-90deg) translateZ(50px);
}

/* Make the table a little nicer */
th, p, td {
  background-color: #EEEEEE;
  padding: 10px;
  font-family: sans-serif;
  text-align: left;
}



</style>

        background: rgba(0,255,0,.4);
        user-select: none;
    }
</style>
