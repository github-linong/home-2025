<body>
<canvas id="myCanvas" width="300" height="150" style="border:1px solid #d3d3d3;">
Your browser does not support the HTML5 canvas tag.
</canvas>
<script>
var PI1_5 = 2*Math.PI*(1/5)

var c=document.getElementById("myCanvas");
var ctx=c.getContext("2d");
ctx.beginPath();
ctx.arc(100,75,50,0*PI1_5,1*PI1_5);
ctx.strokeStyle = "#f00";
ctx.stroke();

ctx.beginPath();
ctx.arc(100,75,50,1*PI1_5,2*PI1_5);
ctx.strokeStyle = "#ff0";
ctx.stroke();

ctx.beginPath();
ctx.arc(100,75,50,2*PI1_5,3*PI1_5);
ctx.strokeStyle = "#0f0";
ctx.stroke();

ctx.beginPath();
ctx.arc(100,75,50,3*PI1_5,4*PI1_5);
ctx.strokeStyle = "#f0f";
ctx.stroke();

ctx.beginPath();
ctx.arc(100,75,50,4*PI1_5,5*PI1_5);
ctx.strokeStyle = "#00f";
ctx.stroke();

// context.arc(x,y,r,sAngle,eAngle,counterclockwise);
</script>
</body>
