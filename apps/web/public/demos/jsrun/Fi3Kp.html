<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>可编辑的表格</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="Fi3Kp" />
  <style>

  </style>
</head>
<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js">
</script>
<div id="app">
    <el-table
        border
        :data="tableData"
    >
        <el-table-column 
            v-for="(item, itemkey) in column"
            :label="item.label"
        >
            <template slot="default" slot-scope="scope">
                <template v-if="!item.edit || (!editRow || editRow.id != scope.row.id)">
                    {{filterColumn(scope.row, scope.column, item, itemkey) }}
                </template>
                <template v-else>
                    <input v-model="scope.row[item.key]">
                </template>
            </template>
        </el-table-column>
        <el-table-column
            label="操作"
        >
      <template slot-scope="scope">
            <el-button size="mini" 
                @click="handleEdit(scope.$index, scope.row)">{{editRow && editRow.id == scope.row.id?'保存':'编辑'}}</el-button>
            <el-button size="mini">删除</el-butto>
      </template>
        </el-table-column>
    </el-table>
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            tableData: [{
                id: 1,
                date: '2016-05-02',
                name: '王小虎',
                address: '上海市普陀区金沙江路 1518 弄'
            }, {
                id: 2,
                date: '2016-05-04',
                name: '王小虎',
                address: '上海市普陀区金沙江路 1517 弄'
            }, {
                id: 3,
                date: '2016-05-01',
                name: '王小虎',
                address: '上海市普陀区金沙江路 1519 弄'
            }, {
                id: 4,
                date: '2016-05-03',
                name: '王小虎',
                address: '上海市普陀区金沙江路 1516 弄'
            }],
            editRow: null,
            column: [
                {
                    key: 'id',
                    edit: false,
                    label: "ID",
                },
                {
                    key: 'name',
                    edit: true,
                    label: "姓名",
                },
                {
                    key: 'address',
                    edit: true,
                    label: "地址",
                }
            ]
        }
    },
    watch: {
        radio(val) {
            if (val) {
                this.value1 = this.value2 = ''
            }
        },
        value1(val) {
            if (val) {
                this.radio = ''
            }
        },
        value2(val) {
            if (val) {
                this.radio = ''
            }
        }
    },
    methods: {
        filterColumn(row, column, item, itemkey){
            // console.log(row, column, item, itemkey)
            return row[item.key]
        },
        handleEdit(idx, row){
            // console.log(idx, row)
            if(this.editRow == row){
                this.editRow = null;
                return false;
            }
            this.editRow = row;
        }
    }
})

</script>
</body>
</html>
