div tr:nth-child(2n){

<script>
var $this = $("#city-all-data");
var _scroll = $("#city-all-data-scroll");
var scrollTimer;

$this.hover(function() {
  clearInterval(scrollTimer);
},function() {
  scrollTimer = setInterval(function() {
    scrollNews($this);
  },
  2000);
}).trigger("mouseleave");

function scrollNews(obj) {
  var $self = obj.find("tbody");
  var lineHeight = $self.find("tr:first").height();
  _scroll.animate({
    "scrollTop": lineHeight + 3
    // "scrollTop": lineHeight + 8
  },
  1000, function() {
    $self.find("tr:first").appendTo($self);
    _scroll.toggleClass('bg_even').scrollTop(0);
  })
}
</script>
