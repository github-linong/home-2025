<script>

document.addEventListener('contextmenu', (event) => {
  // 阻止默认菜单
  event.preventDefault();

let textNode = event.target//document.getElementById('text').firstChild;
  // 获取鼠标所在位置的文本节点和偏移量
  let range = document.createRange();
  range.setStart(textNode, 0);
  range.setEnd(textNode, textNode.length);
  let rect = range.getBoundingClientRect();
  let mouseX = event.clientX - rect.left;
  let mouseY = event.clientY - rect.top;
  let offset = range.startOffset + mouseX;

  // 向左寻找单词的起始位置
  let startOffset = offset;
  while (startOffset > 0 && /\w/.test(textNode.textContent.charAt(startOffset - 1))) {
    startOffset--;
  }

  // 向右寻找单词的结束位置
  let endOffset = offset;
  while (endOffset < textNode.length && /\w/.test(textNode.textContent.charAt(endOffset))) {
    endOffset++;
  }

  // 创建一个新的 Selection 对象，并设置其范围为鼠标所在位置的单词
  let newRange = document.createRange();
  newRange.setStart(textNode, startOffset);
  newRange.setEnd(textNode, endOffset);
  let selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(newRange);
});
