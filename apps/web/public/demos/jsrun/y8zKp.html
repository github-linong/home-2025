<script>
    Vue.component('ttt', {

  <el-popover
    v-bind="$attrs"
    v-model="visible"
    trigger="click"

  <div class="el-popconfirm">

    <div class="el-popconfirm__action">
      <el-button 
        size="mini" 
        :type="cancelButtonType" 
        @click="cancel"
      >
        {{ displayCancelButtonText }}
      </el-button>
      <el-button 
        size="mini" 
        :type="confirmButtonType" 
        @click="confirm"
      >
        {{ displayConfirmButtonText }}
      </el-button>
    </div>
  </div>
  <slot name="reference" slot="reference"></slot>
</el-popover>
</div>`,

  name: 'ElPopconfirm',
  props: {
    title: {
      type: String
    },
    confirmButtonText: {
      type: String
    },
    cancelButtonText: {
      type: String
    },
    confirmButtonType: {
      type: String,
      default: 'primary'
    },
    cancelButtonType: {
      type: String,
      default: 'text'
    },
    icon: {
      type: String,
      default: 'el-icon-question'
    },
    iconColor: {
      type: String,
      default: '#f90'
    },
    hideIcon: {
      type: Boolean,
      default: false
    }
  },
  components: {
  },
  data() {
    return {
      visible: false
    };
  },
  mounted(){
      this.$refs.abc.addEventListener('click', ()=>{
          this.visible
      })
  },
  computed: {
    displayConfirmButtonText() {
      return this.confirmButtonText ;
    },
    displayCancelButtonText() {
      return this.cancelButtonText ;
    }
  },
  methods: {
    confirm() {
      this.visible = false;
      this.$emit('confirm');
    },
    cancel() {
      this.visible = false;
      this.$emit('cancel');
    }
  }
    })
</script>
