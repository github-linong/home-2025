<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skew calc</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />
  <meta name="jsrun:slug" content="qRqKp" />
  <style>
body{
			margin:0;
			padding:0;
		}
		.wrapper{
			width: 100%;
			height: 600px;
			position: relative;
			overflow:hidden;
		}
		.top{
			width: 100%;
			height: 100%;
			background: orange;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 2;
      
    transform:skew(-30deg);
    margin-left:-1000px;
    width:calc(50vw + 1000px)
		}
		.bottom{
			width: 100%;
			height: 100%;
			background: #000;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 1;			
		}
		.line{
			width: 5px;
			height: 800px;
			background: #f0f;
			position: absolute;
			top: -90px;
			left: 0;
			z-index: 3;      
      top:50%;
      transform:rotate(30deg) translateY(-50%);
      height:200%;
      transform-origin: top;
		}
  </style>
</head>
<body>
<div class="wrapper">
    <div class="top"></div>
    <div class="bottom"></div>
    <div class="line"></div>
  </div>
<script>
var Wrapper = document.getElementsByClassName("wrapper")[0];
var Top = document.getElementsByClassName("top")[0];
var Bottom = document.getElementsByClassName("bottom")[0];
var Line = document.getElementsByClassName("line")[0];
var num=0;
Wrapper.onmousemove = function(e){
  console.log(e.clientX)
  num=(e.clientX-window.innerWidth/2)*0.5;
  Line.style.left=e.clientX+num+'px';
  Top.style.width=e.clientX+1000+num+'px';
}

</script>
</body>
</html>
