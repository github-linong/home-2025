<body>
<div id="app">
  <div :style="style">{{style}}</div>
  <button @click="addLeft">addLeft</button>
  <button @click="addTop">addTop</button>
</div>
<script>
new Vue({
  el: '#app',
  data(){
    return {
    	left: 100,
      top: 100
    }
  },
  mounted(){
    document.addEventListener('keydown', e=>{
  		console.log(e,e.keyCode)
      if(e.keyCode == 39){
        this.left+=50
      }else if(e.keyCode == 37){
        this.left-=50
      }else if(e.keyCode == 38){
        this.top-=50
      }else if(e.keyCode == 40){
        this.top+=50
      }
		})
  },
  methods:{
    addLeft(){
      this.left+=50;
    },
    addTop(){
      this.top+=50;
    },
  },
	computed:{
    style(){
      return {
        left: this.left+'px',
        top: this.top+'px'
      }
    }
  }
})

</script>
</body>
