<body>
<div>
    <ul id="ul">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
</div>
<style>
    *{padding: 0;margin:0;line-height:1;}
    div{height: 2em;overflow:hidden;}
    li{background: rgba(0,0,0,.5);border-radius: 10px;width: 100px;text-align:center}
</style>
<script>
    setInterval(v=>{
        ul.style.transition = 'all 1s'
        ul.style.transform = 'translate(0, -1em)'
        setTimeout(v=>{
            ul.appendChild(ul.children[0])
            ul.style.transition = 'all 0s'
            ul.style.transform = 'translate(0, 0em)'
        }, 1000)
    }, 1100)
</script>

</body>
