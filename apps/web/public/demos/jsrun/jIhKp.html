<script>
var a = document.querySelector('.aside');

a.addEventListener('mousemove', function(e) {
  this.style.cursor = 'auto'
  if (e.offsetX + 15 > this.offsetWidth) {
    this.style.cursor = 'col-resize';
  }
  // if(x!=null){
  //  	// console.log(this.style.width = this.offsetWidth+(e.offsetX - x)+'px');
  //   this.style.width = this.offsetWidth+(e.offsetX - x)+'px'
  //   x = e.offsetX;
  // }
});
var x = null;
a.addEventListener('mousedown', function(e) {
  if (e.offsetX + 15 > this.offsetWidth) {
    x = e.offsetX;
  }
});
document.body.addEventListener('mouseup', function(e) {
  x = null
});
document.body.addEventListener('mousemove', function(e) {
  if (x != null) {
    a.style.width = (e.clientX - 10) + 'px';
  }
  // console.log(e.clientX)
})
</script>
