var allSum = 0;
var allSum_jiage = 0;
$('.qddls-cards').each(function(idx, el){
    var sum = 0;
    var sum_jiage = 0;
    $(el).find('.qddls-ordertop').each(function () {
        var jiage = parseInt($(this).find(".order-cartitle b").text()); //获取全部单价
        var num = parseInt($(this).find(".order-carnum i").text().match(/\d+/)); //获取全部订单数量
        sum += num;
        var numJisuan = jiage * num;
        sum_jiage += numJisuan;
        // console.log({jiage, num, sum, sum_jiage})
        $(this).siblings(".qddls-orderbottom")
            .find('.pay_xiaoji')
            .html(`<span class="pay_xiaoji"><em>共${Math.ceil(sum)}件</em> 小计：<b>¥</b><i>${Math.ceil(sum_jiage)}</i><b>.${sum_jiage % 1}</b></span>`);
    })
    allSum += sum;
    allSum_jiage += sum_jiage
})
$('.cartright_span').text('共'+allSum+'件 ，')
