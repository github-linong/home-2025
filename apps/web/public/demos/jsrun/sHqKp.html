let formatDate= function (time, fmt='yy-MM-dd hh:mm:ss') {
    if (time) {
      var date = new Date(time);
      var o = {
        'y+': date.getFullYear(),
        'M+': date.getMonth() + 1,
        'd+': date.getDate(),
        'h+': date.getHours(),
        'm+': date.getMinutes(),
        's+': date.getSeconds()
      };
      for (var k in o) {
        if (new RegExp('(' + k + ')').test(fmt)) {
          var str = o[k] + '';
          fmt = fmt.replace(RegExp.$1, (str.length === 1) ? ('0' + str) : str);
        }
      };
      return fmt;
    } else {
      return '';
    }
  }
