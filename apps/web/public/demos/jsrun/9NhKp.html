<div id="app">
  <h1>{{anchor}}</h1>
  <h2><v_children v-model="anchor"></v_children></h2>
</div>
<script>
var children = {
  template: `
		<div>
			{{value}}
			{{anchor}}
		</div>
	`,
  data(){
    return {
      anchor: 'LN'
    }
  },
  prop:{
    value: String
  }
}
new Vue({
  el: '#app',
  data(){
    return {
      anchor: 'li'
    }
  },
  components:{
    v_children: children
  }
});
