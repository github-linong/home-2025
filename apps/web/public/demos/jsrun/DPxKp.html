<script>
    sMenu = [
        {
            name: '个人中心',
            mount(el){
                el.innerHTML = '个人中心'
            }
        },
        {
            name: '系统通知',
            mount(el){
                el.innerHTML = '系统通知'
            }
        }
    ]
    uMenu = []

<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
<script>
    new Vue({
        el: '#app',
        data(){
            return {
                nav: [].concat(sMenu,uMenu)
            }
        },
        methods:{
            import1(){
                const value = Math.random();
                this.nav.push({
                    name: value,
                    mount(el){
                        el.innerHTML = Date.now()+value
                    }
                })
            },
            import2(){
                import2file.click();
                import2file.onchange = (e)=>{
                    const file = e.files[0];
                    if(file){
                        fr = new FileReader()
                        fr.readAsText(file)
                        fr.onload = ()=>{
                            eval(`(${fr.result})`)
                        }
                    }
                }
                window.import2 = (v)=>{
                    this.nav.push(v)
                }
            },
            download1(){
                downloadEl.href = URL.createObjectURL(new Blob([`import2({
                    name: '本地文件${Math.random()}',
                    mount(el){
                        el.innerHTML = Date.now()+'本地文件'
                    }
                })`]))
                downloadEl.click()
            }
        }
    })
</script>
