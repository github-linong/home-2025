            el.download = `${filename || '示例'}.xls`;
            el.target="_blank";
            str = ''
            str = header.join(',')+'\n';
            str += data.map(v=>v.join(',')).join('\n')
            // str = header+'\n';
            // str += data.join('\n')
            // console.log(str)
            el.href = URL.createObjectURL(new Blob([BOM + str], { type: 'text/csv;charset=utf-8;' }))
            document.body.appendChild(el);
            el.click();
            document.body.removeChild(el);
        }

    <script>
        new Vue({
            el: '#app',
            methods: {
                exportCSV(){
                    export_json_to_excel({
                        header: this.tableHeader,
                        data: this.tableData,
                        filename: this.filename,
                        autoWidth: this.autoWidth,
                        bookType: this.bookType,
                    });
                }
            },
            computed:{
                tableHeader(){
                    return Object.values(this.exportConfig).map(item => item.label);
                },
                tableData(){
                    return this.list.map(listItem => {
                        return Object.keys(this.exportConfig).map((key) => {
                            const format = this.exportConfig[key].formatText;
                            if (format) {
                                return format(listItem, key) || '-';
                            }
                            return String(listItem[key]) || '-';
                        });
                    });
                }
            },
            data(){
