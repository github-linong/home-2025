<div id="todo">
  <button @click="doRest">重置全部单选按钮组为未选状态</button>
  <ul class ="todo-list ui-sortable">  
      <li v-for="(todo, index) in filedText">

new Vue({

var vu = new Vue({
        el: '#todo',
        data: {
            one:{
            	fields: [{field_type:'file'}]
            },
          checkedNames:[],
          waterMarkText: '',
          waterMarkImg: '',
        },
        watch: {},
        computed: { 
            filedText: { //文本字段
                get: function () {
                    return this.one.fields.filter(function (item) {

                    });
                },
                set: function (newValue) {

                },
            },

                    return item.field_type == 'file' && item.filetype == 'img';
                })
            },
        },
