<div id="app">
    <ln-document :doc="doc"></ln-document>
</div>
<script>
    doc = {
        type: 'document',
        nodes: [
            {
                type: 'paragraph',
                data: {
                    style: {

                    }
                },
                nodes: [

                                    {type: 'bold'},
                                    {type: 'color', value: 'red'},
                                ]
                            }
                        ]
                    },
                    {
                        type: 'text',
                        chars: [
                            {
                                text: 'c',
                                marks: [
                                    {type: 'bold'},
                                ]
                            },
                            {
                                text: 'de',
                                marks: [
                                    {type: 'bold'},
                                    {type: 'color', value: 'red'},
                                ]
                            }
                        ]
                    }
                ]
            },{
                type: 'paragraph',
                data: {
                    style: {
                        color: 'blue'
                    }
                },
                nodes: [
                    {
                        type: 'text',
                        chars: [
                            {
                                text: 'a',
                                marks: [
                                    {type: 'bold'},
                                ]
                            },
                            {
                                text: 'ab',
                                marks: [
                                    {type: 'bold'},
                                    {type: 'color', value: '#f0f'},
                                ]
                            }
                        ]
                    },
                    {
                        type: 'text',
                        chars: [
                            {
                                text: 'c',
                                marks: [
                                    {type: 'bold'},
                                ]
                            },
                            {
                                text: 'de#3af',
                                marks: [
                                    {type: 'bold'},
                                    {type: 'color', value: '#3af'},
                                ]
                            }
                        ]
                    }
                ]
            }
        ]
    }
</script>
<script>
    Vue.component('ln-document',{
        props: ['doc'],
        template:`<div><ln-paragraph v-for="item in doc.nodes" :paragraph="item"></ln-paragraph></div>`
    })
    Vue.component('ln-paragraph',{
        props: ['paragraph'],
        template: `<div :style="paragraph.data.style"><ln-text v-for="item in paragraph.nodes" :text="item"></ln-text></div>`
    })
    Vue.component('ln-text',{
        props: ['text'],
        template: `<div><ln-leaf v-for="item in text.chars" :leaf="item"></ln-leaf></div>`
    })
    Vue.component('ln-leaf',{
        props: ['leaf'],
        computed:{
            style(){
                return this.leaf.marks.reduce((s,n)=>{
                    if(n.type == 'bold'){
                        s['font-weight'] = 'bold'
                    }else if(n.type == 'color'){
                        s['color'] = n.value
                    }
                    return s
                },{})
            }
        },
        template: `<span :style="style">{{leaf.text}}</span>`
    })
    new Vue({
        el: '#app',
        data(){
            return {
                doc: doc,
            }
        }
    })
</script>
