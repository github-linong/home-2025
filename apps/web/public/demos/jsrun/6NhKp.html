var _old = null;
var findParent = (dom, cName)=>{
  if(dom == document.body) return document.body
  if(dom.classList.contains(cName)){
    return dom;
  }else{
    return findParent(dom.parentNode, cName)
  }
}

document.addEventListener('click', (e)=>{
  var _target = findParent(e.target, 'data_show');
  if(!_target.classList.contains('data_show')) return 
  if(_old && _target!=_old) _old.classList.remove('show');
  _target.classList.toggle('show');
  _old = _target;
})
