var c=document.getElementById("canvas");
var ctx=c.getContext("2d");
var _px = 30;
c.width = _px*10;
c.height = _px*10;
var drawImage = function(url,t,l,w,h){
  var _img = new Image();
  _img.src= url;
  _img.onload = function(){
    ctx.drawImage(_img,t,l,w,h);
  }
}
for(let i in arr){
  for(let j in arr[i]){
    if(arr[i][j]){
      setTimeout(()=>{
				drawImage(imageArr[Math.floor(imageArr.length * Math.random())],_px*j+_px/2,_px*i,_px,_px)
			},(i+j)*10*Math.random())
      
    }
  }
}
