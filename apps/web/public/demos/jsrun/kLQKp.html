    .swiper{
        position: relative;

    .swiper-item{
        position: absolute;
        opacity: 0;
        transition: opacity 1s;
    }
    .swiper-item.is-active{
        opacity: 1;

</style>
<script>
    setInterval(()=>{
        el = document.querySelector('.is-active');
        elNext = el.nextElementSibling
        if(!elNext){
            elNext = document.querySelector('.swiper-item')
        }
        el.classList.remove('is-active')
        elNext.classList.add('is-active')
    }, 1500)
</script>
