<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js">

</script>
<div id="app">
    <el-date-picker
        v-model="a"
        :picker-Options="pickerOptions"
    ></el-date-picker>
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            a: '',
            pickerOptions: {
                disabledDate(time) {
                    if(time.getTime() < new Date('2022-11-15 00:00:00.000').getTime()){
                        return true
                    }
                    if(time.getTime() < Date.now()){
                        return true
                    }
                    // return !(
                    //     time.getTime() === new Date('2022-11-15 00:00:00.000').getTime()
                    // )
                },
            }
        }
    }
})
</script>
