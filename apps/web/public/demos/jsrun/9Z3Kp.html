<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>可编辑的表格</title>
  <meta name="generator" content="migrate-jsrun-demos.mjs" />

  <style>

  </style>
</head>
<body>
<!-- 引入样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
<!-- 引入组件库 -->
<script src="https://unpkg.com/element-ui/lib/index.js">
</script>
<div id="app">
    {{editRow}}
    <el-table
        border
        :data="tableData"
    >
        <el-table-column 
            v-for="(item, itemkey) in column"
            :label="item.label"
        >
            <template slot="default" slot-scope="scope">
                <template  v-if="editRow!=scope.row">
                    <div>
                        {{filterColumn(scope.row, scope.column, item, itemkey) }}
                    </div>
                </template>
                <template v-else>
                    <el-date-picker
                        v-model="scope.row[item.key]"
                        type="date"
                        format="yyyy-MM-dd"
                        value-format="yyyy-MM-dd"
                        v-if="item.type == 'date'"
                        placeholder="选择日期">
                        </el-date-picker>
                    <input style="width: 3em;" v-model="scope.row[item.key]" type="number" v-else-if="item.type == 'number'">
                    <input style="width: 3em;" v-model="scope.row[item.key]" v-else>
                </template>
            </template>
        </el-table-column>
        <el-table-column
            label="操作"
        >
      <template slot-scope="scope">
            <el-button size="mini" @click="handleEdit(scope.$index, scope.row, scope.column)"
                >{{editRow && editRow.id == scope.row.id?'保存':'编辑'}}</el-button>
            <el-button size="mini">删除</el-butto>
      </template>
        </el-table-column>
    </el-table>
    {{columnType}}
</div>
<script>
new Vue({
    el: '#app',
    data() {
        return {
            tableData: [{
                id: 1,
                date: '2016-05-02',
                age: 18,
                name: '王小虎',
                address: '上海市普陀区金沙江路 1518 弄'
            }, {
                id: 2,
                date: '2016-05-04',
                age: 19,
                name: '王小虎',
                address: '上海市普陀区金沙江路 1517 弄'
            }, {
                id: 3,
                date: '2016-05-01',
                age: 24,
                name: '王小虎',
                address: '上海市普陀区金沙江路 1519 弄'
            }, {
                id: 4,
                date: '2016-05-03',
                age: 13,
                name: '王小虎',
                address: '上海市普陀区金沙江路 1516 弄'
            }],
            editRow: null,
            column: [
                {
                    key: 'id',
                    type: "Number",
                    edit: false,
                    label: "ID",
                },
                {
                    key: 'date',
                    type: "date",
                    edit: true,
                    label: "date",
                },
                {
                    key: 'age',
                    type: "number",
                    edit: true,
                    label: "age",
                },
                {
                    key: 'name',
                    type: "text",
                    edit: true,
                    label: "姓名",
                },
                {
                    key: 'address',
                    type: "text",
                    edit: true,
                    label: "地址",
                }
            ],
            columnType:""
        }
    },
    watch: {
        radio(val) {
            if (val) {
                this.value1 = this.value2 = ''
            }
        },
        value1(val) {
            if (val) {
                this.radio = ''
            }
        },
        value2(val) {
            if (val) {
                this.radio = ''
            }
        }
    },
    methods: {
        filterColumn(row, column, item, itemkey){
            // console.log(row, column, item, itemkey)
            return row[item.key]
        },
        handleEdit(idx, row, column){
            this.columnType = column
            console.log(column)
            if(this.editRow == row){
                this.editRow = null;
                return false;
            }
            this.editRow = row;
        }
    }
})

</script>
</body>
</html>
