    <div id="app">
        1: {{1}} <br>

        <button @click="$router.push({path: '/foo1', query: {a:2}})">$router.push({path: '/foo1', query: {a:2}})</button>

  <h1>Hello App!</h1>

    <!-- 使用 router-link 组件来导航. -->

    <!-- <router-link> 默认会被渲染成一个 `<a>` 标签 -->
    <router-link to="/foo">Go to Foo</router-link>
    <router-link to="/bar">Go to Bar</router-link>
  </p>

      {{$route}}
  </div>
  <!-- 路由出口 -->

    </div>
    <script>
        Vue.use(Vuex)
        // 0. 如果使用模块化机制编程，导入Vue和VueRouter，要调用 Vue.use(VueRouter)

// 1. 定义 (路由) 组件。
// 可以从其他文件 import 进来
const Foo = { template: '<div>foo <div>{{1}}</div></div>' }
const Bar = { template: '<div>bar</div>' }
const Foo1 = { template: '<div>Foo1{{$route.query}}</div>', mounted(){console.log('mounted')} }

// 2. 定义路由
// 每个路由应该映射一个组件。 其中"component" 可以是
// 通过 Vue.extend() 创建的组件构造器，
// 或者，只是一个组件配置对象。
// 我们晚点再讨论嵌套路由。
const routes = [
  { name: 'Foo1', path: '/Foo1', component: Foo1 },
  { name: 'foo', path: '/foo', component: Foo },
  { name: 'abc', path: '/foo/:id/:abc', component: Foo },
  { path: '/bar', component: Bar }
]

// 3. 创建 router 实例，然后传 `routes` 配置
// 你还可以传别的配置参数, 不过先这么简单着吧。
const router = new VueRouter({
  routes // (缩写) 相当于 routes: routes
})

        const store = new Vuex.Store({
            state: {
                count: 0,
                b: 3,
                c: {c:1},
                d: [12,3,4,5],
                b: [{c:1},{d:2}],
                b: 3
            },
            mutations: {
                increment (state) {
                    state.count++
                }
            }
        })
        new Vue({
            el: '#app',
            store: store,

  router,
            data(){
                return {
                    a: 2
                }
            },
            methods: {
                clog(){
                    console.log(JSON.stringify(this.$store.state))
                }
            }
        })
    </script>
