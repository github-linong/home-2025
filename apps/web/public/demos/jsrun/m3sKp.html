<body>
<div id="editor">
    </div>

    <button class="button" id="button">书签</button>

    <script src="https://cdn.staticfile.org/quill/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow',
        });

        var button = document.getElementById('button');
        button.addEventListener('click', function () {
            const text = 'hello'
            let index = quill.selection.savedRange.index;
            quill.insertText(index, `\n${text}\n`, 'bold', true)
        });

    </script>
