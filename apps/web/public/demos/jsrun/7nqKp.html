<body>
<button id="btn">按钮</button>
<button id="btn2">按钮2</button>
<script>
    btnCount = 0;
    btnTimeout = 0;
    btn.onclick = ()=>{
        console.log('被单击了，但是不会触发事件', Date.now())
        btnCount++;
        if(!btnTimeout){
            btnTimeout = setTimeout(()=>{
                console.log(`触发事件，共被单击${btnCount}次`, Date.now())
                btnTimeout = 0;
                btnCount = 0;
            }, 300)
        }
    }
</script>
<script>
    btn2.onclick = ()=>console.log('单击')
    btn2.ondblclick = ()=>console.log('双击')
    btn2.ondoubleclick = ()=>console.log('双击 doubleclick')
    
</script>
