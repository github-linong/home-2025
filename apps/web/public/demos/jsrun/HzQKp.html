<body>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.14/vue.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/vue-router/3.4.8/vue-router.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/vuex/3.5.1/vuex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/theme-chalk/index.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/element-ui/2.14.0/index.min.js"></script>


    <div id="app">
        <ul>
            <li v-for="item in list">
                {{item}}
                <br>
                {{hash[item.id1][item.id2]}}
            </li>
        </ul>
    </div>
    <script>
        ajax = function(req,rsp,timeout = 1000){
            console.log('ajax')
            return new Promise(function(reslove){
                setTimeout(()=>reslove(rsp), timeout)
            })
        }


    </script>
    <script>
        vm = new Vue({
            el: '#app',
            data(){
                return {
                    list: [],
                    hash: {},
                }
            },
            mounted(){
                this.getList();
            },
            methods: {
                async getList(){
                    const list = await ajax('xxx', [
                        {id1: 123, id2: 456, count:1 },
                        {id1: 1234, id2: 456, count:2 },
                        {id1: 123, id2: 4456, count:3 },
                        {id1: 123, id2: 4456, count:4 },
                    ], 600)
                    this.list = list;
                    list
                        .reduce((s,n)=>{
                            s.add(`${n.id1},${n.id2}`)
                            if(!this.hash[n.id1]) this.$set(this.hash, n.id1, {});
                            if(!this.hash[n.id1][n.id2]) this.$set(this.hash[n.id1], n.id2, {});
                            return s
                        }, new Set())
                        .forEach(this.getInfo)
                },
                async getInfo(item){
                    const [id1, id2] = item.split(',')
                    this.hash[id1][id2] = await ajax([id1, id2], {
                        info: Math.random()
                    }, Math.random() * 2000)
                }
            }
        })
    </script>
<script>

</script>
</body>
