<!DOCTYPE html>
<html lang="zh-CN">

<body>
<script type="text/javascript" src="//music.51vv.com/wx/m/vv-base/js/swiper.min.js"></script>
<link rel="stylesheet" type="text/css" href="//music.51vv.com/wx/m/vv-base/sass/swiper-3.4.1.min.css">


<!-- <link rel="stylesheet" href="https://cdn.bootcss.com/Swiper/4.4.2/css/swiper.min.css">
<script src="https://cdn.bootcss.com/Swiper/4.4.2/js/swiper.min.js"></script> -->

<div class="swiper-container">
    <div class="swiper-wrapper">
        <div class="swiper-slide">Slide 1</div>
        <div class="swiper-slide">Slide 2</div>
        <div class="swiper-slide">Slide 3</div>
    </div>
    <!-- 如果需要分页器 -->
    <div class="swiper-pagination"></div>
    
    <!-- 如果需要导航按钮 -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    
    <!-- 如果需要滚动条 -->
    <div class="swiper-scrollbar"></div>
</div>
<script>
var mySwiper = new Swiper ('.swiper-container', {
    direction: 'vertical', // 垂直切换选项
    loop: true, // 循环模式选项
    
    // 如果需要分页器
    pagination: {
      el: '.swiper-pagination',
    },
    
    // 如果需要前进后退按钮
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    
    // 如果需要滚动条
    scrollbar: {
      el: '.swiper-scrollbar',
    },
  })       
</script>
</body>
</html>
