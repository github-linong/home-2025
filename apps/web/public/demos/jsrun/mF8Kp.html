<div id="app">
    {{1}} <input type="checkbox" v-model="bool">
    <ln-a-component v-if="bool"></ln-a-component>
    <ln-b-component v-else></ln-b-component>
</div>
<style>
    div{border: 1px solid #f00;padding: 4px;}
</style>
<script>
    Vue.component('ln-c',{
        template: `<div>ln-c {{id}}</div>`,
        data(){
            return {id: Math.random()}
        },
        created(){
            this.initWS();
        },
        beforeDestroy(){
            this.closeWS();
        },
        methods: {
            initWS(){
                let ws = new WebSocket('ws://ws.lilnong.top')
                this.ws = {
                    id: this.id,
                    ws: ws
                }
                top.console.log('initWS', this.ws)
            },
            closeWS(){
                this.ws.ws.close();
                top.console.log('closeWS', this.ws)
            }
        }
    })
    Vue.component('ln-a-component', {
        template: `<div>ln-a-component <ln-c></ln-c></div>`,
    })
    Vue.component('ln-b-component', {
        template: `<div>ln-b-component <ln-c></ln-c></div>`,
    })
</script>

        el: '#app',
