var canvas2 = document.querySelector('#canvas2');
var context2 = canvas2.getContext('2d');
var canvas2_mouse = {
  tag: false,
  offsetX: 0,
  offsetY: 0,
}
canvas2.addEventListener('mousedown', function(e){
  // console.log(e)
  canvas2_mouse.offsetX = e.offsetX;
  canvas2_mouse.offsetY = e.offsetY;
  canvas2_mouse.tag = true;
})
canvas2.addEventListener('mousemove', function(e){
  if(canvas2_mouse.tag){
    // console.log(e.offsetX, e.offsetY)
  	context2.clearRect(0, 0, 300, 200);
    context2.beginPath()
    context2.moveTo(canvas2_mouse.offsetX, canvas2_mouse.offsetY);
    context2.lineTo(e.offsetX, e.offsetY);
    context2.stroke();

})
