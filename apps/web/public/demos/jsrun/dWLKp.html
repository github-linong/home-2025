<style>
		.dargwrap {
			border: 1px solid #f00;
			padding: 10px;
			margin: 10px;
			display: flex;
		}

		.dargwrap .ul {
			flex: 1 1 auto;
			margin: 10px;
			padding: 10px;
			border: 1px solid #ff0;
			list-style: none
		}
	</style>
	<div id="app">
		<p>
			list: {{list}}
		</p>
		<p>
			list1: {{list1}}
		</p>
		<p>
			list2: {{list2}}
		</p>
		<div class="dargwrap">
			<draggable class="dragArea list-group ul" :list="list"
				ref="sourceList"
				:move="moveHandle"
				:group="{ name: 'people', pull: 'clone', put: false }">
				<div class="list-group-item" v-for="element in list" :key="element.txt" :class="{'checked': element.checked}">
					<span @mousedown="element.checked = !element.checked">{{ element.txt }}</span>
				</div>
			</draggable>

			<!-- <draggable :move="moveHandle" class="dragArea list-group ul" :list="list1" group="people" @change="log"> -->
			<draggable  :move="moveHandle" class="dragArea list-group ul" :list="list1" group="people" @change="log">
				<div class="list-group-item" v-for="element in list1" :key="element">
					{{ element.txt }}
				</div>
			</draggable>

			<!-- <draggable :move="moveHandle" class="dragArea list-group ul" :list="list2" group="people" @change="log"> -->
			<draggable :move="moveHandle" class="dragArea list-group ul" :list="list2" group="people" @change="log">
				<div class="list-group-item" v-for="element in list2" :key="element">
					{{ element.txt }}
				</div>
			</draggable>
            <el-dialog :visible.sync="dialogDrag">

            </el-dialog>
		</div>
	</div>
	<script>
		lastEvent = null;
		new Vue({
			el: '#app',
			data() {
				return {
					list: [
						{txt: '人教大法师', checked: false},
						{txt: '人教小法师', checked: false},
						{txt: '长庚道友', checked: false},
						{txt: '长寿道友', checked: false},
						{txt: '海神', checked: false},
						{txt: '水神', checked: false},
						{txt: '苟寿', checked: false},
						{txt: '大兴西北', checked: false},
					],
					list1: [],
					list2: [],
                    dialogDrag: false,
                    judg: ''
				}
			},
			computed:{},
			methods: {
				log: function ( evt) {
                    if (evt.added) {
                        if(this.judge == this.list2) {
                            this.dialogDrag = true;
                        }
                    }
					window.console.log(evt, lastEvent);
					if( app.__vue__.$refs.sourceList.$el  == lastEvent.from){
						// 从原始数据中拖出
						// lastEvent.draggedContext.element.checked=false
						this.list.forEach(v=>{
							if(v.checked){
								// v.checked = false;
								if(!lastEvent.relatedContext.list.find(item=>item.txt == v.txt)){
                                    console.log(1)
									lastEvent.relatedContext.list.push(v)	
								}
							}
						})
					}
				},
				moveHandle(ctx, event){
					// console.log(arguments, this)
					lastEvent = ctx;
                    this.judge = ctx.relatedContext.list
					var key = ctx.draggedContext.element
					if(ctx.relatedContext.list == this.list) return false
					if(ctx.relatedContext.list.find(item=>item.txt == key.txt)){
						if(ctx.from == ctx.to) return true
						return true
					}
					return true
				}
			}
		})
	</script>

</script>
