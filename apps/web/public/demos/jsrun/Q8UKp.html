  <title>v-for用来循环div 里面的v-model 也是双向绑定了的 但是问题就来了 值是通过传输的 当新增一个div的时候 突然发现 input框 却被绑定了值 怎么才能 让他们分开呢</title>

<body>
<script src="//unpkg.com/vue/dist/vue.js"></script>
<script src="//unpkg.com/element-ui@2.15.6/lib/index.js"></script>
<link rel="stylesheet" href="//unpkg.com/element-ui@2.15.6/lib/theme-chalk/index.css">
<div id="app">
  <el-button type="primary" @click='add'>添加</el-button>
  <div v-for='(item,index) in dataList' :key="index">
    <div>表单{{index+1}}</div>
    <el-form  label-width="80px">
      <el-form-item :label="item.name">
        <el-input v-model="item.value"></el-input>
        <el-input v-model="item.value1"></el-input>
        <el-input v-model="item.value2"></el-input>
        <el-input v-model="item.value3"></el-input>
        <el-input v-model="item.value4"></el-input>
      </el-form-item>
    </el-form>
  </div>
</div>
<script>
    var Main = {
        data() {
            return {
                dataList: []
            };
        },
        methods: {
            add() {
                this.dataList.push({
                    name: "xxx",
                    value: "",
                    value1: "",
                    value2: "",
                    value3: "",
                    value4: ""
                });
            }
        },
        created(){
            this.add();
        }
    };
    var Ctor = Vue.extend(Main);
    new Ctor().$mount("#app");

</script>

</script>
</body>
</html>
