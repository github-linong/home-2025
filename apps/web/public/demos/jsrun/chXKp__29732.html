<body>
<input type="file" id="fileInput" />
<div class="waitUpload videowarp">
</div>
<script>
document.querySelector('#fileInput').addEventListener('change', function() {
  var reader = new FileReader();
  reader.onload = (evt) => {
    $('.waitUpload').html('<div class="videoCtn"><img src="' + evt.target.result + '" controls></div>');
    
  };

})
