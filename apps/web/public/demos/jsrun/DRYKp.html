div{

		span{

			width:200px;

<body>
<div style="background-color:#f00">
		<span draggable="true">
			1-LiNong

		</span>
		<span draggable="true">

		<span draggable="true">

		</span>
		<span draggable="true">
			10-LiNong
		</span>
	</div>
	<div style="background-color:#0f0">
	</div>
<script>
var span  =document.querySelectorAll("span");
		var dropTag = null;
		for(var i in span){
			span[i].ondragstart = function(event){
        dropTag = event.target
				console.log('--------------------------ondragstart-start');
				console.log(event.target,event.type,event.target.innerText);
				console.log('--------------------------ondragstart-end');
			}
		}
		document.querySelectorAll("div")[1].ondragover = function(event){
			event.preventDefault() ;
			if(document.querySelectorAll("div")[1].ondragoverTag){
				clearTimeout(document.querySelectorAll("div")[1].ondragoverTag);
				document.querySelectorAll("div")[1].ondragoverTag=null;
			}
			document.querySelectorAll("div")[1].ondragoverTag = setTimeout(function(){
				console.log('--------------------------ondragover-start');
				console.log(event.target,event.type,event.target.innerText);
				console.log('--------------------------ondragover-end');
			},1000);
		}
		document.querySelectorAll("div")[1].ondrop = function(event){
			event.preventDefault() 
			console.log('--------------------------ondrop-start');
			console.log(event.target,event.type,event.target.innerText);
      this.appendChild(dropTag);
			console.log('--------------------------ondrop-end');
		}
</script>
