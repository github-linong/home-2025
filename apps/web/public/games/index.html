<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>联机游戏 · linong 个人站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-0: #0a0c12;
    --bg-1: #14171f;
    --bg-2: #1f2330;
    --line: #2a2f3d;
    --text-0: #e8e4d8;
    --text-1: #aab;
    --text-2: #7a8699;
    --gold: #f5d488;
    --gold-dim: #b89a72;
    --ember: #f5a23a;
    --green: #5fd08a;
  }
  html, body { width: 100%; min-height: 100vh; background: var(--bg-0); color: var(--text-0);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 80px 24px 64px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 28px; letter-spacing: 2px; color: var(--gold); font-weight: 900;
    text-shadow: 0 2px 12px rgba(245, 212, 136, 0.12); margin-bottom: 6px; }
  .sub { color: var(--text-2); font-size: 13px; letter-spacing: 1px; }

  .empty { background: var(--bg-1); border: 1px solid var(--line); border-radius: 14px;
    padding: 48px 32px; text-align: center; }
  .mark { color: var(--gold-dim); font-size: 24px; letter-spacing: 8px; margin-bottom: 12px; }
  .empty h2 { color: var(--gold); font-size: 22px; margin-bottom: 10px; letter-spacing: 1px; }
  .empty p { color: var(--text-1); font-size: 14px; line-height: 1.7; margin-bottom: 14px; }
  .empty code { background: var(--bg-2); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-0); }

  .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 9px 18px; font-size: 13px; font-weight: 700; border: none; border-radius: 7px; cursor: pointer;
    transition: background 0.2s, transform 0.2s, border-color 0.2s, color 0.2s; }
  .btn.primary { background: var(--ember); color: #1a0e08; }
  .btn.primary:hover { background: var(--gold); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--text-1); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--gold); border-color: var(--gold); }

  footer { margin-top: 48px; text-align: center; color: var(--text-2); font-size: 12px; }
  footer a { color: var(--gold-dim); transition: color 0.2s; }
  footer a:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>联机游戏</h1>
    <div class="sub">浏览器即开即玩 · 服务端权威同步</div>
  </header>

  <div class="empty">
    <div class="mark">· · ·</div>
    <h2>暂无可用的联机游戏</h2>
    <p>当前没有公开的联机游戏正在运行。</p>
    <p>如果对过往设计感兴趣，可在仓库的 <code>docs/ideas/</code> 里查阅「待重启设计稿」。</p>
    <div class="actions">
      <a class="btn primary" href="/demos/" target="_blank" rel="noreferrer">浏览全部 Demo →</a>
      <a class="btn ghost" href="/blog/" target="_blank" rel="noreferrer">查看博客</a>
    </div>
  </div>

  <footer>
    <a href="/demos/">← 返回项目展示</a> · © 2026 linong
  </footer>
</div>
</body>
</html>
