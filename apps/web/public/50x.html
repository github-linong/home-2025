<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务暂时不可用</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f6f4ef;
        color: #1c1917;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.6;
        opacity: 0.75;
        font-size: 0.95rem;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>登录服务暂时不可用</h1>
      <p>
        服务器访问 GitHub 超时（国内机房常见），GitHub 登录可能失败。请返回登录页改用邮箱，或稍后重试。
      </p>
      <p><a href="/login/">返回登录</a> · <a href="/">回到首页</a></p>
    </main>
  </body>
</html>
