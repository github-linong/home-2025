<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拼拼卡 · PinPin Cards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2d1f0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
        }
        #game-wrapper {
            position: relative;
            width: 400px;
            height: 700px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        canvas {
            display: block;
            border-radius: 24px;
        }
        /* 响应式：小屏幕缩放到适合宽度 */
        @media (max-width: 420px) {
            #game-wrapper {
                width: 100vw;
                height: auto;
                aspect-ratio: 4/7;
                border-radius: 0;
            }
            canvas {
                width: 100% !important;
                height: auto !important;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
