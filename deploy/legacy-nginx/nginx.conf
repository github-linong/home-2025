	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	gzip on;
	gzip_disable "msie6";
	gzip_min_length 1k;
	gzip_comp_level 6;
	gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml application/pdf;
	gzip_vary on;
	gzip_buffers 32 4k;



	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;



