# Legacy excerpt from home-2023:nginx.conf
# Sanitized for reference — NOT for production use.
# See deploy/legacy-nginx-notes.md

user root;
worker_processes auto;
pid /run/nginx.pid;

events {
	worker_connections 768;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
    log_format mainjson "{http_host:`$http_host`,"
    					"remote_addr:`$remote_addr`,"
    					"remote_user:`$remote_user`,"
    					"time_local:`$time_local`,"
    					"msec:`$msec`,"
    					"time_iso8601:`$time_iso8601`,"
    					"request:`$request`,"
    					"request_time:`$request_time`,"
    					"status:`$status`,"
    					"body_bytes_sent:`$body_bytes_sent`,"
    					"http_user_agent:`$http_user_agent`,"
    					"http_x_forwarded_for:`$http_x_forwarded_for`,"
    					"http_referer:`$http_referer`}";
    					
	log_format logstash_json '{"@timestamp":"$time_iso8601",'
       '"host": "$server_addr",'
       '"client": "$remote_addr",'
       '"size": $body_bytes_sent,'
       '"responsetime": $request_time,'
       '"domain": "$host",'
       '"url":"$request_uri",'
       '"referer": "$http_referer",'
       '"agent": "$http_user_agent",'
       '"status":"$status",'
       '"x_forwarded_for":"$http_x_forwarded_for"}';

	access_log /var/log/nginx/mainjson.log mainjson;
	access_log /var/log/nginx/logstash_json.log logstash_json;
	error_log /var/log/nginx/20190227_error.log;

	sendfile on;
	keepalive_timeout 65;
	keepalive_requests 1000;

