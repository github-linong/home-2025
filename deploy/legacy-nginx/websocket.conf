# Legacy excerpt from home-2023:sites-available/websocket.conf
# Sanitized for reference — NOT for production use.
# See deploy/legacy-nginx-notes.md


    server {
		server_name websocket.lilnong.top;
		location /wss {
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $http_host;
			proxy_set_header X-NginX-Proxy true;
		 
			proxy_pass http://localhost:8002;
			proxy_redirect off;
		 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
		location /socket.io {
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $http_host;
			proxy_set_header X-NginX-Proxy true;
		 
			proxy_pass http://localhost:8002;
			proxy_redirect off;
		 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
		
		location /{
			root   /root/websocket/fe/;
		}
	}
    server {
		server_name nodejs-websocket.lilnong.top;
		location /{
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header Host $http_host;
			proxy_set_header X-NginX-Proxy true;
		 
			proxy_pass http://localhost:8001;
			proxy_redirect off;
		 
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
	}
