# Canonical host: apex → www (Baidu/Google duplicate-host fix)
#
# Apply on the production host inside /etc/nginx/conf.d/lilnong.top-https.conf:
# 1) HTTP server: always redirect to https://www.lilnong.top
# 2) Separate HTTPS server for lilnong.top that 301s to www
# 3) Main HTTPS server_name is www.lilnong.top only
#
# See scripts/apply-www-canonical-redirect.sh

# HTTP → HTTPS www
# server {
#     listen       80;
#     listen       [::]:80;
#     server_name  lilnong.top www.lilnong.top;
#     return       301 https://www.lilnong.top$request_uri;
# }

# Apex HTTPS → www (reuse the same Let's Encrypt cert as the main site)
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  lilnong.top;

    ssl_certificate     /etc/letsencrypt/live/lilnong.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lilnong.top/privkey.pem;

    return 301 https://www.lilnong.top$request_uri;
}
