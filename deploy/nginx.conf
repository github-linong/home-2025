server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Analytics-friendly CSP (Baidu HM + GA4). Inline scripts required by both trackers.
    # CSP allows common demo CDNs (bootcdn/bootcss/unpkg/jsdelivr/…) used by legacy HTML demos
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://hm.baidu.com https://hmcdn.baidu.com https://www.googletagmanager.com https://giscus.app https://cdn.bootcss.com https://cdn.bootcdn.net https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://libs.baidu.com https://retcode.alicdn.com https://code.jquery.com https://vuejs.org https://cdn.static.runoob.com https://res.wx.qq.com https://uicdn.toast.com; style-src 'self' 'unsafe-inline' https://cdn.bootcss.com https://cdn.bootcdn.net https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://libs.baidu.com https://fonts.googleapis.com https://uicdn.toast.com; font-src 'self' data: https://cdn.bootcss.com https://cdn.bootcdn.net https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.gstatic.com https://at.alicdn.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https: wss: ws:; media-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' https://giscus.app https:; frame-ancestors 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Retired Astrofy template pages
    location = /cv { return 301 /about/; }
    location = /cv/ { return 301 /about/; }
    location = /services { return 301 /demos/; }
    location = /services/ { return 301 /demos/; }
    location ^~ /store/ { return 301 /blog/; }

    location = /demos/legacy { return 301 /demos/archive/; }
    location = /demos/legacy/ { return 301 /demos/archive/; }

    # Legacy HTML demos → new path (HTML files ship with Astro build)
    location ~ ^/static/html/(.+\.html)$ {
        return 301 /demos/html/$1;
    }

    # Early theme/ experiments → demos/theme
    location ~ ^/theme/(.+\.html)$ {
        return 301 /demos/theme/$1;
    }

    # Legacy whole-site projects → new path
    location ^~ /static/project/ {
        rewrite ^/static/project/(.*)$ /demos/project/$1 last;
    }

    # Legacy download alias for whole-site projects
    location ^~ /download/project/ {
        rewrite ^/download/project/(.*)$ /demos/project/$1 permanent;
    }

    # Legacy runnable project bundles: reachable, but not for search indexing
    location ^~ /demos/project/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Project dirs have no root index — send to Astro intro pages
    location = /demos/project/dashboard { return 301 /demos/project-dashboard/; }
    location = /demos/project/dashboard/ { return 301 /demos/project-dashboard/; }
    location = /demos/project/pdfjs-es5-2.5.207 { return 301 /demos/project-pdfjs-es5-2.5.207/; }
    location = /demos/project/pdfjs-es5-2.5.207/ { return 301 /demos/project-pdfjs-es5-2.5.207/; }

    # createfont output
    location ^~ /static/fontmin/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads are archived under OSS private/uploads — never expose via /static/
    location ^~ /static/uploads/ {
        return 404;
    }

    # Legacy static assets (Aliyun OSS hone-2023 bucket)
    location /static/ {
        proxy_pass https://hone-2023.oss-cn-beijing.aliyuncs.com/static/;
        proxy_set_header Host hone-2023.oss-cn-beijing.aliyuncs.com;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public";
    }

    # home-2023 Express API (path-compatible)
    location ^~ /upload {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /proxy {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /CORS/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /corsutils/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /vapi/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api3/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wx {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /invitation/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /tencent_ai_api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /createfont {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /post {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /falseReport {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /logReport {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /felog {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /tapi/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static site (Astro build output).
    # Do NOT fall back to /index.html — that creates soft-404 duplicates Google flags.
    # Do NOT use "location = /index.html { return 301 /; }" — conflicts with
    # nginx index module internal redirect (/ → /index.html) and causes a loop.
    if ($request_uri ~* "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }
    location = /index { return 301 /; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
