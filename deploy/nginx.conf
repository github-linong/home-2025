server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Analytics-friendly CSP (Baidu HM + GA4). Inline scripts required by both trackers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://hm.baidu.com https://hmcdn.baidu.com https://www.googletagmanager.com https://giscus.app; connect-src 'self' https://hm.baidu.com https://hmcdn.baidu.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://api.github.com; img-src 'self' data: blob: https://hm.baidu.com https://hmcdn.baidu.com https://www.google-analytics.com https://www.googletagmanager.com https://avatars.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://giscus.app; frame-ancestors 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Retired Astrofy template pages
    location = /cv { return 301 /about/; }
    location = /cv/ { return 301 /about/; }
    location = /services { return 301 /demos/; }
    location = /services/ { return 301 /demos/; }
    location ^~ /store/ { return 301 /blog/; }

    location = /demos/legacy { return 301 /demos/archive/; }
    location = /demos/legacy/ { return 301 /demos/archive/; }

    # Legacy HTML demos → new path (HTML files ship with Astro build)
    location ~ ^/static/html/(.+\.html)$ {
        return 301 /demos/html/$1;
    }

    # Legacy static assets (Aliyun OSS hone-2023 bucket)
    location /static/ {
        proxy_pass https://hone-2023.oss-cn-beijing.aliyuncs.com/static/;
        proxy_set_header Host hone-2023.oss-cn-beijing.aliyuncs.com;
        proxy_ssl_server_name on;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Static site (Astro build output)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Auth / API
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        proxy_pass http://api:3001/login;
    }

    location ~ ^/invite/ {
        proxy_pass http://api:3001;
    }
}
