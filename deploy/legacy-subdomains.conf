# Legacy personal demo subdomains (home-2023)
# Static content: OSS hone-2023/static/project/<dir>/
# Cert: /etc/letsencrypt/live/legacy-demos.lilnong.top/
#
# Omitted until redeployed: jfsrc*, music-api, ws/websocket, django, feedsbd, jgq-server

# HTTP → HTTPS (+ ACME)
server {
    listen 80;
    listen [::]:80;
    server_name
        a2hs.lilnong.top
        js13kpwa.lilnong.top
        demo-progressive-web-app-master.lilnong.top
        music-play.lilnong.top
        web-mobile-20200711.lilnong.top
        cocos-20200711.lilnong.top
        cocos2d-20200711.lilnong.top
        hytstart.lilnong.top
        sf-sellgaode.lilnong.top
        sf-sellgaode-2.lilnong.top
        jinguoqiangtool.lilnong.top
        nginx-q-20200713.lilnong.top
        dx.lilnong.top
        cors-1010000020275154.lilnong.top
        cors-www.lilnong.top
        http2-www.lilnong.top
        home.lilnong.top
        home-2023.lilnong.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Map host → OSS object prefix (used with rewrite below)
map $host $legacy_oss_prefix {
    default                                              "";
    a2hs.lilnong.top                                     static/project/a2hs;
    js13kpwa.lilnong.top                                 static/project/js13kpwa;
    demo-progressive-web-app-master.lilnong.top          static/project/demo-progressive-web-app-master;
    music-play.lilnong.top                               static/project/vue-music-webapp;
    web-mobile-20200711.lilnong.top                      static/project/web-mobile;
    cocos-20200711.lilnong.top                           static/project/web-mobile;
    cocos2d-20200711.lilnong.top                         static/project/web-mobile-2/web-mobile;
    hytstart.lilnong.top                                 static/project/hytStart.github.io-master;
    sf-sellgaode.lilnong.top                             static/project/sellgaode;
    sf-sellgaode-2.lilnong.top                           static/project/sellgaode2;
    jinguoqiangtool.lilnong.top                          static/project/jinguoqiangTool;
    nginx-q-20200713.lilnong.top                         static/project/20200713-zhangyue;
    dx.lilnong.top                                       static/project/dx;
    cors-1010000020275154.lilnong.top                    static;
}

# Default entry for hytstart (no root index.html)
map $host $legacy_index {
    default                 /index.html;
    hytstart.lilnong.top    /game/21/index.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name
        a2hs.lilnong.top
        js13kpwa.lilnong.top
        demo-progressive-web-app-master.lilnong.top
        music-play.lilnong.top
        web-mobile-20200711.lilnong.top
        cocos-20200711.lilnong.top
        cocos2d-20200711.lilnong.top
        hytstart.lilnong.top
        sf-sellgaode.lilnong.top
        sf-sellgaode-2.lilnong.top
        jinguoqiangtool.lilnong.top
        nginx-q-20200713.lilnong.top
        dx.lilnong.top
        cors-1010000020275154.lilnong.top;

    ssl_certificate     /etc/letsencrypt/live/legacy-demos.lilnong.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy-demos.lilnong.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CORS demo host
    set $cors_header "";
    if ($host = cors-1010000020275154.lilnong.top) {
        set $cors_header "*";
    }
    add_header Access-Control-Allow-Origin $cors_header always;

    location = / {
        return 302 $legacy_index;
    }

    location / {
        resolver 223.5.5.5 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_pass https://hone-2023.oss-cn-beijing.aliyuncs.com/$legacy_oss_prefix$request_uri;
        proxy_set_header Host hone-2023.oss-cn-beijing.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_set_header Referer https://www.lilnong.top/;
        proxy_hide_header x-oss-request-id;
        proxy_hide_header x-oss-server-time;
        proxy_hide_header x-oss-hash-crc64ecma;
        proxy_hide_header x-oss-storage-class;
        proxy_hide_header x-oss-object-type;
    }
}

# Alternate main hosts → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cors-www.lilnong.top http2-www.lilnong.top home.lilnong.top home-2023.lilnong.top;
    ssl_certificate     /etc/letsencrypt/live/legacy-demos.lilnong.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy-demos.lilnong.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.lilnong.top$request_uri;
}

# Process-backed hosts (not running on this VPS yet)
server {
    listen 80;
    listen [::]:80;
    server_name music-api.lilnong.top ws.lilnong.top websocket.lilnong.top nodejs-websocket.lilnong.top django.lilnong.top;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        default_type text/plain;
        return 503 "Legacy upstream not running. See https://www.lilnong.top/\n";
    }
}
