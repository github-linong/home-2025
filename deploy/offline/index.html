<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务已下线</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 2rem;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { color: #94a3b8; line-height: 1.7; margin-bottom: 1rem; }
    .host {
      display: inline-block;
      margin: 0.5rem 0 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 0.5rem;
      background: rgba(15, 23, 42, 0.8);
      color: #cbd5e1;
      font-size: 0.9rem;
      word-break: break-all;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 1.5rem; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>服务已下线</h1>
    <p>该子站已暂停服务，正在整理与迁移中。请稍后再访问，或前往主站浏览其他内容。</p>
    <div class="host" id="host"></div>
    <p><a href="https://www.lilnong.top/">返回 lilnong.top 主站 →</a></p>
    <p class="footer">如有需要，微信：LN4518</p>
  </div>
  <script>
    document.getElementById("host").textContent = location.hostname;
  </script>
</body>
</html>
