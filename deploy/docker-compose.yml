services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_site}
      MYSQL_USER: ${MYSQL_USER:-site}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sitepass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3001
      SITE_URL: ${SITE_URL:-https://example.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://www.lilnong.top}
      MONGO_URI: ${MONGO_URI:-mongodb://127.0.0.1:27017/}
      BAIDU_CLIENT_ID: ${BAIDU_CLIENT_ID:-}
      BAIDU_CLIENT_SECRET: ${BAIDU_CLIENT_SECRET:-}
      FACEPP_API_KEY: ${FACEPP_API_KEY:-}
      FACEPP_API_SECRET: ${FACEPP_API_SECRET:-}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      WX_APPID: ${WX_APPID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      WX_SERVER_TOKEN: ${WX_SERVER_TOKEN:-invitationln}
      WX_HOST_ALLOWLIST: ${WX_HOST_ALLOWLIST:-www.lilnong.top}
      KG_QQ_COOKIE: ${KG_QQ_COOKIE:-}
      KG_QQ_COOKIE_ALT: ${KG_QQ_COOKIE_ALT:-}
      NETEASE_API_BASE: ${NETEASE_API_BASE:-http://127.0.0.1:9101}
    volumes:
      - api_data:/app/data
    ports:
      - "3001:3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
  api_data:
