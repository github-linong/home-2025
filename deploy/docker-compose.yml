services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_site}
      MYSQL_USER: ${MYSQL_USER:-site}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sitepass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3001
      SITE_URL: ${SITE_URL:-https://example.com}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_site}
      MYSQL_USER: ${MYSQL_USER:-site}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sitepass}
    depends_on:
      - mysql
    ports:
      - "3001:3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
