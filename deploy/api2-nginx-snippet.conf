# Production nginx — insert BEFORE legacy `location ^~ /api/`
# These must stay as sibling location blocks (not nested).
# Note: $connection_upgrade map is expected to already exist in the http block
# (from poker/wander/chat nginx snippets).

location ^~ /api/auth {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    client_max_body_size 30m;
    error_page 502 503 504 = @api_json_error;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/me {
    proxy_pass http://127.0.0.1:3002;
