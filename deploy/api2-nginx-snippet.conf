# 前端面试题库（学前端）— 出卷时 AI 二次加工，给足超时
location ^~ /api/fequiz {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    error_page 502 503 504 = @api_json_error;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Demo APIs (stream / compare WS / image gen with base64 refs) — large body + no buffering
location ^~ /api/demo {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    # Image gen posts base64 refs; match Express 30mb JSON limit.
    client_max_body_size 30m;
    # Video gen polls DashScope up to ~10 minutes before responding.
    proxy_connect_timeout 30s;
    proxy_send_timeout 660s;
    proxy_read_timeout 660s;
    error_page 502 503 504 = @api_json_error;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
