# JSON fallback when an /api/* upstream times out or is unreachable.
# Insert once inside the www.lilnong.top server block (sibling to location blocks).

location @api_json_error {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false,"error":"gateway_error","message":"API upstream timed out or is unavailable"}';
}
